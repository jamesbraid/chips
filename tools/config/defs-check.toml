# Constants-and-macros exports of the Hub and Bedrock register maps (see retools/tools/defs/defslib/gen_export.py).
# `base` is where the unit's registers start in the node's register space: OFFSET in the export is the unit's
# own offset minus it. The Bedrock bases are the first register of each unit (every offset the unit records
# is already node-relative); the Hub units, and the census and Linux-header units of both chips that span
# several blocks, stay at base 0, so their OFFSET is the node-relative offset.
[gen.export]
profiles = ["rust-regs", "c-regfields"]

[gen.export.units.hub]
base = 0x0
rust_file = "hub"

[gen.export.units.hub_extra]
base = 0x0
constants = ["IIO_IBCT_ZFIL_MODE", "IIO_IBCT_NOTIFY", "IIO_IBCT_POISON", "IIO_IBLS_BUSY", "IIO_IECLR_BTE0", "IIO_IECLR_BTE1", "IIO_WID_PART_HUB", "IIO_WSTAT_ECRAZY", "IIO_WSTAT_TXRETRY", "IIO_WSTAT_TXRETRY_MASK", "IIO_WCR_DIR_CON", "IIO_LLP_CSR_IS_UP", "IIO_LLP_CSR_LLP_STAT_MASK", "LNK_STAT_WORKING", "IIO_ILCSR_WARM_RESET", "IIO_ILCSR_LLP_EN", "IIO_ILCSR_BM8", "IIO_IIDSR_SENT", "IIO_IIDSR_ENB", "IIO_IIDSR_LVL_MASK", "IIO_ITTE_BASE", "IIO_ITTE_IOSP", "IIO_ITTE_INVALID_WIDGET", "IIO_BASE", "IIO_BASE_BTE0", "IIO_BASE_BTE1", "IIO_BASE_PERF", "IIO_NUM_ITTES", "IIO_NUM_IPRBS", "IIO_NUM_PRTES", "IIO_NUM_CRBS", "IIO_NUM_NORMAL_CRBS", "IIO_NUM_PC_CRBS", "IIO_SCRATCH_MASK", "IIO_PROTECT_OVRRD_KEY", "HUB_NUM_WIDGET", "HUB_WIDGET_ID_MIN", "HUB_WIDGET_ID_MAX"]
