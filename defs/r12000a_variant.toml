unit = "r12000a_variant"
prefix = "R12KA"
title = "R12000A mode-bit fields and performance control 0 syndrome field"
doc = "Constants for the NEC VR12000A variant of the R12000 as its user's manual describes the differences from the R12000: the SysClkDiv and SCClkDiv fields of the boot mode word, the HSTL output mode field, and the 9-bit read-only syndrome that the variant places in bits 31:23 of CP0 register 25 performance control 0. This unit holds constants only. The capture rule and the open questions are in docs/r12000a_variant.md. Grades: established means the processor manual states it; inferred means a reasoned reading of the manual; unknown items are listed in the page."
from = "NEC VR10000 Series 64-/32-bit Microprocessor User's Manual, U10278EJ4V0UM00, fourth edition"
public_from = ["NEC VR10000 Series user's manual, U10278EJ4V0UM00, fourth edition, printed pages 247, 357-358"]

[constants]
R12KA_MODE_SYSCLKDIV_SHIFT = { value = 9, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 357, Table C-1", doc = "Lowest bit of the four-bit SysClkDiv field, bits 12:9 of the boot mode word." }
R12KA_MODE_SYSCLKDIV_MASK = { value = 0x1e00, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 357, Table C-1", doc = "Mask for the four-bit SysClkDiv field, bits 12:9 of the boot mode word." }
R12KA_MODE_SYSCLKDIV_CODE_A_ONLY = { value = 12, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 357, Table C-1", doc = "SysClkDiv code 1100, the only code the variant's table adds. It selects a divisor of 7 between PClk and SysClk. The common R12000 has no entry for it, which the table's title, a change list, implies. The rejection is inferred." }

R12KA_MODE_SCCLKDIV_SHIFT = { value = 19, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 357, Table C-2", doc = "Lowest bit of the three-bit SCClkDiv field, bits 21:19 of the boot mode word." }
R12KA_MODE_SCCLKDIV_MASK = { value = 0x380000, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 357, Table C-2", doc = "Mask for the three-bit SCClkDiv field, bits 21:19 of the boot mode word." }
R12KA_MODE_SCCLKDIV_TEST_CODE = { value = 7, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 357, Table C-2", doc = "SCClkDiv code 111, a divisor of 4 that the manual says was added for testing silicon." }

R12KA_MODE_HSTL_SHIFT = { value = 29, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 358, Table C-3", doc = "Lowest bit of the two-bit HSTL output mode field, bits 30:29 of the boot mode word. It selects the HSTL level of the system interface outputs and the secondary cache interface outputs." }
R12KA_MODE_HSTL_MASK = { value = 0x60000000, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed page 358, Table C-3", doc = "Mask for the two-bit HSTL output mode field, bits 30:29 of the boot mode word." }

R12KA_PERF_CTL0_SYNDROME_SHIFT = { value = 23, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed pages 247 and 358, section C.2", doc = "Lowest bit of the nine-bit read-only syndrome, bits 31:23 of CP0 register 25 performance control 0. On the R12000 and R12000L these bits are unused and read as zero." }
R12KA_PERF_CTL0_SYNDROME_MASK = { value = 0xff800000, grade = "established", from = "NEC VR10000 Series user's manual, U10278EJ4V0UM00, printed pages 247 and 358, section C.2", doc = "Mask for the nine-bit syndrome field, bits 31:23 of CP0 register 25 performance control 0." }
