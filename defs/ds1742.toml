unit = "ds1742"
prefix = "DS1742"
title = "Dallas DS1742W nonvolatile timekeeping RAM (Fuel L1 storage part, 3.3 V, 2 KiB)"
doc = "The 2,048-byte battery-backed SRAM and clock part identified on a revision B Fuel board. The register contract here covers what the sources state: the clock bytes at the top of the address range and the remaining bytes as RAM. Grades say how each item was derived: established means the manufacturer specification as the source records it, inferred means a public driver, a board marking or arithmetic on an established fact. The clock byte meanings, the reset state and the RAM layout are not stated by the sources and are not listed."
from = "Dallas DS1742/DS1742W nonvolatile timekeeping RAM datasheet (document number and revision not confirmed for this import)"
public_from = ["Dallas DS1742 datasheet", "OpenBSD dsrtc driver", "Fuel revision B board photograph"]

[spaces.chip]
unit = "byte"
doc = "The whole 2,048-byte chip. Eleven address pins A0 to A10 select a byte, so offsets run from 0x000 to 0x7ff."

[registers.ram]
offset = 0x000
space = "chip"
count = 2040
access = "rw"
width = 8
reset = "unknown"
grade = "inferred"
from = "Arithmetic on the clock placement below: the clock occupies the top eight bytes, so the rest of the range is read as RAM"
doc = "Battery-backed RAM below the clock bytes. The sources give no RAM count and no layout inside it. The 2,040 is inferred from the clock placement, not stated by a source."

[registers.clock]
offset = 0x7f8
space = "chip"
count = 8
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "Dallas DS1742 datasheet, address map (the chip places the clock bytes at offsets 0x7f8 to 0x7ff)"
doc = "The eight clock and calendar bytes at the top of the chip. The sources give their order and bit meanings only through the chip's own register page, which this import did not read, so each byte is named here by offset only."
