unit = "r10000_cp0"
prefix = "R10KCP0"
title = "R10000 CP0 Count and Compare timer interrupt and TLB geometry"
doc = "Coprocessor 0 register numbers of the Count and Compare timer, the Cause bit that carries its interrupt, and the TLB geometry the shipped IRIX kernel assumes."
from = "published R10000 user's manual (the source reading gives no document number)"
public_from = ["published R10000", "IRIX kernel translation-handling reading"]

[words.CAUSE_TIMER]
width = 32
grade = "established"
from = "published R10000 user's manual (the source reading gives no document number)"
doc = "The Cause register bit that carries the Count and Compare timer interrupt."

[words.CAUSE_TIMER.fields]
ip7 = { bits = [15, 15], grade = "established" }

[constants]
R10K_CP0_COMPARE = { value = 0xb, grade = "established", macro = "R10K_CP0_COMPARE", from = "published R10000 user's manual (the source reading gives no document number)", doc = "Compare register number in coprocessor 0" }
R10K_CP0_COUNT = { value = 0x9, grade = "established", macro = "R10K_CP0_COUNT", from = "published R10000 user's manual (the source reading gives no document number)", doc = "Count register number in coprocessor 0" }
R10K_TLB_ENTRIES = { value = 64, grade = "inferred", from = "IRIX kernel translation-handling reading, one release outside the shipped-binary inventory; the R10000 geometry was not checked against the published manual", doc = "Dual TLB entries, each holding two pages" }
R10K_TLB_ASID_BITS = { value = 8, grade = "inferred", from = "IRIX kernel translation-handling reading, one release outside the shipped-binary inventory; the R10000 geometry was not checked against the published manual", doc = "Width of the ASID field in the TLB entry high word" }
