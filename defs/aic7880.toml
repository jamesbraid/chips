unit = "aic7880"
prefix = "AIC7880"
title = "Adaptec AIC-7880 SCSI controller on the O2: host DMA and SCB register contract"
doc = "The O2 onboard SCSI controller's host-DMA window, its DMA control and FIFO status registers, the SCB page pointer, byte counter and window, and the SCSI bus signal, transfer-control and PIO registers. Offsets and widths come from the cited Adaptec AIC-7870 data book, applied to the AIC-7880 as its sibling. Every item is inferred until an AIC-7880 book or a measurement settles it."
from = "Adaptec AIC-7870 Data Book (sibling, applied to AIC-7880)"
public_from = ["Adaptec AIC-7870 Data Book"]

[registers.lhaddr]
offset = 0x88
access = "rw"
width = 32
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139-140 (printed 4-70 to 4-71); sibling"
doc = "Host PCI address for the host DMA transfer, four byte registers at 0x88 to 0x8b. Loading it also loads SHADDR. The byte significance across the four bytes is not in the cited extract and stays unknown. Read-back is not stated."

[registers.hcnt]
offset = 0x8c
access = "rw"
width = 8
count = 3
stride = 1
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139-140 (printed 4-70 to 4-71); sibling"
doc = "24-bit host transfer count in three byte registers at 0x8c to 0x8e. A zero count inhibits host PCI requests. Loading a nonzero count clears HDONE. The byte significance across the three bytes is not in the cited extract and stays unknown. Read-back is not stated."

[registers.dfcntrl]
offset = 0x93
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139, 145-148 (printed 4-70, 4-76 to 4-79); sibling"
doc = "Data FIFO control. Bits 5 and 4 enable SCSI and SCSI-block DMA, bit 3 enables host DMA, bit 2 selects the direction, bit 1 flushes the FIFO and bit 0 resets it and self-clears. Cleared by PCI RST# and by the chip reset in HCNTRL. Read-back is not stated. The reset value is the cleared state the chip reset produces, not a value read after initialisation."

[registers.dfcntrl.fields]
scsien     = { bits = [5, 5], grade = "inferred", doc = "enables transfer between the SCSI bus and the SCSI FIFO" }
sdmaen     = { bits = [4, 4], grade = "inferred", doc = "enables transfer between the SCSI block and the data FIFO" }
hdmaen     = { bits = [3, 3], grade = "inferred", doc = "enables transfer between the data FIFO and PCI memory; clearing it halts host requests and is acknowledged before the registers are reloaded" }
direction  = { bits = [2, 2], grade = "inferred", doc = "1 moves data from memory or the FIFO toward the SCSI block; changing it needs all transfer enables clear and acknowledged" }
fifoflush  = { bits = [1, 1], grade = "inferred", doc = "flushes the FIFO" }
fiforeset  = { bits = [0, 0], grade = "inferred", doc = "empties valid FIFO state, resets its word pointers and loads its byte offset from the low three bits of LHADDR; self-clearing" }
wideodd    = { bits = [6, 6], grade = "inferred", doc = "has no effect except in a wide transfer with an odd byte count; the public Linux driver labels bit 6 WIDEODD too" }

[registers.dfstatus]
offset = 0x94
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 145-148 (printed 4-76 to 4-79); sibling"
doc = "Data FIFO status. Reports FIFOEMP, FIFOFULL, FIFOQWDEMP, MREQPEND and HDONE. Only DFTHRSH, bit 2, has a listed position here; the other bit positions are not in the cited extract and stay unknown. MREQPEND is a pending need, not a PCI request in flight."

[registers.dfstatus.fields]
dfthrsh = { bits = [2, 2], grade = "inferred", doc = "FIFO start threshold status for the level selected by DSPCISTATUS bits 7:6; FIFO status only, it needs neither PCI decode and mastering nor HDMAEN" }

[registers.scbptr]
offset = 0x90
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 53, 63-64, 153 and 180; sibling"
doc = "SCB page select latch. All eight bits read back as written, whether or not external SRAM is selected and however much of it is fitted, so a read-back of 0xff does not show that page 255 exists. Selects one 32-byte page for the SCB window and for SCBCNT-addressed accesses. Reset is zero as the cited book's reset description gives it, not a value read after initialisation."

[registers.scbcnt]
offset = 0x9a
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 63-64, 153-154, 176-177 and 180; sibling"
doc = "SCB byte counter. Bits 6:5 read zero. With SCBAUTO clear the window offset selects the byte and the counter is not used. With SCBAUTO set the counter replaces the window offset, advances once per completed logical SCB byte access and wraps within the 32-byte page. Reset is zero as the cited book's reset description gives it."

[registers.scbcnt.fields]
scbauto = { bits = [7, 7], grade = "inferred", doc = "1 makes the counter address the SCB window and advance on each completed byte access; 0 leaves the window offset in control" }
scbofs  = { bits = [4, 0], grade = "inferred", doc = "byte offset within the 32-byte page, used when SCBAUTO is clear and advanced by the counter when it is set" }

[registers.scbwin]
offset = 0xa0
access = "rw"
width = 8
count = 32
stride = 1
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 63-64, 153-154 and 176-177; sibling"
doc = "SCB window: 32 byte positions of the page that SCBPTR selects. Sequencer accesses are byte wide. Host reads are byte wide. Host writes are byte wide in either SCBAUTO mode, and a full four-byte write is accepted only with SCBAUTO set, filling four successive positions. Host access needs a paused sequencer or the automatic access pause. Byte order of the four data bytes against the CPU is not in the cited extract and stays unknown."

[registers.allones]
offset = 0x69
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 102 (printed 4-33); sibling"
doc = "Read-only port that returns 0xff to the host and to the sequencer. It is a source for logical and arithmetic functions. The book gives no write function, so a write is outside the published interface and its effect stays unknown."

[registers.allzeros]
offset = 0x6a
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 102-103 (printed 4-33 to 4-34); sibling"
doc = "Read returns 0x00 and does not return an earlier write. Written as the destination NONE, the byte is discarded and no location changes. Both directions share the offset, so the write side is described here rather than as a separate register."

[registers.function1]
offset = 0x6e
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 104 (printed 4-35); sibling"
doc = "A write stores the byte. Bits 6:4 form an octal value, and a read returns the one-hot byte with bit N set, where N is that value. The book does not define the meaning of bits 7 and 3:0, whether a write keeps them, or the reset value. Those stay unknown."

[registers.function1.fields]
select = { bits = [6, 4], grade = "inferred", doc = "octal value; a read returns 1 << select" }

[registers.stack]
offset = 0x6f
access = "r"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 60 (printed 3-6) and 105 (printed 4-36); sibling"
doc = "Read-only return-stack port. Four return entries, newest first, are read one byte at a time: the low byte of an entry, then its high byte, which carries the high address bit. Each high-byte read advances the read pointer to the next entry, so eight byte reads bring the pointer back to its start. The read value after initialisation is zero. The reset values of the individual backing words are not specified in the cited pages. The book gives no write function, so a write is outside the published interface and its effect stays unknown."

[registers.sxfrctl0]
offset = 0x01
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 74-75 (printed 4-5 and 4-6); sibling"
doc = "SCSI transfer control 0, the first of two transfer-control registers. Bits 5 and 0 are not used and read zero. The two self-clearing controls, CLRSTCNT and CLRCHN, read back as zero. The reset value is not stated in the cited pages."

[registers.sxfrctl0.fields]
dfon     = { bits = [7, 7], grade = "inferred", doc = "digital filtering on for the incoming REQ and ACK signals; the filter period depends on the SCSI transfer rate and on the DFPEXP bit (bit 6)" }
clrstcnt = { bits = [4, 4], grade = "inferred", doc = "self-clearing; zeroes the SCSI transfer counter and the host address counter, and leaves the host count and the FIFO alone" }
spioen   = { bits = [3, 3], grade = "inferred", doc = "enables automatic PIO on the SCSI bus; it must stay set for the whole PIO transfer, and each transfer is triggered by a SCSIDATL access; clearing it stops further PIO transfers without corrupting valid SCSIDATL data; it may stay set in DMA mode because the SCSI DMA enables override it" }
clrchn   = { bits = [1, 1], grade = "inferred", doc = "self-clearing; clears the SCSI FIFO and the synchronous REQ/ACK offset counter and returns the transfer control logic to its reset state; leaves the SCSI transfer counters unchanged" }

[registers.scsisig]
offset = 0x03
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 77-78 (printed 4-8 and 4.9); sibling"
doc = "SCSI control signals. The read side returns the state of the bus control signals. The write side sets the initiator output levels, and its three upper bits are the phase the chip expects on the next REQ pulse. The two sides share one offset and the same bit positions. Every write-side bit is cleared by chip reset, by a SCSI bus reset and by Bus Free. The read side has no reset value in the cited pages. The book's own register description gives the read side as a stale copy of the bus, which reads as the bus state."

[registers.scsisig.fields]
cd   = { bits = [7, 7], grade = "inferred", doc = "read: CD# on the bus; write: CD# expected on the next REQ in initiator mode" }
io   = { bits = [6, 6], grade = "inferred", doc = "read: I/O# on the bus; write: I/O# expected on the next REQ in initiator mode" }
msg  = { bits = [5, 5], grade = "inferred", doc = "read: MSG# on the bus; write: MSG# expected on the next REQ in initiator mode" }
atn  = { bits = [4, 4], grade = "inferred", doc = "read: ATN# on the bus; write 1 asserts ATN# in initiator mode and write 0 has no effect; ATN# is cleared by writing one to the CLRATNO bit of CLRSINT1, not by a zero here" }
sel  = { bits = [3, 3], grade = "inferred", doc = "read: SEL# on the bus; write 1 asserts SEL#, and write 0 negates it" }
bsy  = { bits = [2, 2], grade = "inferred", doc = "read: BSY# on the bus; write 1 asserts BSY#, and write 0 negates it" }
req  = { bits = [1, 1], grade = "inferred", doc = "read: REQ# on the bus; write: REQO, which has no effect in initiator mode" }
ack  = { bits = [0, 0], grade = "inferred", doc = "read: ACK# on the bus; write: ACKO, which sets ACK# in initiator mode and has no effect in target mode" }

[registers.clrsint1]
offset = 0x0c
access = "w"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 78 and 86; sibling; Linux aic7xxx.reg (db2ddb87143519e20a95aa36c60b36107b736a58)"
doc = "Write-only SCSI interrupt clears. Only CLRATNO, bit 6, is listed here; the bit positions of the other clears (CLRREQINIT, CLRPHASECHG, CLRBUSFREE) are not in the cited extract. Writing one to CLRATNO clears the initiator ATN output set through SCSISIGO. Read-back is not stated."

[registers.clrsint1.fields]
clratno = { bits = [6, 6], grade = "inferred", doc = "writing one clears ATN# asserted in initiator mode; a zero write has no effect" }

[registers.scsidatl]
offset = 0x06
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 81 (printed 4-12); sibling"
doc = "SCSI data latch used for automatic and manual PIO, one byte per access. The book says an access drives the SCSI ACK (as initiator) or REQ (as target) active as it happens. The value after chip reset is unknown, and valid data loads after the first REQ and ACK. The high byte in 16-bit mode is a separate register and is not described here."

[registers.scsibusl]
offset = 0x12
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 93 (printed 4-24); sibling"
doc = "SCSI data bus, read directly. The book says the data is gated from the bus to the internal data bus and is not latched in the SCSI module. A read therefore sees the byte on the bus without taking the latch. Nothing in the cited pages says it acknowledges the byte, and the book ties the ACK drive to SCSIDATL accesses, so this read is taken not to acknowledge (inferred from the book's wording, not stated)."

[registers.simode0]
offset = 0x10
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 91 (printed 4-22); sibling"
doc = "SCSI interrupt mask 0. Setting a bit enables the matching SSTAT0 status to assert the SCSI interrupt. Only the bit this unit uses is listed here."

[registers.simode0.fields]
enspiordy = { bits = [1, 1], grade = "inferred", doc = "enables the SPIORDY status in SSTAT0 to assert the SCSI interrupt" }

[registers.seqctl]
offset = 0x60
access = "rw"
width = 8
reset = 0x90
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 98 (printed 4-29); sibling"
doc = "Sequencer control. Bit 4 selects the sequencer clock divider, bit 2 requests one single step, bit 1 resets the sequencer RAM address pointer and bit 0 gives the host access to sequencer RAM. Bit 6 disables the host pause request. Bits 7, 5 and 3 (PERRORDIS, FAILDIS and BRKADRINTEN) are in the book but are not described on this unit. The reset value is the one the book's bit table gives in parentheses, not a value read after initialisation."

[registers.seqctl.fields]
pausedis = { bits = [6, 6], grade = "inferred", doc = "set disables the host PAUSE request. SCSI interrupts, illegal opcode interrupts and sequencer RAM parity error interrupts clear it, and host software may not write it" }
fastmode = { bits = [4, 4], grade = "inferred", doc = "1 divides the input clock by four to give the sequencer clock; 0 divides it by five" }
step = { bits = [2, 2], grade = "inferred", doc = "1 runs one instruction and pauses the sequencer again. It stays set until software clears it, and each further single step clears PAUSE in HCNTRL once more" }
seqreset = { bits = [1, 1], grade = "inferred", doc = "resets the sequencer RAM address pointer to zero. Self-clearing. The sequencer must be paused before it is set" }
loadram = { bits = [0, 0], grade = "inferred", doc = "1 lets the host read or write sequencer RAM through SEQRAM. Clear it for normal operation, and clear it before switching between reads and writes" }

[registers.seqaddr0]
offset = 0x62
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 99 (printed 4-30); sibling"
doc = "Low eight bits of the sequencer RAM address that executes on the next clock edge. The driver writes it while the sequencer is paused to change where execution resumes, and uses it as the start address when loading sequencer RAM. While loading, the address steps up after every fourth byte. A write to SEQADDR[1:0] clears that byte index. RST# and CHIPRST clear the address to zero."

[registers.seqaddr1]
offset = 0x63
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 99 (printed 4-30); sibling"
doc = "Bit 0 is bit 8 of the sequencer RAM address, which covers the 512 instruction words. Bits 7 to 1 are reserved in the book, and their read-back is not stated. RST# and CHIPRST clear the register."

[registers.seqaddr1.fields]
addr8 = { bits = [0, 0], grade = "inferred", doc = "bit 8 of the sequencer RAM address" }

[registers.scsirate]
offset = 0x04
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 79 and 97; sibling"
doc = "SCSI rate control for DATA. Wide DATA needs this register's WIDEXFER bit and the SBLKCTL SELWIDE bit both set. Bits 6 to 4 are not in the cited pages and the reset value is not stated, so both stay unknown. Read-back is not stated."

[registers.scsirate.fields]
wide = { bits = [7, 7], grade = "inferred", doc = "WIDEXFER: sixteen-bit DATA transfer, which also needs SELWIDE set in SBLKCTL" }
sofs = { bits = [3, 0], grade = "inferred", doc = "SOFS: synchronous offset that sets DATA timing" }

[registers.scsiid]
offset = 0x05
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 80; sibling"
doc = "Target ID in bits 7:4 and own ID in bits 3:0. Both are four-bit fields, so the sibling addresses IDs 0 to 15 on the wide connection. Chip and PCI reset clear both nibbles. The own ID is the initiator's address during Selection Out. Public drivers commonly write own ID 7 after reset. That is software configuration, not a reset value."

[registers.scsiid.fields]
tid = { bits = [7, 4], grade = "inferred", doc = "target ID for Selection Out" }
oid = { bits = [3, 0], grade = "inferred", doc = "own ID presented as the initiator's address during Selection Out" }

[registers.sblkctl]
offset = 0x1f
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 80 and 96-97; sibling"
doc = "Block control. The SELWIDE bit selects the physical SCSI connection width. Its reset value follows the wide-select pin WIDEPS# sampled at reset, and the O2's strap state is unknown, so the register has no reset value here. Bits 7 and 6 reset to one, bit 5 resets to zero, and bits 4, 2 and 0 read zero. Bit 3 is not described here."

[registers.sblkctl.fields]
diagled      = { bits = [7, 6], grade = "inferred", doc = "diagnostic LED control; resets to one" }
autoflushdis = { bits = [5, 5], grade = "inferred", doc = "resets to zero; the function is not in the cited pages" }
selwide      = { bits = [1, 1], grade = "inferred", doc = "1 configures the wide physical connection with the upper data lines in use; 0 leaves them unused" }

[registers.scsiseq]
offset = 0x00
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 72-73 (printed 4-3 and 4-4); sibling"
doc = "SCSI sequence control. Each bit enables one hardware selection or reselection sequence, or drives SCSI RESET#. A SCSI bus reset clears every bit except SCSIRSTO. The register reads back, so software can set and clear bits without a scratch copy."

[registers.scsiseq.fields]
temodeo    = { bits = [7, 7], grade = "inferred", doc = "0 makes ENSELO start a selection out; 1 makes it start a reselection out" }
enselo     = { bits = [6, 6], grade = "inferred", doc = "starts a selection (initiator) or reselection (target) sequence; SSTAT0 reports the wait for BSY" }
enseli     = { bits = [5, 5], grade = "inferred", doc = "lets the logic answer a selection by an initiator; sets SSTAT0 SELDI and TARGET" }
enrseli    = { bits = [4, 4], grade = "inferred", doc = "lets the logic answer a reselection by a target; sets SSTAT0 SELDI and clears TARGET" }
enautoatno = { bits = [3, 3], grade = "inferred", doc = "asserts ATN during a selection out; ATN clears on a one written to CLRATNO or at bus free, and a zero written here does not clear it" }
enautoatni = { bits = [2, 2], grade = "inferred", doc = "asserts ATN after a reselection; ATN clears as for ENAUTOATNO" }
enautoatnp = { bits = [1, 1], grade = "inferred", doc = "asserts ATN on a parity error in data in, message in or status in, only with SXFRCTL1 ENSPCHK set; ATN clears as for ENAUTOATNO" }
scsirsto   = { bits = [0, 0], grade = "inferred", doc = "drives SCSI RESET# while set; software clears it with a zero write" }

[registers.sxfrctl1]
offset = 0x02
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 75-76 (printed 4-6 and 4-7); sibling"
doc = "SCSI transfer control 1. Holds the bit-bucket and wrap controls, the parity check enable, the selection timer and its interval, active negation and the termination power enable. Every bit reads zero after reset."

[registers.sxfrctl1.fields]
bitbucket = { bits = [7, 7], grade = "inferred", doc = "initiator mode only: read and discard bus data, or drive zeros on writes, with no stops on FIFO full or empty" }
swrapen   = { bits = [6, 6], grade = "inferred", doc = "lets STCNT wrap past zero so a transfer can exceed 24 bits; SWRAP status is set at each wrap" }
enspchk   = { bits = [5, 5], grade = "inferred", doc = "enables SCSI parity checking in selection, reselection and information transfer; an error sets SSTAT1 SCSIPERR" }
stimesel  = { bits = [4, 3], grade = "inferred", doc = "selection time-out interval: 01 is 128 ms, 10 is 64 ms, 11 is 32 ms; the value for 00 is not legible in the source text and stays unknown" }
enstimer  = { bits = [2, 2], grade = "inferred", doc = "enables the hardware selection timer; on expiry SEL is released and SSTAT1 SELTO is set; when clear, SEL stays on until the sequencer clears it" }
actnegen  = { bits = [1, 1], grade = "inferred", doc = "enables active negation on REQ, ACK and the data outputs during information transfer" }
stpwen    = { bits = [0, 0], grade = "inferred", doc = "drives the termination power control output to the level STPWLEVEL selects in DEVCONFIG" }

[registers.shaddr]
offset = 0x14
access = "r"
width = 8
count = 4
stride = 1
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 58-59 and 93 (printed 4-24); sibling"
doc = "SCSI-side host address, four bytes at 0x14 to 0x17, least significant byte first, so byte n holds address bits 8n+7 to 8n. Loaded when the host address at 0x88 to 0x8b is written and HADDLDSEL is 0. Counts up while STCNT counts down. Saved by the Save Data Pointers message. Zero after reset."

[registers.selid]
offset = 0x19
access = "r"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 59 and 95 (printed 4-26); sibling"
doc = "Selection and reselection ID. Holds the ID of the device that selected or reselected this controller on the last such phase."

[registers.selid.fields]
selid = { bits = [7, 4], grade = "inferred", doc = "ID of the selecting or reselecting device, decoded from the bus bits" }
onebit = { bits = [3, 3], grade = "inferred", doc = "set when one bit was on the lower eight data lines during selection; zero when two were" }

[registers.simode1]
offset = 0x11
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 92 (printed 4-23); sibling"
doc = "SCSI interrupt mask 1. Each set bit lets the matching SSTAT1 status assert SCSIINT on IRQA#."

[registers.simode1.fields]
enseltimo  = { bits = [7, 7], grade = "inferred", doc = "SELTO status" }
enatntarg  = { bits = [6, 6], grade = "inferred", doc = "ATNTARG status" }
enscsirst  = { bits = [5, 5], grade = "inferred", doc = "SCSI reset status" }
enphasemis = { bits = [4, 4], grade = "inferred", doc = "PHASEMIS status" }
enbusfree  = { bits = [3, 3], grade = "inferred", doc = "bus-free status" }
enscsiperr = { bits = [2, 2], grade = "inferred", doc = "latched SCSI parity error status" }
enphasechg = { bits = [1, 1], grade = "inferred", doc = "PHASECHG status" }
enreqinit  = { bits = [0, 0], grade = "inferred", doc = "REQINIT status" }

[registers.dspcistatus]
offset = 0x86
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 61 and 136 (printed 4-67); sibling"
doc = "Data FIFO threshold select, with a read-only view of six PCI status bits. Power-on reset forces the threshold select to zero. Writes change only bits 7 and 6."

[registers.dspcistatus.fields]
dfthrsh = { bits = [7, 6], grade = "inferred", doc = "threshold select for the FIFO start and stop levels that DFSTATUS DFTHRSH reports" }
pcistatus = { bits = [5, 0], grade = "inferred", doc = "live, read-only mirror of PCI status bits, named DSDPR (5, data parity reported), DSDPE (4, detected parity error), DSSSE (3, signaled system error), DSRMA (2, received master abort), DSRTA (1, received target abort) and DSSTA (0, signaled target abort); writes have no effect" }

[registers.hcntrl]
offset = 0x87
access = "rw"
width = 8
reset = 0x05
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 61 and 137-138 (printed 4-68 and 4-69); sibling"
doc = "Host control. RST# or a CHIPRST write sets it to 0x05: the sequencer is requested paused and chip reset is acknowledged. A write that changes PAUSE is not complete until a read returns the written value."

[registers.hcntrl.fields]
powrdn  = { bits = [6, 6], grade = "inferred", doc = "power down: removes the clock and SCSI inputs, suppresses IRQA# and limits device access to host registers; quiesce transfers and pause first" }
swint   = { bits = [4, 4], grade = "inferred", doc = "software interrupt on IRQA# when INTEN, MASTEREN, a decode enable are set and POWRDN is clear; leaves INTSTAT alone" }
hcntrl3 = { bits = [3, 3], grade = "inferred", doc = "spare bit with no assignment" }
pause   = { bits = [2, 2], grade = "inferred", doc = "write: request a latched pause; read: pause acknowledge. Host access to normally sequencer-only registers opens once PAUSEACK is set" }
inten   = { bits = [1, 1], grade = "inferred", doc = "lets active INTSTAT causes assert IRQA#, when the PCI command MASTEREN bit is also set" }
chiprst = { bits = [0, 0], grade = "inferred", doc = "write 1 resets the chip as RST# does, leaving PCI configuration space alone; read: CHIPRSTACK" }

[registers.intstat]
offset = 0x91
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 141-142 (printed 4-72 and 4-73); sibling"
doc = "Interrupt status. The sequencer writes these causes, and the host reads them without pausing the sequencer. SEQINT, SCSIINT and BRKADRINT pause the sequencer at once; CMDCMPLT does not. Bits 3 to 0 clear individually through CLRINT."

[registers.intstat.fields]
intcode   = { bits = [7, 4], grade = "inferred", doc = "code the sequencer stores in the same write that sets SEQINT; valid only while SEQINT is set" }
brkadrint = { bits = [3, 3], grade = "inferred", doc = "breakpoint match with the breakpoint enabled, or an error: illegal opcode, sequencer RAM parity, data-path parity or memory parity" }
scsiint   = { bits = [2, 2], grade = "inferred", doc = "SCSI reset, parity error, selection time-out or unexpected bus free, when enabled in SIMODE0 or SIMODE1" }
cmdcmplt  = { bits = [1, 1], grade = "inferred", doc = "a command completed and its SCB ID was posted to the queue-out FIFO; the sequencer keeps running" }
seqint    = { bits = [0, 0], grade = "inferred", doc = "the sequencer needs the driver; it stops at once, with no instruction after the write that sets it" }

[registers.clrint]
offset = 0x92
access = "w"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 143-144 (printed 4-74 and 4-75); sibling"
doc = "Clear interrupt, the write side of offset 0x92. A one written to a bit clears the matching INTSTAT cause; the bits self-clear, and the sequencer cannot write this register. The read side at the same offset is the ERROR register, whose causes (PCIERRSTAT, MPARERR, DPARERR, SQPARERR, ILLOPCODE) are described in the prose page."

[registers.clrint.fields]
clrparerr    = { bits = [4, 4], grade = "inferred", doc = "clears the SQPARERR, MPARERR and DPARERR error causes and their latched interrupts; the PCI STATUS bits stay set" }
clrbrkadrint = { bits = [3, 3], grade = "inferred", doc = "clears BRKADRINT; a BRKADRINT cause from a breakpoint or a sequencer error must be cleared at its source first" }
clrscsiint   = { bits = [2, 2], grade = "inferred", doc = "clears SCSIINT" }
clrcmdint    = { bits = [1, 1], grade = "inferred", doc = "clears CMDCMPLT" }
clrseqint    = { bits = [0, 0], grade = "inferred", doc = "clears SEQINT" }

[registers.dfdat]
offset = 0x99
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 63; sibling"
doc = "Data FIFO port, one byte per access. A read takes one valid byte from the FIFO and a write supplies one. The book gives no reset value (init xx)."

[registers.qinfifo]
offset = 0x9b
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 69 (layout), p. 63 (lists it at M98, which the layout does not match); sibling"
doc = "Queue-in FIFO. The host writes SCB IDs and the sequencer removes them. The address follows the SCB device-register layout on PDF p. 69; the register table on PDF p. 63 prints it as 0x98."

[registers.qincnt]
offset = 0x9c
access = "r"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 63 and 69; sibling"
doc = "Queue-in count: entries waiting in the queue-in FIFO. Zero when empty."

[registers.qoutcnt]
offset = 0x9e
access = "r"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 61; sibling"
doc = "Queue-out count, read by the host only. Zero when empty."

[registers.accum]
offset = 0x64
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 60 and 100 (printed 4-31); sibling"
doc = "Accumulator: temporary holding place for sequencer ALU operations."

[registers.sindex]
offset = 0x65
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 60 and 100; sibling"
doc = "Source index: a temporary value, or the address that the sequencer's indirect source port SINDIR reads. The sequencer increments it after each indirect transfer."

[registers.dindex]
offset = 0x66
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 60 and 101; sibling"
doc = "Destination index: a temporary value, or the address that the sequencer's indirect destination port DINDIR writes. The sequencer increments it after each indirect transfer."

[registers.brkaddr0]
offset = 0x67
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 60 and 101; sibling"
doc = "Low eight bits of the sequencer breakpoint address. Cleared to zero by reset."

[registers.brkaddr1]
offset = 0x68
access = "rw"
width = 8
reset = 0x80
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 60 and 102 (printed 4-33); sibling"
doc = "Breakpoint disable and the top address bit. Reset to 0x80, which leaves the breakpoint disabled."

[registers.brkaddr1.fields]
brkdis   = { bits = [7, 7], grade = "inferred", doc = "1 disables the compare against the program counter" }
brkaddr8 = { bits = [0, 0], grade = "inferred", doc = "bit 8 of the break address" }

[registers.flags]
offset = 0x6b
access = "r"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 103 (printed 4-34); sibling"
doc = "Sequencer flags, read only."

[registers.flags.fields]
zero  = { bits = [1, 1], grade = "inferred", doc = "zero flag" }
carry = { bits = [0, 0], grade = "inferred", doc = "carry flag" }

[registers.sindir]
offset = 0x6c
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 103 (printed 4-34); sibling"
doc = "Sequencer-only indirect source port. A read returns the byte SINDEX addresses, then SINDEX increments. The host cannot reach this port."

[registers.dindir]
offset = 0x6d
access = "w"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 104 (printed 4-35); sibling"
doc = "Sequencer-only indirect destination port. A write stores the byte at the address DINDEX holds, then DINDEX increments. The host cannot reach this port."
