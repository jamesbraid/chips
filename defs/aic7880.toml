unit = "aic7880"
prefix = "AIC7880"
title = "Adaptec AIC-7880 SCSI controller on the O2: host DMA and SCB register contract"
doc = "The O2 onboard SCSI controller's host-DMA window, its DMA control and FIFO status registers, and the SCB page pointer, byte counter and window. Offsets and widths come from the cited Adaptec AIC-7870 data book, applied to the AIC-7880 as its sibling. Every item is inferred until an AIC-7880 book or a measurement settles it."
from = "Adaptec AIC-7870 Data Book (sibling, applied to AIC-7880)"
public_from = ["Adaptec AIC-7870 Data Book"]

[registers.lhaddr]
offset = 0x88
access = "rw"
width = 32
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139-140 (printed 4-70 to 4-71); sibling"
doc = "Host PCI address for the host DMA transfer, four byte registers at 0x88 to 0x8b. Loading it also loads SHADDR. The byte significance across the four bytes is not in the cited extract and stays unknown. Read-back is not stated."

[registers.hcnt]
offset = 0x8c
access = "rw"
width = 8
count = 3
stride = 1
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139-140 (printed 4-70 to 4-71); sibling"
doc = "24-bit host transfer count in three byte registers at 0x8c to 0x8e. A zero count inhibits host PCI requests. Loading a nonzero count clears HDONE. The byte significance across the three bytes is not in the cited extract and stays unknown. Read-back is not stated."

[registers.dfcntrl]
offset = 0x93
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139, 145-148 (printed 4-70, 4-76 to 4-79); sibling"
doc = "Data FIFO control. Bits 5 and 4 enable SCSI and SCSI-block DMA, bit 3 enables host DMA, bit 2 selects the direction, bit 1 flushes the FIFO and bit 0 resets it and self-clears. Cleared by PCI RST# and by the chip reset in HCNTRL. Read-back is not stated. The reset value is the cleared state the chip reset produces, not a value read after initialisation."

[registers.dfcntrl.fields]
scsien     = { bits = [5, 5], grade = "inferred", doc = "enables transfer between the SCSI bus and the SCSI FIFO" }
sdmaen     = { bits = [4, 4], grade = "inferred", doc = "enables transfer between the SCSI block and the data FIFO" }
hdmaen     = { bits = [3, 3], grade = "inferred", doc = "enables transfer between the data FIFO and PCI memory; clearing it halts host requests and is acknowledged before the registers are reloaded" }
direction  = { bits = [2, 2], grade = "inferred", doc = "1 moves data from memory or the FIFO toward the SCSI block; changing it needs all transfer enables clear and acknowledged" }
fifoflush  = { bits = [1, 1], grade = "inferred", doc = "flushes the FIFO" }
fiforeset  = { bits = [0, 0], grade = "inferred", doc = "empties valid FIFO state, resets its word pointers and loads its byte offset from the low three bits of LHADDR; self-clearing" }
wideodd    = { bits = [6, 6], grade = "inferred", doc = "has no effect except in a wide transfer with an odd byte count; the public Linux driver labels bit 6 WIDEODD too" }

[registers.dfstatus]
offset = 0x94
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 145-148 (printed 4-76 to 4-79); sibling"
doc = "Data FIFO status. Reports FIFOEMP, FIFOFULL, FIFOQWDEMP, MREQPEND and HDONE. The bit positions are not in the cited extract, so no field is listed here and they stay unknown. MREQPEND is a pending need, not a PCI request in flight."

[registers.scbptr]
offset = 0x90
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 53, 63-64, 153 and 180; sibling"
doc = "SCB page select latch. All eight bits read back as written, whether or not external SRAM is selected and however much of it is fitted, so a read-back of 0xff does not show that page 255 exists. Selects one 32-byte page for the SCB window and for SCBCNT-addressed accesses. Reset is zero as the cited book's reset description gives it, not a value read after initialisation."

[registers.scbcnt]
offset = 0x9a
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 63-64, 153-154, 176-177 and 180; sibling"
doc = "SCB byte counter. Bits 6:5 read zero. With SCBAUTO clear the window offset selects the byte and the counter is not used. With SCBAUTO set the counter replaces the window offset, advances once per completed logical SCB byte access and wraps within the 32-byte page. Reset is zero as the cited book's reset description gives it."

[registers.scbcnt.fields]
scbauto = { bits = [7, 7], grade = "inferred", doc = "1 makes the counter address the SCB window and advance on each completed byte access; 0 leaves the window offset in control" }
scbofs  = { bits = [4, 0], grade = "inferred", doc = "byte offset within the 32-byte page, used when SCBAUTO is clear and advanced by the counter when it is set" }

[registers.scbwin]
offset = 0xa0
access = "rw"
width = 8
count = 32
stride = 1
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 63-64, 153-154 and 176-177; sibling"
doc = "SCB window: 32 byte positions of the page that SCBPTR selects. Sequencer accesses are byte wide. Host reads are byte wide. Host writes are byte wide in either SCBAUTO mode, and a full four-byte write is accepted only with SCBAUTO set, filling four successive positions. Host access needs a paused sequencer or the automatic access pause. Byte order of the four data bytes against the CPU is not in the cited extract and stays unknown."
