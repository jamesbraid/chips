unit = "aic7880"
prefix = "AIC7880"
title = "Adaptec AIC-7880 SCSI controller on the O2: host DMA and SCB register contract"
doc = "The O2 onboard SCSI controller's host-DMA window, its DMA control and FIFO status registers, the SCB page pointer, byte counter and window, and the SCSI bus signal, transfer-control and PIO registers. Offsets and widths come from the cited Adaptec AIC-7870 data book, applied to the AIC-7880 as its sibling. Every item is inferred until an AIC-7880 book or a measurement settles it."
from = "Adaptec AIC-7870 Data Book (sibling, applied to AIC-7880)"
public_from = ["Adaptec AIC-7870 Data Book"]

[registers.lhaddr]
offset = 0x88
access = "rw"
width = 32
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139-140 (printed 4-70 to 4-71); sibling"
doc = "Host PCI address for the host DMA transfer, four byte registers at 0x88 to 0x8b. Loading it also loads SHADDR. The byte significance across the four bytes is not in the cited extract and stays unknown. Read-back is not stated."

[registers.hcnt]
offset = 0x8c
access = "rw"
width = 8
count = 3
stride = 1
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139-140 (printed 4-70 to 4-71); sibling"
doc = "24-bit host transfer count in three byte registers at 0x8c to 0x8e. A zero count inhibits host PCI requests. Loading a nonzero count clears HDONE. The byte significance across the three bytes is not in the cited extract and stays unknown. Read-back is not stated."

[registers.dfcntrl]
offset = 0x93
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 139, 145-148 (printed 4-70, 4-76 to 4-79); sibling"
doc = "Data FIFO control. Bits 5 and 4 enable SCSI and SCSI-block DMA, bit 3 enables host DMA, bit 2 selects the direction, bit 1 flushes the FIFO and bit 0 resets it and self-clears. Cleared by PCI RST# and by the chip reset in HCNTRL. Read-back is not stated. The reset value is the cleared state the chip reset produces, not a value read after initialisation."

[registers.dfcntrl.fields]
scsien     = { bits = [5, 5], grade = "inferred", doc = "enables transfer between the SCSI bus and the SCSI FIFO" }
sdmaen     = { bits = [4, 4], grade = "inferred", doc = "enables transfer between the SCSI block and the data FIFO" }
hdmaen     = { bits = [3, 3], grade = "inferred", doc = "enables transfer between the data FIFO and PCI memory; clearing it halts host requests and is acknowledged before the registers are reloaded" }
direction  = { bits = [2, 2], grade = "inferred", doc = "1 moves data from memory or the FIFO toward the SCSI block; changing it needs all transfer enables clear and acknowledged" }
fifoflush  = { bits = [1, 1], grade = "inferred", doc = "flushes the FIFO" }
fiforeset  = { bits = [0, 0], grade = "inferred", doc = "empties valid FIFO state, resets its word pointers and loads its byte offset from the low three bits of LHADDR; self-clearing" }
wideodd    = { bits = [6, 6], grade = "inferred", doc = "has no effect except in a wide transfer with an odd byte count; the public Linux driver labels bit 6 WIDEODD too" }

[registers.dfstatus]
offset = 0x94
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 145-148 (printed 4-76 to 4-79); sibling"
doc = "Data FIFO status. Reports FIFOEMP, FIFOFULL, FIFOQWDEMP, MREQPEND and HDONE. The bit positions are not in the cited extract, so no field is listed here and they stay unknown. MREQPEND is a pending need, not a PCI request in flight."

[registers.scbptr]
offset = 0x90
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 53, 63-64, 153 and 180; sibling"
doc = "SCB page select latch. All eight bits read back as written, whether or not external SRAM is selected and however much of it is fitted, so a read-back of 0xff does not show that page 255 exists. Selects one 32-byte page for the SCB window and for SCBCNT-addressed accesses. Reset is zero as the cited book's reset description gives it, not a value read after initialisation."

[registers.scbcnt]
offset = 0x9a
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 63-64, 153-154, 176-177 and 180; sibling"
doc = "SCB byte counter. Bits 6:5 read zero. With SCBAUTO clear the window offset selects the byte and the counter is not used. With SCBAUTO set the counter replaces the window offset, advances once per completed logical SCB byte access and wraps within the 32-byte page. Reset is zero as the cited book's reset description gives it."

[registers.scbcnt.fields]
scbauto = { bits = [7, 7], grade = "inferred", doc = "1 makes the counter address the SCB window and advance on each completed byte access; 0 leaves the window offset in control" }
scbofs  = { bits = [4, 0], grade = "inferred", doc = "byte offset within the 32-byte page, used when SCBAUTO is clear and advanced by the counter when it is set" }

[registers.scbwin]
offset = 0xa0
access = "rw"
width = 8
count = 32
stride = 1
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 63-64, 153-154 and 176-177; sibling"
doc = "SCB window: 32 byte positions of the page that SCBPTR selects. Sequencer accesses are byte wide. Host reads are byte wide. Host writes are byte wide in either SCBAUTO mode, and a full four-byte write is accepted only with SCBAUTO set, filling four successive positions. Host access needs a paused sequencer or the automatic access pause. Byte order of the four data bytes against the CPU is not in the cited extract and stays unknown."

[registers.allones]
offset = 0x69
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 102 (printed 4-33); sibling"
doc = "Read-only port that returns 0xff to the host and to the sequencer. It is a source for logical and arithmetic functions. The book gives no write function, so a write is outside the published interface and its effect stays unknown."

[registers.allzeros]
offset = 0x6a
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 102-103 (printed 4-33 to 4-34); sibling"
doc = "Read returns 0x00 and does not return an earlier write. Written as the destination NONE, the byte is discarded and no location changes. Both directions share the offset, so the write side is described here rather than as a separate register."

[registers.function1]
offset = 0x6e
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 104 (printed 4-35); sibling"
doc = "A write stores the byte. Bits 6:4 form an octal value, and a read returns the one-hot byte with bit N set, where N is that value. The book does not define the meaning of bits 7 and 3:0, whether a write keeps them, or the reset value. Those stay unknown."

[registers.function1.fields]
select = { bits = [6, 4], grade = "inferred", doc = "octal value; a read returns 1 << select" }

[registers.sxfrctl0]
offset = 0x01
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 74-75 (printed 4-5 and 4-6); sibling"
doc = "SCSI transfer control 0, the first of two transfer-control registers. Bits 5 and 0 are not used and read zero. The two self-clearing controls, CLRSTCNT and CLRCHN, read back as zero. The reset value is not stated in the cited pages."

[registers.sxfrctl0.fields]
dfon     = { bits = [7, 7], grade = "inferred", doc = "digital filtering on for the incoming REQ and ACK signals; the filter period depends on the SCSI transfer rate and on the DFPEXP bit (bit 6)" }
clrstcnt = { bits = [4, 4], grade = "inferred", doc = "self-clearing; zeroes the SCSI transfer counter and the host address counter, and leaves the host count and the FIFO alone" }
spioen   = { bits = [3, 3], grade = "inferred", doc = "enables automatic PIO on the SCSI bus; it must stay set for the whole PIO transfer, and each transfer is triggered by a SCSIDATL access; clearing it stops further PIO transfers without corrupting valid SCSIDATL data; it may stay set in DMA mode because the SCSI DMA enables override it" }
clrchn   = { bits = [1, 1], grade = "inferred", doc = "self-clearing; clears the SCSI FIFO and the synchronous REQ/ACK offset counter and returns the transfer control logic to its reset state; leaves the SCSI transfer counters unchanged" }

[registers.scsisig]
offset = 0x03
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF pp. 77-78 (printed 4-8 and 4.9); sibling"
doc = "SCSI control signals. The read side returns the state of the bus control signals. The write side sets the initiator output levels, and its three upper bits are the phase the chip expects on the next REQ pulse. The two sides share one offset and the same bit positions. Every write-side bit is cleared by chip reset, by a SCSI bus reset and by Bus Free. The read side has no reset value in the cited pages. The book's own register description gives the read side as a stale copy of the bus, which reads as the bus state."

[registers.scsisig.fields]
cd   = { bits = [7, 7], grade = "inferred", doc = "read: CD# on the bus; write: CD# expected on the next REQ in initiator mode" }
io   = { bits = [6, 6], grade = "inferred", doc = "read: I/O# on the bus; write: I/O# expected on the next REQ in initiator mode" }
msg  = { bits = [5, 5], grade = "inferred", doc = "read: MSG# on the bus; write: MSG# expected on the next REQ in initiator mode" }
atn  = { bits = [4, 4], grade = "inferred", doc = "read: ATN# on the bus; write 1 asserts ATN# in initiator mode and write 0 has no effect; ATN# is cleared by writing one to the CLRATNO bit of CLRSINT1, not by a zero here" }
sel  = { bits = [3, 3], grade = "inferred", doc = "read: SEL# on the bus; write 1 asserts SEL#, and write 0 negates it" }
bsy  = { bits = [2, 2], grade = "inferred", doc = "read: BSY# on the bus; write 1 asserts BSY#, and write 0 negates it" }
req  = { bits = [1, 1], grade = "inferred", doc = "read: REQ# on the bus; write: REQO, which has no effect in initiator mode" }
ack  = { bits = [0, 0], grade = "inferred", doc = "read: ACK# on the bus; write: ACKO, which sets ACK# in initiator mode and has no effect in target mode" }

[registers.scsidatl]
offset = 0x06
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 81 (printed 4-12); sibling"
doc = "SCSI data latch used for automatic and manual PIO, one byte per access. The book says an access drives the SCSI ACK (as initiator) or REQ (as target) active as it happens. The value after chip reset is unknown, and valid data loads after the first REQ and ACK. The high byte in 16-bit mode is a separate register and is not described here."

[registers.scsibusl]
offset = 0x12
access = "r"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 93 (printed 4-24); sibling"
doc = "SCSI data bus, read directly. The book says the data is gated from the bus to the internal data bus and is not latched in the SCSI module. A read therefore sees the byte on the bus without taking the latch. Nothing in the cited pages says it acknowledges the byte, and the book ties the ACK drive to SCSIDATL accesses, so this read is taken not to acknowledge (inferred from the book's wording, not stated)."

[registers.simode0]
offset = 0x10
access = "rw"
width = 8
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 91 (printed 4-22); sibling"
doc = "SCSI interrupt mask 0. Setting a bit enables the matching SSTAT0 status to assert the SCSI interrupt. Only the bit this unit uses is listed here."

[registers.simode0.fields]
enspiordy = { bits = [1, 1], grade = "inferred", doc = "enables the SPIORDY status in SSTAT0 to assert the SCSI interrupt" }

[registers.seqctl]
offset = 0x60
access = "rw"
width = 8
reset = 0x90
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 98 (printed 4-29); sibling"
doc = "Sequencer control. Bit 4 selects the sequencer clock divider, bit 2 requests one single step, bit 1 resets the sequencer RAM address pointer and bit 0 gives the host access to sequencer RAM. Bit 6 disables the host pause request. Bits 7, 5 and 3 (PERRORDIS, FAILDIS and BRKADRINTEN) are in the book but are not described on this unit. The reset value is the one the book's bit table gives in parentheses, not a value read after initialisation."

[registers.seqctl.fields]
pausedis = { bits = [6, 6], grade = "inferred", doc = "set disables the host PAUSE request. SCSI interrupts, illegal opcode interrupts and sequencer RAM parity error interrupts clear it, and host software may not write it" }
fastmode = { bits = [4, 4], grade = "inferred", doc = "1 divides the input clock by four to give the sequencer clock; 0 divides it by five" }
step = { bits = [2, 2], grade = "inferred", doc = "1 runs one instruction and pauses the sequencer again. It stays set until software clears it, and each further single step clears PAUSE in HCNTRL once more" }
seqreset = { bits = [1, 1], grade = "inferred", doc = "resets the sequencer RAM address pointer to zero. Self-clearing. The sequencer must be paused before it is set" }
loadram = { bits = [0, 0], grade = "inferred", doc = "1 lets the host read or write sequencer RAM through SEQRAM. Clear it for normal operation, and clear it before switching between reads and writes" }

[registers.seqaddr0]
offset = 0x62
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 99 (printed 4-30); sibling"
doc = "Low eight bits of the sequencer RAM address that executes on the next clock edge. The driver writes it while the sequencer is paused to change where execution resumes, and uses it as the start address when loading sequencer RAM. While loading, the address steps up after every fourth byte. A write to SEQADDR[1:0] clears that byte index. RST# and CHIPRST clear the address to zero."

[registers.seqaddr1]
offset = 0x63
access = "rw"
width = 8
reset = 0x0
grade = "inferred"
from = "Adaptec AIC-7870 Data Book, PDF p. 99 (printed 4-30); sibling"
doc = "Bit 0 is bit 8 of the sequencer RAM address, which covers the 512 instruction words. Bits 7 to 1 are reserved in the book, and their read-back is not stated. RST# and CHIPRST clear the register."

[registers.seqaddr1.fields]
addr8 = { bits = [0, 0], grade = "inferred", doc = "bit 8 of the sequencer RAM address" }
