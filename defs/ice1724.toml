# ---- PCI configuration space

[registers.pci_vendor_id]
space = "pci"
offset = 0x00
access = "r"
width = 16
reset = 0x1412
grade = "established"
from = "ICE1724 datasheet p. 3-2"
doc = "PCI vendor ID, IC Ensemble."

[registers.pci_device_id]
space = "pci"
offset = 0x02
access = "r"
width = 16
reset = 0x1724
grade = "established"
from = "ICE1724 datasheet p. 3-2"
doc = "PCI device ID. The same ID is used by the VT1720 (Envy24PT), so it does not tell the parts apart."

[registers.pci_command]
space = "pci"
offset = 0x04
access = "rw"
width = 16
reset = 0x0000
grade = "established"
from = "ICE1724 datasheet p. 3-2"
doc = "Bit 1 (memory space) and bits 3 to 7 and 9 are hardwired to 0. The datasheet lists bit 8 as read-write but describes it as hardwired to 0; it reads 0 here."
fields = { io_space = { bits = [0, 0], grade = "established" }, bus_master = { bits = [2, 2], grade = "established" } }

[registers.pci_status]
space = "pci"
offset = 0x06
access = "rw"
width = 16
reset = 0x0210
grade = "established"
from = "ICE1724 datasheet p. 3-3"
doc = "Bits 15 to 12 are write-1-to-clear. Bit 11 is hardwired to 0. Bit 14 reads 0. Bit 4 (capability list) is hardwired to 1."
fields = { parity_error = { bits = [15, 15], grade = "established" }, master_abort = { bits = [13, 13], grade = "established" }, target_abort = { bits = [12, 12], grade = "established" }, devsel_timing = { bits = [10, 9], grade = "inferred", doc = "The table says 10b; the text and the reset value say medium timing, 01b." }, capability_list = { bits = [4, 4], grade = "established" } }

[registers.pci_revision]
space = "pci"
offset = 0x08
access = "r"
width = 8
reset = "unknown"
grade = "established"
from = "ICE1724 datasheet p. 3-3"
doc = "Vendor revision. The datasheet shows it as a placeholder; the value is not given."

[registers.pci_class]
space = "pci"
offset = 0x0A
access = "r"
width = 16
reset = 0x0401
grade = "established"
from = "ICE1724 datasheet p. 3-3"
doc = "Class code: multimedia, audio. The field is 24 bits in the header; the programming interface byte at offset 0x09 reads 0."
fields = { base_class = { bits = [15, 8], grade = "established" }, subclass = { bits = [7, 0], grade = "established" } }

[registers.pci_cache_line]
space = "pci"
offset = 0x0C
access = "r"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 3-4"
doc = "Not supported; reads 0."

[registers.pci_latency_timer]
space = "pci"
offset = 0x0D
access = "rw"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 3-4"
doc = "Writes take effect in eight-clock steps: writing FF reads back F8."
fields = { count = { bits = [7, 3], grade = "established" } }

[registers.pci_header_type]
space = "pci"
offset = 0x0E
access = "r"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 3-4"
doc = "Type 0, single function."

[registers.pci_bist]
space = "pci"
offset = 0x0F
access = "r"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 3-4"
doc = "Built-in self test is not supported."

[registers.pci_bar0]
space = "pci"
offset = 0x10
access = "rw"
width = 32
reset = 0x00000001
grade = "established"
from = "ICE1724 datasheet p. 3-4"
doc = "Controller registers (CCS), 32 bytes of I/O space. Bits 31 to 5 are the base."
fields = { base = { bits = [31, 5], grade = "established" } }

[registers.pci_bar1]
space = "pci"
offset = 0x14
access = "rw"
width = 32
reset = 0x00000001
grade = "established"
from = "ICE1724 datasheet p. 3-5"
doc = "Multi-channel registers (MT), 128 bytes of I/O space. Bits 31 to 7 are the base."
fields = { base = { bits = [31, 7], grade = "established" } }

[registers.pci_subsystem]
space = "pci"
offset = 0x2C
access = "rw"
width = 32
reset = 0x17241412
grade = "established"
from = "ICE1724 datasheet p. 3-5"
doc = "Subsystem IDs. Loaded from the EEPROM after reset when one answers, otherwise the reset value. Writable only while the subsystem mask bit is set. Which EEPROM bytes map to which half is not documented."
fields = { subsystem_vendor = { bits = [15, 0], grade = "established" }, subsystem_device = { bits = [31, 16], grade = "established" } }

[registers.pci_expansion_rom]
space = "pci"
offset = 0x30
access = "r"
width = 32
reset = 0x00000000
grade = "established"
from = "ICE1724 datasheet table 3-1"
doc = "Reserved; the part has no option ROM."

[registers.pci_capability_ptr]
space = "pci"
offset = 0x34
access = "r"
width = 8
reset = 0x80
grade = "established"
from = "ICE1724 datasheet p. 3-5"
doc = "Points to the power-management capability at 0x80."

[registers.pci_interrupt_line]
space = "pci"
offset = 0x3C
access = "rw"
width = 8
reset = 0xFF
grade = "established"
from = "ICE1724 datasheet p. 3-5"
doc = "Set by firmware. FF means the interrupt is not routed."

[registers.pci_interrupt_pin]
space = "pci"
offset = 0x3D
access = "r"
width = 8
reset = 0x01
grade = "established"
from = "ICE1724 datasheet p. 3-5"
doc = "INTA#."

[registers.pci_grant_latency]
space = "pci"
offset = 0x3E
access = "r"
width = 16
reset = 0x0000
grade = "established"
from = "ICE1724 datasheet p. 3-5"
doc = "Minimum grant in the low byte, maximum latency in the high byte. Both 0."
fields = { min_grant = { bits = [7, 0], grade = "established" }, max_latency = { bits = [15, 8], grade = "established" } }

[registers.pci_svid_mask]
space = "pci"
offset = 0x42
access = "rw"
width = 8
reset = 0x00
grade = "inferred"
from = "ICE1724 datasheet p. 4-4 and table 3-1"
doc = "The table places the subsystem ID mask at 0x40 and the register section at 0x42. Bit 7 is the control that makes the subsystem IDs writable. The offset is taken from the register section."
fields = { writable = { bits = [7, 7], grade = "inferred" } }

[registers.pci_pm_capability_id]
space = "pci"
offset = 0x80
access = "r"
width = 8
reset = 0x01
grade = "established"
from = "ICE1724 datasheet p. 3-6"
doc = "Capability ID: power management."

[registers.pci_pm_next]
space = "pci"
offset = 0x81
access = "r"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 3-6"
doc = "End of the capability list."

[registers.pci_pm_caps]
space = "pci"
offset = 0x82
access = "r"
width = 16
reset = 0x0401
grade = "established"
from = "ICE1724 datasheet p. 3-6"
doc = "Power management version 1.0. D2 is supported, D1 and PME are not."

[registers.pci_pm_control]
space = "pci"
offset = 0x84
access = "rw"
width = 16
reset = 0x0000
grade = "established"
from = "ICE1724 datasheet p. 3-7"
doc = "Power state select."
fields = { power_state = { bits = [1, 0], grade = "established", enum = "pm_state" } }

[registers.pci_pm_data]
space = "pci"
offset = 0x86
access = "r"
width = 16
reset = 0x0000
grade = "established"
from = "ICE1724 datasheet p. 3-7"
doc = "Power management bridge extension and data. Read only, reset 0."

# ---- Controller registers (BAR0)

[registers.ccs_control]
space = "ccs"
offset = 0x00
access = "rw"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 4-3"
doc = "Bit 7 is a soft reset of the whole chip. The public driver writes 1, waits, then writes 0; the datasheet does not say whether the bit self-clears. Bits 6 to 0 are reserved."
fields = { soft_reset = { bits = [7, 7], grade = "established" } }

[registers.ccs_irq_mask]
space = "ccs"
offset = 0x01
access = "rw"
width = 8
reset = 0xFE
grade = "established"
from = "ICE1724 datasheet p. 4-3"
doc = "Interrupt mask. A set bit masks the source. The datasheet states this polarity only for MT03; here it is inferred from the reset value and the driver's use. Every source is masked at reset."
fields = { mpu_receive = { bits = [7, 7], grade = "established" }, mpu_transmit = { bits = [5, 5], grade = "established" }, multichannel = { bits = [4, 4], grade = "established", doc = "The single mask for every playback and record engine" } }

[registers.ccs_irq_status]
space = "ccs"
offset = 0x02
access = "rw"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 4-4"
doc = "Bits 7 and 5 are write-1-to-clear. Bit 4 is read only and clears when its source in the multi-channel register clears. Bits are sticky."
fields = { mpu_receive = { bits = [7, 7], grade = "established" }, mpu_transmit = { bits = [5, 5], grade = "established" }, multichannel = { bits = [4, 4], grade = "established" } }

[registers.ccs_system_config]
space = "ccs"
offset = 0x04
access = "rw"
width = 8
reset = 0x0F
grade = "established"
from = "ICE1724 datasheet p. 4-4"
doc = "The public driver copies EEPROM bytes 6 to 9 here; the datasheet says the driver loads them, and hardware does not. The reset value means 24.576 MHz, no UART, no inputs and four stereo DACs."
fields = { xin1_clock = { bits = [7, 6], grade = "established", enum = "xin1_clock" }, mpu_uart = { bits = [5, 5], grade = "established" }, adc_inputs = { bits = [3, 2], grade = "established", enum = "adc_inputs" }, dac_count_minus_one = { bits = [1, 0], grade = "established", doc = "Stereo DAC count less one; one to four DACs, at least one required" } }

[registers.ccs_ac97_config]
space = "ccs"
offset = 0x05
access = "rw"
width = 8
reset = 0x00
grade = "established"
from = "ICE1724 datasheet p. 4-5"
doc = "Converter type and AC'97 slot layout. Bit 7 reflects the power-up strap on GPIO 0 in reverse and may be overwritten."
fields = { converter_type = { bits = [7, 7], grade = "established", enum = "converter_type" }, ac97_slot = { bits = [1, 1], grade = "established", enum = "ac97_slot" } }

[registers.ccs_i2s_features]
space = "ccs"
offset = 0x06
access = "rw"
width = 8
reset = 0x01
grade = "established"
from = "ICE1724 datasheet p. 4-5"
doc = "Converter capabilities, written from the EEPROM."
fields = { volume_by_gpio = { bits = [7, 7], grade = "established", doc = "Valid only when the converter type bit is 1" }, supports_96k = { bits = [6, 6], grade = "established" }, resolution = { bits = [5, 4], grade = "established", enum = "resolution_bits" }, supports_192k = { bits = [3, 3], grade = "established" }, other_ids = { bits = [2, 0], grade = "unknown", doc = "Named in the datasheet; the meaning is not given" } }

[registers.ccs_spdif_config]
space = "ccs"
offset = 0x07
access = "rw"
width = 8
reset = 0x01
grade = "established"
from = "ICE1724 datasheet p. 4-6"
doc = "S/PDIF transmitter enable and capability bits. Bit 6 is read only and reflects the SPDTX pin during reset, reversed: 0 means the transmitter is on the board."
