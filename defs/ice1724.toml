unit = "ice1724"
prefix = "ICE1724"
title = "VIA/IC Ensemble ICE1724 (Envy24HT) PCI audio controller registers"
from = "shipped DMediaPro DM8 audio driver object; roles from the public Linux ICE1724 driver names"

[c]
legacy_header = "include/ice1724.h"
legacy_guard = "ICE1724_H"

[constants]
CCS_AC97_CONF = { value = 0x5, grade = "established", doc = "byte; read (bit 7 sets the per-device I2S converter flag) and written from EEPROM byte 7; role [I]" }
CCS_GPIO_DATA = { value = 0x14, grade = "established", doc = "16-bit; GPIO data bits 15:0, read and written; role [I]" }
CCS_GPIO_DATA_HI = { value = 0x1e, grade = "established", doc = "byte; GPIO data bits 22:16; role [I]" }
CCS_GPIO_DIR = { value = 0x18, grade = "established", doc = "32-bit; GPIO direction, 24 bits used, loaded from EEPROM bytes 10 to 12; role [I]" }
CCS_GPIO_MASK = { value = 0x16, grade = "established", doc = "16-bit; GPIO write mask bits 15:0, loaded from EEPROM bytes 13 and 14; role [I]" }
CCS_GPIO_MASK_HI = { value = 0x1f, grade = "established", doc = "byte; GPIO write mask bits 22:16, loaded from EEPROM byte 15; role [I]" }
CCS_I2C_BYTE_ADDR = { value = 0x11, grade = "established", doc = "byte; role [I]" }
CCS_I2C_CTRL = { value = 0x13, grade = "established", doc = "byte; bit 7 tested (EEPROM present) and bit 0 polled for busy; role [I]" }
CCS_I2C_DATA = { value = 0x12, grade = "established", doc = "byte; read; role [I]" }
CCS_I2C_DEV_ADDR = { value = 0x10, grade = "established", doc = "byte; the driver writes 0xa0 for the EEPROM; role [I]" }
CCS_I2S_FEATURES = { value = 0x6, grade = "established", doc = "byte; written from EEPROM byte 8; role [I]" }
CCS_IRQ_MASK = { value = 0x1, grade = "inferred", doc = "byte; never touched by the shipped driver; 1 = masked, reset FE per the vendor datasheet; the driver therefore never gets an interrupt" }
CCS_IRQ_STATUS = { value = 0x2, grade = "inferred", doc = "byte; never touched by the shipped driver" }
CCS_SPDIF_CONF = { value = 0x7, grade = "established", doc = "byte; read (bit 0 sets the digital-output-present flag) and written from EEPROM byte 9; role [I]" }
CCS_SYSCONF = { value = 0x4, grade = "established", doc = "byte; access r (bits 1:0 read) and w (EEPROM byte 6; the driver stores 0x40 when no EEPROM answers); role [I]: system configuration, bits 1:0 = number of stereo DACs less one (value 3 gives 8 analog output channels, 0 to 2 give 2)" }
MT_BURST = { value = 0x19, grade = "established", doc = "byte; written 0 when analog output has 8 channels, 3 otherwise; role [I]" }
MT_CAPTURE_ADDR = { value = 0x20, grade = "established", doc = "32-bit; capture buffer address; role [I]" }
MT_CAPTURE_SIZE = { value = 0x24, grade = "established", doc = "16-bit; capture size, dword count less one (16-bit field); also read back as the DMA position; \"current address\" semantics [I]" }
MT_CONVERTER_RESET = { value = 0x5, grade = "established", doc = "byte; bit 7 set, 10 microsecond delay, then cleared during a rate change; role [I] (a converter reset line)" }
MT_DMA_CONTROL = { value = 0x18, grade = "established", doc = "byte; the driver keeps a shadow and writes it at start and stop: bit 0 analog output stream, bit 1 capture stream, bit 7 digital output stream; bit roles [I]" }
MT_DMA_INT_MASK = { value = 0x3, grade = "inferred", doc = "byte; never touched by the shipped driver; 1 = masked, reset FF per the vendor datasheet" }
MT_IRQ_STATUS = { value = 0x0, grade = "inferred", doc = "byte; never touched by the shipped driver; write 1 to clear" }
MT_MCLK_128X = { value = 0x2, grade = "established", doc = "byte; bit 3 set for rates of 120000 Hz and above, cleared below; \"128x master clock\" role [I]" }
MT_PLAYBACK_ADDR = { value = 0x10, grade = "established", doc = "32-bit; start address of the playback buffer; role [I]" }
MT_PLAYBACK_SIZE = { value = 0x14, grade = "established", doc = "32-bit; written with the dword count less one: the driver zeroes count<<2 bytes of the buffer and programs count-1 (mad_start_dma 0xe70..0xe98, 0xf90..0xf98); matches the vendor datasheet and Linux, OpenBSD, FreeBSD [E] for the arithmetic, byte unit of the zeroing call [I]" }
MT_RATE = { value = 0x1, grade = "established", doc = "byte; sample rate code written by the rate routine: 0 for 48 kHz, 4 for 32 kHz, 2 for 12 kHz, 11 for 88.2 kHz equal the public driver's table" }
MT_SPDIF_OUT_ADDR = { value = 0x40, grade = "established", doc = "32-bit; digital output buffer address; role [I]" }
MT_SPDIF_OUT_SIZE = { value = 0x44, grade = "established", doc = "16-bit; digital output size; role [I]" }
