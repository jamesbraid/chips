unit = "ics1890"
prefix = "ICS1890"
title = "ICS1890 10Base-T/100Base-TX PHYceiver, MII management registers (Octane base I/O)"
doc = "The MII management registers of the ICS1890 Integrated PHYceiver, the Ethernet transceiver on the Octane and Octane2 base I/O board. The IOC3 Ethernet controller reaches the part through its MII port. Only the registers and bits the ICS1890 revision G datasheet describes here are transcribed: the identifier registers 2 and 3, and bits of the extended control register 16. Offsets are MII register numbers, one per 16-bit register. Grades say how each item was derived from the datasheet; none of it was measured on a board. Reset values are the datasheet's default column."
from = "ICS1890 revision G datasheet"
public_from = ["ICS1890 revision G datasheet"]

[spaces.mii]
unit = "reg"
doc = "MII management registers, addressed by register number through the controller's MII port."

[registers.phy_id1]
offset = 0x2
space = "mii"
access = "rw"
width = 16
reset = 0x0015
grade = "established"
from = "ICS1890 revision G datasheet, PHY identifier register (register 2), PDF p. 23 (printed p. 23)"
doc = "PHY identifier, first word: the low 16 bits of the 24-bit OUI. The part resets to the Integrated Circuit Systems OUI. Writes take effect only after the command override bit of register 16 is set, so each write needs that bit set first."

[registers.phy_id1.fields]
oui_low = { bits = [15, 0], grade = "established", from = "ICS1890 revision G datasheet, PDF p. 23 (printed p. 23)", doc = "OUI bits 3 to 18, in the order the datasheet's bit map gives them. The datasheet shows the full OUI as octets 00 A0 BE." }

[registers.phy_id2]
offset = 0x3
space = "mii"
access = "rw"
width = 16
reset = 0xf423
grade = "established"
from = "ICS1890 revision G datasheet, PHY identifier register (register 3), PDF p. 24 (printed p. 24)"
doc = "PHY identifier, second word: OUI bits 19 to 24, the model number and the revision number. Reset value is the ICS1890 identity. Writes need the command override bit of register 16, as for register 2."

[registers.phy_id2.fields]
oui_high = { bits = [15, 10], grade = "established", from = "ICS1890 revision G datasheet, PDF p. 24 (printed p. 24)", doc = "OUI bits 19 to 24. Bit 19 of the OUI is bit 15 of the register." }
model = { bits = [9, 4], grade = "established", enum = "model", from = "ICS1890 revision G datasheet, PDF p. 24 (printed p. 24)", doc = "Manufacturer's model number. Value 2 is the ICS1890 and value 1 is the ICS1889, a different part." }
revision = { bits = [3, 0], grade = "established", enum = "revision", from = "ICS1890 revision G datasheet, PDF p. 24 (printed p. 24)", doc = "Revision number, incremented on each significant silicon revision." }

[enums.model]
values = { ics1889 = { value = 1, grade = "established", doc = "ICS1889, a different part with the same register layout" }, ics1890 = { value = 2, grade = "established", doc = "ICS1890" } }

[enums.revision]
values = { internal = { value = 0, grade = "established", doc = "ICS internal release" }, alpha = { value = 1, grade = "established", doc = "first alpha customer samples" }, general = { value = 2, grade = "established", doc = "first general release. The datasheet's text says the device is at this revision." }, j_or_later = { value = 3, grade = "established", doc = "1890 J release and later" } }

[registers.ext_ctrl]
offset = 0x10
space = "mii"
access = "rw"
width = 16
reset = "unknown"
grade = "established"
from = "ICS1890 revision G datasheet, extended control register (register 16), PDF p. 29 (printed p. 29)"
doc = "Extended control. Pre-programs the part; reset loads the defaults from the datasheet's table. Only the bits below are transcribed here. Other bits (for example the stream cipher and scrambler controls) are in the datasheet's full table and are not part of this unit yet, so the reset value of the whole register is unknown here."

[registers.ext_ctrl.fields]
command_override = { bits = [15, 15], grade = "established", from = "ICS1890 revision G datasheet, PDF p. 29 (printed p. 29)", doc = "Command override. Set to one, it lets the next write to any command-writeable bit in any register take effect. Any later write to any register clears it, so each command-writeable write needs the bit set again." }
reserved_ics_4 = { bits = [4, 4], grade = "established", from = "ICS1890 revision G datasheet, PDF p. 29 (printed p. 29), reserved bits note", doc = "Reserved for ICS use. Read value unspecified: the datasheet says it may be zero or one. Write zero; writing one may stop the part operating correctly." }
phy_address = { bits = [10, 6], grade = "established", from = "ICS1890 revision G datasheet, PDF p. 29 (printed p. 29)", doc = "Read only: the five-bit MII address of the part (0 to 31). The LED pin connections set it. A write is ignored." }
