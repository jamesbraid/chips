[registers.reset_mask_link8]
offset = 0x40818
access = "rw"
width = 64
space = "vector"
grade = "inferred"
doc = "Reset mask of link 8. Same layout as link 1. The eight mask addresses are not linear: links come in pairs 64 KiB apart, with the second link of a pair 0x800 above the first."

[registers.reset_mask_link8.fields]
reset_ok = { bits = [7, 0], grade = "inferred" }

[registers.error_link1]
offset = 0x10008
access = "r"
width = 64
space = "vector"
grade = "inferred"
doc = "Error status of link 1. The layout is the one the public header gives and the firmware's error decoder prints. The order of the three low flags is not given."

[registers.error_link1.fields]
power_not_ok = { bits = [38, 38], grade = "inferred", doc = "The far end reports no power." }
deadlock = { bits = [37, 37], grade = "inferred", doc = "Output port deadlocked." }
warm_reset_rx = { bits = [36, 36], grade = "inferred", doc = "A warm reset was received on this link." }
link_reset_rx = { bits = [35, 35], grade = "inferred", doc = "A link reset was received on this link." }
retry_rx_illegal = { bits = [34, 32], grade = "unknown", doc = "Three flags for retry timeout, receiver overflow and illegal port. The decoder lists them in that order, but which bit is which is not settled." }

[registers.error_link2]
