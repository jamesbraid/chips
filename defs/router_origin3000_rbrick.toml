[registers.scratch3]
offset = 0x118
access = "rw"
width = 64
space = "vector"
grade = "inferred"
doc = "Scratch register 3. Bit 0 is the router lock: writing 0 releases it. The header names this word as the scratch register itself."

[registers.scratch3.fields]
lock = { bits = [0, 0], grade = "inferred" }

[registers.scratch3_setzero]
offset = 0x518
access = "r"
width = 64
space = "vector"
grade = "inferred"
doc = "Set-if-zero alias of scratch register 3. A read returns the old lock bit and sets it, so the firmware takes the lock by reading it until the read returns 0."

[registers.scratch3_setzero.fields]
lock = { bits = [0, 0], grade = "inferred" }

[constants]
ROUTER_CHIP_PART = { value = 0x3017, grade = "inferred", from = "shipped kernel reading of the status word part field", doc = "Part value the kernel requires in the status word's chip field before it accepts a router." }
ROUTER_PORTS = { value = 8, grade = "established", from = "SGI Origin 3000 Series Owner's Guide, 007-4240-002, pp. 194-196", doc = "NUMAlink 3 ports on the R-brick's rear panel, lettered A to H." }
ROUTER_ENABLED_PORTS_SIX = { value = 6, grade = "established", from = "SGI Origin 3000 Series Service Procedures, 108-0301-001, pp. 3-1 and 3-2", doc = "Ports enabled on a vendor-shipped six-port R-brick. Two ports are switched off by L1 command." }
ROUTER_USB_PORT_FIRST = { value = 2, grade = "established", from = "SGI Origin 3000 Series Technical Configuration Owner's Guide, 007-4311-002, p. 36", doc = "First rear port that carries the USB signals to a C-brick's L1." }
ROUTER_USB_PORT_LAST = { value = 5, grade = "established", from = "SGI Origin 3000 Series Technical Configuration Owner's Guide, 007-4311-002, p. 36", doc = "Last rear port that carries the USB signals to a C-brick's L1." }
ROUTER_DEST_IDS = { value = 512, grade = "established", from = "SGI Origin 3000 System Architecture, 108-0240-002, pp. 2-18 to 2-22", doc = "Destination IDs the header's destination field can name." }
ROUTER_VCS_PER_PORT = { value = 4, grade = "established", from = "SGI Origin 3000 System Architecture, 108-0240-002, pp. 2-18 to 2-22", doc = "Virtual channels per port. Requests use channels 0 and 1, responses 2 and 3." }
ROUTER_LOCAL_TABLE_ENTRIES = { value = 16, grade = "established", from = "SGI Origin 3000 System Architecture, 108-0240-002, p. 2-22", doc = "Entries in the local routing table, indexed by the low four bits of the destination." }
ROUTER_REMOTE_TABLE_ENTRIES = { value = 32, grade = "established", from = "SGI Origin 3000 System Architecture, 108-0240-002, p. 2-22", doc = "Entries in the remote routing table, indexed by the upper five bits of the destination." }
L1_SETTING_ROUTER_TYPE = { value = 0x3c, grade = "inferred", from = "shipped firmware reading of the L1 persistent settings", doc = "Persistent L1 setting that holds the router type. The type sits in the upper nibble of the setting." }
