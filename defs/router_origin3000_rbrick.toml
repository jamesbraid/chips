unit = "router_origin3000_rbrick"
prefix = "RBRICK_ROUTER"
title = "Origin 3000 R-brick router registers outside the census (vector space)"
doc = "Router register fields and link addresses that the shipped firmware and kernel use, and that the census of the router's vector accesses does not give. Every item here is a software expectation read from shipped code or a public header, not a hardware measurement. The register space is named apart from the census so that offsets which the census already names (the status word, the protection configuration) are not claimed twice."
from = "shipped kernel and firmware readings; names from the public Linux SN1 router header"
public_from = ["SGI Origin 3000", "Linux SN1 router header", "shipped firmware", "shipped kernel"]

[spaces.vector]
doc = "Router registers reached through the vector path, one offset per register."

[enums.link_state]
values = { wentdown = { value = 0, grade = "inferred" }, resetfail = { value = 1, grade = "inferred" }, linkup = { value = 2, grade = "inferred" }, notused = { value = 3, grade = "inferred" } }

[registers.status]
offset = 0x0
access = "r"
width = 64
space = "vector"
grade = "inferred"
doc = "Status word. The kernel refuses a chip whose part field is not the router part, reads the revision from the top nibble, and treats a port as active when its link-working bit is set. Each link has a two-bit state. The census names the same word as the status and revision register."

[registers.status.fields]
rev = { bits = [31, 28], grade = "inferred", doc = "Chip revision, as the kernel reports it." }
chip = { bits = [27, 12], grade = "inferred", doc = "Chip part field. The kernel accepts only the router part." }
link1_state = { bits = [37, 36], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 1: its reset-failed bit is the low bit and its link-working bit the high bit." }
link2_state = { bits = [39, 38], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 2." }
link3_state = { bits = [41, 40], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 3." }
link4_state = { bits = [43, 42], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 4." }
link5_state = { bits = [45, 44], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 5." }
link6_state = { bits = [47, 46], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 6." }
link7_state = { bits = [49, 48], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 7." }
link8_state = { bits = [51, 50], grade = "inferred", enum = "link_state", doc = "Two-bit state of link 8." }

[registers.position]
offset = 0x50
access = "r"
width = 64
space = "vector"
grade = "inferred"
doc = "Position word that discovery reads to classify a router. A clear bit marks a metarouter or a repeat router. The census does not name this offset."

[registers.position.fields]
meta_flag = { bits = [20, 20], grade = "inferred", doc = "Clear for a metarouter." }
repeater_flag = { bits = [21, 21], grade = "inferred", doc = "Clear for a repeat router. Discovery inverts both bits before it tests them." }

[registers.prot_conf]
offset = 0x10
access = "rw"
width = 64
space = "vector"
grade = "inferred"
doc = "Protection configuration. Each low bit lets a reset arriving on that link through. The census gives the access and offset of the same word; the field names come from the public header. Reset value unknown."

[registers.prot_conf.fields]
reset_ok = { bits = [7, 0], grade = "inferred", doc = "One permit bit per link, bit n-1 for link n. A clear bit blocks a reset arriving on that link." }
meta_id = { bits = [11, 8], grade = "inferred", doc = "Meta identifier. Its use is not read." }
force_local = { bits = [12, 12], grade = "inferred", doc = "Force-local flag. Its effect is not read." }
dir_compare_off = { bits = [13, 13], grade = "inferred", doc = "Disables the directory compare. Its effect is not read." }

[registers.reset_mask_link1]
offset = 0x10018
access = "rw"
width = 64
space = "vector"
grade = "inferred"
doc = "Reset mask of link 1. Bit n-1 names a link n. The direction in which the mask applies is inferred, not established."

[registers.reset_mask_link1.fields]
reset_ok = { bits = [7, 0], grade = "inferred" }

[registers.reset_mask_link2]
offset = 0x10818
access = "rw"
width = 64
space = "vector"
grade = "inferred"
doc = "Reset mask of link 2. Same layout as link 1."

[registers.reset_mask_link2.fields]
reset_ok = { bits = [7, 0], grade = "inferred" }

