# ---------------------------------------------------------------------------
# Words
# ---------------------------------------------------------------------------

[words.MAPRAM_ENTRY]
width = 32
grade = "established"
doc = "A valid map-RAM page-table entry, one 32-bit word per 16 KiB page of the board's own DMA address space, stored by the driver as one big-endian PIO store. Written value is the page number's low 26 bits shifted left by 2, ORed with the valid bit. Whether the hardware reads bits 1:0 or the top bits as attributes, and the byte order its logic applies to the store, are unknown: nothing reads an entry back."
[words.MAPRAM_ENTRY.fields]
valid = { bits = [29, 29], grade = "established", doc = "1 in every valid entry" }
invalid = { bits = [28, 28], grade = "established", doc = "0 in valid entries" }
ppn = { bits = [27, 2], grade = "established", doc = "system DMA address bits 39:14, the low 26 bits of the page number the driver's DMA mapping returns (that those are address bits 39:14 is inferred)" }
[[words.MAPRAM_ENTRY.tests]]
value = 0x20000004
kind = "example"
expect = { valid = 1, invalid = 0, ppn = 1 }

[words.MAPRAM_ENTRY_INVALIDATED]
width = 32
grade = "established"
doc = "An invalidated map-RAM entry: bit 28 set and a run-length counter below it. The driver writes n consecutive entries, the i-th as the invalid bit with the value n minus 1 minus i, so a single invalidated page is exactly the invalid bit alone. That bit 28 is what the hardware tests, and that the counter is only a run length, is inferred; the effect is the map-RAM-invalid error cause with the entry address in the map-RAM error address register."
[words.MAPRAM_ENTRY_INVALIDATED.fields]
invalid = { bits = [28, 28], grade = "established" }
run_left = { bits = [27, 0], grade = "inferred" }
[[words.MAPRAM_ENTRY_INVALIDATED.tests]]
value = 0x10000000
kind = "vector"
expect = { invalid = 1, run_left = 0 }

[words.FPGA_PROG_WRITE]
width = 32
grade = "established"
doc = "Write layout of the GIF programming register: an 8-bit data byte, a clock in bit 8 and a strobe in bit 9 that is high in the idle and active-data states. Each image byte of the GIF load is stored eight times unshifted, once with the clock low and once high. Values and tests established; the names are inferred. The kernel's own byte-load case stores a byte ORed with the clock-low and clock-high patterns the same way."
[words.FPGA_PROG_WRITE.fields]
data = { bits = [7, 0], grade = "established" }
clock = { bits = [8, 8], grade = "inferred" }
strobe = { bits = [9, 9], grade = "inferred" }
[[words.FPGA_PROG_WRITE.tests]]
value = 0x300
kind = "vector"
expect = { data = 0, clock = 1, strobe = 1 }
[[words.FPGA_PROG_WRITE.tests]]
value = 0x200
kind = "vector"
expect = { data = 0, clock = 0, strobe = 1 }
[[words.FPGA_PROG_WRITE.tests]]
value = 0x100
kind = "vector"
expect = { data = 0, clock = 1, strobe = 0 }

[words.FPGA_INFO_KIND]
width = 32
grade = "established"
doc = "Word at +4 of a 28-byte FPGA info record (all fields are big-endian 32-bit words): the kind, which selects the start, byte and stop routines."
[words.FPGA_INFO_KIND.fields]
kind = { bits = [1, 0], grade = "established", enum = "fpga_kind" }

[words.RING_ENTRY_W0]
width = 32
grade = "established"
doc = "Word 0 of a 0x80-byte status-ring entry. The service routine treats bits 23:0 as a device media stream counter (MSC) and extends it to 64 bits, detecting a wrap by an unsigned compare with the previous value. The code only works if bits 31:24 read as zero (inferred; the driver does not check). The name MSC is inferred from the driver's own strings."
[words.RING_ENTRY_W0.fields]
msc = { bits = [23, 0], grade = "inferred" }
reserved_zero = { bits = [31, 24], grade = "inferred" }

[words.RING_ENTRY_FLAGS]
width = 32
grade = "established"
doc = "Word 1 of a status-ring entry, the flag word. Bit numbers and names come from the driver's own 20-entry flag-name table (established); what each bit means in hardware terms is inferred from its name. Pipe 0 is the out pipe (video interrupt 1), pipe 1 the in pipe (video interrupt 0). The host clears VALID first, then handles the completion bits slot by slot in order, then the field-interrupt bit, the error bits while DMA is enabled, and the two link bits. Bits 20 to 31 have no table entry and no test."
[words.RING_ENTRY_FLAGS.fields]
valid = { bits = [0, 0], grade = "established", doc = "entry present; cleared by the host before anything else" }
f = { bits = [1, 1], grade = "established", doc = "passed to the completion routine as a boolean" }
input_off = { bits = [2, 2], grade = "established", doc = "pipe 1 only: with in_change, the input signal went away" }
trs_error = { bits = [3, 3], grade = "established", doc = "pipe 1 only: logged, not counted as an error" }
overflow = { bits = [4, 4], grade = "established", doc = "pipe 0: a transfer error; pipe 1: a sequence-lost message with no event posted" }
in_change = { bits = [5, 5], grade = "established", doc = "pipe 1 only: input state changed" }
fif = { bits = [6, 6], grade = "established", doc = "with the field interrupt bit: the device's view of field parity, compared against the driver's field counter" }
f_intr = { bits = [7, 7], grade = "established", doc = "field interrupt: counters, host timestamp, watchdog re-arm, timestamp event" }
done = { bits = [11, 8], grade = "established", doc = "DMA slot 0 to 3 completion, one bit per slot" }
aborted = { bits = [15, 12], grade = "established", doc = "DMA slot 0 to 3 aborted, one bit per slot" }
current_valid = { bits = [17, 16], grade = "inferred", doc = "named by the driver's table but never tested by the service routine" }
clink_xmit_done = { bits = [18, 18], grade = "established", doc = "VBOB message acknowledge" }
clink_rcv_done = { bits = [19, 19], grade = "established", doc = "VBOB message received; raises the receive event" }
[[words.RING_ENTRY_FLAGS.tests]]
value = 0x40001
kind = "example"
expect = { valid = 1, clink_xmit_done = 1, clink_rcv_done = 0 }

[words.VBOB_MSG_HEADER]
width = 32
grade = "established"
doc = "First four bytes of the 24-byte VBOB control message frame, in wire order from the high byte: count of bytes that follow, pipe, register id with bit 7 set for a write, then the first data byte. Byte layout established from every message builder in the library; names are inferred. The same 24 bytes are carried as twelve halfwords in the CLINK transmit and receive registers. Which pipe's ring carries a receive flag is unknown."
[words.VBOB_MSG_HEADER.fields]
count = { bits = [31, 24], grade = "established", doc = "count of bytes that follow (last used index)" }
pipe = { bits = [23, 16], grade = "established", enum = "vbob_pipe", doc = "equals the ioctl pipe word in every caller; that it selects a cable is inferred" }
write = { bits = [15, 15], grade = "established", doc = "set for a write message" }
reg_id = { bits = [14, 8], grade = "established" }
data0 = { bits = [7, 0], grade = "inferred" }
[[words.VBOB_MSG_HEADER.tests]]
value = 0x04012000
kind = "example"
expect = { count = 4, pipe = 1, write = 0, reg_id = 0x20 }

