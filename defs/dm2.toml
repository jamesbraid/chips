unit = "dm2"
prefix = "DM2"
title = "DMediaPro DM2 (XT-DIGVID) XIO video board: widget window, XG block, FPGA load, GIF register file and word layouts"
doc = """\
Register and word contract of the DM2 board's 16 MiB widget window, as the shipped kernel driver, the user-space media module and the board's diagnostic use it. \
Every offset is a byte offset from the window base and every register is a 32-bit word. \
Grades follow the contract pages: established means the access was read in full from a shipped binary, inferred means the item is reasoned from names or shape, unknown means nothing shipped settles it. \
Where a position or formula is established and only the role is inferred, the item is graded established and its doc says what is inferred. \
The GIF register file (window base plus 0x800000) is a file of 64-bit slots at an 8-byte stride. Software only ever reaches the odd (low) 32-bit word of a slot, at slot base plus 4, so every GIF register here is listed as 0x800000 + R + 4, where R is the register number (the slot offset) that the library and the diagnostic use. \
The input and output colour-converter blocks have two register layouts, one per FPGA image, and the two are not unified: they live in separate address spaces, xcc_prog (the images the media module loads) and xcc_diag (the images only the diagnostic loads). \
No reset value of any register is known. Nothing here describes emulator behaviour."""
from = "shipped kernel driver and media library readings"
public_from = ["shipped kernel driver and media library readings", "shipped diagnostic tables"]

[c]
offset_macro = "suffix"

[spaces.xcc_prog]
unit = "byte"
doc = "Colour-converter registers as the library programs them, for the ixcc and oxcc images it loads."

[spaces.xcc_diag]
unit = "byte"
doc = "Colour-converter registers as the diagnostic's table names them, for the ixcc_2 and oxcc_2 images only the diagnostic loads."

[enums.xg_mapram_type]
doc = "XG configuration word, map-RAM type code: the diagnostic indexes a three-string table with it."
values = { k32x36 = { value = 0, grade = "established", doc = "32K by 36 bits" }, k64x18 = { value = 1, grade = "established", doc = "64K by 18 bits" }, k128x9 = { value = 2, grade = "established", doc = "128K by 9 bits" }, invalid = { value = 3, grade = "established", doc = "the diagnostic prints that the type is invalid" } }

[enums.fpga_kind]
doc = "Programming routine set an FPGA info record selects."
values = { others_handshaked = { value = 0, grade = "established", doc = "start, byte and stop routines of the seven FPGAs behind the GIF; each byte goes to the data port after a READY poll" }, gif = { value = 1, grade = "established", doc = "the GIF FPGA, programmed bit-serially through the programming register" }, others_blind = { value = 2, grade = "established", doc = "as kind 0 for start and stop, but each byte is one blind store to the status port with no READY poll (the two colour-converter FPGAs)" } }

[enums.vbob_pipe]
doc = "Pipe byte of a VBOB message frame."
values = { output = { value = 0, grade = "established", doc = "the driver's out pipe; the cable it names is inferred (cable A, transmit)" }, input = { value = 1, grade = "established", doc = "the driver's in pipe; the cable it names is inferred (cable B, receive)" } }

# ---------------------------------------------------------------------------
# Standard widget block and the XG block, at the window base
# ---------------------------------------------------------------------------

[registers.widget_id]
offset = 0x04
access = "r"
width = 32
grade = "established"
doc = "Widget identification, read by the diagnostic only; the kernel never reads it. The field split is established; the readback value is unknown (the part and manufacturer the driver registers with are not read from this register)."
from = "shipped diagnostic tables"
fields = { revision = { bits = [31, 28], grade = "established" }, part = { bits = [27, 12], grade = "established" }, manufacturer = { bits = [11, 1], grade = "established" } }

[registers.widget_status]
offset = 0x0c
access = "r"
width = 32
grade = "established"
doc = "Widget status. The kernel reads it once at attach and tests bit 5 only: when set it prints that the XIO slot is the slower 400 MB/s kind. The test is established; what the bit encodes is unknown (the message says link speed)."
fields = { link_slow = { bits = [5, 5], grade = "established" } }

[registers.widget_control]
offset = 0x24
access = "rw"
width = 32
grade = "established"
doc = "Widget control (the diagnostic calls it the XG control register). The init routine stores widget id, interrupt target and a constant, then ORs the XG error interrupt enable; the error handler clears the enable first and nothing sets it again. The low nibble comes from the widget's own number and bits 25:22 from the interrupt target widget, both inferred from the helper names. Bits 14 and 9 are written as constants and are unexplained."
fields = { widget_number = { bits = [3, 0], grade = "inferred" }, const_bit9 = { bits = [9, 9], grade = "unknown" }, const_bit14 = { bits = [14, 14], grade = "unknown" }, xg_error_int_enable = { bits = [17, 17], grade = "established", doc = "role established from the handler's own disable and the diagnostic's messages; that nothing else lives in the bit is inferred" }, int_target = { bits = [25, 22], grade = "inferred" } }
tests = [{ value = 0x4200, kind = "vector", expect = { const_bit9 = 1, const_bit14 = 1, xg_error_int_enable = 0 } }]

[registers.int_dest_hi]
offset = 0x34
access = "w"
width = 32
grade = "established"
doc = "Interrupt destination, upper: address bits 47:32 in the low half and the target id above them, from the interrupt object the kernel allocated for the XG error interrupt. Store established; field names inferred."
fields = { addr_hi = { bits = [15, 0], grade = "inferred" }, target_id = { bits = [19, 16], grade = "inferred" } }

[registers.int_dest_lo]
offset = 0x3c
access = "w"
width = 32
grade = "established"
doc = "Interrupt destination, lower: the low 32 bits of the interrupt address."
fields = { addr_lo = { bits = [31, 0], grade = "established" } }

[registers.xg_int_vectors]
offset = 0x5c
access = "w"
width = 32
grade = "established"
doc = "XG interrupt vectors. In the common widget block this slot is an error command word; in the XG it holds interrupt vectors, so the common role does not apply (established for the XG use, inferred that the divergence is deliberate; no read exists). Bits 17 and 8 are ORed in as constants and are inferred to be per-source enables, which one is which is unknown."
fields = { gv0_vector = { bits = [7, 0], grade = "established" }, const_bit8 = { bits = [8, 8], grade = "inferred" }, gv1_vector = { bits = [16, 9], grade = "established" }, const_bit17 = { bits = [17, 17], grade = "inferred" }, error_vector = { bits = [25, 18], grade = "established" } }

[registers.xg_config]
offset = 0x64
access = "r"
width = 32
grade = "established"
doc = "XG configuration, read at attach and by the diagnostic; read-only from software. The subsystem field must read 1. The map-RAM size code is printed by the kernel as the code times 32 kilobytes; the table from size code to real size is unknown. The type code indexes a three-string table (order established)."
fields = { subsystem = { bits = [2, 0], grade = "established" }, mapram_size_code = { bits = [5, 3], grade = "established" }, mapram_type = { bits = [7, 6], grade = "established", enum = "xg_mapram_type" } }

[registers.xg_error_cause]
offset = 0x6c
access = "rw"
width = 32
grade = "established"
doc = "XG error cause, one bit per error. The error handler reads it, writes the same value back before decoding, and prints one message per set bit. That the write-back is write-one-to-clear is inferred. Bit 22 is tested twice in the shipped handler and prints both a cache-line and a double-word underflow message; bit 24 is never tested. The intended assignment of bit 24 (graphics double-word credit underflow) is inferred; the diagnostic writes 0 here. Bit 31 has no test in the handler's shift sequence."
fields = { guava_overlap = { bits = [0, 0], grade = "established" }, guava_pio_data_resp_overflow = { bits = [1, 1], grade = "established" }, guava_pio_cmd_resp_overflow = { bits = [2, 2], grade = "established" }, guava_valid_when_idle = { bits = [3, 3], grade = "established" }, guava_bad_command = { bits = [4, 4], grade = "established" }, guava_bad_interrupt = { bits = [5, 5], grade = "established" }, xtalk_address = { bits = [6, 6], grade = "established" }, xtalk_bad_command = { bits = [7, 7], grade = "established" }, xtalk_read_req_timeout = { bits = [8, 8], grade = "established" }, xtalk_response = { bits = [9, 9], grade = "established" }, xtalk_request = { bits = [10, 10], grade = "established" }, gfx_fifo_overflow = { bits = [11, 11], grade = "established" }, mapram_parity = { bits = [12, 12], grade = "established", doc = "the handler prints the address read from the map-RAM error address register" }, mapram_invalid = { bits = [13, 13], grade = "established", doc = "the handler prints the address read from the map-RAM error address register" }, guava_bus_cmd_parity = { bits = [14, 14], grade = "established" }, guava_bus_data_parity = { bits = [15, 15], grade = "established" }, guava_bus_parity = { bits = [16, 16], grade = "established" }, xtalk_req_credit_overflow = { bits = [17, 17], grade = "established" }, xtalk_req_credit_underflow = { bits = [18, 18], grade = "established" }, xtalk_resp_credit_overflow = { bits = [19, 19], grade = "established" }, xtalk_resp_credit_underflow = { bits = [20, 20], grade = "established" }, gfx_cacheline_credit_overflow = { bits = [21, 21], grade = "established" }, gfx_cacheline_credit_underflow = { bits = [22, 22], grade = "established", doc = "the handler also prints the double-word underflow message when this bit is set" }, gfx_dword_credit_overflow = { bits = [23, 23], grade = "established" }, gfx_dword_credit_underflow = { bits = [24, 24], grade = "inferred", doc = "never tested by the shipped handler; the assignment comes from the sequence of messages" }, cmd_fifo_overflow = { bits = [25, 25], grade = "established" }, odma_fifo_overflow = { bits = [26, 26], grade = "established" }, idma_resp_size = { bits = [27, 27], grade = "established" }, idma_resp_invalid_tag = { bits = [28, 28], grade = "established" }, guava_write_too_few = { bits = [29, 29], grade = "established" }, xtalk_write_full_fifo = { bits = [30, 30], grade = "established" }, bit31_untested = { bits = [31, 31], grade = "unknown", doc = "no test seen in the handler's shift sequence; a direct sign test on the raw word was not looked for" } }

[registers.xg_water_mark]
offset = 0x74
access = "rw"
width = 32
grade = "established"
doc = "High/low water mark (the diagnostic's name). The init routine keeps the two 6-bit fields from the current value, forces bits 15:0 to a constant and bits 31:28 to 0. The diagnostic stores bits 27:0 as plain storage. What high and low mean (presumably graphics FIFO thresholds) is inferred. This is the XG register at window offset 0x74, not the pipe 0 per-pipe word whose window offset is 0x800074."
fields = { fixed_low = { bits = [15, 0], grade = "established", doc = "forced to a constant by the init routine" }, mark_a = { bits = [21, 16], grade = "inferred" }, mark_b = { bits = [27, 22], grade = "inferred" }, forced_zero = { bits = [31, 28], grade = "established" } }
tests = [{ value = 0x3f40, kind = "vector", expect = { fixed_low = 0x3f40, mark_a = 0, mark_b = 0, forced_zero = 0 } }]

[registers.xg_mapram_err_addr]
offset = 0x94
access = "r"
width = 32
grade = "established"
doc = "Offending map-RAM entry address, read after a map-RAM parity or invalid error and printed as five hex digits. Read-only is inferred."
fields = { entry_addr = { bits = [19, 0], grade = "established" } }

[registers.xg_nic]
offset = 0x9c
access = "rw"
width = 32
grade = "established"
doc = "Board identity one-wire register, read through the shared one-wire accessor. The offset and accessor are established; the bit protocol is not in the driver object (unknown). The diagnostic stores bits 15:2 as plain storage; bits 1:0 are inferred to be the one-wire pulse and sample bits."
fields = { onewire = { bits = [1, 0], grade = "inferred" }, storage = { bits = [15, 2], grade = "established", from = "shipped diagnostic tables" } }

[registers.fpga_prog]
offset = 0x120000
access = "rw"
width = 32
grade = "established"
doc = "GIF FPGA programming and status register. Read layout (this register): DONE and INIT for each FPGA in adjacent bit pairs. The message calls the GIF INIT bit INIT_L, active low, so it reads 1 when the pin is not asserted. The pairs run in the order GIF, packer, unpacker, input colour converter, output colour converter, VIF, HDOC, CLINK, which is not the order of the library's FPGA numbers. Names are inferred. The write layout is the word FPGA_PROG_WRITE."
fields = { gif_done = { bits = [0, 0], grade = "established" }, gif_init = { bits = [1, 1], grade = "established" }, packer_done = { bits = [2, 2], grade = "established" }, packer_init = { bits = [3, 3], grade = "established" }, unpacker_done = { bits = [4, 4], grade = "established" }, unpacker_init = { bits = [5, 5], grade = "established" }, ixcc_done = { bits = [6, 6], grade = "established" }, ixcc_init = { bits = [7, 7], grade = "established" }, oxcc_done = { bits = [8, 8], grade = "established" }, oxcc_init = { bits = [9, 9], grade = "established" }, vif_done = { bits = [10, 10], grade = "established" }, vif_init = { bits = [11, 11], grade = "established" }, hdoc_done = { bits = [12, 12], grade = "established" }, hdoc_init = { bits = [13, 13], grade = "established" }, clink_done = { bits = [14, 14], grade = "established" }, clink_init = { bits = [15, 15], grade = "established" } }

# ---------------------------------------------------------------------------
# GIF register file: core, DMA pipes, identification
# ---------------------------------------------------------------------------

[registers.gif_reset]
offset = 0x800004
access = "rw"
width = 32
grade = "established"
doc = "GIF reset/enable word (register number 0x00). The init routine stores 0 when asked to reinitialise; the FPGA load path polls for a value of 0x80. The meaning of the bits is unknown."

[registers.gif_prog_control]
offset = 0x80000c
access = "rw"
width = 32
grade = "established"
doc = "Per-FPGA programming control (register number 0x08), for the seven FPGAs behind the GIF. The select word is one-hot and bit 7 is a strobe level (idle high, pulsed low around each download); the code shows only the values and the pulse shape, so the names are inferred."
fields = { fpga_select = { bits = [6, 0], grade = "inferred" }, prog_strobe = { bits = [7, 7], grade = "inferred" } }

[registers.pipe_dma_control]
offset = 0x800014
access = "rw"
width = 32
count = 2
stride = 0x28
grade = "established"
doc = "Per-pipe DMA control word, indexed by pipe (pipe 0 at register number 0x10, pipe 1 at 0x38). The driver keeps a shadow and rewrites the whole word. Bits 3:0 are per-slot valid latches and bit 4 is abort; both are ORed into the written value and never kept in the shadow (established from the driver's own assertion). Bit 16 is the pipe interrupt enable (inferred from trace names). Bits 12, 10 and 9 are set and cleared by the raster configuration; their roles are inferred. The valid bits are inferred to be write-one-to-set latches. The initial shadow is 0xea040 for pipe 0 and 0xa040 for pipe 1. The diagnostic stores bits 14:5 (and 20:17 on pipe 0). The diagnostic calls pipe 0 the IDMA engine and pipe 1 the ODMA engine; the contract pages assign pipe 0 to video out (HDOC side) and pipe 1 to video in (VIF side), which is inferred."
fields = { slot_valid = { bits = [3, 0], grade = "established" }, abort = { bits = [4, 4], grade = "established" }, cfg_bit9 = { bits = [9, 9], grade = "inferred" }, cfg_bit10 = { bits = [10, 10], grade = "inferred" }, cfg_bit12 = { bits = [12, 12], grade = "inferred" }, int_enable = { bits = [16, 16], grade = "inferred" } }
tests = [{ value = 0xea040, kind = "vector", expect = { slot_valid = 0, abort = 0, cfg_bit9 = 0, cfg_bit10 = 0, cfg_bit12 = 0, int_enable = 0 } }, { value = 0xa040, kind = "vector", expect = { slot_valid = 0, abort = 0, cfg_bit9 = 0, cfg_bit10 = 0, cfg_bit12 = 0, int_enable = 0 } }]

[registers.pipe_start_addr1]
offset = 0x80001c
access = "rw"
width = 32
count = 2
stride = 0x28
grade = "established"
doc = "Per-pipe raster start address 1 (register numbers 0x18 and 0x40). The value must be below 16 MiB (the driver rejects larger ones). The diagnostic does not store the low 3 bits, so 8-byte alignment is inferred."
fields = { start_addr = { bits = [23, 0], grade = "established" } }

[registers.pipe_start_addr2]
offset = 0x800024
access = "rw"
width = 32
count = 2
stride = 0x28
grade = "established"
doc = "Per-pipe raster start address 2 (register numbers 0x20 and 0x48), same range test as start address 1. Alignment is inferred."
fields = { start_addr = { bits = [23, 0], grade = "established" } }

[registers.pipe_vid_control]
offset = 0x80002c
access = "rw"
width = 32
count = 2
stride = 0x28
grade = "established"
doc = "Per-pipe video control (register numbers 0x28 and 0x50; the diagnostic's IDMA_OV and ODMA_IV). Formula and width are established, exactly the 26 bits the diagnostic stores; what the two counts and flags mean in the video path is unknown. Bits 11:0 come from a 16-bit field of the pipe record, bits 23:12 from a 12-bit argument of the raster configuration, bit 24 is set when one 16-bit pipe field is zero and bit 25 when another is nonzero."
fields = { count_lo = { bits = [11, 0], grade = "established" }, count_hi = { bits = [23, 12], grade = "established" }, flag_zero = { bits = [24, 24], grade = "established" }, flag_nonzero = { bits = [25, 25], grade = "established" } }

[registers.pipe_vid_control2]
offset = 0x800034
access = "rw"
width = 32
count = 2
stride = 0x28
grade = "established"
doc = "Per-pipe video control 2 (register numbers 0x30 and 0x58): the low 12 bits of an argument. Meaning unknown."
fields = { value = { bits = [11, 0], grade = "established" } }

[registers.pipe1_ring_ptr_reset]
offset = 0x800064
access = "w"
width = 32
grade = "inferred"
doc = "Pipe 1 per-pipe word (register number 0x60), stored 0 when the pipe's status buffer is set up and by the clink-timeout path. The stores and the pipe assignment (pipe 1 owns this offset, pipe 0 owns 0x800074) are established; that it resets the board's status-ring write index is inferred. The host never reads it."

[registers.pipe1_reset_word]
offset = 0x80006c
access = "w"
width = 32
grade = "established"
doc = "Pipe 1 per-pipe word (register number 0x68), stored 0 at DMA start. Meaning unknown."

[registers.pipe0_ring_ptr_reset]
offset = 0x800074
access = "w"
width = 32
grade = "inferred"
doc = "Pipe 0 per-pipe word (register number 0x70), stored 0 when the pipe's status buffer is set up and by the clink-timeout path. The stores and the pipe assignment (pipe 0 owns this offset, pipe 1 owns 0x800064) are established; that it resets the board's status-ring write index is inferred. The host never reads it. Not to be confused with the XG water-mark register at window offset 0x74."

[registers.pipe0_reset_word]
offset = 0x80007c
access = "w"
width = 32
grade = "established"
doc = "Pipe 0 per-pipe word (register number 0x78), stored 0 at DMA start. Meaning unknown."

[registers.gif_ident]
offset = 0x800084
access = "r"
width = 32
grade = "established"
doc = "GIF identification (register number 0x80), read at attach: the upper 24 bits must be the ASCII text GIF; the low byte is the GIF version, which the driver prints. Any other value fails attach."
fields = { magic = { bits = [31, 8], grade = "established" }, version = { bits = [7, 0], grade = "established" } }
tests = [{ value = 0x47494600, kind = "example", expect = { magic = 0x474946, version = 0 } }]

[registers.ust_msc_counter]
offset = 0x80008c
access = "rw"
width = 32
grade = "inferred"
doc = "Register number 0x88, stored 0 by the UST initialisation just before the host UST is sampled. The store is established; that it is the board's own UST/MSC counter is inferred from the pattern and the driver's message."

# ---------------------------------------------------------------------------
# Packer (block at register number 0x800) and unpacker (0x1000)
# ---------------------------------------------------------------------------

[registers.pack_r0800]
offset = 0x800804
access = "rw"
width = 32
grade = "established"
doc = "Packer register number 0x800. The library's per-pipe init stores a constant (see PACK_INIT_R0800). Roles unknown."

[registers.pack_r0808]
offset = 0x80080c
access = "rw"
width = 32
grade = "established"
doc = "Packer register number 0x808. Init constant PACK_INIT_R0808. Roles unknown."

[registers.pack_r0810]
offset = 0x800814
access = "rw"
width = 32
grade = "established"
doc = "Packer register number 0x810. Init constant PACK_INIT_R0810. Roles unknown."

[registers.pack_misc_sel]
offset = 0x800824
access = "rw"
width = 32
grade = "established"
doc = "Packer miscellaneous select (register number 0x820, the diagnostic's PACK_MISC_SEL). Name and storage mask (bits 2 and 0) are established; the library stores 1 during init. Role unknown."
from = "shipped diagnostic tables"
fields = { storage_bit0 = { bits = [0, 0], grade = "established" }, storage_bit2 = { bits = [2, 2], grade = "established" } }

[registers.pack_r0840]
offset = 0x800844
access = "rw"
width = 32
grade = "established"
doc = "Packer register number 0x840. Init value is 0x1000 for pipe 1 (PACK_INIT_R0840). Roles unknown."

[registers.pack_r0848]
offset = 0x80084c
access = "rw"
width = 32
grade = "established"
doc = "Packer register number 0x848. Init constant PACK_INIT_R0848. Roles unknown."

[registers.pack_r0850]
offset = 0x800854
access = "rw"
width = 32
grade = "established"
doc = "Packer register number 0x850. Init constant PACK_INIT_R0850. Roles unknown."

[registers.unpack_r1000]
offset = 0x801004
access = "rw"
width = 32
grade = "established"
doc = "Unpacker register number 0x1000. Init constant UNPACK_INIT_R1000. Roles unknown."

[registers.unpack_r1008]
offset = 0x80100c
access = "rw"
width = 32
grade = "established"
doc = "Unpacker register number 0x1008. Init constant UNPACK_INIT_R1008. Roles unknown."

[registers.unpack_version_sel]
offset = 0x801014
access = "rw"
width = 32
grade = "established"
doc = "Unpacker VERSION_SEL (register number 0x1010). Name only; the diagnostic's storage mask is 0, which means not tested rather than read-only. Role unknown."
from = "shipped diagnostic tables"

[registers.unpack_misc_sel]
offset = 0x80101c
access = "rw"
width = 32
grade = "established"
doc = "Unpacker MISC_SEL (register number 0x1018). The library stores 0x0fffe0f9 with a flag shifted into bit 28 (UNPACK_INIT_MISC_BASE); the diagnostic's storage mask is bits 11:2 and 0. Bits of the library constant outside that mask are either not storage or not tested. Roles unknown."
fields = { diag_storage_hi = { bits = [11, 2], grade = "established", from = "shipped diagnostic tables" }, diag_storage_lo = { bits = [0, 0], grade = "established", from = "shipped diagnostic tables" }, flag28 = { bits = [28, 28], grade = "inferred", doc = "the library ORs the second output of its timing mapper here; inferred to mean standard-definition timing" } }

[registers.unpack_idma_data_sel]
offset = 0x801024
access = "rw"
width = 32
count = 2
stride = 8
grade = "established"
doc = "Unpacker IDMA_DATA0_SEL and IDMA_DATA1_SEL (register numbers 0x1020 and 0x1028). Names only; diagnostic mask 0. Roles unknown."
from = "shipped diagnostic tables"

[registers.unpack_ovfifo_test_pattern_sel]
offset = 0x801034
access = "rw"
width = 32
count = 2
stride = 8
grade = "established"
doc = "Unpacker OVFIFO_TEST_PATTERN0_SEL and OVFIFO_TEST_PATTERN1_SEL (register numbers 0x1030 and 0x1038). Names only; diagnostic mask 0. Roles unknown."
from = "shipped diagnostic tables"

[registers.unpack_r1040]
offset = 0x801044
access = "rw"
width = 32
grade = "established"
doc = "Unpacker register number 0x1040. Init value is 0x1200 for pipe 0 (UNPACK_INIT_R1040). Roles unknown."

[registers.unpack_r1048]
offset = 0x80104c
access = "rw"
width = 32
grade = "established"
doc = "Unpacker register number 0x1048. Init constant UNPACK_INIT_R1048. Roles unknown."

# ---------------------------------------------------------------------------
# Video input formatter (VIF), block at register number 0x1800
# ---------------------------------------------------------------------------

[registers.vif_control]
offset = 0x801804
access = "rw"
width = 32
grade = "established"
doc = "VIF control (register number 0x1800, the diagnostic's CONTROL_SEL). Formula and width (14 bits) are established, matching the diagnostic's storage mask; the meaning of any bit is unknown. Bit 0 is 0 on the path the library reads, bits 5:4 are one of two bits chosen by a standard-definition flag, bit 6 is that flag, bits 10:8 are always 7, bit 11 comes from a format-table word and bit 12 is a nonzero test."
fields = { bit0 = { bits = [0, 0], grade = "established" }, mode_sel = { bits = [5, 4], grade = "established" }, sd_flag = { bits = [6, 6], grade = "established" }, const_7 = { bits = [10, 8], grade = "established" }, row_word1 = { bits = [11, 11], grade = "established" }, nonzero_test = { bits = [12, 12], grade = "established" } }

[registers.vif_enable]
offset = 0x80180c
access = "rw"
width = 32
grade = "established"
doc = "VIF enable (register number 0x1808, the diagnostic's ENABLE_SEL); the kernel stores the pipe's second shadow word here and abort clears bit 0. The store is established; that bit 0 is the enable is inferred. This is the in-pipe (pipe 1) video enable; the pairing is inferred from trace names."
fields = { enable = { bits = [0, 0], grade = "inferred" }, bit1 = { bits = [1, 1], grade = "unknown" } }

[registers.vif_scratch]
offset = 0x801814
access = "rw"
width = 32
grade = "inferred"
