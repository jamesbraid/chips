unit = "l1_requests"
prefix = "L1"
title = "request codes the Origin 3000 kernel sends to the brick controller"
from = "shipped Origin 3000 kernel routines that send each request code to the brick controller"

[c]
legacy_header = "include/l1_requests.h"
legacy_guard = "L1_REQUESTS_H"

[constants]
REQ_ELSC_CONS_NODE = { value = 0x1003, grade = "established", doc = "sent by elsc_cons_node; role [I]" }
REQ_ELSC_CONS_SUBCH = { value = 0x1002, grade = "established", doc = "sent by elsc_cons_subch; role [I]" }
REQ_ELSC_DEBUG_GET = { value = 0x1, grade = "established", doc = "sent by elsc_debug_get; role [I]" }
REQ_ELSC_DISPLAY_LINE_1 = { value = 0x1004, grade = "established", doc = "sent by elsc_display_line, line 0 (request is 4100 plus the line number); role [I]" }
REQ_ELSC_DISPLAY_LINE_2 = { value = 0x1005, grade = "established", doc = "sent by elsc_display_line, line 1; role [I]" }
REQ_ELSC_EVT_UNREG = { value = 0x100a, grade = "established", doc = "sent by elsc_evt_unreg; role [I]" }
REQ_ELSC_LED_SET = { value = 0x1009, grade = "established", doc = "sent by elsc_led_set; role [I]" }
REQ_ELSC_ODY_EXPANDER_GET = { value = 0x2007, grade = "established", doc = "sent by elsc_ody_expander_get; role [I]" }
REQ_ELSC_ODY_EXPANDER_SET = { value = 0x2008, grade = "established", doc = "sent by elsc_ody_expander_set; role [I]" }
REQ_ELSC_PARTITION_GET = { value = 0x9, grade = "established", doc = "sent by elsc_partition_get, peer_iobrick_partition_get; role [I]" }
REQ_ELSC_PARTITION_SET = { value = 0x1006, grade = "established", doc = "sent by elsc_partition_set, peer_iobrick_partition_set; role [I]" }
REQ_ELSC_PWR_CYCLE = { value = 0x2006, grade = "established", doc = "sent by elsc_pwr_cycle; role [I]" }
REQ_ELSC_PWR_OFF = { value = 0x2005, grade = "established", doc = "sent by elsc_pwr_off; role [I]" }
REQ_ELSC_SLAB_GET = { value = 0xe, grade = "established", doc = "sent by elsc_slab_get; role [I]" }
REQ_ELSC_SYSTEM_RESET = { value = 0x2001, grade = "established", doc = "sent by elsc_system_reset; the public later-generation header gives this number to a different request, see the chip page; role [I]" }
REQ_IOBRICK_ATTACHED_BRICKS = { value = 0xc, grade = "established", doc = "sent by iobrick_attached_bricks; role [I]" }
REQ_IOBRICK_GET_SYS_SNUM = { value = 0x8, grade = "established", doc = "sent by iobrick_get_sys_snum; role [I]" }
REQ_RACK_BAY_TYPE_GET = { value = 0x3, grade = "established", doc = "sent by the rack, bay and brick type getters (elsc_cbrick_type_get and three more); role [I]" }
REQ_SC_COMMAND_INTERP = { value = 0x0, grade = "established", doc = "sent by sc_command_interp: interpret an ASCII command; role [I]" }
REQ_SC_PORTSPEED_GET = { value = 0xa, grade = "established", doc = "sent by sc_portspeed_get, peer_iobrick_portspeed_get; role [I]" }
REQ_SC_SET_SYSTEM_STATE = { value = 0x100c, grade = "established", doc = "sent by sc_set_system_state; role [I]" }
REQ_SC_VERSION = { value = 0x5, grade = "established", doc = "sent by sc_version, iobrick_sc_version; role [I]" }
