unit = "mace_extra"
prefix = "MACE"
title = "MACE register bits the census does not name"
from = "MACE I/O ASIC Specification, chip revision 2.0 (July 16, 1996), section 5.1.2, table 54, p. 124, for the Flash-ROM/NIC control register at 0x310008"
public_from = ["census:"]

[constants]
ISA_MISC_FLASH_WRITE_ENABLE = { value = 0x1, grade = "established", doc = "Bit 0 of the miscellaneous control register (ISA_MISC), read/write, reset 0. Set to 1, writes to the Flash-ROM are enabled. Clear, a write is discarded into a bit bucket and does not reach the device. Specification section 5.1.2, table 54, p. 124, titled Flash-ROM/NIC control register. Section 5.5, p. 133, says software must enable this bit before writing the Flash-ROM, and that the Flash-ROM interface takes single-byte writes only." }
ISA_MISC_NIC_DEASSERT = { value = 0x4, grade = "established", doc = "Bit 2 of the miscellaneous control register (ISA_MISC), read/write, reset 0. Clear holds the NIC bidirectional interface low; set releases it and the bit then does nothing. This is the drive side of the one-wire Number-In-a-Can interface the specification's feature list names. Specification section 5.1.2, table 54, p. 124." }
ISA_MISC_NIC_SAMPLE = { value = 0x8, grade = "established", doc = "Bit 3 of the miscellaneous control register (ISA_MISC), read-only, reset 0. It reads the level now on the NIC interface signal: 0 when the signal is low, 1 when it is high. This is the sample side of the same interface as ISA_MISC_NIC_DEASSERT. Specification section 5.1.2, table 54, p. 124." }
