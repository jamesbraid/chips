unit = "r5000_cp0"
prefix = "R5KCP0"
title = "MIPS R5000 CP0 Config, Status, PageMask and LLAddr field positions, and FCR31 flags"
doc = "Constants for the R5000 processor's CP0 registers and FCR31 as the NEC VR5000 user's manual lays them out: the Config field positions, the Status fields and the bits a warm entry sets, the PageMask field and its legal page sizes, the LLAddr diagnostic layout, and the FCR31 field positions. This unit holds constants only; the reset, write and exception rules are in devices/r5000/README.md. Grades: established means the cited manual states it; unknown items are listed in the page."
from = "NEC VR5000/VR5000A 64-/32-bit Microprocessor User's Manual, U11761EJ6V0UM00, sixth edition, April 2001"
public_from = ["NEC VR5000/VR5000A 64-/32-bit Microprocessor User's Manual, U11761EJ6V0UM00, sixth edition, April 2001"]

[constants]
R5KCFG_EC_SHIFT = { value = 28, grade = "established", from = "NEC VR5000/VR5000A user's manual, U11761EJ6V0UM00, sixth edition, Config register (pages 129-131)", doc = "Lowest bit of the three-bit EC field, bits 30:28, the processor-to-system clock divisor." }
R5KCFG_EC_MASK = { value = 0x70000000, grade = "established", from = "NEC VR5000/VR5000A user's manual, U11761EJ6V0UM00, sixth edition, Config register (pages 129-131)", doc = "Mask for the EC field, bits 30:28 of Config." }
