[registers.gart_aperature]
offset = 0x28
access = "rw"
width = 64
grade = "established"
doc = "GART aperture. The provider writes size, page-size and enable bits plus the bus base in one 64-bit store: size field 0x3ff for 4 MiB, one bit fewer set per doubling down to 0x000 for 4 GiB (the field is the complement of the size in 4 MiB units); bit 1 set when the kernel page is 16 KiB; enable bits 0 (AGP) and 2 (PCI); the bus base ORed in unshifted (the base field starts at bit 22, and the base 0x80000000 falls inside it). The name is spelled aperature in the header. Name and offset are the vendor header's definition (struct member ca_gart_aperature). Software only writes it (one 64-bit store, last in GART setup, after the table is built). Writability: established. Readability and any bit that reads back differently: unknown, so rw stays as the widest access. Reset value unknown: the header and provider state none, and no firmware reading has been done."

