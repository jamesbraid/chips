unit = "tioca"
prefix = "TIOCA"
title = "TIOCA (TIO AGP bridge), as SGI's Linux Altix platform code defines it"
doc = "Names, offsets and bit fields are the definitions of SGI's Linux Altix platform code (header, AGP and PCI provider, v5.3). The TIOCA's own register specification is not held. The header gives no access direction and no reset value for any register. Each row states its access and the grade of that reading from what the provider does; no reset value is known."
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e: arch/ia64/include/asm/sn/tioca.h, tioca_provider.h, arch/ia64/sn/pci/tioca_provider.c"
public_from = ["census:"]

[c]
offset_macro = "bare"

[registers.id]
offset = 0x0
access = "r"
width = 64
grade = "established"
doc = "Widget identification word (part 0xe020, manufacturer 0x24, revision A = 1 per the header constants). The kernel keeps the revision the firmware reports in the bus record, not a value read here, and uses it to select four workarounds named in the provider header. Name and offset are the vendor header's definition (struct member ca_id). Access r: inferred from the name and role (an identification word); no code reads or writes it, since the kernel takes the revision from the firmware's bus record. Reset value unknown: the header and provider state none, and no firmware reading has been done."

[registers.control1]
offset = 0x8
access = "rw"
width = 64
grade = "established"
doc = "Control 1. The provider sets bit 42 (AGP DMA operation combining delay enable; a provider comment ties it to PV895469 with a question mark) when it initialises the GART, and sets bit 6 (AGP fast write enable) when every function on the bus supports fast writes. Everything else is untouched. Name and offset are the vendor header's definition (struct member ca_control1). Access rw: established as a software expectation, because the provider changes single bits by reading the register back and writing it (read-modify-write). Reset value unknown: the header and provider state none, and no firmware reading has been done."

