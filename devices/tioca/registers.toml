PCI32_DIRECT_BASE = { value = 0xc0000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, arch/ia64/include/asm/sn/tioca.h (CA_PCI32_DIRECT_BASE)", doc = "Start of the 32-bit direct DMA window. The provider sets its size to zero, so the window is unused: the header says an addressing flaw makes 32-bit direct DMA unusable below 3 GiB, and all 32-bit DMA goes through the GART." }
