[registers.control2]
offset = 0x10
access = "rw"
width = 64
grade = "established"
doc = "Control 2. The provider programs GART memory parameter 2 (cached, coherent GART table), clears both GART prefetch enables, and sets the GART TLB flush bit (36) to flush explicitly. On revision A hardware it pulses the flush with the memory parameter cleared first (PV910244: the flush is ignored while the table is cached), then restores the parameter. Name and offset are the vendor header's definition (struct member ca_control2). Access rw: established as a software expectation, because the provider changes single bits by reading the register back and writing it (read-modify-write). The flush bit is read back after setting. Reset value unknown: the header and provider state none, and no firmware reading has been done."

