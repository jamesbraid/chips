unit = "router_nl4"
prefix = "ROUTER_NL4"
title = "NUMAlink 4 router (R4): global, local-block and per-port registers, as the SN2 PROM's error and dump tables name them"
doc = "Register numbers, names and bit ranges come from the register description table that the SN2 PROM images carry for the NUMAlink 4 router (names with the prefix R4_, here without it). The table gives each register's number in the router's own register space, its name and its fields with bit positions and a small flags value. It states no reset values and no semantics, so every reset is unknown, roles are inferred from the names, and an access of r or rw is inferred from the flags (bit 0 set on every readable field, bit 1 on every writable one). Width 64 is inferred: every number is a multiple of 8 and the SHub's own vector accesses are doublewords. The eight ports are lettered A to H in the PROM and indexed 0 to 7 here (the PROM's own port number is the index plus one). A per-port register is recorded at port A with count 8; the stride is the one the table shows (the port-block distance for registers inside the port blocks, 8 for the per-port registers kept in the global block). The prose is in devices/router_nl4/README.md."
from = "SN2 PROM 10.54 (shub2snprom image) NUMAlink 4 router register description table; the same table is in every SHub 2 and SHub 1 image read"
public_from = ["SGI SN2 PROM image 10.54"]

[constants]
MAX_PORTS = { value = 8, grade = "established", doc = "Ports lettered A to H in the table; the Dense router and the R-brick manuals describe an eight-port crossbar (007-4823-001 p.61)." }
PORT_BLOCK_STRIDE = { value = 0x1000000, grade = "established", doc = "Distance between one port's block and the next for every register inside the port blocks (port A first, port H last)." }

