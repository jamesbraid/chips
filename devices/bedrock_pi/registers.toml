doc = "A read returns the CPU B CPU-to-CPU pending bits. A write clears each bit whose data bit is one."

[registers.cc_pend_clr_b.fields]
cpcb_cc_pend = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.cc_mask]
offset = 0xe8
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CC_MASK at image offset 0x15eff8 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Masks both CPU-to-CPU pending registers."

[registers.cc_mask.fields]
cm_cc_mask = { bits = [63, 0], grade = "established" }

[registers.int_pend1_remap]
offset = 0xf0
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_INT_PEND1_REMAP at image offset 0x15f010 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Moves bank 1 bits 31 to 0 from level 3 to level 2 under control of the low four bits. Bit 4 forwards the memory and unit error interrupts to the I/O interface, which raises its interrupt to the node named in its destination register, so the errors can reach another node. The header does not give the encoding of the four-bit selector."

[registers.int_pend1_remap.fields]
ipr_remap = { bits = [3, 0], grade = "established", doc = "Low four bits of the remap selector; encoding not given." }
ipr_error_forward = { bits = [4, 4], grade = "established", doc = "Forward memory, network, local-block and crossbar errors to the I/O interface." }

[registers.rt_counter]
