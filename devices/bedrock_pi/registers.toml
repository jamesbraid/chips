access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_RT_COUNTER at image offset 0x15f538 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Real-time counter. It wraps to zero at its maximum value and increments on each rising edge of the global clock. The header puts it in its own 64 KB page so it can be mapped to user space."

[registers.rt_counter.fields]
