unit = "bedrock_pi"
prefix = "BEDROCK_PI"
title = "Bedrock processor interface (PI) registers: field layouts, interrupt banks, real-time clock, graphics credits and error capture"
doc = "Offsets are hub-relative inside one processor interface. The second interface repeats the same layout 2 MiB higher in the node window (see the processor-interface page). Register names, offsets, widths and field positions come from the public Linux 2.5.40 SN1 processor-interface register header, so they are established as header facts. Behaviour the header gives only in its comments is inferred. Access modes the header does not state are assumed read and write and labelled so in the text. The header gives no reset value for any register, so every reset is unknown."
from = "Linux 2.5.40 SN1 processor-interface register header: names, offsets and field layouts"
public_from = ["Linux 2.5.40"]

[c]
offset_macro = "bare"


[registers.cpu_protect]
offset = 0x0
access = "rw"
width = 64
grade = "established"
reset = 0xffffffffffffffff
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CPU_PROTECT at image offset 0x15eda0 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "One bit per region. A set bit lets the processor in that region reach this interface's local registers. A denied access gets a protection error reply. The header says the register is not reset by a soft reset and gives no reset value."

[registers.cpu_protect.fields]
cp_cpu_protect = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.prot_override]
offset = 0x8
access = "w"
width = 64
grade = "established"
doc = "A write carrying a special data pattern sets the writing processor's region bit in the CPU protect register. The header does not give the pattern."

[registers.prot_override.fields]
po_prot_ovrrd = { bits = [63, 0], grade = "established", doc = "Written value compared against the special pattern; the pattern is not stated." }

[registers.io_protect]
offset = 0x10
access = "rw"
width = 64
grade = "established"
reset = 0xffffffffffffffff
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_IO_PROTECT at image offset 0x15edd0 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "One bit per region. Decides whether I/O-initiated interrupt writes from that region may set bits in the two pending banks. The header says it is not reset by a soft reset."

[registers.io_protect.fields]
ip_io_protect = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.region_present]
offset = 0x18
access = "rw"
width = 64
grade = "established"
reset = 0xffffffffffffffff
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_REGION_PRESENT at image offset 0x15ede8 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "One bit per region. Clear bits block speculative coherent reads to that region. A coherent read to an absent region gets an error reply and no error register changes. Partial reads and writes are not checked. Cached-alias accesses are not affected. The header says it is not reset by a soft reset."

[registers.region_present.fields]
rp_region_present = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.cpu_num]
offset = 0x20
access = "r"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CPU_NUM at image offset 0x15ee00 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Read by a processor to learn its own slot and interface. Bit 0 is the slot (0 for CPU A, 1 for CPU B); bit 1 is the interface (0 for PI0, 1 for PI1)."

[registers.cpu_num.fields]
cn_cpu_num = { bits = [0, 0], grade = "established", doc = "0 is CPU A, 1 is CPU B." }
cn_pi_id = { bits = [1, 1], grade = "established", doc = "0 is PI0, 1 is PI1." }

[registers.calias_size]
offset = 0x28
access = "rw"
width = 64
grade = "established"
doc = "Size code for the cached-alias space. The header says all cached-alias spaces in a system must carry the same size. It is not reset by a soft reset."

[registers.calias_size.fields]
cs_calias_size = { bits = [3, 0], grade = "established", doc = "Size code; the header does not give the size each code means." }

[registers.max_crb_timeout]
offset = 0x30
access = "rw"
width = 64
grade = "established"
doc = "Value at which a valid coherency request buffer's timeout counter causes a timeout error. The header refers to the processor interface chapter of the Bedrock manual, which is not held."

[registers.max_crb_timeout.fields]
mct_max_timeout = { bits = [7, 0], grade = "established", doc = "Maximum timeout value." }

[registers.crb_scale_factor]
offset = 0x38
access = "rw"
width = 64
grade = "established"
reset = 0x64
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CRB_SFACTOR at image offset 0x15ee48 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Sets how often a valid coherency request buffer's timeout counter increments. The header refers to the same manual section as the maximum timeout register."

[registers.crb_scale_factor.fields]
cs_sfactor = { bits = [23, 0], grade = "established", doc = "Scale factor." }

[registers.cpu_present_a]
offset = 0x40
access = "r"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CPU_PRESENT_A at image offset 0x15ee60 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Set by the interface when it sees the first transaction from CPU A. The header gives no write behaviour."

[registers.cpu_present_a.fields]
cpa_cpu_present = { bits = [0, 0], grade = "established" }

[registers.cpu_present_b]
offset = 0x48
access = "r"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CPU_PRESENT_B at image offset 0x15ee78 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Set by the interface when it sees the first transaction from CPU B. The header gives no write behaviour."

[registers.cpu_present_b.fields]
cpb_cpu_present = { bits = [0, 0], grade = "established" }

[registers.cpu_enable_a]
offset = 0x50
access = "rw"
width = 64
grade = "established"
reset = 0x1
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CPU_ENABLE_A at image offset 0x15ee90 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "While clear, the interface ignores the bus request from CPU A and never grants it the bus. The header says it is not reset by a soft reset and gives no reset value."

[registers.cpu_enable_a.fields]
cea_cpu_enable = { bits = [0, 0], grade = "established" }

[registers.cpu_enable_b]
offset = 0x58
access = "rw"
width = 64
grade = "established"
reset = 0x1
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CPU_ENABLE_B at image offset 0x15eea8 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "While clear, the interface ignores the bus request from CPU B and never grants it the bus. The header says it is not reset by a soft reset and gives no reset value."

[registers.cpu_enable_b.fields]
ceb_cpu_enable = { bits = [0, 0], grade = "established" }

[registers.nmi_a]
offset = 0x70
access = "w"
width = 64
grade = "established"
doc = "A write issues a non-maskable interrupt to CPU A. The header gives no predicate on the written value, no latch behaviour and no reset value."

[registers.nmi_b]
offset = 0x78
access = "w"
width = 64
grade = "established"
doc = "A write issues a non-maskable interrupt to CPU B. The header gives no predicate on the written value, no latch behaviour and no reset value."

[registers.ipi_a]
offset = 0x80
access = "w"
width = 64
grade = "established"
from = "Linux ia64 SN1 (v2.5.0 snapshot): arch/ia64/sn/sn1/smp.c, sn1_send_IPI; not defined in the SN1 register headers"
doc = "Inter-processor interrupt delivery for the Itanium processor in slot A of this interface (IA-64 nodes only). A store of (delivery mode << 8) | vector, 64 bits wide, raises that vector on the processor. The Linux code stores to this offset of PI0 for slice 0 and PI1 for slice 2, from the node's hub register window. The MIPS headers do not define the offset and no MIPS software is known to use it. The register's reset, read behaviour and any mode beyond the written value are unknown."

[registers.ipi_b]
offset = 0x88
access = "w"
width = 64
grade = "established"
from = "Linux ia64 SN1 (v2.5.0 snapshot): arch/ia64/sn/sn1/smp.c, sn1_send_IPI; not defined in the SN1 register headers"
doc = "Inter-processor interrupt delivery for the Itanium processor in slot B of this interface (IA-64 nodes only), same use as ipi_a: slice 1 on PI0, slice 3 on PI1."

[registers.int_pend_mod]
offset = 0x90
access = "w"
width = 64
grade = "established"
doc = "Sets or clears one bit of an interrupt pending bank. It is the only pending-register write an I/O-issued write may make, and I/O protect checks it. Processor writes are checked against CPU protect. The header gives no reset value."

[registers.int_pend_mod.fields]
ipm_bit_select = { bits = [5, 0], grade = "established", doc = "Bit number 0 to 63 in the bank chosen by the bank field." }
ipm_reg_select = { bits = [6, 6], grade = "established", doc = "0 selects pending bank 0, 1 selects pending bank 1." }
ipm_value = { bits = [8, 8], grade = "established", doc = "1 sets the named bit, 0 clears it." }

[registers.int_pend0]
offset = 0x98
access = "r"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_INT_PEND0 at image offset 0x15ef08 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Pending bank 0, read only. The bits map to interrupt level 2 in the header's naming. The graphics bits are set by hardware and must be cleared by software."

[registers.int_pend0.fields]
int_pend0_lo = { bits = [0, 0], grade = "established", doc = "General; not named by the header." }
gfx_int_a = { bits = [1, 1], grade = "established", doc = "Graphics interrupt for CPU A; set by hardware, cleared by software." }
gfx_int_b = { bits = [2, 2], grade = "established", doc = "Graphics interrupt for CPU B; set by hardware, cleared by software." }
page_migration = { bits = [3, 3], grade = "established", doc = "Page migration." }
uart_ucntrl = { bits = [4, 4], grade = "established", doc = "Name from the header's field list; the header's comment does not describe it." }
or_cc_pend_a = { bits = [5, 5], grade = "established", doc = "Set when CPU A has a CPU-to-CPU interrupt pending." }
or_cc_pend_b = { bits = [6, 6], grade = "established", doc = "Set when CPU B has a CPU-to-CPU interrupt pending." }
int_pend0_hi = { bits = [63, 7], grade = "established", doc = "General." }

[registers.int_pend1]
offset = 0xa0
access = "r"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_INT_PEND1 at image offset 0x15ef20 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Pending bank 1, read only. Bits map to interrupt level 3 unless the remap register moves bits 31 to 0 to level 2. The correctable-error, NACK and performance-overflow bits are set by hardware and must be cleared by software. The system shutdown, network, local-block and crossbar bits only reflect other logic and cannot be changed through this interface."

[registers.int_pend1.fields]
int_pend1_gen = { bits = [53, 0], grade = "established", doc = "General bits 53 to 0." }
xb_error = { bits = [54, 54], grade = "established", doc = "Crossbar error; reflects other logic." }
lb_error = { bits = [55, 55], grade = "established", doc = "Local block error; reflects other logic." }
nack_int_a = { bits = [56, 56], grade = "established", doc = "CPU A NACK count reached its compare; set by hardware." }
nack_int_b = { bits = [57, 57], grade = "established", doc = "CPU B NACK count reached its compare; set by hardware." }
perf_cntr_oflow = { bits = [58, 58], grade = "established", doc = "Performance counter overflow. The header's comment for this bank calls the same bit RTC drop-out." }
sys_cor_err_b = { bits = [59, 59], grade = "established", doc = "Correctable system error for CPU B; set by hardware." }
sys_cor_err_a = { bits = [60, 60], grade = "established", doc = "Correctable system error for CPU A; set by hardware." }
md_corr_error = { bits = [61, 61], grade = "established", doc = "Memory and directory correctable error." }
ni_error = { bits = [62, 62], grade = "established", doc = "Network interface error; reflects other logic." }
system_shutdown = { bits = [63, 63], grade = "established", doc = "System shutdown; reflects other logic." }

[registers.int_mask0_a]
offset = 0xa8
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_INT_MASK0_A at image offset 0x15ef38 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Masks bank 0 for CPU A. A set bit passes the pending bit through as a level 2 interrupt (bit 10 of the processor's Cause register)."

[registers.int_mask0_a.fields]
ima_int_mask0_lo = { bits = [0, 0], grade = "established", doc = "Mask for the general bit 0 of bank 0." }
ima_gfx_int_a = { bits = [1, 1], grade = "established", doc = "Mask for the CPU A graphics bit." }
ima_gfx_int_b = { bits = [2, 2], grade = "established", doc = "Mask for the CPU B graphics bit." }
ima_page_migration = { bits = [3, 3], grade = "established", doc = "Mask for the page migration bit. The header says only one processor per Bedrock should enable it." }
ima_uart_ucntrl = { bits = [4, 4], grade = "established", doc = "Mask for the UART bit." }
ima_or_ccp_mask_a = { bits = [5, 5], grade = "established", doc = "Mask for the CPU A CPU-to-CPU bit." }
ima_or_ccp_mask_b = { bits = [6, 6], grade = "established", doc = "Mask for the CPU B CPU-to-CPU bit." }
ima_int_mask0_hi = { bits = [63, 7], grade = "established", doc = "Mask for the general bits 63 to 7." }

[registers.int_mask1_a]
offset = 0xb0
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_INT_MASK1_A at image offset 0x15ef50 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Masks bank 1 for CPU A. Bits 63 to 32 always raise a level 3 interrupt (bit 11 of Cause). Bits 31 to 0 raise level 3 or level 2 depending on the remap register. The header says only one processor per Bedrock should enable the network, local-block, crossbar and memory-correctable bits."

[registers.int_mask1_a.fields]
ima_int_mask1 = { bits = [63, 0], grade = "established" }

[registers.int_mask0_b]
offset = 0xb8
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_INT_MASK0_B at image offset 0x15ef68 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Masks bank 0 for CPU B. Same layout and meaning as the CPU A mask."

[registers.int_mask0_b.fields]
imb_int_mask0_lo = { bits = [0, 0], grade = "established", doc = "Mask for the general bit 0 of bank 0." }
imb_gfx_int_a = { bits = [1, 1], grade = "established", doc = "Mask for the CPU A graphics bit." }
imb_gfx_int_b = { bits = [2, 2], grade = "established", doc = "Mask for the CPU B graphics bit." }
imb_page_migration = { bits = [3, 3], grade = "established", doc = "Mask for the page migration bit. The header says only one processor per Bedrock should enable it." }
imb_uart_ucntrl = { bits = [4, 4], grade = "established", doc = "Mask for the UART bit." }
imb_or_ccp_mask_a = { bits = [5, 5], grade = "established", doc = "Mask for the CPU A CPU-to-CPU bit." }
imb_or_ccp_mask_b = { bits = [6, 6], grade = "established", doc = "Mask for the CPU B CPU-to-CPU bit." }
imb_int_mask0_hi = { bits = [63, 7], grade = "established", doc = "Mask for the general bits 63 to 7." }

[registers.int_mask1_b]
offset = 0xc0
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_INT_MASK1_B at image offset 0x15ef80 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Masks bank 1 for CPU B. Same layout and meaning as the CPU A mask."

[registers.int_mask1_b.fields]
imb_int_mask1 = { bits = [63, 0], grade = "established" }

