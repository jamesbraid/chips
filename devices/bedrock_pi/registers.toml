[registers.cc_pend_set_b.fields]
cpsb_cc_pend = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.cc_pend_clr_a]
offset = 0xd8
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_CC_PEND_CLR_A at image offset 0x15efc8 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
