reset_from = "IP35 PROM 6.210 register table, entry PI_RT_INT_PEND_A at image offset 0x15f070 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "Real-time interrupt pending for CPU A. When the matching enable is set, CPU A's interrupt line follows this bit. The header's comment on this register says level 5, which conflicts with the compare register's level 4. Any store clears the bit."

