offset = 0x108
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry PI_RT_COMPARE_A at image offset 0x15f028 (field reset values are the system reset initial values; layout per IRIX software (source not cited))"
doc = "When the real-time counter equals this value, the CPU A real-time pending bit is set. The header's comment says this sends a level 4 interrupt. Access is not stated; read and write is assumed."

[registers.rt_compare_a.fields]
