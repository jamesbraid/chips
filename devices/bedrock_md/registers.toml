[registers.mem_error]
offset = 0x7e0010
access = "r"
width = 64
grade = "established"
doc = "Memory error record: an address, a syndrome and a valid and overrun flag pair for each of three kinds. The address and syndrome belong to the earliest error of the highest priority: uncorrectable read above uncorrectable write above correctable read. Bit 63 is set when uncorrectable errors reached different cache lines. The header's flag summary gives the order of each pair's bits only in one place, so the pair order is inferred. Reset unknown."

[registers.mem_error.fields]
differing_address = { bits = [63, 63], grade = "established", doc = "Uncorrectable errors reached different cache lines." }
read_uncorrectable_flags = { bits = [61, 60], grade = "inferred", doc = "Overrun and valid flags for the read-uncorrectable kind, in that order (61 overrun, 60 valid). The order is inferred from the register line; the memory diagnostic's own wait names bits 54 to 52 for the read-correctable kind, which conflicts with the summary." }
write_uncorrectable_flags = { bits = [57, 56], grade = "inferred", doc = "Overrun and valid flags for the write-uncorrectable kind. The order is inferred as for the read kind. No consumer produces this kind." }
read_correctable_flags = { bits = [53, 52], grade = "inferred", doc = "Overrun and valid flags for the read-correctable kind. The order is inferred as for the read-uncorrectable kind." }
syndrome = { bits = [47, 40], grade = "established", doc = "Eight-bit syndrome of the latched error." }
address = { bits = [32, 3], grade = "established", doc = "Thirty-bit doubleword address of the latched error, with the low three bits dropped." }

