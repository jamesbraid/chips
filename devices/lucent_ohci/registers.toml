unit = "lucent_ohci"
prefix = "LUCENT_OHCI"
title = "AT&T/Lucent 11C1:5802 two-port OHCI USB host controller (Origin 300 IO-8), the register and identity facts the held sources establish"
doc = "The two-port USB host controller on the Origin 300 IO-8 board (PCI 11c1:5802, OpenHCI register interface). The register offsets follow the OpenHCI word layout; the IO-8 board test names its operational registers by word index. Grades say how each item was derived: established means the published OpenHCI specification, the Lucent USS-312 datasheet, a published SGI manual or a public hardware capture states it; inferred means a software expectation taken from the IO-8 board test's own checks, or a reading of its masks. No reset word for the PCI configuration Command and Status registers is held, and the reset values of the operational registers are unknown unless a row says otherwise. Software expectations are what the diagnostic requires, not measured chip behaviour."
from = "OpenHCI 1.0a (sections cited per item); Lucent USS-312 datasheet; Online Diagnostics manual 108-0286-007; IO-8 board test (io8bt) in the stock PROM diagnostics; public IRIX hinv capture of an Origin 300 IO-8"
public_from = ["OpenHCI 1.0a", "Lucent USS-312 datasheet", "Online Diagnostics manual 108-0286-007", "IO-8 board test (io8bt) in the stock PROM diagnostics", "public IRIX hinv capture of an Origin 300 IO-8"]

[constants.PCI_VENDOR_ID]
value = 0x11c1
grade = "established"
from = "public IRIX hinv capture of an Origin 300 IO-8 (decimal 4545, PCI device 5, interface OHCI); Lucent USS-312 datasheet"
doc = "PCI vendor ID of AT&T/Lucent. The capture reports the decimal form, 4545, for this function."

[constants.PCI_DEVICE_ID]
value = 0x5802
grade = "established"
from = "public IRIX hinv capture of an Origin 300 IO-8 (decimal 22530, PCI device 5, interface OHCI); Lucent USS-312 datasheet"
doc = "PCI device ID of the two-port OHCI function. The capture reports the decimal form, 22530. The board places it at PCI device 5."

[constants.SUBSYSTEM_VENDOR_ID]
value = 0x11c1
grade = "established"
from = "Lucent USS-312 datasheet, Tables 3 and 17"
doc = "Subsystem vendor ID the datasheet gives. It is read-only unless system firmware opens the subsystem fields through configuration register 4Ch. Whether the IO-8 firmware does so, and so what the fitted part reports, is unknown."

[constants.SUBSYSTEM_ID]
value = 0x5802
grade = "established"
from = "Lucent USS-312 datasheet, Tables 3 and 18"
doc = "Subsystem ID the datasheet gives. Same write rule as the subsystem vendor ID. The value on a fitted IO-8 part is not read from a capture here."

[constants.MIN_GNT]
value = 0x03
grade = "established"
from = "Lucent USS-312 datasheet"
doc = "Min_Gnt configuration value the datasheet gives for this part."

[constants.MAX_LAT]
value = 0x56
grade = "established"
from = "Lucent USS-312 datasheet"
doc = "Max_Lat configuration value the datasheet gives for this part."

[constants.HCLSTHRESHOLD_RESET]
value = 0x628
grade = "established"
from = "Lucent USS-312 datasheet, Table 44"
doc = "Reset value of the low-speed threshold register the datasheet gives."

[constants.FRAME_INTERVAL_RESET]
value = 0x2edf
grade = "established"
from = "OpenHCI 1.0a, section 7.3.1 (figure on printed page 120, table on printed page 121), as the source datasheet cites it"
doc = "Reset value of the frame interval field of the frame interval register. The specification gives it. The field that holds the largest data packet size in the same register is marked TBD there, so it is not listed here (see the register's doc)."

[constants.FM_NUMBER_WRITE_MASK]
value = 0x0000ffff
grade = "inferred"
from = "IO-8 board test's register table for the frame number register"
doc = "Read-back mask the IO-8 board test applies after writing the frame number register. It shows the full 16-bit field is expected to hold a driver write while the controller is not operational. What the part does with a write while operational is unknown."

[registers.hc_interrupt_enable]
offset = 0x10
access = "rw"
width = 32
reset = 0x0
reset_from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 31 (offset 10h, every defined bit resets to 0b); IO-8 board test USB reset check (its message names register index 0x4, which is offset 0x10)"
grade = "established"
from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 31 (offset 10h, every defined bit resets to 0b); IO-8 board test USB reset check (its message names register index 0x4, which is offset 0x10)"
doc = "Interrupt enable word. The IO-8 board test requires it to read zero after a host-controller reset issued through the command register, and it prints a reset-error message when it does not. That is the test's software expectation, not a value measured on the part. The test's mask table narrows the read-back masks of four fields: the unrecoverable-error enable in this word, the frame interval toggle, the frame remaining word and the top of the power-on-to-power-good time. Which bits of those the part keeps is unknown."

[registers.hc_fm_interval]
offset = 0x34
access = "rw"
width = 32
reset = 0x2edf
reset_from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 40 (offset 34h: frame interval 2EDFh, FS largest data packet 0h, toggle 0b at reset); IO-8 board test USB reset check (index 0xd); OpenHCI 1.0a section 7.3.1"
grade = "established"
from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 40 (offset 34h: frame interval 2EDFh, FS largest data packet 0h, toggle 0b at reset); IO-8 board test USB reset check (index 0xd); OpenHCI 1.0a section 7.3.1"
doc = "Frame interval word. The frame interval and its toggle take the OpenHCI reset values (see FRAME_INTERVAL_RESET). The largest data packet field's reset value is TBD in the OpenHCI specification, and the USS-312 data sheet gives it as 0h, which the IO-8 board test also expects."

[registers.hc_fm_interval.fields]
frame_interval = { bits = [13, 0], grade = "established", doc = "Frame interval in bit times, reset 0x2edf per the specification" }
fs_largest_data_packet = { bits = [30, 16], grade = "established", doc = "Largest data packet size. Its reset value is TBD in the OpenHCI specification; the USS-312 data sheet (Table 40) gives 0h and the IO-8 board test expects zero" }
frame_interval_toggle = { bits = [31, 31], grade = "established", doc = "Toggle, reset zero per the specification" }

[registers.hc_fm_number]
offset = 0x3c
access = "r"
width = 32
reset = 0x0
reset_from = "OpenHCI 1.0a section 7.3.3 (printed page 122), as the source datasheet cites it; IO-8 board test register table for the write check (index 0xf, offset 0x3c)"
grade = "established"
from = "OpenHCI 1.0a section 7.3.3 (printed page 122), as the source datasheet cites it; IO-8 board test register table for the write check (index 0xf, offset 0x3c)"
doc = "Frame number word. The specification makes it read-only to the driver, written only by the controller, with reset zero. The IO-8 board test writes 0xffff to it after a controller reset, while the controller is not operational and again during reset, and requires the read-back to match under the mask in FM_NUMBER_WRITE_MASK. Neither the specification nor the test says what a driver write does to the part. That is the open point of this register."

[registers.hc_fm_number.fields]
frame_number = { bits = [15, 0], grade = "established", doc = "Frame number, written by the controller" }

[registers.hc_rh_descriptor_a]
offset = 0x48
access = "rw"
width = 32
reset = 0x10000902
reset_from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 45 (offset 48h: NDP 02h, PSM 1b, NPS 0b, DT 0b, OCPM 1b, NOCP 0b, POTPGT 10h at reset); IO-8 board test USB section (index 0x12); OpenHCI 1.0a section 7.4.1"
grade = "established"
from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 45 (offset 48h: NDP 02h, PSM 1b, NPS 0b, DT 0b, OCPM 1b, NOCP 0b, POTPGT 10h at reset); IO-8 board test USB section (index 0x12); OpenHCI 1.0a section 7.4.1"
doc = "Root hub descriptor A. The specification makes the power-switching and over-current fields and the power-on-to-power-good time driver-written, so the board test's write-and-read-back of them is a fair check of those writable bits. The test writes zero and requires those fields to read back as zero under the mask 0x03001b00 (the bits of PowerSwitchingMode, NoPowerSwitching, OverCurrentProtectionMode and NoOverCurrentProtection, plus bits 25 and 24 of the power-on-to-power-good time). The power-on value is given by the USS-312 datasheet but is not stated in this unit."

[registers.hc_rh_descriptor_a.fields]
power_switching_mode = { bits = [8, 8], grade = "established", doc = "Per-port (1) or global (0) power switching, driver written per the specification" }
no_power_switching = { bits = [9, 9], grade = "established", doc = "Power switching disabled when set, driver written per the specification" }
over_current_protection_mode = { bits = [11, 11], grade = "established", doc = "Per-port (1) or global (0) over-current reporting, driver written per the specification" }
no_over_current_protection = { bits = [12, 12], grade = "established", doc = "Over-current protection disabled when set, driver written per the specification" }
power_on_to_power_good_time = { bits = [31, 24], grade = "established", doc = "Power-on to power-good time in 2 ms units, driver written per the specification. The board test checks only bits 25 and 24" }

[registers.hc_rh_descriptor_b]
offset = 0x4c
access = "rw"
width = 32
reset = 0x60000
reset_from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 46 (offset 4Ch: DR 0000h, PPCM 0006h at reset, so the word resets to 0x00060000); IO-8 board test USB section (index 0x13); OpenHCI 1.0a sections 7.1.3 and 7.4.2"
grade = "established"
from = "Lucent USS-312 Advance Data Sheet rev 5 (March 2000), Table 46 (offset 4Ch: DR 0000h, PPCM 0006h at reset, so the word resets to 0x00060000); IO-8 board test USB section (index 0x13); OpenHCI 1.0a sections 7.1.3 and 7.4.2"
doc = "Root hub descriptor B. The specification gives the device-removable and port-power-control fields as driver written, one bit per port starting at bit 1 of each half, and says a hardware reset does not reset the root hub. The board test's USBRESET check requires the port bits to survive a USBRESET followed by a controller reset. The specification's prose points the other way about USBRESET, and its reset column permits keeping the fields, so the survival is inferred from the test alone."

[registers.hc_rh_descriptor_b.fields]
device_removable = { bits = [15, 0], grade = "established", doc = "One bit per port from bit 1, driver written" }
port_power_control_mask = { bits = [31, 16], grade = "established", doc = "One bit per port from bit 17, driver written" }
