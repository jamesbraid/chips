unit = "tiocp_extra"
prefix = "TIOCP"
title = "TIOCP registers and constants outside the census"
doc = "SGI's Linux Altix platform code (v5.3) defines the TIOCP register block as struct tiocp. The census unit holds the offsets the shipped IRIX accessors reach; this unit holds what the header defines beyond them and the constants of the provider. Names, offsets and layouts are software definitions."
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e: arch/ia64/include/asm/sn/tiocp.h, pcibr_provider.h, arch/ia64/sn/pci/pcibr/"
public_from = ["census:"]

