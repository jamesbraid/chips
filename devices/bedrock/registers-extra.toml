unit = "bedrock_extra"
prefix = "BEDROCK"
title = "Hub and Bedrock network-controller registers outside the census"
from = "shipped Origin 350 generation kernel I/O error handlers; published SN1 register header for the two timeout registers"
public_from = ["census:", "shipped IRIX"]

[c]
offset_macro = "bare"

[registers.ii_widget_status]
offset = 0x400008
access = "r"
width = 64
grade = "established"

[registers.ii_shutdown_status]
offset = 0x4001e8
access = "r"
width = 64
grade = "established"

[registers.ii_error_header_1]
offset = 0x400220
access = "r"
width = 64
grade = "established"

[registers.ii_error_header_2]
offset = 0x400228
access = "r"
width = 64
grade = "established"

[registers.node_region_mask]
offset = 0x1000018
access = "r"
width = 64
grade = "established"

[registers.mem_bank_config]
offset = 0x1f80008
access = "rw"
width = 64
grade = "established"

[constants]
II_CREDIT_TIMEOUT = { value = 0x4001e0, grade = "established", doc = "Bedrock layout, [I] Hub: bits 25:0 count 128-clock ticks while outbound credits are below 1 (direct) or 2 (crossbar), saturate, raise one interrupt; no consumer in anything held" }
II_ERROR_HEADER_1_COMMAND = { value = 0x7f, grade = "established", doc = "bits 6:0" }
II_ERROR_HEADER_1_ERR_TYPE = { value = 0xf00000000, grade = "established", doc = "bits 35:32; 2 short request packet, 3 short reply packet, 4 long request packet, 5 long reply packet, any other value prints as unknown (each value selects its own text in the print routine)" }
II_ERROR_HEADER_1_OVERRUN = { value = 0x10000000000, grade = "established", doc = "bit 40" }
II_ERROR_HEADER_1_PRINT_GATE = { value = 0x100000000000, grade = "established", doc = "bit 44 gates the print; [I] header valid" }
II_ERROR_HEADER_1_SOURCE = { value = 0x7ff00000, grade = "established", doc = "bits 30:20" }
II_ERROR_HEADER_1_SUPPLEMENTAL = { value = 0x7ff00, grade = "established", doc = "bits 18:8" }
II_ERROR_HEADER_2_ADDRESS = { value = 0x3fffffffff, grade = "established", doc = "bits 37:0" }
II_ERROR_HEADER_2_TAIL = { value = 0x10000000000, grade = "established", doc = "bit 40" }
II_READ_RESP_PRESCALE_B_54_32 = { value = 0x7fffff00000000, grade = "established", doc = "Bedrock layout: read-response prescaler, bits 54:32; unit [U]" }
II_READ_RESP_TIMEOUT_B_59_55 = { value = 0xf80000000000000, grade = "established", doc = "Bedrock layout: read-response timeout, bits 59:55; unit [U]" }
II_TAIL_TIMEOUT = { value = 0x4001f0, grade = "established", doc = "Bedrock layout, [I] Hub: bits 25:0 tail timeout; the same offset holds the read-response fields below" }
II_WIDGET_STATUS_CREDIT_TIMEOUT = { value = 0x10, grade = "established", doc = "bit 4, reason when bit 32 is set" }
II_WIDGET_STATUS_ERROR = { value = 0x100000000, grade = "established", doc = "bit 32, the \"crazy\" error flag; name [I]" }
II_WIDGET_STATUS_RETRY_TIMEOUT = { value = 0x200, grade = "established", doc = "bit 9, reason when bit 32 is set" }
II_WIDGET_STATUS_TAIL_TIMEOUT = { value = 0x20, grade = "established", doc = "bit 5, reason when bit 32 is set" }
MEM_BANK_CONFIG_BANK_SELECT = { value = 0x300000000, grade = "established", doc = "bits 33:32; the PROM clears these and ORs in a selector shifted left 32 (not masked to two bits by that routine)" }
MEM_BANK_CONFIG_B_58_56 = { value = 0x700000000000000, grade = "established", doc = "the same write ORs in 7 here; meaning [U]: settle by a published Bedrock register list (none held) or the same routine's callers' use of the result" }
MEM_BANK_CONFIG_LANE_ENABLE = { value = 0x3, grade = "established", doc = "per lane, bits 1:0 enable the lane's two banks, one bit each; bits 3:2 are not read by the decode routine [U]" }
MEM_BANK_CONFIG_LANE_SIZE = { value = 0xf0, grade = "established", doc = "per lane, bits 7:4: one size code shared by both banks of the lane" }
PI_ERROR_SPOOL_SIZE_BASE = { value = 0x1000, grade = "established", doc = "bytes for a value of 1" }
NODE_SHIFT = { value = 0x21, grade = "established", from = "shipped IRIX kernel binaries, per kudzu docs/ip35-hub-errors.md", doc = "Physical node number shift of the Origin 300/350 hub, as the kernel's memory-directory, I/O and one-wire code all apply it." }
NIC_ACCESS_HUB_PHYS_LOW = { value = 0x1e04030, grade = "established", from = "shipped IRIX kernel binaries, per kudzu docs/nic.md", doc = "Physical address of the one-wire access register (nic_access_hub) for node 0." }
