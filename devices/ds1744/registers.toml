title = "Dallas DS1744 nonvolatile timekeeping SRAM (32 KiB, byte-wide, with clock)"
doc = "The 32 KiB battery-backed SRAM with a clock in its top eight bytes. The register contract here covers what the sources state: the clock bytes at the top of the address range and the remaining bytes as RAM. Grades say how each item was derived: established means the manufacturer specification as the source records it, inferred means arithmetic on an established fact. The clock byte order and bit meanings, the reset state and the RAM layout are not stated by the sources and are not listed."
from = "Analog Devices/Maxim DS1744 nonvolatile timekeeping SRAM datasheet, document 19-5502, revision 6/13"
public_from = ["Analog Devices/Maxim DS1744 nonvolatile timekeeping SRAM datasheet"]

