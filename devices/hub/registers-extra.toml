unit = "hub_extra"
prefix = "HUB"
title = "Hub block transfer engine registers and control bits outside the census"
from = "public Linux mainline SN0 Hub I/O register header under arch/mips/include/asm/sn/sn0, tag v6.12 (names, offsets and masks); Origin and Onyx2 Theory of Operations 007-3439-002 rev 002, page 50, for the poison status"
public_from = ["census:", "public Linux SN0 Hub I/O header"]

[c]
offset_macro = "bare"

# The census has no entry for these slots. Offsets and names come from the public
# header. The header states no access type, so the access is an assumption and the
# register is graded inferred as a whole.
# Where the IRIX register table states a register's access, the row is graded established and its from names the
# header and the table; the rows it does not list keep the Linux-header reading and stay inferred.

[registers.iio_ibna_0]
offset = 0x410020
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_IBNA_0; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_IBNA0 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7e60"
doc = "Notification address of engine 0, the twin of the engine 1 slot in the census. Offset and name are from the public header. The IRIX register table confirms the access."

[registers.iio_ibia_0]
offset = 0x410028
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_IBIA_0; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_IBIA0 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7e78"
doc = "Interrupt address of engine 0. Offset and name are from the public header. The IRIX register table confirms the access."

[registers.iio_ibia_0.fields]
level = { bits = [22, 16], grade = "established", doc = "Interrupt level: mask 0x7f shifted to bits 22:16 in the public header." }
node = { bits = [8, 0], grade = "established", doc = "Destination node number: mask 0x1ff in the public header." }

[registers.iio_ibia_1]
offset = 0x420028
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_IBIA1; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_IBIA1 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7f08"
doc = "Interrupt address of engine 1. Offset and name are from the public header. The IRIX register table confirms the access."

[registers.iio_ibia_1.fields]
level = { bits = [22, 16], grade = "established", doc = "Interrupt level: mask 0x7f shifted to bits 22:16 in the public header." }
node = { bits = [8, 0], grade = "established", doc = "Destination node number: mask 0x1ff in the public header." }

# Hub I/O registers the census did not reach. Offsets, names and field masks are from the public
# Linux SN0 Hub I/O header (pinned linux tree). The
# header states no access type or reset value, so each register is graded inferred as a whole.
[registers.iio_wid]
offset = 0x400000
access = "r"
width = 64
grade = "established"
reset = 0x1c101048
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_WID (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7800"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_WID; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_WID and hubii_wid_u"
doc = "Widget identification register of the Hub widget. Offset and field layout are from the public header. The header gives no access type and no reset value, so the The IRIX register table confirms the access."

[registers.iio_wid.fields]
rev = { bits = [31, 28], grade = "established", doc = "Revision number, bits 31:28, in the header's identification structure." }
part = { bits = [27, 12], grade = "established", doc = "Widget part number, bits 27:12, in the header's identification structure. The header comment gives the Hub's value, IIO_WID_PART_HUB." }
mfg = { bits = [11, 1], grade = "established", doc = "Manufacturer number, bits 11:1, in the header's identification structure. The header comment names a manufacturer; the name is not imported here, and the value is unknown." }

[registers.iio_ilapr]
offset = 0x400100
access = "rw"
width = 64
grade = "established"
reset = 0xffffffffffffffff
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_ILAPR (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd78a8"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_ILAPR; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_ILAPR"
doc = "Local access protection register, named and placed by the public header. The header gives no fields, access type or reset. The IRIX register table confirms the access."

[registers.iio_ilapo]
offset = 0x400108
access = "w"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_ILAPO; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_ILAPO"
doc = "Protection override register, named and placed by the public header. The header gives no unlock value or behaviour, so none is imported. The IRIX register table confirms the access."

# Big-window translation entries. The header numbers them 0 to 6 and says the hardware manuals
# number them 1 to 7. Eight bytes apart. The census has an inferred name at the first offset and a
# write-only entry at the seventh; both are left as the census states them.
[registers.iio_itte]
offset = 0x400160
count = 7
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, registers II_ITTE1 to II_ITTE7 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7a40"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubpi.h, II_ITTE2; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_NUM_ITTES, IIO_ITTE_BASE, IIO_ITTE"
doc = "Big-window translation entry n, for n from 0 to 6. Entry 0 is at the register offset and each later entry is eight bytes further on. The IRIX register table confirms the access."

[registers.iio_itte.fields]
slice = { bits = [4, 0], grade = "established", doc = "Slice field, bits 4:0 (IIO_ITTE_OFFSET_MASK in the public header)." }
widget = { bits = [11, 8], grade = "established", doc = "Target widget number, bits 11:8 (IIO_ITTE_WIDGET_MASK, shift 8)." }
iospace = { bits = [12, 12], grade = "established", doc = "I/O space bit, bit 12 (IIO_ITTE_IOSP). Set selects the widget's I/O space, clear its memory space." }

# Registers named by the public header that the census does not reach. The header states no access type,
# so every access here is an assumption and each register is graded inferred. No reset value is stated.
[registers.iio_igfx_1]
offset = 0x400148
access = "rw"
width = 64
grade = "inferred"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_IGFX_1; public Linux SN0 Hub I/O header, pinned linux tree: IIO_IGFX_1 (offset and name)"
doc = "Graphics node and widget register 1, the twin of iio_igfx_0 in the census. The header gives both the same field layout: widget number in bits 3:0, node number in bits 12:4, processor number at bit 16 and a valid bit at bit 20. The header gives no access type, so rw is assumed."

[registers.iio_igfx_1.fields]
widget = { bits = [3, 0], grade = "established", doc = "Widget number: four bits at shift 0 in the header." }
node = { bits = [12, 4], grade = "established", doc = "Node number: nine bits at shift 4 in the header." }
processor = { bits = [16, 16], grade = "established", doc = "Processor number: one bit at shift 16 in the header." }
valid = { bits = [20, 20], grade = "established", doc = "Valid: one bit at shift 20 in the header." }

[registers.iio_scratch_reg0]
offset = 0x400150
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_SCRATCH_REG0 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7a10"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_SCRATCH_REG0; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header, pinned linux tree: IIO_SCRATCH_REG0 (offset and name)"
doc = "Scratch register 0. The header names its bit uses for software only and gives a mask of the bits that exist, 0x0000000f00f11fff. The IRIX register table confirms the access. Only the bits in the header's IIO_SCRATCH_MASK, 0x0000000f00f11fff, exist; the rsvd mask is its complement. Established as the header's statement that not all bits are available; whether the missing bits read zero is not stated."
rsvd = 0xfffffff0ff0ee000

[registers.iio_scratch_reg1]
offset = 0x400158
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_SCRATCH_REG1 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7a28"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_SCRATCH_REG1; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header, pinned linux tree: IIO_SCRATCH_REG1 (offset and name)"
doc = "Scratch register 1, the twin of register 0. The IRIX register table confirms the access. Only the bits in the header's IIO_SCRATCH_MASK, 0x0000000f00f11fff, exist; the rsvd mask is its complement. Established as the header's statement that not all bits are available; whether the missing bits read zero is not stated."
rsvd = 0xfffffff0ff0ee000

# ---- II: I/O interface (widget, protection, error, CRB and PRB registers)
[registers.iio_wstat]
offset = 0x400008
access = "r"
width = 64
grade = "established"
from = "census: 1 sites, 1 routines (r); census: 1 sites, 1 routines (r, indexed)"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_WSTAT (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7830"
doc = "The rsvd mask is the members the header's structure names reserved (rsvd1 to rsvd4); the header gives no read or write behaviour for them, so the mask is the header's naming, graded established as a header fact only."
rsvd = 0xfffffffeff00fd80

[registers.iio_wstat.fields]
crazy = { bits = [32, 32], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Hub gone crazy, bit 32 (IIO_WSTAT_ECRAZY and the structure's crazy member)." }
llp_tx_cnt = { bits = [23, 16], grade = "inferred", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Link transmit retry counter. The structure gives eight bits at 23:16; the same header's IIO_WSTAT_TXRETRY_MASK gives seven." }
tx_max_rtry = { bits = [9, 9], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Link retry timeout signal, bit 9 (IIO_WSTAT_TXRETRY and the structure's tx_max_rtry member)." }
xt_tail_to = { bits = [6, 6], grade = "inferred", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Crosstalk tail timeout. Position from the structure's member order, counted down from the top; the structure holds 63 bits, so this assumes the spare bit is bit 0." }
xt_crd_to = { bits = [5, 5], grade = "inferred", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Crosstalk credit timeout. Position as for xt_tail_to." }
pending = { bits = [4, 1], grade = "inferred", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Pending requests, four bits. Position as for xt_tail_to; the structure may instead place them at 3:0." }

[registers.iio_wcr]
offset = 0x400020
access = "r"
width = 64
grade = "established"
from = "census: 2 sites, 2 routines"
reset = 0x4001
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_WCR (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7860"
doc = "The rsvd mask is the structure's rsvd and rsvd1 members; header naming only."
rsvd = 0xffffffffff801fe0

[registers.iio_wcr.fields]
e_thresh = { bits = [22, 18], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Elasticity threshold, five bits." }
dir_con = { bits = [17, 17], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Widget direct connect (IIO_WCR_DIR_CON)." }
f_bad_pkt = { bits = [16, 16], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Force bad link packet enable." }
xbar_crd = { bits = [15, 13], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Link crossbar credit, three bits." }
tag_mode = { bits = [4, 4], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Tag mode." }
widget_id = { bits = [3, 0], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "The Hub's own widget number, four bits (read with a 0xf mask in the header)." }

[registers.iio_iowa]
offset = 0x400110
access = "rw"
width = 64
grade = "established"
from = "census: 6 sites, 3 routines"
reset = 0x0
reset_grade = "established"
