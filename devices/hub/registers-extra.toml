unit = "hub_extra"
prefix = "HUB"
title = "Hub block transfer engine registers and control bits outside the census"
from = "public Linux mainline SN0 Hub I/O register header under arch/mips/include/asm/sn/sn0, tag v6.12 (names, offsets and masks); Origin and Onyx2 Theory of Operations 007-3439-002 rev 002, page 50, for the poison status"
public_from = ["census:", "public Linux SN0 Hub I/O header"]

[c]
offset_macro = "bare"

# The census has no entry for these slots. Offsets and names come from the public
# header. The header states no access type, so the access is an assumption and the
# register is graded inferred as a whole.
# Where the IRIX register table states a register's access, the row is graded established and its from names the
# header and the table; the rows it does not list keep the Linux-header reading and stay inferred.

[registers.iio_ibna_0]
offset = 0x410020
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_IBNA_0; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_IBNA0 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7e60"
doc = "Notification address of engine 0, the twin of the engine 1 slot in the census. Offset and name are from the public header. The IRIX register table confirms the access."

[registers.iio_ibia_0]
offset = 0x410028
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_IBIA_0; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_IBIA0 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7e78"
doc = "Interrupt address of engine 0. Offset and name are from the public header. The IRIX register table confirms the access."

[registers.iio_ibia_0.fields]
level = { bits = [22, 16], grade = "established", doc = "Interrupt level: mask 0x7f shifted to bits 22:16 in the public header." }
node = { bits = [8, 0], grade = "established", doc = "Destination node number: mask 0x1ff in the public header." }

[registers.iio_ibia_1]
offset = 0x420028
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_IBIA1; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_IBIA1 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7f08"
doc = "Interrupt address of engine 1. Offset and name are from the public header. The IRIX register table confirms the access."

[registers.iio_ibia_1.fields]
level = { bits = [22, 16], grade = "established", doc = "Interrupt level: mask 0x7f shifted to bits 22:16 in the public header." }
node = { bits = [8, 0], grade = "established", doc = "Destination node number: mask 0x1ff in the public header." }

# Hub I/O registers the census did not reach. Offsets, names and field masks are from the public
# Linux SN0 Hub I/O header (pinned linux tree). The
# header states no access type or reset value, so each register is graded inferred as a whole.
[registers.iio_wid]
offset = 0x400000
access = "r"
width = 64
grade = "established"
reset = 0x1c101048
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_WID (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7800"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_WID; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_WID and hubii_wid_u"
doc = "Widget identification register of the Hub widget. Offset and field layout are from the public header. The header gives no access type and no reset value, so the The IRIX register table confirms the access."

[registers.iio_wid.fields]
rev = { bits = [31, 28], grade = "established", doc = "Revision number, bits 31:28, in the header's identification structure." }
part = { bits = [27, 12], grade = "established", doc = "Widget part number, bits 27:12, in the header's identification structure. The header comment gives the Hub's value, IIO_WID_PART_HUB." }
mfg = { bits = [11, 1], grade = "established", doc = "Manufacturer number, bits 11:1, in the header's identification structure. The header comment names a manufacturer; the name is not imported here, and the value is unknown." }

[registers.iio_ilapr]
offset = 0x400100
access = "rw"
width = 64
grade = "established"
reset = 0xffffffffffffffff
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_ILAPR (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd78a8"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_ILAPR; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_ILAPR"
doc = "Local access protection register, named and placed by the public header. The header gives no fields, access type or reset. The IRIX register table confirms the access."

[registers.iio_ilapo]
offset = 0x400108
access = "w"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_ILAPO; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_ILAPO"
doc = "Protection override register, named and placed by the public header. The header gives no unlock value or behaviour, so none is imported. The IRIX register table confirms the access."

# Big-window translation entries. The header numbers them 0 to 6 and says the hardware manuals
# number them 1 to 7. Eight bytes apart. The census has an inferred name at the first offset and a
# write-only entry at the seventh; both are left as the census states them.
[registers.iio_itte]
offset = 0x400160
count = 7
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, registers II_ITTE1 to II_ITTE7 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7a40"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubpi.h, II_ITTE2; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header (pinned linux tree): IIO_NUM_ITTES, IIO_ITTE_BASE, IIO_ITTE"
doc = "Big-window translation entry n, for n from 0 to 6. Entry 0 is at the register offset and each later entry is eight bytes further on. The IRIX register table confirms the access."

[registers.iio_itte.fields]
slice = { bits = [4, 0], grade = "established", doc = "Slice field, bits 4:0 (IIO_ITTE_OFFSET_MASK in the public header)." }
widget = { bits = [11, 8], grade = "established", doc = "Target widget number, bits 11:8 (IIO_ITTE_WIDGET_MASK, shift 8)." }
iospace = { bits = [12, 12], grade = "established", doc = "I/O space bit, bit 12 (IIO_ITTE_IOSP). Set selects the widget's I/O space, clear its memory space." }

# Registers named by the public header that the census does not reach. The header states no access type,
# so every access here is an assumption and each register is graded inferred. No reset value is stated.
[registers.iio_igfx_1]
offset = 0x400148
access = "rw"
width = 64
grade = "inferred"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_IGFX_1; public Linux SN0 Hub I/O header, pinned linux tree: IIO_IGFX_1 (offset and name)"
doc = "Graphics node and widget register 1, the twin of iio_igfx_0 in the census. The header gives both the same field layout: widget number in bits 3:0, node number in bits 12:4, processor number at bit 16 and a valid bit at bit 20. The header gives no access type, so rw is assumed."

[registers.iio_igfx_1.fields]
widget = { bits = [3, 0], grade = "established", doc = "Widget number: four bits at shift 0 in the header." }
node = { bits = [12, 4], grade = "established", doc = "Node number: nine bits at shift 4 in the header." }
processor = { bits = [16, 16], grade = "established", doc = "Processor number: one bit at shift 16 in the header." }
valid = { bits = [20, 20], grade = "established", doc = "Valid: one bit at shift 20 in the header." }

[registers.iio_scratch_reg0]
offset = 0x400150
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_SCRATCH_REG0 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7a10"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, II_SCRATCH_REG0; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header, pinned linux tree: IIO_SCRATCH_REG0 (offset and name)"
doc = "Scratch register 0. The header names its bit uses for software only and gives a mask of the bits that exist, 0x0000000f00f11fff. The IRIX register table confirms the access."

[registers.iio_scratch_reg1]
offset = 0x400158
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register II_SCRATCH_REG1 (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7a28"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IIO_SCRATCH_REG1; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access; public Linux SN0 Hub I/O header, pinned linux tree: IIO_SCRATCH_REG1 (offset and name)"
doc = "Scratch register 1, the twin of register 0. The IRIX register table confirms the access."

[registers.iio_icrb_a]
offset = 0x400400
access = "rw"
width = 64
count = 15
stride = 0x20
grade = "inferred"
from = "public Linux SN0 Hub I/O header, pinned linux tree: IIO_ICRB_A(x) macro, 15 entries (IIO_NUM_CRBS) four words apart"
doc = "Word A of the I/O interface's CRB entries. Entry x (0 to 14) is at this offset plus 0x20 times x; the census names entry 0 and a few siblings individually. The header gives no access type, so the access is carried over from the census row of entry 0 (read-write) and is inferred."

[registers.iio_icrb_b]
offset = 0x400408
access = "rw"
width = 64
count = 15
stride = 0x20
grade = "inferred"
from = "public Linux SN0 Hub I/O header, pinned linux tree: IIO_ICRB_B(x) macro, 15 entries (IIO_NUM_CRBS) four words apart"
doc = "Word B of the I/O interface's CRB entries. Entry x (0 to 14) is at this offset plus 0x20 times x; the census names entry 0 and a few siblings individually. The header gives no access type, so the access is carried over from the census row of entry 0 (read-write) and is inferred."

[registers.iio_icrb_c]
offset = 0x400410
access = "r"
width = 64
count = 15
stride = 0x20
grade = "inferred"
from = "public Linux SN0 Hub I/O header, pinned linux tree: IIO_ICRB_C(x) macro, 15 entries (IIO_NUM_CRBS) four words apart"
doc = "Word C of the I/O interface's CRB entries. Entry x (0 to 14) is at this offset plus 0x20 times x; the census names entry 0 and a few siblings individually. The header gives no access type, so read-only is carried over from the census row of entry 0 and is inferred."

[registers.iio_icrb_d]
offset = 0x400418
access = "r"
width = 64
count = 15
stride = 0x20
grade = "inferred"
from = "public Linux SN0 Hub I/O header, pinned linux tree: IIO_ICRB_D(x) macro, 15 entries (IIO_NUM_CRBS) four words apart"
doc = "Word D of the I/O interface's CRB entries. Entry x (0 to 14) is at this offset plus 0x20 times x; the census names entry 0 and a few siblings individually. The header gives no access type, so read-only is carried over from the census row of entry 0 and is inferred."

[constants]
# Control/terminate bits. The census carries the notify value (0x10) only as an inferred
# constant. The names and the zero-fill and poison bits are from the public header.
IIO_IBCT_ZFIL_MODE = { value = 0x1, grade = "established", doc = "Zero-fill mode bit of the control/terminate register, named ZFIL_MODE in the public header. The header gives no behaviour for it." }
IIO_IBCT_NOTIFY = { value = 0x10, grade = "established", doc = "Notify bit of the control/terminate register, named NOTIFY in the public header. The census has the same value as an inferred constant." }
IIO_IBCT_POISON = { value = 0x100, grade = "established", doc = "Poison bit of the control/terminate register, named POISON in the public header. The Theory of Operations calls directory poisoning a proposed feature, so its effect on shipped hardware is unknown." }
# Length/status busy bit. The census carries the same value as an inferred constant.
IIO_IBLS_BUSY = { value = 0x100000, grade = "established", doc = "Busy bit of the length/status register, named IBLS_BUSY in the public header." }
# I/O error clear bits for the two engines. The public header marks both meanings with a question mark.
IIO_IECLR_BTE0 = { value = 0x20000, grade = "inferred", from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IECLR_BTE0", doc = "Clears engine 0's latched error, per the public header's name. The header's comment on the bit is marked uncertain, so the meaning is inferred. The IRIX header defines the same bit and marks its comment with question marks, so the meaning stays inferred." }
IIO_IECLR_BTE1 = { value = 0x40000, grade = "inferred", from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, IECLR_BTE1", doc = "Clears engine 1's latched error, per the public header's name. The header's comment on the bit is marked uncertain, so the meaning is inferred. The IRIX header defines the same bit and marks its comment with question marks, so the meaning stays inferred." }
# Hub I/O field masks. Values are the header's masks, shifted into place.
IIO_WID_PART_HUB = { value = 0xc101, grade = "established", doc = "Widget part number the public header's comment assigns to the Hub (hub=c101)." }
IIO_WSTAT_ECRAZY = { value = 0x100000000, grade = "established", doc = "Crazy bit of the widget status register, bit 32, named ECRAZY in the public header ('Hub gone crazy'). The header gives no behaviour for it." }
IIO_WSTAT_TXRETRY = { value = 0x200, grade = "established", doc = "Transmit retry timeout bit of the widget status register, bit 9, from the public header's mask." }
IIO_WSTAT_TXRETRY_MASK = { value = 0x7f0000, grade = "established", doc = "Transmit retry counter, bits 22:16: mask 0x7f at shift 16 in the public header. The same header's bit-field structure gives eight bits at 23:16, so the width is disputed inside the header and not settled here." }
IIO_WCR_WIDGET_ID_MASK = { value = 0xf, grade = "established", doc = "The Hub's own widget number, bits 3:0 of the widget control register. The public header reads the number with this mask. The reset value is not imported." }
IIO_WCR_DIR_CON = { value = 0x20000, grade = "established", doc = "Widget direct-connect bit, bit 17 of the widget control register, named in the public header's structure." }
IIO_LLP_CSR_IS_UP = { value = 0x2000, grade = "established", doc = "Link-up bit, bit 13 of the link control and status register, named IS_UP in the public header. The header names the bit only; what the other values of the status field mean is not imported." }
IIO_LLP_CSR_LLP_STAT_MASK = { value = 0x3000, grade = "established", doc = "Two-bit link status field, bits 13:12, named LLP_STAT_MASK in the public header." }
LNK_STAT_WORKING = { value = 0x2, grade = "established", from = "irix-657m-src irix/kern/sys/SN/SN0/hubio.h, LNK_STAT_WORKING", doc = "Value of the link status field the public header names WORKING. The name is the driver's expectation. The header names no other value of the field. The IRIX header defines the name with this value." }
IIO_ILCSR_WARM_RESET = { value = 0x100, grade = "established", doc = "Warm reset bit of the link control register, bit 8, named ILCSR_WARM_RESET in the public header. The census carries the same value as an inferred constant. The header gives no behaviour for it." }
IIO_ILCSR_LLP_EN = { value = 0x400, grade = "established", doc = "Link enable bit, bit 10 of the link control register, named llp_en in the public header's structure." }
IIO_ILCSR_BM8 = { value = 0x800, grade = "established", doc = "Eight-bit mode bit, bit 11 of the link control register, named bm8 in the public header's structure." }
IIO_ILCSR_MAX_BURST_MASK = { value = 0x3ff00000000, grade = "established", doc = "Maximum burst field, bits 41:32 of the link control register, from the public header's structure." }
IIO_ILCSR_MAX_RETRY_MASK = { value = 0x3ff0000, grade = "established", doc = "Maximum retry field, bits 25:16 of the link control register, from the public header's structure." }
IIO_ILCSR_NULL_TO_MASK = { value = 0x3f, grade = "established", doc = "Null timeout field, bits 5:0 of the link control register, from the public header's structure." }
IIO_ILLR_CB_CNT_MASK = { value = 0xffff0000, grade = "established", doc = "Check-bit error count, bits 31:16 of the link log register, from the public header's structure." }
IIO_ILLR_SN_CNT_MASK = { value = 0xffff, grade = "established", doc = "Sequence-number error count, bits 15:0 of the link log register, from the public header's structure." }
IIO_IIDSR_SENT = { value = 0x10000000, grade = "established", doc = "Interrupt-sent bit, bit 28 of the interrupt destination register, from the public header's mask." }
IIO_IIDSR_ENB = { value = 0x1000000, grade = "established", doc = "Interrupt enable bit, bit 24 of the interrupt destination register, from the public header's mask." }
IIO_IIDSR_NODE_MASK = { value = 0xff00, grade = "established", doc = "Destination node field, bits 15:8, from the public header's mask. The reviewed tree has no bit-field structure for this register, so only the masks are imported." }
IIO_IIDSR_LVL_MASK = { value = 0x3f, grade = "established", doc = "Interrupt number field, bits 5:0 of the interrupt destination register, from the public header's mask." }
IIO_ITTE_BASE = { value = 0x400160, grade = "established", doc = "Offset of big-window translation entry 0, from the public header. Entry n sits at this value plus 8 times n. The census has entry 0 under an inferred name and entry 6 as a write-only register, which overlaps the header's entry 6." }
IIO_ITTE_IOSP = { value = 0x1000, grade = "established", doc = "I/O space bit of a translation entry, bit 12, from the public header." }
IIO_ITTE_INVALID_WIDGET = { value = 0x3, grade = "established", doc = "Widget value the public header's disable routine writes to park a translation entry." }
