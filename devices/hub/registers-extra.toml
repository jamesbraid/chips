bm8 = { bits = [11, 11], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Eight-bit mode." }
llp_en = { bits = [10, 10], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Link enable." }
wrm_reset = { bits = [8, 8], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Warm reset bit (ILCSR_WARM_RESET 0x100)." }
data_ready_offset = { bits = [7, 6], grade = "inferred", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Data ready offset, two bits. The structure names the member reserved and gives the offset only in its comment." }
null_to = { bits = [5, 0], grade = "established", from = "public Linux SN0 Hub I/O header: field layout and masks", doc = "Null timeout, six bits." }

[registers.iio_illr]
