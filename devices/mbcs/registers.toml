[constants]
PART_NUM = { value = 0xfff0, grade = "established", from = "SGI Linux platform code, drivers/char/mbcs.h (MBCS_PART_NUM)", doc = "Part number the Core Services driver binds to, with manufacturer 1." }
PART_NUM_ALG0 = { value = 0xf001, grade = "established", from = "SGI Linux platform code, drivers/char/mbcs.h (MBCS_PART_NUM_ALG0)", doc = "Second part number the driver binds to, with manufacturer 1. The header names it ALG0; what distinguishes it from the first is unknown." }
MFG_NUM = { value = 0x1, grade = "established", from = "SGI Linux platform code, drivers/char/mbcs.h (MBCS_MFG_NUM)", doc = "Manufacturer number of both ids." }
GSCR_START = { value = 0x0, grade = "established", doc = "Start of the first region of the window, which holds the registers above. The driver maps one page of it to user space, uncached. The name is not expanded in the source." }
DEBUG_START = { value = 0x100000, grade = "established", doc = "Start of the debug register region. By the driver's own comment the first debug register holds the algorithm number and revision; the algorithm sysfs file prints its high then low 32 bits." }
RAM0_START = { value = 0x200000, grade = "established", doc = "Start of local RAM 0 in the window." }
RAM1_START = { value = 0x400000, grade = "established", doc = "Start of local RAM 1 in the window." }
