unit = "mbcs"
prefix = "MBCS"
title = "RASC Core Services (MBCS): the register block a Core Services FPGA bitstream presents on the TIO FPGA port, as SGI's Linux driver defines it"
doc = "Offsets, widths and field positions are the definitions of SGI's Linux FPGA Core Services driver header (v5.3). They describe the Core Services block that SGI's RASC bitstreams contain; other bitstreams on the same port need not have it. The header gives no reset value and no access direction: access is what the driver does (r read, w written, rw read-modify-write or an unused placeholder), reset is unknown throughout. Offsets are from the base of the FPGA port's 256 MiB small window."
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e: drivers/char/mbcs.h, drivers/char/mbcs.c"
public_from = ["census:"]

[c]
offset_macro = "bare"

[registers.id]
offset = 0x0
access = "r"
width = 64
grade = "established"
doc = "Identification word of the core. Its low bits are the same widget identification layout the TIO driver reads at offset 0 of the port's window: bit 0 is one, manufacturer in 11:1, part number in 27:12. The core adds an 8-bit bitstream revision in 35:28. The MBCS driver never reads this register; the layout is the header's."

[registers.id.fields]
always_one = { bits = [0, 0], grade = "established" }
mfg_id = { bits = [11, 1], grade = "established" }
part_num = { bits = [27, 12], grade = "established" }
bitstream_rev = { bits = [35, 28], grade = "established" }


[registers.status]
offset = 0x8
access = "r"
width = 64
grade = "established"
doc = "Core status. The driver's one interrupt handler reads it and tests the read-DMA-done, write-DMA-done and algorithm-done bits; it reads nothing else."

[registers.status.fields]
pending_reads = { bits = [7, 0], grade = "established" }
pending_writes = { bits = [15, 8], grade = "established" }
ice_rsp_credits = { bits = [23, 16], grade = "established" }
ice_req_credits = { bits = [31, 24], grade = "established" }
cm_req_credits = { bits = [39, 32], grade = "established" }
rd_dma_in_progress = { bits = [41, 41], grade = "established" }
rd_dma_done = { bits = [42, 42], grade = "established" }
wr_dma_in_progress = { bits = [44, 44], grade = "established" }
wr_dma_done = { bits = [45, 45], grade = "established" }
alg_waiting = { bits = [46, 46], grade = "established" }
alg_pipe_running = { bits = [47, 47], grade = "established" }
alg_done = { bits = [48, 48], grade = "established" }
pending_int_reqs = { bits = [59, 52], grade = "established" }
alg_half_speed_sel = { bits = [63, 63], grade = "established" }


