from = "Intel 82371AB datasheet 290562-001 (April 1997) p.93-94"
doc = "IDE timing: 0x40 primary channel, 0x42 secondary. The PROM's IDE attach writes the dword 0xc077c077 (both channels: decode enabled, slave timing register enabled, fast timing with prefetch and IORDY sampling on both drives, ISP 5 clocks, RTC 4 clocks) and, on board type 1 (the 540, which has one IDE channel), writes the byte 0x40 to 0x43, which leaves only the slave timing enable set for the secondary channel and its decode disabled."

[registers.f1_idetim.fields]
