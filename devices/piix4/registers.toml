[registers.f0_pcicmd]
space = "piix4_f0"
offset = 0x4
access = "rw"
width = 16
reset = 0x7
reset_from = "Intel 82371AB datasheet 290562-001 (April 1997) p.54"
ro = 0xfef7
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.54"
doc = "PCI command. The firmware writes 0x0f once. Bits 2 to 0 are hardwired to 1 and the bits the datasheet marks not implemented read 0, so the write leaves special cycle enable (bit 3) and SERR enable unchanged except bit 3 set; the special cycle enable is what lets the chip see the shutdown special cycle that Linux sends before powering off. The read-only mask lists the hardwired and reserved bits; only the fields shown are writable."

[registers.f0_pcicmd.fields]
io_space = { bits = [0, 0], grade = "established", doc = "Hardwired 1: the function always answers I/O cycles." }
memory = { bits = [1, 1], grade = "established", doc = "Hardwired 1." }
bus_master = { bits = [2, 2], grade = "established", doc = "Hardwired 1." }
sce = { bits = [3, 3], grade = "established", doc = "Special cycle enable: 1 makes the chip recognise PCI shutdown special cycles and assert INIT." }
serre = { bits = [8, 8], grade = "established", doc = "SERR# enable." }

[[registers.f0_pcicmd.tests]]
value = 0xf
expect = { io_space = 1, memory = 1, bus_master = 1, sce = 1, serre = 0 }

