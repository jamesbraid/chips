[registers.rc]
space = "piix4_isa"
offset = 0xcf9
access = "rw"
width = 8
reset = 0x0
reset_from = "Intel 82371AB datasheet 290562-001 (April 1997) p.88"
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.88"
doc = "Reset control. Linux restarts the board by writing 0x06 (reset CPU with system reset set); the HAL does the same on all but the earliest boards. Bit 2 going 0 to 1 starts the reset; bit 1 chooses a hard reset (1) or a soft INIT-only reset (0)."

[registers.rc.fields]
srst = { bits = [1, 1], grade = "established", doc = "1 hard reset, 0 soft reset (INIT)." }
rcpu = { bits = [2, 2], grade = "established", doc = "Reset CPU on a 0 to 1 transition; cannot be read as 1." }

[[registers.rc.tests]]
value = 0x6
expect = { srst = 1, rcpu = 1 }

