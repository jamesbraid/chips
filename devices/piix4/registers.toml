offset = 0x71
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.85"
doc = "RTC data, lower 128-byte bank."

[registers.rtcei]
space = "piix4_isa"
offset = 0x72
access = "w"
width = 8
reset = "unknown"
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.85"
doc = "RTC extended index: bits 6:0 address the upper bank (the datasheet lists it write only in its register page and read/write in Table 5). Bit 7 is the aliased NMI enable according to specification update spec change 2 (p.13); the datasheet calls it reserved. The upper bank is reached only with RTCCFG bit 2 set."

[registers.rtcei.fields]
addr = { bits = [6, 0], grade = "established", doc = "Upper bank address." }
nmi_dis = { bits = [7, 7], grade = "established", doc = "Aliased NMI enable, mirrors rtci bit 7 (specification update)." }

