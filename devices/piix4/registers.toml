sitre = { bits = [14, 14], grade = "established", doc = "Slave IDE timing register (SIDETIM) enable." }
isp = { bits = [13, 12], grade = "established", doc = "IORDY sample point: 00 5 clocks, 01 4, 10 3, 11 2." }
rtc = { bits = [9, 8], grade = "established", doc = "Recovery time: 00 4 clocks, 01 3, 10 2, 11 1." }
dte1 = { bits = [7, 7], grade = "established", doc = "DMA timing enable only, drive 1." }
ppe1 = { bits = [6, 6], grade = "established", doc = "Prefetch and posting enable, drive 1." }
ie1 = { bits = [5, 5], grade = "established", doc = "IORDY sample enable, drive 1." }
time1 = { bits = [4, 4], grade = "established", doc = "Fast timing bank, drive 1." }
dte0 = { bits = [3, 3], grade = "established", doc = "DMA timing enable only, drive 0." }
ppe0 = { bits = [2, 2], grade = "established", doc = "Prefetch and posting enable, drive 0." }
ie0 = { bits = [1, 1], grade = "established", doc = "IORDY sample enable, drive 0." }
time0 = { bits = [0, 0], grade = "established", doc = "Fast timing bank, drive 0." }

