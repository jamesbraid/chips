[registers.f0_xbcs]
space = "piix4_f0"
offset = 0x4e
access = "rw"
width = 16
reset = 0x3
reset_from = "Intel 82371AB datasheet 290562-001 (April 1997) p.57"
rsvd = 0xf800
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.57-58"
doc = "X-bus chip select. The PROM writes the byte 0xf4: that sets the extended BIOS, lower BIOS, BIOSCS# write enable, coprocessor error and mouse functions and clears bits 1 and 0, the external keyboard and RTC chip selects (a software expectation). Clearing them while the Super I/O keyboard controller decodes its own ports is consistent with the board using the Super I/O's keyboard controller (inferred). Bit 9 and bit 7 forward the flash regions 0xfff00000 to 0xfff7ffff and 0xfff80000 to 0xfffdffff to the BIOS chip select; the top 64 KiB is always decoded. Which chip select the flash sits on is not stated by any source."

[registers.f0_xbcs.fields]
rtccs_en = { bits = [0, 0], grade = "established", doc = "RTCCS#/RTCALE and XOE# for ports 0x70 to 0x77." }
kbccs_en = { bits = [1, 1], grade = "established", doc = "KBCCS# and XOE# for ports 0x60 and 0x64." }
bioscs_wp = { bits = [2, 2], grade = "established", doc = "1 asserts BIOSCS# for writes as well as reads in the decoded BIOS regions." }
port61_alias = { bits = [3, 3], grade = "established", doc = "Alias ports 0x63, 0x65 and 0x67 to 0x61." }
mouse = { bits = [4, 4], grade = "established", doc = "IRQ12/M mouse function." }
coproc_err = { bits = [5, 5], grade = "established", doc = "Coprocessor error function (FERR# raises internal IRQ13)." }
lower_bios = { bits = [6, 6], grade = "established", doc = "Lower BIOS enable: 0xe0000 to 0xeffff and 0xfffe0000 to 0xfffeffff." }
ext_bios = { bits = [7, 7], grade = "established", doc = "Extended BIOS enable: 0xfff80000 to 0xfffdffff." }
apic_cs = { bits = [8, 8], grade = "established", doc = "APIC chip select; also selects GPI5, GPO12 to GPO14 and GPO29 versus the APIC functions." }
bios_1meg = { bits = [9, 9], grade = "established", doc = "1-Meg extended BIOS enable: 0xfff00000 to 0xfff7ffff." }
mc_loc = { bits = [10, 10], grade = "established", doc = "Microcontroller address location enable (ports 0x62 and 0x66)." }

[[registers.f0_xbcs.tests]]
value = 0xf4
expect = { rtccs_en = 0, kbccs_en = 0, bioscs_wp = 1, port61_alias = 0, mouse = 1, coproc_err = 1, lower_bios = 1, ext_bios = 1, apic_cs = 0, bios_1meg = 0, mc_loc = 0 }

