ch3 = { bits = [7, 6], grade = "established", doc = "Channel 3 type.", enums = { normal_isa = { value = 0, grade = "established" }, pc_pci = { value = 1, grade = "established" }, distributed = { value = 2, grade = "established" } } }
ch5 = { bits = [11, 10], grade = "established", doc = "Channel 5 type.", enums = { normal_isa = { value = 0, grade = "established" }, pc_pci = { value = 1, grade = "established" }, distributed = { value = 2, grade = "established" } } }
