[registers.rtci]
space = "piix4_isa"
offset = 0x70
access = "w"
width = 8
reset = "unknown"
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.84-85"
doc = "RTC index and NMI enable, shared. Bits 6:0 index the lower RTC bank and are undefined at reset (the datasheet gives only 'Bit[6:0]=undefined; Bit 7=1', p.84); bit 7 set disables NMI. Write only. The PROM and the HAL reach the clock through ports 0x70 and 0x71."

[registers.rtci.fields]
addr = { bits = [6, 0], grade = "established", doc = "RTC address." }
nmi_dis = { bits = [7, 7], grade = "established", doc = "1 disables NMI generation." }

