[registers.f0_rtccfg]
space = "piix4_f0"
offset = 0xcb
access = "rw"
width = 8
reset = 0x21
reset_from = "Intel 82371AB datasheet 290562-001 (April 1997) p.67"
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.67-68"
doc = "Real-time clock configuration. The PROM writes 0x25 (positive decode, upper bank enable, RTC enable). The HAL sets bit 2 by read-modify-write before using the extended clock RAM at ports 0x72 and 0x73. The PROM's self-test clears and sets bit 0 around its clock RAM probe. The lock bits are write-once until a hardware reset. With bit 2 clear the datasheet says the access is forwarded to ISA (RTCCFG text) and also lists ports 0x72 to 0x77 as aliases of the index and data ports (Table 5); the two statements conflict."

[registers.f0_rtccfg.fields]
rtc_en = { bits = [0, 0], grade = "established", doc = "1 sends ports 0x70 and 0x71 to the lower 128-byte bank; 0 forwards them to ISA." }
upper_en = { bits = [2, 2], grade = "established", doc = "1 sends ports 0x72 and 0x73 to the upper 128-byte bank; 0 forwards as bit 5 decides." }
lock_lower = { bits = [3, 3], grade = "established", doc = "Locks bytes 0x38 to 0x3f of the lower bank until a hardware reset." }
lock_upper = { bits = [4, 4], grade = "established", doc = "Locks bytes 0x38 to 0x3f of the upper bank until a hardware reset." }
pos_decode = { bits = [5, 5], grade = "established", doc = "1 positive decode of ports 0x70 to 0x73 (default), 0 subtractive." }

[[registers.f0_rtccfg.tests]]
value = 0x25
expect = { rtc_en = 1, upper_en = 1, lock_lower = 0, lock_upper = 0, pos_decode = 1 }

