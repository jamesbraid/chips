IDETIM_PROM_VALUE = { value = 0xc077c077, grade = "established", from = "PROM 1.1005 boot block, read in Ghidra: software/visws/boot-path.md", doc = "Dword the PROM's IDE attach writes to function 1 offset 0x40 (both IDETIM registers)." }
