[registers.f0_pdmacfg]
space = "piix4_f0"
offset = 0x90
access = "rw"
width = 16
reset = 0x0
reset_from = "Intel 82371AB datasheet 290562-001 (April 1997) p.63"
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.63-64"
doc = "PCI DMA configuration: the DMA type of each channel. Channel 4 is the cascade and has no field. The PROM bit-walks the byte at 0x90 and the one at 0x95 (high byte of the channel 5 to 7 pointer) in its function 0 register test, and the walked bytes hold every pattern on the real board."

