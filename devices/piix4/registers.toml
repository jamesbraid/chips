grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.148-149"
doc = "SMBus host status: failed, bus collision, device error, interrupt (all write 1 to clear) and host busy. The PROM clears it by writing before its one transaction."

[registers.smbhststs.fields]
host_busy = { bits = [0, 0], grade = "established", doc = "Host busy, read only." }
inter = { bits = [1, 1], grade = "established", doc = "Command completed." }
dev_err = { bits = [2, 2], grade = "established", doc = "Device error." }
bus_err = { bits = [3, 3], grade = "established", doc = "Bus collision." }
failed = { bits = [4, 4], grade = "established", doc = "Transaction killed." }

