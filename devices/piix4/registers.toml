unit = "piix4"
prefix = "PIIX4"
title = "Intel 82371AB PIIX4 (PCI-to-ISA bridge, IDE, USB, power management and SMBus) as wired in the Visual Workstation 320 and 540"
doc = "Register contract of the PIIX4 southbridge, functions 0 to 3, from the published datasheet and specification update, with the board wiring taken from the system firmware, the Windows NT hardware abstraction layer and the Linux Visual Workstation code. Grades: established means a datasheet or specification update page states it (the page is cited) or the shipped firmware and HAL do it in a routine read in full, which is a software expectation and not a measurement; inferred means a reasoned reading; unknown means no held source settles it. The update corrects the datasheet and wins where they differ. Config-space registers are in one space per PCI function (f0 ISA bridge, f1 IDE, f2 USB, f3 power management and SMBus). The power management block (pm), the SMBus block (smb), the IDE bus-master block (bm) and the fixed ISA ports (isa) are I/O spaces whose base is programmed in config space. Not listed: the 8259, 8254 and DMA controller registers (standard parts at their PC ports), the USB host controller I/O registers (no held software touches them at register level), and the device-monitor registers of function 3 (offsets 0x50 to 0x7f and the device activity and resource registers), which no held software writes."
from = "Intel 82371AB PIIX4 datasheet 290562-001 (April 1997) and specification update 297738-017 (January 2002)"
public_from = ["Intel 82371AB datasheet", "Intel 82371AB specification update"]
name_source = "public"
name_cite = "Intel 82371AB (PIIX4) datasheet 290562-001: register names and mnemonics"

[spaces.piix4_f0]
unit = "byte"
doc = "PCI function 0 (PCI-to-ISA bridge) configuration space, byte offsets. On the board it is device 4 of the Lithium bridge B bus, reached through bridge B's configuration window."

[spaces.piix4_f1]
unit = "byte"
doc = "PCI function 1 (IDE controller) configuration space, byte offsets."

[spaces.piix4_f2]
unit = "byte"
doc = "PCI function 2 (USB host controller) configuration space, byte offsets."

[spaces.piix4_f3]
unit = "byte"
doc = "PCI function 3 (power management and SMBus) configuration space, byte offsets."

[spaces.piix4_pm]
unit = "byte"
doc = "Power management I/O block: base from PMBA (function 3 offset 0x40). The firmware programs the base 0xf80."

[spaces.piix4_smb]
unit = "byte"
doc = "SMBus host and slave I/O block: base from SMBBA (function 3 offset 0x90). The firmware programs the base 0xfd0."

[spaces.piix4_bm]
unit = "byte"
doc = "IDE bus-master I/O block: base from BMIBA (function 1 offset 0x20); primary channel at +0, secondary at +8."

[spaces.piix4_isa]
unit = "byte"
doc = "Fixed ISA-compatible I/O ports the PIIX4 decodes itself (absolute port numbers)."

