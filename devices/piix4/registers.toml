reset_from = "Intel 82371AB datasheet 290562-001 (April 1997) p.87"
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.87"
doc = "Port 92. The PROM never writes it; the application processors set bit 1. The datasheet text says FAST_A20 set asserts A20M# low but its own table and specification update documentation change 11 (p.54) say a 1 deasserts A20M#."

[registers.p92.fields]
fast_init = { bits = [0, 0], grade = "established", doc = "Fast INIT: a write of 1 pulses INIT for about 16 PCI clocks; must be rewritten 0 before the next pulse." }
fast_a20 = { bits = [1, 1], grade = "established", doc = "1 forces A20M# negated (A20 unmasked), 0 lets A20GATE decide (corrected by the specification update)." }

