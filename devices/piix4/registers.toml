[registers.f0_gencfg]
space = "piix4_f0"
offset = 0xb0
access = "rw"
width = 32
reset = 0x0
reset_from = "Intel 82371AB datasheet 290562-001 (April 1997) p.65"
ro = 0xc
rsvd = 0x4002080
grade = "established"
from = "Intel 82371AB datasheet 290562-001 (April 1997) p.65-67"
doc = "General configuration: pin function selects and bus mode. The PROM writes the bytes 0x4d (register 0xb0) and 0x60 (register 0xb3). 0x4d sets bit 0 (ISA mode, so the pins carry IOCHK# and LA[23:17] and are not GPI0 and GPO[7:1]), bit 6 (positive decode of the Plug and Play ports 0x279 and 0xa79) and the read-only bits 2 and 3, which stay as the straps set them. 0x60 sets bits 30 and 29, turning the RTCALE and RTCCS# pins into outputs GPO25 and GPO24. Bit 29 is printed as 'GPO2' in the datasheet and is GPO24 in its GPO table (a datasheet inconsistency). Tables 1 and 2 label the register 'PCI Function 1' but it is a function 0 register."

[registers.f0_gencfg.fields]
isa_mode = { bits = [0, 0], grade = "established", doc = "0 EIO (default), 1 ISA; also selects IOCHK#/LA[23:17] (1) versus GPI0/GPO[7:1] (0)." }
pos_decode = { bits = [1, 1], grade = "established", doc = "0 subtractive (default), 1 positive decode; changes the class code sub-class byte." }
