unit = "ns_pc87307"
prefix = "PC87307"
title = "National Semiconductor PC87307 Super I/O (marked NS87307) as wired in the Visual Workstation 320 and 540"
doc = "Register contract of the PC87307 Super I/O: its configuration protocol, the nine logical devices' configuration registers, the GPIO ports and the power management block, from the published datasheet, with the board's use taken from the system firmware, the Windows NT hardware abstraction layer and the Linux Visual Workstation code. Every register is eight bits wide. Grades: established means a datasheet page states it (the page is cited) or the shipped firmware and HAL do it in a routine read in full, which is a software expectation and not a measurement; inferred means a reasoned reading; unknown means no held source settles it. The configuration registers are addressed by an index written to an index port, so the offsets of the card, logical-device, chip-select and power management spaces are indexes, not bus addresses. The part has two variants: the PC87307 reads 0xc0 in its identification register and the PC97307 0xcf, and the PC97307 adds a stepping register; which one the board carries is not known. Not listed: the keyboard, mouse, real-time clock and advanced power control function registers, the floppy controller, UART and parallel port function registers, which are standard PC parts at the bases the logical devices select."
from = "National Semiconductor PC87307/PC97307 Plug and Play Compatible PC97 SuperI/O datasheet (Preliminary, March 1998)"
public_from = ["National Semiconductor PC87307/PC97307 datasheet"]
name_source = "public"
name_cite = "National Semiconductor PC87307/PC97307 datasheet: register names and mnemonics (Tables 2-5 to 2-20, 8-1, 8-2, 9-1)"

[spaces.pc87307_cfgport]
unit = "byte"
doc = "The configuration port pair, offsets from the index port. In PnP motherboard mode the index port is 0x2e and the data port 0x2f, both read/write; other straps give 0x15c and 0x15d, or the full Plug and Play ISA write-only ports 0x279 and 0xa79. The firmware, the HAL and Linux use 0x2e and 0x2f."

[spaces.pc87307_card]
unit = "byte"
doc = "Card-level configuration registers, selected by index on the data port (first-level indexes 0x00 to 0x27)."

[spaces.pc87307_ld0]
unit = "byte"
doc = "Logical device 0 (keyboard controller) configuration registers, selected by index after writing 0 to the logical device number register (index 0x07)."

[spaces.pc87307_ld1]
unit = "byte"
doc = "Logical device 1 (mouse controller) configuration registers, selected by index after writing 1 to the logical device number register (index 0x07)."

[spaces.pc87307_ld2]
unit = "byte"
doc = "Logical device 2 (real-time clock and advanced power control) configuration registers, selected by index after writing 2 to the logical device number register (index 0x07)."

[spaces.pc87307_ld3]
unit = "byte"
doc = "Logical device 3 (floppy disk controller) configuration registers, selected by index after writing 3 to the logical device number register (index 0x07)."

[spaces.pc87307_ld4]
unit = "byte"
doc = "Logical device 4 (parallel port) configuration registers, selected by index after writing 4 to the logical device number register (index 0x07)."

[spaces.pc87307_ld5]
unit = "byte"
doc = "Logical device 5 (second UART with infrared) configuration registers, selected by index after writing 5 to the logical device number register (index 0x07)."

[spaces.pc87307_ld6]
unit = "byte"
doc = "Logical device 6 (first UART) configuration registers, selected by index after writing 6 to the logical device number register (index 0x07)."

[spaces.pc87307_ld7]
unit = "byte"
doc = "Logical device 7 (general-purpose I/O) configuration registers, selected by index after writing 7 to the logical device number register (index 0x07)."

[spaces.pc87307_ld8]
unit = "byte"
doc = "Logical device 8 (power management) configuration registers, selected by index after writing 8 to the logical device number register (index 0x07)."

[spaces.pc87307_cs]
unit = "byte"
doc = "Programmable chip select registers, second-level indexes written to the chip select index register (card index 0x23) and read or written through the chip select data register (card index 0x24)."

[spaces.pc87307_gpio0]
unit = "byte"
doc = "GPIO block, bank 0, byte offsets from the logical device 7 base (the board puts it at 0xfc0). Selected while SuperI/O configuration 2 bit 7 is 0."

[spaces.pc87307_gpio1]
unit = "byte"
doc = "GPIO block, bank 1, byte offsets from the logical device 7 base. Selected while SuperI/O configuration 2 bit 7 is 1."

[spaces.pc87307_pmport]
unit = "byte"
doc = "Power management index and data ports, offsets from the logical device 8 base (the board puts it at 0xfc8)."

[spaces.pc87307_pm]
unit = "byte"
doc = "Power management registers, selected by index through the power management index port."

[registers.cfg_index]
space = "pc87307_cfgport"
offset = 0x0
access = "rw"
width = 8
reset = 0x0
reset_grade = "inferred"
reset_from = "datasheet gives no reset value for the index register; none is read by held software"
grade = "established"
from = "National Semiconductor PC87307/PC97307 datasheet (Preliminary, March 1998) p.24-25"
doc = "Configuration index register. A write selects the configuration register the data port then reaches; a read returns the last index written. Reset: the part wakes in the Config state in PnP motherboard mode, so no key sequence is needed. The PROM and Linux write ports 0x2e and 0x2f directly."

