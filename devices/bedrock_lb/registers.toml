unit = "bedrock_lb"
prefix = "BEDROCK_LB"
title = "Bedrock local block (LB) registers: field layouts, reset statements and the vector engine"
doc = "Offsets are hub-relative: the local block starts 6 MiB into the node's register space and holds the 34 registers from the revision register through vector status clear. Field positions, access widths and reset statements come from the public Linux 2.5.40 SN1 headers, so they are established as header facts. Behaviour the headers give only in comments is graded as the comment's own claim, and behaviour they leave open is unknown. No Bedrock specification is held, so no reset value is established where the headers are silent."
from = "Linux 2.5.40 SN1 local-block register headers (field layouts, masks and comments), the processor-interface header (pending-1 bit 55) and the SN1 configuration header (real-time counter default); public Linux ia64 L1 driver (scratch 3 lock use)"
public_from = ["Linux 2.5.40", "Linux ia64"]

[c]
offset_macro = "bare"

[enums.region_size]
values = { fine = { value = 0, grade = "established", doc = "Header name SMALL. Each node is its own region." }, coarse = { value = 1, grade = "established", doc = "Two nodes per region." }, nmode = { value = 2, grade = "established", doc = "Four nodes per region (N mode)." }, invalid = { value = 3, grade = "established", doc = "The header calls this value invalid." } }

[enums.vector_op]
values = { read = { value = 0, grade = "established" }, write = { value = 1, grade = "established" }, undefined = { value = 2, grade = "established" }, exchange = { value = 3, grade = "established", doc = "The header says the IP35 does not support vector exchange and that scratch registers do locks directly." } }

[enums.vector_reply_type]
values = { read = { value = 0, grade = "established" }, write = { value = 1, grade = "established" }, undefined = { value = 2, grade = "established" }, exchange = { value = 3, grade = "established" }, address_error = { value = 4, grade = "established", doc = "Error code 4 in the type-or-error field, with bit 2 set." }, command_error = { value = 5, grade = "established" }, protection_error = { value = 6, grade = "established" }, unknown_error = { value = 7, grade = "established" } }

[constants]
CHIP_PART_BEDROCK = { value = 0x3012, grade = "established", doc = "Part number the SN1 chip-identity header assigns to the hub chip. The revision register carries it." }
REVISION_1_0 = { value = 1, grade = "established", doc = "Revision field value for Bedrock 1.0, from the SN1 chip-identity header." }
REVISION_1_1 = { value = 2, grade = "established", doc = "Revision field value for Bedrock 1.1, from the SN1 chip-identity header." }
ERROR_PI_PEND1_BIT = { value = 55, grade = "established", doc = "Bit of the processor interface's pending-1 register that carries the local block's error request, counted from zero." }
RTC_FREQ_KHZ_CONFIG = { value = 1250, grade = "inferred", doc = "Real-time counter frequency the SN1 kernel configuration sets (the SN1 configuration default for the counter). The header gives it as the software default, not as a hardware measurement; the block does not state it." }

[registers.rev_id]
offset = 0x600000
access = "rw"
width = 64
grade = "established"
reset = 0x23012049
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_REV_ID at image offset 0x161410 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Revision and identity. The header says this register carries the chip identity and sets the node's ID and the size of each region. The manufacturer, part and revision fields are assigned by IBM under the IEEE 1149.1 scheme, and the header does not say whether they are writable. The I/O interface's widget identification register echoes the manufacturer and revision fields."

[registers.rev_id.fields]
manufacturer = { bits = [11, 1], grade = "established", doc = "Manufacturer code, assigned by IBM under the header's scheme. The value is not stated in the header." }
part_number = { bits = [27, 12], grade = "established", doc = "Hub chip part number, the value of CHIP_PART_BEDROCK." }
revision = { bits = [31, 28], grade = "established", doc = "1 for Bedrock 1.0, 2 for Bedrock 1.1." }
node_id = { bits = [39, 32], grade = "established", doc = "This node's number. The header says the register sets the node ID." }
region_size = { bits = [47, 46], grade = "established", enum = "region_size", doc = "How many nodes share one region." }

[registers.cpu_permission]
offset = 0x604000
access = "rw"
width = 64
grade = "established"
reset = 0xfffffffffffffff
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_CPU_PERMISSION at image offset 0x161428 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Processor PIO access permission, one bit per region. A region whose bit is clear gets no write access to the local block, network interface, crossbar or memory-directory registers, and no read that would change state. A write or a state-changing read from such a region is not performed and gets an error reply. The header calls it the access-rights vector for those four units."

[registers.cpu_permission.fields]
region_enable = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.cpu_permission_override]
offset = 0x604008
access = "w"
width = 64
grade = "established"
doc = "Writing the 64-bit ASCII key the SN1 header names sets the writer's own region bit in cpu_permission. The key is not reproduced here. Reset unknown."

[registers.io_permission]
offset = 0x604010
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_IO_PERMISSION at image offset 0x161458 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "The same per-region access vector as cpu_permission, applied to accesses that come from the I/O interface side rather than from a processor."

[registers.io_permission.fields]
region_enable = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.soft_reset]
offset = 0x604018
access = "w"
width = 64
grade = "established"
doc = "A write to bit 0 resets the Bedrock with a soft reset. The header does not say which state survives it. Reset unknown."

[registers.soft_reset.fields]
soft_reset = { bits = [0, 0], grade = "established" }

[registers.region_present]
offset = 0x604020
access = "rw"
width = 64
grade = "established"
reset = 0xfffffffffffffff
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_REGION_PRESENT at image offset 0x161488 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Regions that can receive an invalidate. The block samples it when an invalidate arrives. If an invalidate names a processor interface in a region whose bit is clear, the block acknowledges on that interface's behalf. The region size in the revision register sets how many nodes share one bit."

[registers.region_present.fields]
present = { bits = [63, 0], grade = "established", doc = "One bit per region." }

[registers.nodes_absent]
offset = 0x604028
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_NODES_ABSENT at image offset 0x1614a0 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Four 16-bit entries, one per slot. Each entry holds a node number in its low eight bits and a valid bit at bit 15. A node listed with its valid bit set cannot receive an invalidate."

[registers.nodes_absent.fields]
entry0_node = { bits = [7, 0], grade = "established" }
entry0_valid = { bits = [15, 15], grade = "established" }
entry1_node = { bits = [23, 16], grade = "established" }
entry1_valid = { bits = [31, 31], grade = "established" }
entry2_node = { bits = [39, 32], grade = "established" }
entry2_valid = { bits = [47, 47], grade = "established" }
entry3_node = { bits = [55, 48], grade = "established" }
entry3_valid = { bits = [63, 63], grade = "established" }

[registers.microlan_ctl]
offset = 0x604030
access = "rw"
width = 64
grade = "established"
reset = 0x31e300002
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_MICROLAN_CTL at image offset 0x1614b8 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Control for a one-wire serial bus to the node board's add-only serial PROM. The header names the part as a Dallas 1990A and says the PROM holds the node board's serial number and configuration. Bytes travel least-significant bit first. The header gives no unit for the timing fields, no completion latency and no sequence of commands, so the timing and the transaction are unknown. The public Linux SN1 tree does not use this register outside its header."

[registers.microlan_ctl.fields]
read_data = { bits = [0, 0], grade = "established", doc = "Sampled bus level." }
done = { bits = [1, 1], grade = "established", doc = "Completion flag for the operation started by a write." }
sample_offset = { bits = [9, 2], grade = "established", doc = "Sample offset field. Its time base is not stated." }
low_pulse = { bits = [19, 10], grade = "established", doc = "Low-pulse duration field. Its time base is not stated." }
clkdiv_phi0 = { bits = [26, 20], grade = "established", doc = "Phase-0 divider. The header does not say how it sets time." }
clkdiv_phi1 = { bits = [33, 27], grade = "established", doc = "Phase-1 divider. The header does not say how it sets time. Bit 33 means a 32-bit access cannot write the whole field." }

[registers.error_bits]
offset = 0x604040
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_ERROR_BITS at image offset 0x1614d0 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Local-block error bits. Reads do not change them. A write sets the bits it names. Any set bit raises the block's error request to both processor interfaces (bit 55 of their pending-1 register). The header says the contents survive a reset."

[registers.error_bits.fields]
rq_bad_cmd = { bits = [0, 0], grade = "established", doc = "Request with a bad command." }
rp_bad_cmd = { bits = [1, 1], grade = "established", doc = "Reply with a bad command." }
rq_short = { bits = [2, 2], grade = "established", doc = "Short request." }
rp_short = { bits = [3, 3], grade = "established", doc = "Short reply." }
rq_long = { bits = [4, 4], grade = "established", doc = "Long request." }
rp_long = { bits = [5, 5], grade = "established", doc = "Long reply." }
rq_bad_data = { bits = [6, 6], grade = "established", doc = "Request with bad data." }
rp_bad_data = { bits = [7, 7], grade = "established", doc = "Reply with bad data." }
rq_bad_addr = { bits = [8, 8], grade = "established", doc = "Request with a bad address." }
rq_bad_inval = { bits = [9, 9], grade = "established", doc = "Request with a bad invalidate." }
gclk_drop = { bits = [10, 10], grade = "established", doc = "Loss of the global clock. Header 1 is not updated for this error." }

[registers.error_mask_clr]
offset = 0x604048
access = "w"
width = 64
grade = "established"
doc = "Write one to clear the matching error bits. A zero bit in the written value leaves its error bit alone, so any subset clears atomically. Reset unknown."

[registers.error_mask_clr.fields]
clear = { bits = [10, 0], grade = "established", doc = "One bit per error bit in error_bits." }

[registers.error_hdr1]
offset = 0x604050
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_ERROR_HDR1 at image offset 0x161500 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Header of the first packet that caused an error. It is captured while valid is clear, and valid is then set. A later error while valid is set sets overrun and leaves the rest alone. The err_type value uses the same bit numbering as error_bits, so err_type 5 means rp_long. Not relevant for a global clock drop."

[registers.error_hdr1.fields]
command = { bits = [6, 0], grade = "established" }
suppl = { bits = [18, 8], grade = "established" }
source = { bits = [30, 20], grade = "established" }
err_type = { bits = [35, 32], grade = "established" }
overrun = { bits = [40, 40], grade = "established" }
valid = { bits = [44, 44], grade = "established" }

[registers.error_hdr2]
offset = 0x604058
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_ERROR_HDR2 at image offset 0x161518 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Address field from the header of the first packet that caused an error. Not relevant for a global clock drop."

[registers.error_hdr2.fields]
address = { bits = [37, 0], grade = "established" }

[registers.error_data]
offset = 0x604060
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_ERROR_DATA at image offset 0x161530 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Data flit of the first erroring packet, for the error kinds that carry data."

[registers.error_data.fields]
flit = { bits = [63, 0], grade = "established" }

[registers.debug_select]
offset = 0x604100
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_DEBUG_SELECT at image offset 0x161548 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Chooses which internal signals appear on the debug pins. The header gives no list of the choices."

[registers.debug_select.fields]
select = { bits = [5, 0], grade = "established" }

[registers.debug_pins]
offset = 0x604108
access = "r"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_DEBUG_PINS at image offset 0x161560 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Value on the chip's debug pins."

[registers.debug_pins.fields]
pins = { bits = [31, 0], grade = "established" }

[registers.rt_local_ctrl]
offset = 0x604200
access = "rw"
width = 64
grade = "established"
reset = 0x100000640
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_RT_LOCAL_CTRL at image offset 0x161578 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Local source of the real-time clock. The local block gives the clock to both processor interfaces. With use_internal set it generates the clock from the Bedrock's system clock, with its period set by max_count. With it clear it filters an incoming global clock instead (see rt_filter_ctrl)."

[registers.rt_local_ctrl.fields]
gclk_enable = { bits = [0, 0], grade = "established", doc = "Global clock enable." }
max_count = { bits = [13, 4], grade = "established", doc = "Maximum count that sets the internal clock's period." }
gclk_counter = { bits = [25, 16], grade = "established", doc = "Global clock counter field. The header does not say what it counts." }
gclk = { bits = [28, 28], grade = "established", doc = "Global clock bit. The header names it only." }
use_internal = { bits = [32, 32], grade = "established", doc = "Generate the real-time clock internally rather than filtering the global clock." }

[registers.rt_filter_ctrl]
offset = 0x604208
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_RT_FILTER_CTRL at image offset 0x161590 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Filtering of an incoming global clock, used when rt_local_ctrl use_internal is clear. Simple filtering drops single-cycle glitches. Complex filtering (mask_enable set) expects positive edges at regular intervals, tracks missing and unexpected edges, and generates an edge itself when one is missing. Under either option the clock it hands the processor interfaces stays high for (2 * max_count + 1 - offset) / 2 cycles of the block's system clock after each positive edge. Clock loss is error bit gclk_drop."

[registers.rt_filter_ctrl.fields]
offset = { bits = [4, 0], grade = "established" }
mask_counter = { bits = [19, 8], grade = "established" }
mask_enable = { bits = [20, 20], grade = "established", doc = "Selects complex filtering." }
dropout_counter = { bits = [33, 24], grade = "established" }
dropout_threshold = { bits = [45, 36], grade = "established" }
error_counter = { bits = [57, 48], grade = "established" }

