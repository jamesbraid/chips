reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_SCRATCH_REG4 at image offset 0x161608 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "One-bit storage (bit 0 of a 64-bit word). The header gives no reset value, and the public Linux tree shows no use of it."

