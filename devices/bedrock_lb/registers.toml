[registers.vector_parms]
offset = 0x60c000
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_VECTOR_PARMS at image offset 0x161698 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Vector I/O request parameters. A write sends one request, and the block replies to the write at once without waiting for the operation. The request is built from three registers: the route, the write data and this one, which should be written last. Software waits for busy to clear before it starts."

[registers.vector_parms.fields]
type = { bits = [1, 0], grade = "inferred", enum = "vector_op", doc = "The header's union gives one bit and its companion mask gives two. The defined values are 0 to 3, so the field is graded inferred for its width." }
address = { bits = [23, 3], grade = "established" }
write_id = { bits = [39, 32], grade = "established" }
pio_id = { bits = [50, 40], grade = "established" }
busy = { bits = [63, 63], grade = "established", doc = "Set while a request is in flight." }

[registers.vector_route]
offset = 0x60c008
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_VECTOR_ROUTE at image offset 0x1616b0 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Outgoing vector route for the next request. The header gives no field layout."

[registers.vector_data]
offset = 0x60c010
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_VECTOR_DATA at image offset 0x1616c8 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Write data for an outgoing vector write, and the data value for a read reply."

[registers.vector_status]
offset = 0x60c020
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry LB_VECTOR_STATUS at image offset 0x1616e0 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Return status of the last vector request. Software clears it before launching a request. The block leaves the fields unchanged when a reply has an error. A reply that arrives while valid is already set sets overrun and leaves the rest alone. Otherwise the block loads the source, ids, address and type, sets valid, and updates return and read data. The header does not say what a write of a nonzero value does."

[registers.vector_status.fields]
type_or_error = { bits = [2, 0], grade = "established", enum = "vector_reply_type", doc = "Reply type on success (matching the request), or an error code when bit 2 is set." }
