unit = "hpc3_enet"
prefix = "HPC3_ENET"
title = "SGI HPC3 Ethernet DMA channels (Indy)"
doc = "The receive and transmit DMA channels of the HPC3 peripheral controller, which move frames between main memory and the SEEQ Ethernet controller, with the layouts of the descriptor words they read and write. Offsets are from the start of the HPC3 register window; the HPC3 of the Indy sits at physical 1fb80000. Grades say how each item was derived: established means read in the HPC3 specification, a public driver or the shipped IRIX driver as the source records; inferred means a reasoned reading, with the reasoning in docs/hpc3-ethernet.md. Registers the specification does not list are marked as such."
from = "HPC3 Chip Specification, revision 1.4, 22 January 1993"
public_from = ["HPC3 Chip Specification", "Linux", "NetBSD", "OpenBSD", "IRIX"]

[spaces.hpc3]
unit = "byte"
doc = "Byte offsets from the start of the HPC3 register window."

[registers.rx_cbp]
offset = 0x14000
space = "hpc3"
access = "r"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, p. 33 (address map) and p. 39 (field definitions)"
doc = "Receive current buffer pointer. HPC3 loads it when it fetches a descriptor, so it names the buffer being filled."

[registers.rx_nbdp]
offset = 0x14004
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33 and 39"
doc = "Receive next descriptor pointer. Software writes the physical address of the first descriptor here before it sets the channel active."

[registers.rx_bc]
offset = 0x15000
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33 and 39-40"
doc = "Receive byte count and flags of the current descriptor. The count is read only to the programmed interface; the flags are read and written."

[registers.rx_bc.fields]
count = { bits = [13, 0], grade = "established", doc = "Byte count of the current buffer. HPC3 writes back the bytes left after a frame; the programmed interface reads it." }
xie = { bits = [29, 29], grade = "established", from = "HPC3 Chip Specification, revision 1.4, p. 39", doc = "Interrupt after this descriptor. The Ethernet channels act on it only when end-of-packet is also set." }
eox = { bits = [31, 31], grade = "established", from = "HPC3 Chip Specification, revision 1.4, p. 39", doc = "End of chain. After the descriptor carrying it, the channel stops." }

[registers.rx_cntl]
offset = 0x15004
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 39-40"
doc = "Receive control and status. The status bits are read only copies of the SEEQ receive status."

[registers.rx_cntl.fields]
status = { bits = [5, 0], grade = "established", doc = "Read only copy of the SEEQ receive status bits 5 to 0." }
status_6 = { bits = [6, 6], grade = "established", doc = "Read only. On its own, a late receive discard. With the bit 4 status set, an end-of-packet or interrupt timeout." }
status_7 = { bits = [7, 7], grade = "established", doc = "Read only copy of the SEEQ old or new bit." }
endian = { bits = [8, 8], grade = "established", doc = "One for little-endian DMA, zero for big-endian." }
ch_active = { bits = [9, 9], grade = "established", doc = "One while the channel is active. Software writes one to start it, and HPC3 clears it when the channel stops. A store changes it only when the mask bit is written zero in the same store. Cleared by power-on reset." }
ch_active_mask = { bits = [10, 10], grade = "established", doc = "Write only. Written one, it leaves the active bit unchanged in that store." }
rbo = { bits = [11, 11], grade = "established", doc = "Receive buffer overflow: a frame was longer than its buffer. How it is cleared is not settled; see docs/hpc3-ethernet.md." }

[registers.rx_gio]
offset = 0x15008
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33 and 39"
doc = "Receive FIFO tail pointer, diagnostic. Normal software does not write it."

[registers.rx_dev]
offset = 0x1500c
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33 and 39"
doc = "Receive FIFO head pointer, diagnostic."

[registers.enet_reset]
offset = 0x15014
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, p. 41"
doc = "Reset and interrupt control, shared by both Ethernet channels. The specification calls it misc."

[registers.enet_reset.fields]
ch_reset = { bits = [0, 0], grade = "established", doc = "Resets both Ethernet DMA channels and the SEEQ, by driving the SEEQ reset pin. Set at power-on. It must be zero before either channel is set active." }
clrint = { bits = [1, 1], grade = "established", doc = "Read: the current state of the Ethernet interrupt. Written one: clears every Ethernet interrupt source except receive buffer overflow." }
loopback = { bits = [2, 2], grade = "established", doc = "Drives the loopback pin of the Manchester encoder. Diagnostic." }

[registers.dmacfg]
offset = 0x15018
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 41-42"
doc = "DMA timing and the SEEQ work-around enables. The timing fields reset to 1111 according to the specification; the other fields have no stated reset."

[registers.dmacfg.fields]
d1 = { bits = [3, 0], grade = "established", doc = "Cycle count D1. The specification says D1 is not implemented and always behaves as 1." }
d2 = { bits = [7, 4], grade = "established", doc = "Cycle count D2." }
d3 = { bits = [11, 8], grade = "established", doc = "Cycle count D3." }
wr_ctrl = { bits = [12, 12], grade = "established", doc = "Write each transmit descriptor's inter-packet gap byte into the SEEQ." }
fix_rxdc = { bits = [13, 13], grade = "established", doc = "Work-around enable for the receive descriptor fix." }
fix_eop = { bits = [14, 14], grade = "established", doc = "Work-around enable for the end-of-packet fix." }
fix_intr = { bits = [15, 15], grade = "established", doc = "Work-around enable for the interrupt fix." }
fix_timeout = { bits = [17, 16], grade = "established", doc = "Timeout used by the fixes above." }

[[registers.dmacfg.tests]]
value = 0x00030026
expect = { d1 = 6, d2 = 2, d3 = 0, wr_ctrl = 0, fix_rxdc = 0, fix_eop = 0, fix_intr = 0, fix_timeout = 3 }

[[registers.dmacfg.tests]]
value = 0x0003e026
expect = { d1 = 6, d2 = 2, d3 = 0, wr_ctrl = 0, fix_rxdc = 1, fix_eop = 1, fix_intr = 1, fix_timeout = 3 }

[registers.piocfg]
offset = 0x1501c
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 41-42"
doc = "PIO timing to the SEEQ. The timing fields reset to 1111 according to the specification; the other bits have no stated reset."

[registers.piocfg.fields]
p1 = { bits = [3, 0], grade = "established", doc = "Timing field P1." }
p2 = { bits = [7, 4], grade = "established", doc = "Timing field P2." }
p3 = { bits = [11, 8], grade = "established", doc = "Timing field P3." }
fifo_ram_test = { bits = [12, 12], grade = "established", doc = "FIFO RAM test mode. Diagnostic." }

[[registers.piocfg.tests]]
value = 0x161
expect = { p1 = 1, p2 = 6, p3 = 1, fifo_ram_test = 0 }

[registers.tx_cbp]
offset = 0x16000
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, p. 34 (address map, read) and p. 43 (field text, read and write)"
doc = "Transmit current buffer pointer. The specification gives the access as read in one place and read and write in another."

[registers.tx_nbdp]
offset = 0x16004
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33 and 43"
doc = "Transmit next descriptor pointer. Software writes the physical address of the first descriptor here before it sets the channel active."

[registers.tx_bc]
offset = 0x17000
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33, 43"
doc = "Transmit byte count and flags of the current descriptor. The count and the end-of-chain sample bit are read only."

[registers.tx_bc.fields]
count = { bits = [13, 0], grade = "established", doc = "Bytes to send from the current buffer." }
eox_sampled = { bits = [28, 28], grade = "established", from = "HPC3 Chip Specification, revision 1.4, p. 43", doc = "Read only. One once HPC3 has sampled the end-of-chain flag for the frame in progress, so software can tell whether clearing that flag on the old last descriptor came too late." }
xie = { bits = [29, 29], grade = "established", doc = "Interrupt after the frame is sent." }
eoxp = { bits = [30, 30], grade = "established", doc = "End of packet: the last buffer of a frame." }
eox = { bits = [31, 31], grade = "established", doc = "End of chain. After the descriptor carrying it, the channel stops." }

[registers.tx_cntl]
offset = 0x17004
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, p. 44"
doc = "Transmit control and status. The status bits are read only copies of the SEEQ transmit status."

[registers.tx_cntl.fields]
status = { bits = [3, 0], grade = "established", doc = "Read only copy of the SEEQ transmit status bits 3 to 0." }
status_4 = { bits = [4, 4], grade = "established", doc = "Read only. Late collision: a collision after the first 80 bytes left the FIFO." }
status_7_5 = { bits = [7, 5], grade = "established", doc = "Read only. The specification gives this field as a copy of the SEEQ transmit status bit 7; it does not split the three bits." }
endian = { bits = [8, 8], grade = "established", doc = "As for the receive control register." }
ch_active = { bits = [9, 9], grade = "established", doc = "As for the receive control register." }
ch_active_mask = { bits = [10, 10], grade = "established", doc = "As for the receive control register." }

[registers.tx_gio]
offset = 0x17008
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33 and 43"
doc = "Transmit FIFO tail pointer, diagnostic."

[registers.tx_dev]
offset = 0x1700c
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 33 and 43"
doc = "Transmit FIFO head pointer, diagnostic."

[registers.rx_cur_desc]
offset = 0x18000
space = "hpc3"
access = "rw"
width = 32
reset = "unknown"
grade = "established"
from = "IRIX 6.5 base-release Ethernet driver object (initialisation and interrupt handler). Not in the HPC3 specification."
doc = "Receive current descriptor pointer. The specification does not list it. The IRIX driver writes it at initialisation with the descriptor it marks end-of-chain, and reads it after the receive channel stops. How the hardware updates it is not settled; see docs/hpc3-ethernet.md."

[registers.tx_first_cur]
offset = 0x1a000
space = "hpc3"
access = "r"
width = 32
reset = "unknown"
grade = "established"
from = "IRIX 6.5 base-release Ethernet driver object (transmit path and interrupt handler). Not in the HPC3 specification."
doc = "First descriptor of the packet in progress. The specification does not list it. The IRIX driver reads it. Its update rule is unknown."

[registers.tx_first_prev]
offset = 0x1a004
space = "hpc3"
access = "r"
width = 32
reset = "unknown"
grade = "established"
from = "IRIX 6.5 base-release Ethernet driver object (transmit path and interrupt handler). Not in the HPC3 specification."
doc = "First descriptor of the previous packet. The specification does not list it. The IRIX driver reads it while the transmit channel is active, to reclaim transmit descriptors. Its update rule is unknown."

[words.RX_DESC_CTL]
width = 32
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 6-7 and 14"
doc = "Word 1 of a receive descriptor, the count and flags that HPC3 writes back when a frame has been stored."

[words.RX_DESC_CTL.fields]
eox = { bits = [31, 31], grade = "established", doc = "End of chain. The channel stops after this descriptor." }
eoxp = { bits = [30, 30], grade = "established", doc = "Must be set on every receive descriptor, which carries one frame." }
xie = { bits = [29, 29], grade = "established", doc = "Interrupt after this descriptor. Ignored unless end-of-packet is also set." }
own = { bits = [14, 14], grade = "inferred", from = "The specification reserves this bit. The IRIX, Linux, NetBSD and OpenBSD drivers set it when arming a descriptor and treat a clear bit as filled. Inferred from the write-back description (p. 14) and those drivers.", doc = "Reserved in the specification and used by every driver as a receive ownership flag. HPC3 does not read it: the specification gives no ownership check. The write-back of the count clears it." }
count = { bits = [13, 0], grade = "established", doc = "Buffer size when armed. After a frame, HPC3 writes back the bytes left: the frame length is the armed size, minus the bytes left, minus 3." }

[words.TX_DESC_CTL]
width = 32
grade = "established"
from = "HPC3 Chip Specification, revision 1.4, pp. 6-7, 13-14"
doc = "Word 1 of a transmit descriptor: the count, flags and inter-packet gap byte."

[words.TX_DESC_CTL.fields]
eox = { bits = [31, 31], grade = "established", doc = "End of chain. The channel stops after the frame whose descriptor carries it has gone." }
eoxp = { bits = [30, 30], grade = "established", doc = "Last buffer of a frame." }
xie = { bits = [29, 29], grade = "established", doc = "Interrupt after this frame is sent." }
ipg = { bits = [23, 16], grade = "established", doc = "Inter-packet gap byte, written to SEEQ extended register 2 when the write-control bit is set in the DMA configuration." }
txd = { bits = [15, 15], grade = "established", doc = "Set by HPC3 in the first descriptor of a frame once the frame has gone. HPC3 clears bits 14 to 0 in the same write." }
count = { bits = [13, 0], grade = "established", doc = "Bytes to send from this buffer." }
