[constants]
INTR_PCI_MASTER_TIMEOUT = { value = 0x800, grade = "established", doc = "bit 11 of the interrupt status register (0x100) and of the error view (0x170). The view records a master timeout whether or not the enable bit is set; status records it only when bit 11 of the enable register (0x108) is also set. An unclaimed configuration cycle is the usual source (inferred, see devices/pic/facts-outside-census.md)" }
INTR_PCIX_MASTER_TIMEOUT = { value = 0x400000000, grade = "established", doc = "bit 34 of the interrupt status register (0x100), the PCI-X master timeout. Which bit a bus in PCI-X mode sets for an unclaimed configuration cycle is not stated by any source read (unknown)" }
INTR_RESET_MULTIPLE_CLEAR = { value = 0x40, grade = "established", doc = "bit 6 of the reset register (0x110), the multiple-error clear. Bits 8:7 and 5:0 have no PIC field. A one written at an error bit's own position clears that bit and rearms the error registers, and any write to 0x110 also clears the error view" }
DEVICE_SWAP_DIRECT = { value = 0x80000, grade = "inferred", doc = "bit 19 of the device register (0x200 plus 8n), named swap_direct in the public PIC header. Set selects the address-preserving byte map for the 32-bit direct window; clear selects the lane-preserving map. The bit position comes from the public SN2 driver's byte-stream flag mapping onto this bit; no PIC measurement confirms the lane sense (open question in open-questions.md)" }

# ---- constants from SGI Linux v5.3 PCI bridge provider (arch/ia64/include/asm/sn/pcibr_provider.h, pic.h; arch/ia64/sn/pci/pcibr/)
CONTROL_PAGE_SIZE_16K = { value = 0x200000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCIBR_CTRL_PAGE_SIZE) and pcibr_provider.c (pcibr_bus_fixup)", doc = "Bit 21 of the control register: translation page size. The kernel clears it for 4 KiB I/O pages and sets it when its page size is 16 KiB or more. The shipped IRIX attach sets it unconditionally, which agrees with 16 KiB pages." }
ATE_VALID = { value = 0x1, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_ATE_V)", doc = "Bit 0 of an internal translation entry: valid." }
ATE_COHERENT = { value = 0x2, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_ATE_CO, comment PIC ASIC ONLY)", doc = "Bit 1 of a translation entry on the PIC: coherent. The same bit position is the programmed-I/O bit on the TIOCP." }
ATE_MSI = { value = 0x4, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_ATE_MSI) and pcibr_dma.c (pcibr_dmamap_ate32)", doc = "Bit 2: the mapping is for a message-signalled interrupt write." }
ATE_PREFETCH = { value = 0x8, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_ATE_PREF) and pcibr_dma.c", doc = "Bit 3: prefetch. The kernel clears it in PCI-X mode because prefetch is not supported there." }
ATE_BARRIER = { value = 0x10, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_ATE_BAR)", doc = "Bit 4: barrier, requested for consistent (coherent-memory) mappings." }
ATE_TARGET_SHIFT = { value = 8, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pic.h (PIC_ATE_TARGETID_SHFT) and pcibr_dma.c", doc = "Shift of the target widget number in a PIC translation entry: the kernel ORs the hub's Crosstalk widget id left by 8. Entry bits from 12 up carry the page address (shift PCI32_ATE_ADDR_SHFT 12)." }
ATE_ADDR_SHIFT = { value = 12, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_ATE_ADDR_SHFT)", doc = "Translation entry bit 12 is the lowest page-address bit; the kernel stores the page-aligned address in place with the low bits as flags, whatever the I/O page size." }
DIRECT64_ATTR_TARGET_SHIFT = { value = 60, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pic.h (PIC_PCI64_ATTR_TARG_SHFT) and pcibr_dma.c (pcibr_dmatrans_direct64)", doc = "Shift of the target widget number in a 64-bit direct PCI address. Same placement as the other PIC page, now also named by the SGI Altix provider." }
DIRECT64_ATTR_PREFETCH = { value = 0x800000000000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI64_ATTR_PREF)", doc = "Bit 59 of a 64-bit direct address: prefetch. Cleared by the kernel in PCI-X mode. Used for streaming mappings." }
DIRECT64_ATTR_PRECISE = { value = 0x400000000000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI64_ATTR_PREC)", doc = "Bit 58: precise. Defined; no SGI Altix provider code read sets it." }
DIRECT64_ATTR_VIRTUAL = { value = 0x200000000000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI64_ATTR_VIRTUAL) and pcibr_dma.c", doc = "Bit 57: second virtual channel. In conventional PCI mode the kernel sets it for every function except function 0, so function 0 uses channel 0 and other functions channel 1. Not set in PCI-X mode." }
DIRECT64_ATTR_BARRIER = { value = 0x100000000000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI64_ATTR_BAR) and pcibr_dma.c (pcibr_dma_map_consistent)", doc = "Bit 56: barrier. Set for consistent mappings." }
DIRECT64_ATTR_SWAP = { value = 0x80000000000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI64_ATTR_SWAP)", doc = "Bit 55: byte swap. Defined, but no SGI Altix provider code read ever sets it." }
DIRECT64_ATTR_VIRTUAL1 = { value = 0x40000000000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI64_ATTR_VIRTUAL1)", doc = "Bit 54: defined next to the virtual-channel bit; no provider code read sets it." }
PCI32_MAPPED_BASE = { value = 0x40000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_MAPPED_BASE, IS_PCI32_MAPPED)", doc = "Start of the translated 32-bit window: PCI addresses from here up to PCI32_DIRECT_BASE go through the internal translation entries, index (address minus base) shifted by the I/O page shift." }
PCI32_DIRECT_BASE = { value = 0x80000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (PCI32_DIRECT_BASE) and pcibr_dma.c (pcibr_dmatrans_direct32)", doc = "Start of the 2 GiB direct-mapped 32-bit window, offset from the base the direct-map register holds. Not used in PCI-X mode." }
PCI32_MAPPED_SWAP = { value = 0x20000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_provider.h (ATE_SWAPSHIFT 29, ATE_SWAP_ON) and pcibr_dma.c (pcibr_dmamap_ate32)", doc = "Bit 29 of a translated-window PCI address: the kernel sets it only when the device's Device register copy it was handed already has the swap bit (bit 19) set." }
HOST_INTR_ADDR_MASK = { value = 0xffffffffffff, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pic.h (PIC_HOST_INTR_ADDR)", doc = "Mask of the destination address field of a per-pin interrupt address register, 48 bits. The kernel clears this field and ORs the new address in; the TIOCP uses a 54-bit field." }
INTR_FLUSH_WAIT_VALUE = { value = 0x10f, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pcibr_dma.c (sn_dma_flush)", doc = "The value the kernel's read-ordering flush waits to see at the memory word it armed as an interrupt target after forcing a pin interrupt. As a packet shape, 0x100 plus vector 0x0f, it matches the shape the shipped IRIX path is inferred to wait for; the kernel names no meaning for bit 8." }
CFG_TYPE0_BASE = { value = 0x20000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pic.h (p_type0_cfg_dev[8])", doc = "Base of eight type-0 configuration windows of 0x1000 bytes each (eight functions of 0x100 bytes). Internal device n is reached through window n + 1 because the PIC takes device 0: the first device sits one window up. The kernel derives the internal device as PCI slot minus 1." }
CFG_TYPE1_BASE = { value = 0x28000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pic.h (p_type1_cfg)", doc = "Base of the 0x1000-byte type-1 configuration window." }
PCI_IACK_BASE = { value = 0x30000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pic.h (p_pci_iack)", doc = "Eight-byte PCI interrupt acknowledge cycle window. No code read uses it." }
PCIX_SPECIAL_CYCLE_BASE = { value = 0x40000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, pic.h (p_pcix_cycle)", doc = "Eight-byte PCI-X special cycle window. No code read uses it." }

# ---- register field layouts (SGI Linux 2.4-era PIC header, unions pic_*_u_t, plus bridge.h masks)

[words.ID_REG]
width = 64
grade = "established"
from = "SGI Linux platform code, linux-2.4.37 pin e0dbf803698f, include/asm-ia64/sn/pci/pic.h (typedef pic_id_reg_u)"
doc = "Widget identification. Layout of the JTAG-style identification word: revision, part number, manufacturer. Bit 0 has no field in the header. The compare value in the SN2 PROM for the low twelve bits is 0x049, which would make bit 0 read one (inferred, see README)."
[words.ID_REG.fields]
rev_num = { bits = [31, 28], grade = "established", doc = "Part revision. IRIX attach accepts 1, 2 and 3 and names them A, B and C. The public header calls 1 revision A." }
part_num = { bits = [27, 12], grade = "established", doc = "Part number. The header names 0xd102 for bus 0 and 0xd112 for bus 1 (macros PIC_WIDGET_PART_NUM_BUS0 and _BUS1) and tests both with manufacturer 0x24. Which register address returns the 0xd112 value is inferred: the bus-1 block sits 0x800000 above bus 0 (PIC_BUS1_OFFSET)." }
mfg_num = { bits = [11, 1], grade = "established", doc = "Manufacturer number, 0x24 (36). IRIX and the SN1 IA-64 PROM both compare it against 36." }

[words.STATUS_REG]
width = 64
grade = "established"
from = "SGI Linux platform code, linux-2.4.37 pin e0dbf803698f, include/asm-ia64/sn/pci/pic.h (typedef pic_stat_reg_u)"
doc = "Widget status. Bus-side status. Bits 35:33 carry the PCI-X mode report; the low byte is the live level of the miscellaneous PCI inputs."
[words.STATUS_REG.fields]
pci_x_speed = { bits = [35, 34], grade = "established", doc = "PCI-X bus speed code." }
pci_x_active = { bits = [33, 33], grade = "established", doc = "The bus is running in PCI-X mode." }
llp_rec_cnt = { bits = [31, 24], grade = "established", doc = "Link-layer receive counter." }
llp_tx_cnt = { bits = [23, 16], grade = "established", doc = "Link-layer transmit counter." }
rx_credit_cnt = { bits = [15, 12], grade = "established", doc = "Receive credit count." }
tx_credit_cnt = { bits = [11, 8], grade = "established", doc = "Transmit credit count." }
pci_misc_input = { bits = [7, 0], grade = "established", doc = "Level of the PCI miscellaneous input pins. README records the interrupt pin sense in the interrupt status register, not here." }

[words.ERR_UPPER_REG]
width = 64
grade = "established"
from = "SGI Linux platform code, linux-2.4.37 pin e0dbf803698f, include/asm-ia64/sn/pci/pic.h (typedef pic_upper_bus_err_u)"
doc = "Widget error address, upper word: the upper 16 address bits held when a bus-side error is logged. Held until the error group is cleared."
[words.ERR_UPPER_REG.fields]
upp_addr = { bits = [15, 0], grade = "established" }

[words.ERR_LOWER_REG]
width = 64
grade = "established"
from = "SGI Linux platform code, linux-2.4.37 pin e0dbf803698f, include/asm-ia64/sn/pci/pic.h (typedef pic_lower_bus_err_u)"
doc = "Widget error address, lower word: the address held when a bus-side error is logged; bits 47:32 repeat the upper word."
[words.ERR_LOWER_REG.fields]
upp_addr = { bits = [47, 32], grade = "established" }
low_addr = { bits = [31, 0], grade = "established" }

[words.CONTROL_REG]
width = 64
grade = "established"
from = "SGI Linux platform code, linux-2.4.37 pin e0dbf803698f, include/asm-ia64/sn/pci/pic.h (typedef pic_control_reg_u)"
doc = "Widget control. Fields from the register structure plus the mask definitions in bridge.h for the bits the structure leaves reserved (bus, device and function number, parity enables, no-snoop and relaxed ordering). IRIX attach writes bits 55:48, 31:29 and 21 (see README, \"Control register\")."
[words.CONTROL_REG.fields]
no_snoop = { bits = [62, 62], grade = "established", from = "SGI Linux platform code, linux-2.4.37 pin e0dbf803698f, include/asm-ia64/sn/pci/bridge.h (PIC_CTRL_ / PIC_ISR_ masks)", doc = "No-snoop control bit (PIC_CTRL_NO_SNOOP). Effect on PCI-X attributes is inferred from the name. IRIX attach clears bits 62:61." }
