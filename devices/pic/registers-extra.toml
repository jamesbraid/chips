unit = "pic_extra"
prefix = "PIC"
title = "PIC bits outside the census"
from = "public SGI PIC register header (include/asm-ia64/sn/pci/pic.h, pinned linux-2.4.37 tree, GPL); SGI Altix PIC structure and PCI bridge provider (linux-5.3 pin, arch/ia64/include/asm/sn/pic.h, pcibr_provider.h, arch/ia64/sn/pci/pcibr/); public Linux and OpenBSD PIC driver flag tables; shipped IRIX 6.5.30 IP35 pcibr flag routine (static reading)"
public_from = ["census:"]

[c]
offset_macro = "bare"

[registers.wid_stat]
offset = 0x8
access = "rw"
width = 64
grade = "established"
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, arch/ia64/include/asm/sn/pic.h (struct pic)"
doc = "Widget status, the second word of the standard widget configuration block (`p_wid_stat`). Offset, width and name are the header definition. Access direction is not stated by the header or by any code read; nothing in the SN2 driver or the IRIX objects reaches this register, so its behaviour is unknown."

