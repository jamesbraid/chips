unit = "r10000_secondary_cache_ecc"
prefix = "R10K"
title = "R10000 family CP0 CacheErr fields for secondary-cache errors"
doc = "Constants for the CP0 CacheErr register as the R10000 reports a secondary-cache error: the unit select in bits 31:30, the uncorrectable data-error way field, the tag-error field and the secondary block index. This unit holds constants only. The delivery rule, the check matrix and the syndrome classification are in devices/r10000_secondary_cache_ecc/README.md. Grades: established means the processor manual states it; inferred means a reasoned reading of the manual; unknown items are listed in the page."
from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001"
public_from = ["MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276"]

[constants]
R10K_CACHEERR_UNIT_SHIFT = { value = 30, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Lowest bit of the two-bit CacheErr unit select, bits 31:30." }
R10K_CACHEERR_UNIT_SECONDARY = { value = 2, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Unit select value for a secondary-cache error, binary 10 in bits 31:30." }

R10K_CACHEERR_D_SHIFT = { value = 26, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Lowest bit of the two-bit D field, bits 27:26, which identifies an uncorrectable secondary data error by way." }
R10K_CACHEERR_D_MASK = { value = 0x0c000000, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Mask for the two-bit D field, bits 27:26 of CP0 CacheErr." }

R10K_CACHEERR_TA_SHIFT = { value = 24, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Lowest bit of the two-bit TA field, bits 25:24, which identifies a secondary tag error." }
R10K_CACHEERR_TA_MASK = { value = 0x03000000, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Mask for the two-bit TA field, bits 25:24 of CP0 CacheErr." }

R10K_CACHEERR_SIDX_SHIFT = { value = 6, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Lowest bit of the secondary block index, bits 22:6 of CP0 CacheErr." }
R10K_CACHEERR_SIDX_MASK = { value = 0x007fffc0, grade = "established", from = "MIPS R10000 Microprocessor User's Manual, version 2.0, 007-2490-001, printed pages 274-276", doc = "Mask for the 17-bit secondary block index, bits 22:6 of CP0 CacheErr. The index is PA[22:6] for a 64-byte block and PA[22:7] for a 128-byte block." }
