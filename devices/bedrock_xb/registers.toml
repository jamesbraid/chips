unit = "bedrock_xb"
prefix = "BEDROCK"
title = "Bedrock internal crossbar (XB) registers outside the census"
doc = "The crossbar's 21 control, debug and error registers at the start of its block, the 14 error-clear registers and the first-error register. The census has only the block's row in the dump table. Names, offsets and field layouts come from the public Linux header; that header states no access direction, reset value or side effect, so every item is inferred and the reset values are unknown. Access is recorded as rw for the control and error registers, r for the first-error register and w for the clear registers: the first two are assumed from the header's wording, the first-error register is what the header says (not writable). Clear registers take the field layout of the register they clear. Bit positions are the little-endian layout the header gives first."
from = "Linux 2.5.40 public SN1 crossbar register header: register names, offsets and field layouts"
public_from = ["Linux 2.5.40"]

[c]
offset_macro = "bare"

[enums.first_error_source]
values = { poq0 = { value = 0xf, grade = "inferred" }, piq0 = { value = 0xe, grade = "inferred" }, poq1 = { value = 0xd, grade = "inferred" }, piq1 = { value = 0xc, grade = "inferred" }, mp0 = { value = 0xb, grade = "inferred" }, mp1 = { value = 0xa, grade = "inferred" }, mmq = { value = 0x9, grade = "inferred" }, miq = { value = 0x8, grade = "inferred" }, noq = { value = 0x7, grade = "inferred" }, niq = { value = 0x6, grade = "inferred" }, ioq = { value = 0x5, grade = "inferred" }, iiq = { value = 0x4, grade = "inferred" }, loq = { value = 0x3, grade = "inferred" }, liq = { value = 0x2, grade = "inferred" } }

[registers.xb_parms]
offset = 0x700000
access = "rw"
width = 64
grade = "inferred"
doc = "Crossbar-wide parameters. The header gives the bypass enable and three wrap periods (age, deadlock, tail). It does not say what the periods count or how the crossbar uses them."

[registers.xb_parms.fields]
byp_en = { bits = [0, 0], grade = "inferred" }
age_wrap = { bits = [11, 4], grade = "inferred" }
deadlock_wrap = { bits = [31, 12], grade = "inferred" }
tail_wrap = { bits = [51, 32], grade = "inferred" }

[registers.xb_slow_gnt]
offset = 0x700008
access = "rw"
width = 64
grade = "inferred"
doc = "Wavefront grant period per unit: the number of cycles between grant opportunities. The all-ones value gives no grants, and one less than all ones the slowest rate. Used to apply backpressure to a unit's output queues. Bypass grants are not affected."

[registers.xb_slow_gnt.fields]
lb = { bits = [3, 0], grade = "inferred" }
ii = { bits = [7, 4], grade = "inferred" }
ni = { bits = [11, 8], grade = "inferred" }
mmq = { bits = [15, 12], grade = "inferred" }
mp1 = { bits = [19, 16], grade = "inferred" }
mp0 = { bits = [23, 20], grade = "inferred" }
pi1 = { bits = [27, 24], grade = "inferred" }
pi0 = { bits = [31, 28], grade = "inferred" }

[registers.xb_spew_control]
offset = 0x700010
access = "rw"
width = 64
grade = "inferred"
doc = "Snoop selector for internal crossbar traffic, sent to the PI1 port. The header says only one selector should be set, and any set selector takes PI1 away from every use except this debug connection. Separate from the debug data select register."

[registers.xb_spew_control.fields]
snoop_liq = { bits = [0, 0], grade = "inferred" }
snoop_iiq = { bits = [1, 1], grade = "inferred" }
snoop_niq = { bits = [2, 2], grade = "inferred" }
snoop_miq = { bits = [3, 3], grade = "inferred" }
snoop_piq0 = { bits = [4, 4], grade = "inferred" }
snoop_loq = { bits = [5, 5], grade = "inferred" }
snoop_ioq = { bits = [6, 6], grade = "inferred" }
snoop_noq = { bits = [7, 7], grade = "inferred" }
snoop_mmq = { bits = [8, 8], grade = "inferred" }
snoop_mp0 = { bits = [9, 9], grade = "inferred" }
snoop_poq0 = { bits = [10, 10], grade = "inferred" }

[registers.xb_ioq_arb_trigger]
offset = 0x700018
access = "rw"
width = 64
grade = "inferred"
doc = "Clocks the I/O output queue waits before crossbar arbitration starts, so the slower I/O data rate can catch up in the queue buffer."

[registers.xb_ioq_arb_trigger.fields]
clocks = { bits = [3, 0], grade = "inferred" }

[registers.xb_poq0_error]
offset = 0x700020
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the PI0 output queue. The header says software may write it to test error handling, and the write raises an interrupt."

[registers.xb_poq0_error.fields]
invalid_xsel = { bits = [1, 0], grade = "inferred" }
overflow = { bits = [5, 4], grade = "inferred" }
underflow = { bits = [9, 8], grade = "inferred" }
tail_timeout = { bits = [13, 12], grade = "inferred" }

[registers.xb_piq0_error]
offset = 0x700028
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the PI0 input queue. The header says the processor-interface input cannot underflow, so no underflow field is defined."

[registers.xb_piq0_error.fields]
overflow = { bits = [1, 0], grade = "inferred" }
deadlock_timeout = { bits = [5, 4], grade = "inferred" }

[registers.xb_poq1_error]
offset = 0x700030
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the PI1 output queue. The header gives no field layout for it."

[registers.xb_piq1_error]
offset = 0x700038
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the PI1 input queue. The header gives no field layout for it."

[registers.xb_mp0_error]
offset = 0x700040
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the memory-to-PI0 output queue. The header notes the crossbar select is decoded on the memory side of this queue, so no invalid-select field is defined."

[registers.xb_mp0_error.fields]
overflow = { bits = [5, 4], grade = "inferred" }
underflow = { bits = [9, 8], grade = "inferred" }
tail_timeout = { bits = [13, 12], grade = "inferred" }

[registers.xb_mp1_error]
offset = 0x700048
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the memory-to-PI1 output queue. The header gives no field layout for it."

[registers.xb_mmq_error]
offset = 0x700050
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the memory output queue that carries miscellaneous traffic to LB, NI and II. The header gives no field layout for it."

[registers.xb_miq_error]
offset = 0x700058
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the memory input queue. The header says further errors of this queue are logged in the memory unit's input error registers."

[registers.xb_miq_error.fields]
deadlock_timeout = { bits = [7, 4], grade = "inferred" }

[registers.xb_noq_error]
offset = 0x700060
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the NI output queue. The header defines three separate 4-bit counters for it."

[registers.xb_noq_error.fields]
overflow = { bits = [7, 4], grade = "inferred" }
underflow = { bits = [11, 8], grade = "inferred" }
tail_timeout = { bits = [15, 12], grade = "inferred" }

[registers.xb_niq_error]
offset = 0x700068
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the NI input queue. The header gives no field layout for it."

[registers.xb_ioq_error]
offset = 0x700070
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the I/O output queue. The header gives no field layout for it."

[registers.xb_iiq_error]
offset = 0x700078
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the I/O input queue. The header gives no field layout for it."

[registers.xb_loq_error]
offset = 0x700080
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the LB output queue."

[registers.xb_loq_error.fields]
invalid_xsel = { bits = [1, 0], grade = "inferred" }
underflow = { bits = [9, 8], grade = "inferred" }
tail_timeout = { bits = [13, 12], grade = "inferred" }

[registers.xb_liq_error]
offset = 0x700088
access = "rw"
width = 64
grade = "inferred"
doc = "Error record for the LB input queue. The header says it records only request-channel errors: the reply channel has no flow control and cannot overflow or deadlock."

[registers.xb_liq_error.fields]
overflow = { bits = [0, 0], grade = "inferred" }
deadlock_timeout = { bits = [4, 4], grade = "inferred" }

[registers.xb_first_error]
offset = 0x700090
access = "r"
width = 64
grade = "inferred"
doc = "The first crossbar error latched. It latches when the valid bit is clear and an error occurs. Any set valid bit interrupts both processor interfaces. The interrupt stays until the error register that captured the error is cleared, then this register is cleared, in that order. The header says the register is not writable but is set whenever software writes any error register."

[registers.xb_first_error.fields]
err_type = { bits = [3, 0], grade = "inferred" }
channel = { bits = [7, 4], grade = "inferred" }
source = { bits = [11, 8], grade = "inferred", enum = "first_error_source" }
valid = { bits = [12, 12], grade = "inferred" }

[registers.xb_debug_data_ctl]
offset = 0x700098
access = "rw"
width = 64
grade = "inferred"
doc = "Selects which queue observation points drive debug output. The header says more than one selected point makes the debug output undefined. The output formats are not in the header."

[registers.xb_debug_data_ctl.fields]
observe_liq = { bits = [0, 0], grade = "inferred" }
observe_iiq = { bits = [1, 1], grade = "inferred" }
observe_niq = { bits = [2, 2], grade = "inferred" }
observe_miq = { bits = [3, 3], grade = "inferred" }
observe_piq1 = { bits = [4, 4], grade = "inferred" }
observe_piq0 = { bits = [5, 5], grade = "inferred" }
observe_loq = { bits = [6, 6], grade = "inferred" }
observe_ioq = { bits = [7, 7], grade = "inferred" }
observe_noq = { bits = [8, 8], grade = "inferred" }
observe_mp1 = { bits = [9, 9], grade = "inferred" }
observe_mp0 = { bits = [10, 10], grade = "inferred" }
observe_mmq = { bits = [11, 11], grade = "inferred" }
observe_poq1 = { bits = [12, 12], grade = "inferred" }
observe_poq0 = { bits = [13, 13], grade = "inferred" }
observe_source_field = { bits = [14, 14], grade = "inferred" }
observe_lodata = { bits = [15, 15], grade = "inferred" }

[registers.xb_debug_arb_ctl]
offset = 0x7000a0
access = "rw"
width = 64
grade = "inferred"
doc = "Three-bit select for the debug mux of the crossbar's queues and arbiter. The header does not give the output each value selects."

[registers.xb_debug_arb_ctl.fields]
select = { bits = [2, 0], grade = "inferred" }

[registers.xb_poq0_error_clear]
offset = 0x700120
access = "w"
width = 64
grade = "inferred"
doc = "Clears the PI0 output queue error record. The header does not say whether a write clears by any value or only by set bits, so the mechanism is unknown. Field layout as the base register."

[registers.xb_piq0_error_clear]
offset = 0x700128
access = "w"
width = 64
grade = "inferred"
doc = "Clears the PI0 input queue error record. The write mechanism is unknown; field layout as the base register."

[registers.xb_poq1_error_clear]
offset = 0x700130
access = "w"
width = 64
grade = "inferred"
doc = "Clears the PI1 output queue error record. The write mechanism is unknown."

[registers.xb_piq1_error_clear]
offset = 0x700138
access = "w"
width = 64
grade = "inferred"
doc = "Clears the PI1 input queue error record. The write mechanism is unknown."

[registers.xb_mp0_error_clear]
offset = 0x700140
access = "w"
width = 64
grade = "inferred"
doc = "Clears the memory-to-PI0 output queue error record. The write mechanism is unknown."

[registers.xb_mp1_error_clear]
offset = 0x700148
access = "w"
width = 64
grade = "inferred"
doc = "Clears the memory-to-PI1 output queue error record. The write mechanism is unknown."

[registers.xb_mmq_error_clear]
offset = 0x700150
access = "w"
width = 64
grade = "inferred"
doc = "Clears the memory output queue error record. The write mechanism is unknown."

[registers.xb_miq_error_clear]
offset = 0x700158
access = "w"
width = 64
grade = "inferred"
doc = "Clears the memory input queue error record. The header names this register with an extra XM_ in the macro, and its comment says it clears the MIQ error register. The write mechanism is unknown."

[registers.xb_noq_error_clear]
offset = 0x700160
access = "w"
width = 64
grade = "inferred"
doc = "Clears the NI output queue error record. The write mechanism is unknown."

[registers.xb_niq_error_clear]
offset = 0x700168
access = "w"
width = 64
grade = "inferred"
doc = "Clears the NI input queue error record. The write mechanism is unknown."

[registers.xb_ioq_error_clear]
offset = 0x700170
access = "w"
width = 64
grade = "inferred"
doc = "Clears the I/O output queue error record. The write mechanism is unknown."

[registers.xb_iiq_error_clear]
offset = 0x700178
access = "w"
width = 64
grade = "inferred"
doc = "Clears the I/O input queue error record. The write mechanism is unknown."

[registers.xb_loq_error_clear]
offset = 0x700180
access = "w"
width = 64
grade = "inferred"
doc = "Clears the LB output queue error record. The write mechanism is unknown."

[registers.xb_liq_error_clear]
offset = 0x700188
access = "w"
width = 64
grade = "inferred"
doc = "Clears the LB input queue error record. The write mechanism is unknown."

[registers.xb_first_error_clear]
offset = 0x700190
access = "w"
width = 64
grade = "inferred"
doc = "Clears the first-error register. The header says it is cleared after the error register that captured the error. The write mechanism is unknown."

[constants]
XB_PARMS_RESET_DEFAULTS = { value = 0x0008000080000021, grade = "inferred", doc = "Software constant named as the reset defaults in the Linux 2.5.40 public SN1 crossbar header. It is what software writes, not a hardware reset value, and the reset value is unknown. Decodes to bypass on, age period 2, and deadlock and tail periods with only the top bit of their 20-bit fields set." }
XB_PARMS_ACTIVE_DEFAULTS = { value = 0x00080000fffff021, grade = "inferred", doc = "Software constant named as the active defaults in the same public header. Same as the reset constant except the deadlock period has all 20 bits set. Whether software writes this value is unknown." }
