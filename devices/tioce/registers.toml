[registers.adm_int_status]
offset = 0x58
access = "rw"
width = 64
grade = "established"
doc = "Interrupt status. Bit n is the interrupt source named by the header (error, link 1 and 2 errors, PCIe error, hot-plug events per port, INTA to INTD of each port, message slots 0 to 3, power-management events). The provider reads it on revision A before forcing an interrupt. Name and offset are the vendor header's definition (struct member ce_adm_int_status). The header gives no access direction or reset value; access rw is a placeholder. Field layout: the header defines the bit position of every source. Bit 14 is also named as the first message slot. Bits 18 to 21 and above 23 have no definition."

