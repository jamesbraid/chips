[registers.adm_int_dest]
offset = 0x88
count = 15
stride = 0x8
access = "rw"
width = 64
grade = "established"
doc = "Interrupt destination, one per source (the header declares fifteen). The provider writes the kernel vector in bits 63:56 (shift INTR_VECTOR_SHFT) ORed with the destination coretalk address of the target CPU, indexed by interrupt source bit. Name and offset are the vendor header's definition (struct member ce_adm_int_dest). The header gives no access direction or reset value; access rw is a placeholder. The vector field is inferred: the header gives only the shift 56 and the provider ORs the vector over the destination address; bit 63 as the top is the end of the word, not a header fact. The extent of the address part is unknown."

[registers.adm_int_dest.fields]
vector = { bits = [63, 56], grade = "inferred" }

