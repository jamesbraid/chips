[registers.adm_force_int]
offset = 0x78
access = "rw"
width = 64
grade = "established"
doc = "Force interrupt. Bits 0 to 7 force INTA to INTD of port 1 then port 2; bit 8 forces always. The bit numbering differs from the status register, and the provider maps explicitly. Revision A does not use it (workaround). Name and offset are the vendor header's definition (struct member ce_adm_force_int). The header gives no access direction or reset value; access rw is a placeholder. Field layout from the header: bits 0 to 7 are the four interrupt pins of each port, bit 8 forces unconditionally. These positions differ from the status register, and the provider maps between them explicitly."

