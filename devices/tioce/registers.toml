width = 64
grade = "established"
doc = "Interrupt status alias. The provider sets every bit through it at attach to clear transients (the alias is the write path to clear; role from that use). Name and offset are the vendor header's definition (struct member ce_adm_int_status_alias). The header gives no access direction or reset value; access rw is a placeholder. Field layout is inferred: the header gives positions only for the status and mask registers. The provider writes all ones here at attach, after a load and OR, to clear stale interrupts, which reads as a write-to-clear alias of the status word (inferred from the provider comment, not stated by the header)."

