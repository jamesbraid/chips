unit = "tioce"
prefix = "TIOCE"
title = "TIOCE (TIO PCI Express bridge), as SGI's Linux Altix platform code defines it"
doc = "Names and offsets are the definitions of SGI's Linux Altix platform code (header and provider, v5.3). The TIOCE's own register specification is not held. The header gives no access direction and no reset value for any register; rows say what the provider does where it touches one. Bit layouts the header defines are fields of their registers. Where the header names a register with its masks (interrupt status and mask, error summary and mask, force interrupt, the upstream engine control, page map, pipe select and mask, PCIe control, gearbox configuration, downstream engine configuration) the fields are established; the same layout on a sibling register (an alias, say) is inferred and said so on the register. Constants keep the plain values (identifiers, address windows, enhanced configuration masks)."
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e: arch/ia64/include/asm/sn/tioce.h, tioce_provider.h, arch/ia64/sn/pci/tioce_provider.c"
public_from = ["census:"]

[c]
offset_macro = "bare"

[registers.adm_id]
offset = 0x0
access = "rw"
width = 64
grade = "established"
doc = "Widget identification word: part 0xce00, source id 1, revision A = 1 (header constants). Revision A needs the access workaround described on the unit page. Name and offset are the vendor header's definition (struct member ce_adm_id). The header gives no access direction or reset value; access rw is a placeholder."

