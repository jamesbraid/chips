doc = "Time save RAM, seconds. While time save control bit 7 is set this byte follows the seconds counter; clearing that bit freezes it, which is how software reads the clock without a rollover. The PROM zeroes all five time save bytes before latching (the data sheet says to clear unused bits first); the kernel does not."

