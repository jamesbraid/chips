doc = "Hours compare RAM, a free RAM byte while interrupt control 1 bit 2 is clear. IRIX keeps its bad-clock flag in bit 0 of this byte (set when the kernel finds the date lost, cleared by a successful set). The PROM's start-up RAM test saves the byte, writes a5, reads it back and restores it. A qtest can discriminate: the byte holds any written value and survives with the clock running."

