[registers.ram_test]
offset = 0x7f
space = "dp8573a_common"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet Table III (RAM / test mode register); IRIX dp8573clk.h ram[1]"
doc = "A general RAM byte that doubles as the chip's test-mode register while the test-enable bit of the periodic flag register is set. The data sheet says to write zero here in a start-up sequence that first sets that bit. No shipped Indigo code touches it; a model can treat it as RAM."

[registers.periodic_flag]
offset = 0x0f
space = "dp8573a_rs0"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet periodic flag register; IRIX dp8573clk.h ck_pflag; kernel.o 0x518c writes zero; PROM 0xbfc2c7e8 writes zero"
doc = "Block 0. Bits 0 to 5 are the six periodic event flags: minutes, tens of seconds, seconds, 100 ms, 10 ms and 1 ms rollovers. They are set whether or not the matching interrupt is enabled and are cleared by reading the register. Bit 6 reads as the oscillator-fail flag (set on initial power-up and after an oscillator failure, cleared by starting the clock with the oscillator running) and, when written, selects battery-backed operation (zero) or single-supply operation (one). Bit 7 is the test-mode enable; software must keep it clear. IRIX and the PROM write zero here once while setting the clock, which asks for battery-backed operation and clears test mode. A qtest can discriminate: bits 0 to 5 are clear after a read, bit 6 is high before the first start of the clock after power-up and low after."

[registers.periodic_flag.fields]
minute = { bits = [0, 0], grade = "established", doc = "Minutes counter rolled over." }
ten_second = { bits = [1, 1], grade = "established", doc = "Tens-of-seconds digit rolled over." }
second = { bits = [2, 2], grade = "established", doc = "Seconds counter rolled over." }
hundred_ms = { bits = [3, 3], grade = "established", doc = "100 ms digit rolled over." }
ten_ms = { bits = [4, 4], grade = "established", doc = "10 ms digit rolled over." }
ms = { bits = [5, 5], grade = "established", doc = "1 ms tick." }
osc_fail_or_single_supply = { bits = [6, 6], grade = "established", doc = "Read: oscillator failed. Write: zero selects battery-backed mode, one selects single-supply mode." }
test_enable = { bits = [7, 7], grade = "established", doc = "Test mode enable; keep clear." }

[registers.timesave_ctl]
offset = 0x13
space = "dp8573a_rs0"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet time save control register; IRIX dp8573clk.h ck_tsavctl; kernel.o 0x50e0 (writes 80 then 00); PROM 0xbfc2c73c"
doc = "Block 0. Bit 7 is the time save enable: while set the time save RAM follows the clock, and a write that clears it freezes the clock's value there. Bits 0 to 5 are general RAM; bit 6 is not present and reads zero. IRIX and the PROM read the clock by writing 80 then 00 and then reading the time save bytes; the kernel's set sequence writes zero here. A qtest can discriminate: write 80 then 00 leaves the five time save bytes equal to the counters at that instant and unchanged afterwards."

[registers.timesave_ctl.fields]
ram = { bits = [5, 0], grade = "established", doc = "General RAM bits." }
absent = { bits = [6, 6], grade = "established", doc = "Not present on the 8573A; reads zero." }
enable = { bits = [7, 7], grade = "established", doc = "Time save enable." }

[registers.rt_mode]
offset = 0x07
space = "dp8573a_rs1"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet real time mode register; IRIX dp8573clk.h ck_rtime; kernel.o 0x50e0 and 0x518c; PROM 0xbfc2c73c"
doc = "Block 1. Bits 1:0 are the leap-year counter: years since the last leap year, 0 meaning this year is one. Bit 2 selects 12-hour (set) or 24-hour (clear) mode; IRIX and the PROM leave it clear. Bit 3 starts the clock when set and holds the counters stopped when clear; while the oscillator has not started the chip holds it clear, and it clears itself on an oscillator failure. Bit 4 keeps the interrupt configuration alive in standby; both programs set it with bit 3 (run bits 0x18). Bits 7:5 are general RAM on the 8573A (crystal select bits on the 8572A). The data sheet requires clearing bit 3 before writing the counters; IRIX and the PROM do exactly that and then write the mode back with bit 3 set and the leap field from the year. A qtest can discriminate: the counters advance only while bit 3 is set, and a read of the clock sequence returns the mode byte with bits 3 and 4 as written."

[registers.rt_mode.fields]
leap = { bits = [1, 0], grade = "established", doc = "Years since the last leap year." }
hour12 = { bits = [2, 2], grade = "established", doc = "Set for 12-hour mode with an AM/PM bit; clear for 24-hour mode." }
run = { bits = [3, 3], grade = "established", doc = "Clock start (set) or stop (clear)." }
int_standby = { bits = [4, 4], grade = "established", doc = "Interrupt operation in standby." }
ram = { bits = [7, 5], grade = "established", doc = "General RAM bits on the 8573A." }

[registers.output_mode]
offset = 0x0b
space = "dp8573a_rs1"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet output mode register; IRIX dp8573clk.h ck_outmode; kernel.o 0x518c writes zero; PROM 0xbfc2c7e8 writes zero"
doc = "Block 1. Bit 7 chooses what the MFO pin carries: the power-fail interrupt (clear) or the buffered crystal oscillator (set). Bits 6:0 are general RAM. IRIX and the PROM write zero while setting the clock. Where MFO is wired on the Indigo is unknown."

[registers.output_mode.fields]
ram = { bits = [6, 0], grade = "established", doc = "General RAM bits." }
mfo_oscillator = { bits = [7, 7], grade = "established", doc = "MFO pin carries the buffered oscillator instead of the power-fail interrupt." }

[registers.int0_ctl]
offset = 0x0f
space = "dp8573a_rs1"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet interrupt control register 0; IRIX dp8573clk.h ck_int0ctl"
doc = "Block 1. Bits 0 to 5 enable the six periodic interrupts (minutes, tens of seconds, seconds, 100 ms, 10 ms, 1 ms), which raise main status bit 2 and the interrupt output; bits 6 and 7 are general RAM. Shipped Indigo code never writes this register (the kernel's clock tick comes from the 8254 timer), so what it holds at power-up decides whether the chip interrupts; the data sheet says its contents are random until written."

[registers.int0_ctl.fields]
minute = { bits = [0, 0], grade = "established", doc = "Minutes periodic interrupt enable." }
ten_second = { bits = [1, 1], grade = "established", doc = "Tens-of-seconds periodic interrupt enable." }
second = { bits = [2, 2], grade = "established", doc = "Seconds periodic interrupt enable." }
hundred_ms = { bits = [3, 3], grade = "established", doc = "100 ms periodic interrupt enable." }
ten_ms = { bits = [4, 4], grade = "established", doc = "10 ms periodic interrupt enable." }
ms = { bits = [5, 5], grade = "established", doc = "1 ms periodic interrupt enable." }
ram = { bits = [7, 6], grade = "established", doc = "General RAM bits." }

[registers.int1_ctl]
offset = 0x13
space = "dp8573a_rs1"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet interrupt control register 1; IRIX dp8573clk.h ck_int1ctl and RTC_INT1INIT; kernel.o 0x518c; PROM 0xbfc2c7e8 (both write 80); ide rt_clock test writes the same"
doc = "Block 1. Bits 0 to 5 enable the compare of seconds, minutes, hours, day of month, month and day of week against the matching compare RAM byte: a clear bit forces that comparison to always-equal and frees the RAM byte. Bit 6 lets an alarm match (all enabled compares equal) raise the interrupt output; bit 7 enables the power-fail interrupt and the low-battery circuit. IRIX and the PROM write 80 whenever they set the clock, which disables every compare and the alarm interrupt and leaves only the power-fail interrupt enabled. A qtest can discriminate: with bits 0 to 5 clear the compare RAM never raises main status bit 3."

[registers.int1_ctl.fields]
cmp_seconds = { bits = [0, 0], grade = "established", doc = "Compare seconds." }
cmp_minutes = { bits = [1, 1], grade = "established", doc = "Compare minutes." }
cmp_hours = { bits = [2, 2], grade = "established", doc = "Compare hours." }
cmp_day_of_month = { bits = [3, 3], grade = "established", doc = "Compare day of month." }
cmp_month = { bits = [4, 4], grade = "established", doc = "Compare month." }
cmp_day_of_week = { bits = [5, 5], grade = "established", doc = "Compare day of week." }
alarm_int_enable = { bits = [6, 6], grade = "established", doc = "Alarm match raises the interrupt output." }
power_fail_int_enable = { bits = [7, 7], grade = "established", doc = "Power-fail interrupt enable." }
