unit = "dp8573a"
prefix = "DP8573A"
title = "National DP8573A real-time clock and battery-backed RAM (Indigo, R3000 and R4000 boards)"
doc = "The Indigo's time-of-day chip, reached through the first peripheral controller at physical 0x1fb80e00. Offsets here are byte addresses from that base and name the byte a big-endian CPU addresses: each chip register sits in the low byte lane of a 4-byte slot, so register n is at offset 4n+3 (a little-endian CPU addresses the same register 3 bytes lower). Registers 1 to 4 exist twice, selected by the register-select bit of the main status register, which are the dp8573a_rs0 and dp8573a_rs1 spaces below; everything else is in common. IRIX comments call the part a DP8572 or DP8573 and name its header and structure after the 8573; the 8573A data sheet's address table is the layout software uses, and the 8572A adds a second page, two Julian-day counters and a page-select bit that no Indigo software touches. The board's exact part number is not stated by any shipped file. Grades: established means read in the IRIX source, the kernel object or the 4.0.5D PROM (the README cites addresses) or stated by the data sheet; inferred means a reasoned reading; unknown means nothing held settles it. Nothing was measured on a board. The prose and the behaviour a model needs are in devices/dp8573a/README.md."
from = "IRIX 6.5 IP20 clock header and kernel object, PROM 070-8116-004 (4.0.5D), National DP8573A data sheet (1993 RTC handbook)"
public_from = ["National Semiconductor 1993 real-time clock handbook, DP8573A section", "NetBSD sgimips dp8573areg.h and dpclock.c"]
name_source = "public"
name_cite = "NetBSD sys/arch/sgimips/dev/dp8573areg.h and the National DP8573A data sheet"

[spaces.dp8573a_common]
unit = "byte"
doc = "Registers that answer whichever register block is selected: main status, the clock counters, compare RAM, time save RAM and the general RAM bytes."

[spaces.dp8573a_rs0]
unit = "byte"
doc = "Register block 0 (main status bit 6 clear): the periodic flag and time save control registers, at the slots of chip registers 3 and 4."

[spaces.dp8573a_rs1]
unit = "byte"
doc = "Register block 1 (main status bit 6 set): real time mode, output mode and the two interrupt control registers, at the slots of chip registers 1 to 4."

[constants]
WINDOW_SIZE = { value = 0x80, grade = "established", doc = "Bytes the 32 four-byte slots occupy, from the clock base." }
LANE_OFFSET = { value = 3, grade = "established", doc = "Byte of each 4-byte slot that carries the register on a big-endian CPU. The header shifts word accesses by 0 on the R4000 board and by 24 on the older R3000 and 4D-generation boards." }
RT_RUN = { value = 0x18, grade = "established", doc = "Real time mode bits the IRIX header calls run: start (bit 3) plus interrupt-in-standby (bit 4). The kernel and PROM treat a clock whose mode register has neither bit set as not running." }
RT_RS = { value = 0x40, grade = "established", doc = "Main status bit 6, register select, as the header names it." }
RT_TIMSAV_ON = { value = 0x80, grade = "established", doc = "Time save control bit 7, time save enable." }
INT1_INIT = { value = 0x80, grade = "established", doc = "Interrupt control 1 value both IRIX and the PROM write: only the power-fail interrupt enable set, all alarm compares off." }
BAD_CLOCK_FLAG = { value = 0x01, grade = "established", doc = "Bit of the hours compare RAM byte the IRIX kernel uses as its software flag that the clock date is not trustworthy." }
EPOCH_YEAR = { value = 1970, grade = "established", doc = "Calendar year the year counter counts from in both IRIX and the PROM: the counter holds BCD years since 1970." }
RAM_TEST_A = { value = 0xa5, grade = "established", doc = "Pattern the PROM writes to the hours compare RAM byte in its start-up RAM test." }
RAM_TEST_B = { value = 0x5a, grade = "established", doc = "Pattern the PROM writes to the day-of-month compare RAM byte in the same test." }

[registers.status]
offset = 0x03
space = "dp8573a_common"
access = "rw"
width = 8
reset = "unknown"
ro = 0x03
w1c = 0x0c
grade = "established"
from = "DP8573A data sheet, main status register and Table III; IRIX dp8573clk.h ck_status; kernel.o 0x50e0 and 0x518c; PROM 0xbfc2c73c"
doc = "Always present, whichever block is selected. Bit 0 is the interrupt status, high while the chip's interrupt output is asserted (read only). Bit 1 is the power-fail status, which follows the PFAIL input and cannot be written. Bit 2 is the periodic interrupt flag and bit 3 the alarm interrupt flag; both are cleared by writing a one to them and are set whether or not the interrupt is enabled. Bits 4, 5 and 7 are general RAM bits on the 8573A. Bit 6 selects register block 1. IRIX and the PROM write zero to select block 0 before every access sequence and set bit 6 with a read-modify-write (the PROM and kernel read routines leave it set when they finish). A qtest can discriminate: bit 6 flips which of two registers answers at the slot of register 3, bits 2 and 3 clear only on a one written, bits 0 and 1 ignore writes."

[registers.status.fields]
interrupt_status = { bits = [0, 0], grade = "established", doc = "Interrupt output pending." }
power_fail = { bits = [1, 1], grade = "established", doc = "Power-fail status from the PFAIL pin. Read only." }
periodic = { bits = [2, 2], grade = "established", doc = "Periodic interrupt flag; write one to clear." }
alarm = { bits = [3, 3], grade = "established", doc = "Alarm (time compare) interrupt flag; write one to clear." }
ram4 = { bits = [4, 4], grade = "established", doc = "General RAM bit on the 8573A." }
ram5 = { bits = [5, 5], grade = "established", doc = "General RAM bit on the 8573A." }
register_select = { bits = [6, 6], grade = "established", doc = "Selects register block 1 (set) or block 0 (clear) for the slots of registers 1 to 4." }
ram7 = { bits = [7, 7], grade = "established", doc = "General RAM bit on the 8573A. On the 8572A this is the page select; no Indigo software sets it." }

[registers.hundredths]
offset = 0x17
space = "dp8573a_common"
access = "rw"
width = 8
reset = "unknown"
grade = "established"
from = "DP8573A data sheet Table III; IRIX dp8573clk.h ck_counter[0]; PROM 0xbfc2c878 (motion test), 0xbfc2c73c"
doc = "Hundredths and tenths of a second, two BCD digits, 00 to 99, incrementing every 10 ms while the clock runs. The PROM's first read of the clock after reset polls this byte and requires it to change (see the README). A qtest can discriminate: with the start bit set the byte changes within a few tens of milliseconds and wraps from 99 to 00 as it carries into seconds."

