unit = "hub_md_extra"
prefix = "HUB"
title = "Hub memory and directory register layouts and constants outside the census"
from = "public Linux SN0 Hub memory/directory header, pinned linux tree (field masks, shifts and default constants)"
public_from = ["census:", "public Linux SN0 Hub memory/directory header", "shipped IRIX"]

# The census has the offsets of the memory and directory registers at 0x200000 to 0x2000a8 and
# 0x210000 to 0x210038, and their access sites. It has no field layouts. These word layouts
# come from the public header's masks and shifts. The register offsets themselves stay in
# devices/hub/registers.toml. Each word here is the bit layout of a register that the census names.
# The header states no access type for any of them. Reset defaults are software constants in
# the header, not a reset read from hardware, so they are graded inferred.

[words.MD_MIG_CANDIDATE_FORMAT]
width = 64
grade = "established"
from = "public Linux SN0 Hub memory/directory header: MD_MIG_CANDIDATE masks"
doc = "Layout of the page migration candidate. The header's initiator and node-number masks overlap at bits 28:20, so only the single-bit fields are imported here. The shipped IRIX kernel reads only the read-to-clear alias (md_mig_candidate_clr), in a loop until the valid bit is clear, and takes the node and page fields below from it. That a read consumes the candidate is inferred from the register name and the loop. Nothing in the kernel accesses the candidate register itself, which sits one doubleword below the alias."

[words.MD_MIG_CANDIDATE_FORMAT.fields]
valid = { bits = [63, 63], grade = "established", doc = "Candidate valid bit." }
type = { bits = [30, 30], grade = "established", doc = "Candidate type bit, named MD_MIG_CANDIDATE_TYPE in the header. Its meaning is not stated there." }
overrun = { bits = [29, 29], grade = "established", doc = "Candidate overrun bit." }
node = { bits = [28, 20], grade = "inferred", from = "public Linux SN0 Hub memory/directory header: MD_MIG_CANDIDATE_NODEID_MASK (0x1ff at shift 20)", doc = "Node number of the requester, nine bits at 28:20, from the header's node-id mask. The header's initiator mask (11 bits at shift 18) overlaps these bits, so the layout is graded inferred." }
page = { bits = [17, 0], grade = "inferred", from = "public Linux SN0 Hub memory/directory header: MD_MIG_CANDIDATE_ADDR_MASK (0x3ffff)", doc = "Page index within the node, eighteen bits at 17:0, from the header's address mask. The header's own comment says the address starts at bit 14, which disagrees with the mask, so the position is graded inferred." }

