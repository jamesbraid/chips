[constants]
# Default values the header defines for the registers above. They are what software writes as a
# starting value, so the reset of the hardware is not established by them.
HUB_MD_MEMORY_CONFIG_RESET_DEFAULTS = { value = 0x1e7fbc3fffffff, grade = "established", from = "irix-657m-src irix/kern/sys/SN/SN0/hubmd.h, MMC_RESET_DEFAULTS, MRC_RESET_DEFAULTS, MMS_RESET_DEFAULTS and MLAN_RESET_DEFAULTS; written by stand/arcs/lib/libkl/ml/hub.c and stand/arcs/IP27prom/mdir.c", doc = "Composite default of the memory configuration register, built from the header's default constant. The header gives it as a value software writes, not a reset read from hardware. Eight bank codes of 7, reply guarantee 15, both directory and ignore-ECC bits set, and the four timing fields at their header values. The IRIX header defines the macro with this value, and the PROM writes it to the register." }
HUB_MD_REFRESH_CONTROL_RESET_DEFAULTS = { value = 0x400, grade = "established", from = "irix-657m-src irix/kern/sys/SN/SN0/hubmd.h, MMC_RESET_DEFAULTS, MRC_RESET_DEFAULTS, MMS_RESET_DEFAULTS and MLAN_RESET_DEFAULTS; written by stand/arcs/lib/libkl/ml/hub.c and stand/arcs/IP27prom/mdir.c", doc = "Default value of the refresh control register, from the header's default constant. Not a reset read. The IRIX header defines the macro with this value, and the PROM writes it to the register." }
HUB_MD_MOQ_SIZE_RESET_DEFAULTS = { value = 0x3212, grade = "established", from = "irix-657m-src irix/kern/sys/SN/SN0/hubmd.h, MMC_RESET_DEFAULTS, MRC_RESET_DEFAULTS, MMS_RESET_DEFAULTS and MLAN_RESET_DEFAULTS; written by stand/arcs/lib/libkl/ml/hub.c and stand/arcs/IP27prom/mdir.c", doc = "Default value of the outgoing queue size register, from the header's default constant. Not a reset read. The IRIX header defines the macro with this value, and the PROM writes it to the register." }
HUB_MD_MLAN_CTL_RESET_DEFAULTS = { value = 0x18b100000, grade = "established", from = "irix-657m-src irix/kern/sys/SN/SN0/hubmd.h, MMC_RESET_DEFAULTS, MRC_RESET_DEFAULTS, MMS_RESET_DEFAULTS and MLAN_RESET_DEFAULTS; written by stand/arcs/lib/libkl/ml/hub.c and stand/arcs/IP27prom/mdir.c", doc = "Default value of the one-wire control register: the two phase fields at 0x31 each, from the header's default constant. Not a reset read. The IRIX header defines the macro with this value, and the PROM writes it to the register." }
HUB_MD_MLAN_CTL_ACCESS_BYTES = { value = 8, grade = "established", doc = "Access size in bytes of the one-wire control register in the shipped IRIX kernel accessor: its loads and stores there are doubleword (census context). Bit 33 belongs to the upper phase field, so a 32-bit access cannot write the whole register; that consequence follows from the field layout, not from a trace." }

# Memory bank granule. A bank index is the address bits above bit 28 (the header's shift for 512 MB).
HUB_MD_BANK_SHIFT = { value = 29, grade = "established", doc = "Log2 of the 512 MB bank granule, per the header's MD_BANK_SHFT." }
HUB_MD_BANK_MASK = { value = 0xe0000000, grade = "established", doc = "Bank index mask, bits 31:29, per the header's MD_BANK_MASK." }
HUB_MD_MEM_BANKS_N_MODE = { value = 4, grade = "established", doc = "Bank count in the header's N-mode build (CONFIG_SGI_SN_N_MODE)." }
HUB_MD_MEM_BANKS_M_MODE = { value = 8, grade = "established", doc = "Bank count in the header's M-mode build, the default when N mode is not configured." }

# Directory format bit values, as the header's directory-type accessor reads them.
HUB_MD_DIRTYPE_STANDARD = { value = 0, grade = "established", doc = "Standard directory format, when the directory format bit is clear." }
HUB_MD_DIRTYPE_PREMIUM = { value = 1, grade = "established", doc = "Premium directory format, when the directory format bit is set." }

# Bank size codes. The codes are three bits wide in the bank fields, so codes 8 to 10 fit only
# in the header's size table and not in a bank field. A code of 4 MB shifted left by the code
# gives the bank size in bytes, per the header's size macro.
HUB_MD_SIZE_EMPTY = { value = 0, grade = "established", doc = "Bank code 0: empty. Valid in the memory configuration register, per the header comment." }
HUB_MD_SIZE_8MB = { value = 1, grade = "established", doc = "Bank code 1: 8 MB." }
HUB_MD_SIZE_16MB = { value = 2, grade = "established", doc = "Bank code 2: 16 MB." }
HUB_MD_SIZE_32MB = { value = 3, grade = "established", doc = "Bank code 3: 32 MB. The header marks it broken in the first Hub revision." }
HUB_MD_SIZE_64MB = { value = 4, grade = "established", doc = "Bank code 4: 64 MB. Valid in the memory configuration register, per the header comment." }
HUB_MD_SIZE_128MB = { value = 5, grade = "established", doc = "Bank code 5: 128 MB. Valid in the memory configuration register, per the header comment." }
HUB_MD_SIZE_256MB = { value = 6, grade = "established", doc = "Bank code 6: 256 MB. The header gives no validity annotation for it." }
HUB_MD_SIZE_512MB = { value = 7, grade = "established", doc = "Bank code 7: 512 MB. Valid in the memory configuration register, per the header comment." }
HUB_MD_SIZE_1GB = { value = 8, grade = "established", doc = "Bank code 8: 1 GB. Does not fit a three-bit bank field." }
HUB_MD_SIZE_2GB = { value = 9, grade = "established", doc = "Bank code 9: 2 GB. Does not fit a three-bit bank field." }
HUB_MD_SIZE_4GB = { value = 10, grade = "established", doc = "Bank code 10: 4 GB. Does not fit a three-bit bank field." }

# Directory state encodings the header gives for the directory word.
HUB_MD_DIR_SHARED = { value = 0x0, grade = "established", doc = "Directory state shared, from the header's state constants." }
HUB_MD_DIR_POISONED = { value = 0x1, grade = "established", doc = "Directory state poisoned, from the header's state constants." }
HUB_MD_DIR_EXCLUSIVE = { value = 0x2, grade = "established", doc = "Directory state exclusive, from the header's state constants." }
HUB_MD_DIR_BUSY_SHARED = { value = 0x3, grade = "established", doc = "Directory state busy shared, from the header's state constants." }
HUB_MD_DIR_BUSY_EXCL = { value = 0x4, grade = "established", doc = "Directory state busy exclusive, from the header's state constants." }
HUB_MD_DIR_WAIT = { value = 0x5, grade = "established", doc = "Directory state wait, from the header's state constants." }
HUB_MD_DIR_UNOWNED = { value = 0x7, grade = "established", doc = "Directory state unowned, from the header's state constants." }
HUB_MD_REFCNT_COUNT_MASK_PREMIUM = { value = 0x7ffff, grade = "established", from = "public Linux SN0 Hub memory/directory header: MD_PPROT_REFCNT_SHFT, MD_PPROT_REFCNT_WIDTH", doc = "Nineteen-bit reference count mask, premium memory; which memory is premium is inferred." }
HUB_MD_REFCNT_COUNT_MASK_STANDARD = { value = 0x7ff, grade = "established", from = "public Linux SN0 Hub memory/directory header: MD_SPROT_REFCNT_SHFT, MD_SPROT_REFCNT_WIDTH", doc = "Eleven-bit reference count mask, standard memory." }
HUB_MD_REFCNT_COUNT_SHIFT = { value = 5, grade = "established", from = "public Linux SN0 Hub memory/directory header: MD_PPROT_REFCNT_SHFT and MD_SPROT_REFCNT_SHFT", doc = "Bit position of the count in a node's reference word." }
