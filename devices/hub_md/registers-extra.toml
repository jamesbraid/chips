# ---- MD: memory and directory (configuration, migration, error latches)
[registers.md_memory_config]
offset = 0x200018
access = "rw"
width = 64
grade = "established"
from = "census: 3 sites, 3 routines (r); census: 13 sites, 12 routines (rw, indexed)"
reset = 0x1e7fbc3fffffff
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register MD_MEMORY_CONFIG (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7458"
doc = "Layout of the memory configuration register. Bank descriptors take bits 23:0, three bits each. The timing fields and the bank-size codes are named by the header, and their meaning is only partly stated there."

[registers.md_memory_config.fields]
bank0 = { bits = [2, 0], grade = "established", doc = "Size code of bank 0, bits 2:0. Codes are in the size table below.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
bank1 = { bits = [5, 3], grade = "established", doc = "Size code of bank 1, bits 5:3.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
bank2 = { bits = [8, 6], grade = "established", doc = "Size code of bank 2, bits 8:6.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
bank3 = { bits = [11, 9], grade = "established", doc = "Size code of bank 3, bits 11:9.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
bank4 = { bits = [14, 12], grade = "established", doc = "Size code of bank 4, bits 14:12. The header sizes eight banks in its M-mode build.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
bank5 = { bits = [17, 15], grade = "established", doc = "Size code of bank 5, bits 17:15.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
bank6 = { bits = [20, 18], grade = "established", doc = "Size code of bank 6, bits 20:18.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
bank7 = { bits = [23, 21], grade = "established", doc = "Size code of bank 7, bits 23:21.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
reply_guar = { bits = [27, 24], grade = "established", doc = "Reply guarantee count, four bits at 27:24 (mask 15 in the header). Its meaning is not stated in the header.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
dir_premium = { bits = [28, 28], grade = "established", doc = "Directory format bit: set selects the premium directory format, clear the standard one. The header's own accessor macro reads it this way.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
ignore_ecc = { bits = [29, 29], grade = "established", doc = "Ignore directory ECC bit, bit 29. The header names it MMC_IGNORE_ECC and gives no further behaviour.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
arb_mlss = { bits = [30, 30], grade = "established", doc = "Bit 30, named MMC_ARB_MLSS in the header. The header gives no meaning for it, so only the name and position are imported.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
io_prot_en = { bits = [31, 31], grade = "established", doc = "I/O protection enable, bit 31, named MMC_IO_PROT_EN in the header.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
dimm0_sel = { bits = [33, 32], grade = "established", doc = "Two-bit DIMM 0 select field at 33:32 (mask 3 in the header). The header gives no meaning for the values. The Origin 2000 boot firmware writes the value 2 here while exchanging the size codes of bank pairs (0,1), (2,3), (4,5) and (6,7), and the shipped kernel names a failing module from this field XORed with address bits 31:29; so the field permutes which DIMM serves a bank window. Established for the writes and the XOR, inferred for the effect.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
uctlr_wr = { bits = [38, 34], grade = "established", doc = "Five-bit write timing field at 38:34, named UCTLR_WR in the header. The header's abbreviation is the only name for it; its meaning is inferred from the name.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
uctlr_cyc = { bits = [43, 39], grade = "established", doc = "Five-bit cycle timing field at 43:39, named UCTLR_CYC in the header. The abbreviation is the only name given; its meaning is inferred from the name.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
fprom_wr = { bits = [48, 44], grade = "established", doc = "Five-bit boot flash write timing field at 48:44, named FPROM_WR in the header. The flash reading of the name is inferred.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }
fprom_cyc = { bits = [53, 49], grade = "established", doc = "Five-bit boot flash cycle timing field at 53:49, named FPROM_CYC in the header. The flash reading of the name is inferred.", from = "public Linux SN0 Hub memory/directory header: MD_MEMORY_CONFIG fields (MMC_*)" }

