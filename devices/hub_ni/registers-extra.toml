unit = "hub_ni_extra"
prefix = "HUB"
title = "Hub network interface field layouts, port and vector fields, and register offsets outside the census"
from = "public Linux SN0 Hub network interface header, pinned linux tree (names, masks, shifts and software default constants)"
public_from = ["census:", "public Linux SN0 Hub network interface header", "shipped IRIX"]

# The census has the offsets of most network interface registers and no field layouts. The word
# layouts here come from the public header's masks and shifts; the offsets the census lacks come
# from the same header. The header states no access type and no reset value for any register, so
# the access of each register added here is an assumption and is graded inferred. Its default
# constants are values software writes, not resets read from hardware. The header says every
# register in it is subject to change until tapeout.

[enums.ni_node_mode]
values = { more_memory = { value = 0, grade = "established" }, more_nodes = { value = 1, grade = "established" } }

[enums.ni_region_size]
values = { coarse = { value = 0, grade = "established" }, fine = { value = 1, grade = "established" } }

[enums.ni_pio_type]
values = { read = { value = 0, grade = "established" }, write = { value = 1, grade = "established" }, undefined = { value = 2, grade = "established", doc = "Named undefined in the header, for both the request and the status side." }, exchange = { value = 3, grade = "established" }, address_error = { value = 4, grade = "established", doc = "Status side only." }, command_error = { value = 5, grade = "established", doc = "Status side only." }, protection_error = { value = 6, grade = "established", doc = "Status side only." }, unknown = { value = 7, grade = "established", doc = "Status side only." } }

[enums.ni_pio_request_type]
values = { read = { value = 0, grade = "established" }, write = { value = 1, grade = "established" }, undefined = { value = 2, grade = "established", doc = "Named undefined in the header." }, exchange = { value = 3, grade = "established" } }

[enums.ni_vchannel]
values = { channel_a = { value = 0, grade = "established" }, channel_b = { value = 1, grade = "established" }, any = { value = 2, grade = "established" } }

# Registers the census does not reach. Offsets and names are from the public header. Each has no
# access type in the header, so access is an assumption and each register is graded inferred.

# Where the IRIX register table states a register's access, the row is graded established and its from names the
# header and the table; the rows it does not list keep the Linux-header reading and stay inferred.

