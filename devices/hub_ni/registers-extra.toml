# ---- NI: network interface (status, port, vector, routing tables)
[registers.ni_status_rev_id]
offset = 0x600000
access = "r"
width = 64
grade = "established"
from = "census: 18 sites, 16 routines (r); census: 5 sites, 4 routines (r, indexed)"
reset = 0x20020
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register NI_STATUS_REV_ID (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd7f50"
doc = "Layout of the status, revision and identity register, ni_status_rev_id. The header names the port status bits separately; this word uses the same names. The census of the shipped IRIX Origin 200/2000 kernel (the census field table) shows the register read with a shift of 8 and a nine-bit mask for the node number, a shift of 4 for the chip revision and a test of bit 17 for the region size; the header's layout agrees."

[registers.ni_status_rev_id.fields]
eightbit_mode = { bits = [30, 30], grade = "established", doc = "Eight-bit mode bit, bit 30, named NSRI_8BITMODE. The header gives no further meaning.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }
link_up = { bits = [29, 29], grade = "established", doc = "Link-up bit, bit 29, named NSRI_LINKUP. The header gives no further meaning.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }
down_reason = { bits = [28, 28], grade = "established", doc = "Down reason, bit 28. The header's comment says 0 means failed and 1 means never came out of reset.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }
more_nodes = { bits = [18, 18], grade = "established", enum = "ni_node_mode", doc = "Maximum-node selection, bit 18, named NSRI_MORENODES.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }
region_size = { bits = [17, 17], grade = "established", enum = "ni_region_size", doc = "Region granularity, bit 17, named NSRI_REGIONSIZE.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }
node_id = { bits = [16, 8], grade = "established", doc = "This Hub's node number, nine bits at 16:8, named NSRI_NODEID.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }
chip_rev = { bits = [7, 4], grade = "established", doc = "Chip revision, four bits at 7:4, named NSRI_REV. The header gives no meaning for the values.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }
chip_id = { bits = [3, 0], grade = "established", doc = "Chip type identifier, four bits at 3:0, named NSRI_CHIPID.", from = "public Linux SN0 Hub network interface header: NSRI_* masks and shifts" }

