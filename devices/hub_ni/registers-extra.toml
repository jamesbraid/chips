offset = 0x600400
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubni.h, NI_IO_PROTECT; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0xffffffffffffffff
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register NI_IO_PROTECT (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd80a0"
doc = "PIO protection bits, one per region, named NI_IO_PROTECT in the header. Offset and name are from the header. The header gives neither a field layout nor a reset. The IRIX register table confirms the access."

[registers.ni_io_prot_ovrrd]
