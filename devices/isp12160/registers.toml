unit = "isp12160"
prefix = "ISP12160"
title = "QLogic ISP12160 dual-channel Ultra2 SCSI host adapter (PCI 1077:1216), the constants the held sources establish"
doc = "The two-channel QLogic SCSI host adapter on the Origin 300 IO-8 board and the Origin 350 IO9 board (PCI 1077:1216). Grades say how each item was derived: established means a vendor datasheet, a hardware capture or a driver or firmware statement that names the value directly; inferred means a software expectation, a shipped program that uses the value and does not show the chip's own behaviour, or a reading of a value's meaning from one driver's use of it. No register offsets, reset values or mailbox operand layouts beyond those named here are held for this part, so the register map is not in this unit. The mailbox opcodes are the values the shipped programs send, not measured chip behaviour."
from = "QLogic ISP12160A data sheet (1999); QLogic QLA12160 hardware installation guide (2001); IRIX 6.5 Bedrock-class controller object; IRIX 6.5 Octane SCSI driver object; Linux qla1280, NetBSD isp and OpenBSD qlw drivers (pins in docs/sources/INDEX.md); stock PROM 6.210 SCSI diagnostic"
public_from = ["QLogic ISP12160A data sheet (1999)", "QLogic QLA12160 hardware installation guide (2001)", "IRIX 6.5 Bedrock-class controller object", "IRIX 6.5 Octane SCSI driver object", "Linux qla1280", "NetBSD isp", "OpenBSD qlw", "stock PROM 6.210 SCSI diagnostic", "hinv and boot capture of an Origin 350 IO9 board"]

[constants.PCI_DEVICE_ID]
value = 0x1216
grade = "established"
from = "hinv and OpenBSD boot capture of an Origin 350 IO9 board (docs/questions/ip35-io9-pci-wiring.md); IRIX 6.5 Octane SCSI driver object compares device 0x1216"
doc = "PCI device ID of the ISP12160 under vendor 0x1077. The capture lists it as 0x12161077 on the IO9 board, and the Octane driver object handles this device as well as the ISP1040's 0x1020."

[constants.PCI_CLOCK_MHZ]
value = 66
grade = "established"
from = "QLogic ISP12160A data sheet (1999), first page: \"66-MHz, 64-bit PCI host bus interface\""
doc = "PCI clock the data sheet gives for the host interface. The data sheet's own claim; no capture or driver states the clock the board runs."

[constants.PCI_BUS_WIDTH_BITS]
value = 64
grade = "established"
from = "QLogic ISP12160A data sheet (1999), first page: \"64-bit bus master\""
doc = "Width of the PCI host interface, and so of the data phases the part runs as a bus master, per the data sheet. Whether the board wires the 64-bit lines on each slot or bus is a separate question and is not settled here."

[constants.BUSES]
value = 2
grade = "established"
from = "QLogic ISP12160A data sheet (1999), first page: dual-channel Ultra2 SCSI; IRIX 6.5 Octane SCSI driver object sends per-bus commands for a part with more than one bus"
doc = "SCSI channels per chip. The ISP1040 has one; this part has two, each a separate SCSI bus with its own selection timeout, reset delay and target state."

[constants.BUS_RESET_DELAY_DEFAULT_S]
value = 5
grade = "established"
from = "QLogic QLA12160 hardware installation guide (DC8151101-00 C, 2001), PDF page 21 (printed A-5), Fast!UTIL setting \"SCSI bus reset delay\""
doc = "Default SCSI bus reset delay in seconds, per bus, in the Fast!UTIL NVRAM setting of the QLA12160 board. The guide says that after a bus reset the firmware starts no SCSI activity for the set number of seconds. That is an established statement about the setting. Whether the 0x0018 mailbox value starts the same hold-off is inferred (see OP_BUS_RESET)."

[constants.BUS_RESET_DELAY_MAX_S]
value = 15
grade = "established"
from = "QLogic QLA12160 hardware installation guide (DC8151101-00 C, 2001), PDF page 21 (printed A-5)"
doc = "Largest SCSI bus reset delay the Fast!UTIL setting accepts, in seconds, per bus."

[constants.OP_LOAD_RAM]
value = 0x0001
grade = "inferred"
from = "stock PROM 6.210 SCSI diagnostic, which prepares this opcode against the ISP12160 when it tests DMA"
doc = "Load RAM: the host writes controller RAM. The mailbox operand layout is not given here. The opcode and its direction are software expectations from the diagnostic that sends it, not a chip datasheet statement."

[constants.OP_DUMP_RAM]
value = 0x0003
grade = "inferred"
from = "stock PROM 6.210 SCSI diagnostic, which prepares this opcode against the ISP12160 when it tests DMA"
doc = "Dump RAM: the controller returns its RAM to the host. The pair of the load opcode above. The mailbox operand layout is not given here."

[constants.OP_ABORT_DEVICE]
value = 0x0016
grade = "inferred"
from = "IRIX 6.5 Bedrock-class controller object, which constructs this request and calls the recovery helper that issues it"
doc = "Abort device: abort the outstanding requests for one LUN on one target of one channel. Mailbox 1 packs the channel in bit 15, the target in bits 14:8 and the LUN in bits 7:0. Mailboxes 2 and 3 are zero. The object does not expose a request handle, so this command takes the packed selector and no handle. It is separate from the command abort and target reset opcodes."

[constants.OP_BUS_RESET]
value = 0x0018
grade = "inferred"
from = "IRIX 6.5 Bedrock-class controller object (the request it builds); mailbox placement matches Linux qla1280's bus reset (see the ISP1040 unit's OP_BUS_RESET)"
doc = "Reset one SCSI channel. Mailbox 1 carries a byte the request builder reads from that channel's state, which the object does not name or give units for. Mailbox 2 carries the channel number. The delay's meaning is inferred from the ISP1040 unit's reading (seconds, starting a hold-off on the bus), and the 6.5 Octane driver object sends the same command once per bus with the delay in mailbox 1 and the bus number in mailbox 2. Whether the firmware refuses or holds commands for that hold-off, and whether it posts an asynchronous reset event for a reset the host requested, are unknown."

[constants.OP_SET_SELECTION_TIMEOUT]
value = 0x0031
grade = "inferred"
from = "Linux qla1280, NetBSD isp and OpenBSD qlw drivers (none has an ISP12160 branch); IRIX 6.5 Octane SCSI driver object for device 0x1216"
doc = "Set the selection timeout. Mailbox 1 is bus 0's value and mailbox 2 is bus 1's, as the three public drivers write them and the Octane driver writes them for this device. Unit inferred to be milliseconds, as for the ISP1040, with a driver default of 250. The chip's own default when never programmed is unknown."

[constants.CONTROLLER_PROGRAM_WORDS]
value = 0x361d
grade = "inferred"
from = "IRIX 6.5 Bedrock-class controller object: the separate ISP12160 controller program it carries is 27,706 bytes, and the program's image header word at index 3 is this value"
doc = "Length in 16-bit words of the controller program the IRIX 6.5 Bedrock-class object downloads to this part, read from zero-based image word 3. The value is the length of one shipped program. It is a software expectation, not a chip fact, and says nothing about the RAM the chip has."

[constants.DRIVER_SELECTION_TIMEOUT_DEFAULT]
value = 250
grade = "inferred"
from = "IRIX 6.5 Octane SCSI driver object: per-bus record defaults for device 0x1216"
doc = "Selection timeout the Octane driver stores in its per-bus record and then programs with the selection-timeout command. It is the driver's own default, not a chip default."
