eeprom_do = { bits = [4, 4], grade = "established", doc = "Data from the EEPROM to the CPU; read-only." }

# ---------------------------------------------------------------- windows behind the controller

[registers.int2_window]
offset = 0x1c0
space = "hpc1"
access = "rw"
width = 32
count = 16
reset = "unknown"
grade = "established"
from = "IRIX developer header"
doc = "The interrupt controller window, 64 bytes at 0x1c0. The registers are in the interrupt controller's own unit; the controller is not part of the HPC1."

[registers.serial_window]
offset = 0xd00
space = "hpc1"
access = "rw"
width = 32
count = 16
reset = "unknown"
grade = "established"
from = "IRIX developer header; IRIX serial driver"
doc = "Four 16-byte blocks of 8-bit registers at 0xd00, 0xd10, 0xd20, 0xd30, each register in its own slot with the byte in bits 7:0 (offset +3 big-endian). Blocks 0 to 2 are Z85C30 serial controllers; block 3 holds the two headphone gain converters. The chip's registers are in its own unit."

[registers.clock_window]
offset = 0xe00
space = "hpc1"
access = "rw"
width = 32
count = 32
reset = "unknown"
grade = "established"
from = "IRIX developer header; IRIX kernel"
doc = "The battery-backed real-time clock window, one 8-bit register per 32-bit slot, accessed by word at the slot. The chip's registers are in its own unit."

[registers.board_rev]
offset = 0x50000
space = "hpc1"
access = "r"
width = 32
reset = "unknown"
grade = "established"
from = "IRIX developer header; IRIX kernel; Indigo PROM"
doc = "Board revision word, in the modem SRAM space. The kernel inverts the word and takes bits 14:12; bit 15 is the header's marker for the HP1 base board."

[registers.board_rev.fields]
revision_inverted = { bits = [14, 12], grade = "established", doc = "Revision, active low." }
hp1_marker = { bits = [15, 15], grade = "inferred", doc = "Header name REV_HP1." }

[registers.dsp_sram]
offset = 0x60000
space = "hpc1"
access = "rw"
width = 32
count = 32768
reset = "unknown"
grade = "established"
from = "IRIX developer header; NetBSD register header; Indigo PROM"
doc = "The DSP SRAM, one 24-bit word per 32-bit slot, 128 KB."

[constants]
EEPROM_OP_READ = { value = 0xc000, grade = "established", doc = "Instruction word: start bit, read, address in bits 12:5 (shifted out MSB first, 11 bits)." }
EEPROM_OP_WRITE_ENABLE = { value = 0x9800, grade = "established", doc = "Write-enable instruction." }
EEPROM_OP_WRITE = { value = 0xa000, grade = "established", doc = "Write instruction; the 16 data bits follow." }
EEPROM_OP_WRITE_ALL = { value = 0x8800, grade = "inferred", doc = "Write-all instruction, named by the shipped header; no code was seen using it." }
EEPROM_OP_WRITE_DISABLE = { value = 0x8000, grade = "established", doc = "Write-disable instruction." }
EEPROM_OP_PROTECT_CLEAR = { value = 0xffff, grade = "established", doc = "Protect register clear, issued with PRE high." }
NVRAM_SIZE = { value = 256, grade = "established", doc = "Serial EEPROM size in bytes." }
NVRAM_REVISION = { value = 6, grade = "established", doc = "Layout revision the PROM and the kernel require in byte 1." }
NVRAM_ENET_OFFSET = { value = 250, grade = "established", doc = "Station address, six bytes, the protected tail of the EEPROM." }
SCSI_START_DMA = { value = 0x80, grade = "established", doc = "Control value that starts a memory-to-device transfer." }
SCSI_START_DMA_TO_MEM = { value = 0x90, grade = "established", doc = "Control value that starts a device-to-memory transfer." }

[words.SCSI_DESC_W0]
width = 32
grade = "established"
from = "IRIX developer header; IRIX kernel"
doc = "Word 0 of the SCSI and parallel DMA descriptor. A descriptor is three hardware words in a 16-byte slot; the fourth word is software-only. The words are in the byte order that the endian register selects for the channel."

[words.SCSI_DESC_W0.fields]
byte_count = { bits = [12, 0], grade = "established", doc = "Transfer size in bytes, at most 8191." }

[words.SCSI_DESC_W1]
width = 32
grade = "established"
from = "IRIX developer header; IRIX kernel"
doc = "Word 1 of the SCSI and parallel DMA descriptor."

[words.SCSI_DESC_W1.fields]
eox = { bits = [31, 31], grade = "established", doc = "Last descriptor of the chain." }
buffer = { bits = [27, 0], grade = "established", doc = "Physical buffer address." }

[words.SCSI_DESC_W2]
width = 32
grade = "established"
from = "IRIX developer header"
doc = "Word 2 of the SCSI and parallel DMA descriptor."

[words.SCSI_DESC_W2.fields]
next = { bits = [27, 0], grade = "established", doc = "Physical address of the next descriptor." }

[words.ENET_DESC_W0]
width = 32
grade = "established"
from = "IRIX Ethernet driver; NetBSD register header"
doc = "Word 0 of the Ethernet DMA descriptor: flags and byte count. The HPC3 puts the buffer address first and the flags second; the HPC1 order is the reverse."

[words.ENET_DESC_W0.fields]
eop = { bits = [31, 31], grade = "inferred", doc = "End of packet." }
own = { bits = [30, 30], grade = "inferred", doc = "Ownership flag. The public driver sets it when it posts a receive descriptor and reads a clear bit as received; the IRIX driver sets it on queued transmit descriptors and clears it when it reclaims them. Which side clears it in hardware is not settled." }
intr = { bits = [15, 15], grade = "inferred", doc = "Interrupt when finished." }
byte_count = { bits = [12, 0], grade = "established", doc = "Buffer size on queue; on a receive the HPC leaves the unused count." }

[words.ENET_DESC_W1]
width = 32
grade = "established"
from = "IRIX Ethernet driver; NetBSD register header"
doc = "Word 1 of the Ethernet DMA descriptor: the buffer address with the end-of-chain flag."

[words.ENET_DESC_W1.fields]
eochain = { bits = [31, 31], grade = "established", doc = "Last descriptor of the chain." }
buffer = { bits = [27, 0], grade = "established", doc = "Physical buffer address." }

[words.ENET_DESC_W2]
width = 32
grade = "established"
from = "IRIX Ethernet driver; NetBSD register header"
doc = "Word 2 of the Ethernet DMA descriptor."

[words.ENET_DESC_W2.fields]
next = { bits = [27, 0], grade = "established", doc = "Physical address of the next descriptor." }
