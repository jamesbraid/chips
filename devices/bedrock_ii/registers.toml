pi_select = { bits = [8, 8], grade = "established" }
node = { bits = [16, 9], grade = "established" }
enable = { bits = [24, 24], grade = "inferred", doc = "Set at init by the Itanium consumer. The meaning is inferred from its name. The IRIX source header places a field of this name at the same bit and gives it no description." }
sent = { bits = [28, 28], grade = "inferred", doc = "Cleared by the Itanium handler and by its error clear. The meaning is inferred. The IRIX source header places an interrupt-sent field at the same bit and gives it no description." }
forwarded_pi0 = { bits = [32, 32], grade = "established", doc = "Forwarded-interrupt pending for PI0." }
forwarded_pi1 = { bits = [33, 33], grade = "established", doc = "Forwarded-interrupt pending for PI1." }

[registers.misc_error_mask]
offset = 0x4001e8
access = "rw"
width = 64
grade = "inferred"
from = "irix-657m-src irix/kern/sys/SN/SN1/snacioregs.h, II_IMEM (offset and name; the header states no access); shipped IRIX kernel I/O error handlers (read sites)"
reset = 0x111
reset_grade = "established"
reset_from = "IP35 PROM 6.210 register table, entry II_IMEM at image offset 0x15fd18 (field reset values are the system reset initial values; layout per irix-657m-src stand/arcs/include/hwreg.h)"
doc = "Write-one-to-set per the header. The header's description says the hub clears each field when an error requires that source to be shut down and that software sets a field by writing one. The companion header's macro comments instead call bits 0, 4 and 8 shut-down flags, and the Itanium error handler reads them that way. The register description and the recovery write govern. No Linux header states the reset value. The later chip's recovery write re-enables a source by setting its bit, which agrees with the value in the PROM register table. The shipped kernel's I/O error handlers read this register; a hand-written row once recorded it as read-only on that basis, but reads alone do not show it cannot be written, so rw stays."
notes = "The kernel reading named this register flags and called both bits role unknown; the header's names (widget_0_enable at bit 0, bte_0_enable at bit 4) are kept."

[registers.misc_error_mask.fields]
widget_0_enable = { bits = [0, 0], grade = "established" }
bte_0_enable = { bits = [4, 4], grade = "established" }
bte_1_enable = { bits = [8, 8], grade = "established" }
clear_precise = { bits = [12, 12], grade = "established" }

