rrsp_ps = { bits = [54, 32], grade = "established" }
rrsp_to = { bits = [59, 55], grade = "established" }

[registers.error_clear]
offset = 0x4001f8
access = "w"
width = 64
grade = "established"
doc = "Error clear: writing a one clears the matching error bit elsewhere in the SHub (PRB entries, crazy-widget, BTE 0 and 1, CAM and queue over/underflows, bad commands). The kernel's BTE recovery writes the BTE 0 and BTE 1 bits. Kernel: written with BTE 0 and BTE 1 clear bits after a BTE error (write-one-to-clear). Header name IIO_IECLR. SAL 5.04 PROM: written 0x7ffffffffff, bits 42:0, which cover every defined clear bit and the reserved bits between them (site 0xffab1cc0); its BTE error path writes bits 17 and 18 (site 0xffa94d40)."

[registers.error_clear.fields]
