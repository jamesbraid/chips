[registers.crosstalk_timeout_threshold]
offset = 0x4001f0
access = "rw"
width = 64
grade = "established"
doc = "Crosstalk timeout threshold: read response timeout, its prescaler and the tail-flit timeout, after which the II raises an error interrupt. Header name IIO_IXTT."

[registers.crosstalk_timeout_threshold.fields]
