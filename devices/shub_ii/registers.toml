unit = "shub_ii"
prefix = "SHUB_II"
title = "SHub 1 I/O interface (II): Crosstalk port, access protection, CRBs and block transfer engines"
doc = "Offsets are node-relative, the same numbers the SGI Linux ia64 header uses: the II starts 4 MiB into the node's register space. Field positions are the header's bitfield unions read least-significant first, which agrees with the header's own shift and mask macros wherever it has both. The header is the vendor platform source, so offsets and field positions are established as definitions. Role text is a paraphrase of the header's comments and is inferred. Reset values are unknown unless a source states one, and none does. The kernel files read use few of these registers; the access note in each register says whether the kernel touches it."
from = "Linux v5.3 SGI SN2 platform I/O register header (GPL): names, offsets and field layouts; kernel use from the same tree's SN2 BTE and hub error code"
public_from = ["Linux v5.3 SGI SN2 platform"]

[c]
offset_macro = "bare"

[constants]
NUM_CRBS = { value = 15, grade = "established", doc = "Number of CRB entries, numbered 0 to 14 (the header's IIO_NUM_CRBS)." }
CRB_STRIDE = { value = 0x30, grade = "established", doc = "Distance between CRB entries: each entry takes six 8-byte slots, of which five (A to E) are registers (header macro IIO_ICRB_A: base plus 6 times 8 times the index)." }
NUM_ITTES = { value = 7, grade = "established", doc = "Number of big-window translation entries. The header's manual numbering is 1 to 7, the kernel's 0 to 6." }
NUM_BIG_WINDOWS = { value = 6, grade = "established", doc = "Big windows the kernel treats as real; the seventh entry stands in for small window 0 (header comment: a permanent workaround for a processor-interface defect)." }
HUB_WIDGET_ID_MAX = { value = 0xf, grade = "established", doc = "Highest widget number." }
WARM_RESET = { value = 0x100, grade = "established", doc = "Bit 8 of the LLP control and status register; the header names it ILCSR_WARM_RESET. Same position as the warm_reset field." }
BTE_ENGINES = { value = 2, grade = "established", doc = "Engines in the II; SHub 2 has four, in a different block (see the SHub 2 overlay of devices/shub)." }
BTE_LEN_BITS = { value = 16, grade = "established", doc = "Width of the length field of the BTE status register; the kernel's longest transfer is 65535 cache lines (BTE_LEN_MASK shifted by the line size)." }
BTE_LINE_BYTES = { value = 128, grade = "inferred", doc = "BTE unit of transfer. The kernel shifts the byte length by the L1 cache line size of the CPU (128 bytes on Itanium 2); the header's own text says lines are 128 bytes." }
ICRB_ECODE_DERR = { value = 0, grade = "established", doc = "CRB error code: directory error caused by an II access." }
ICRB_ECODE_PERR = { value = 1, grade = "established", doc = "CRB error code: poison error on an I/O access." }
ICRB_ECODE_WERR = { value = 2, grade = "established", doc = "CRB error code: write error, for example an invalidate to a read-only line." }
ICRB_ECODE_AERR = { value = 3, grade = "established", doc = "CRB error code: access (protection) error." }
ICRB_ECODE_PWERR = { value = 4, grade = "established", doc = "CRB error code: partial write error." }
ICRB_ECODE_PRERR = { value = 5, grade = "established", doc = "CRB error code: partial read error." }
ICRB_ECODE_TOUT = { value = 6, grade = "established", doc = "CRB error code: timeout before deallocation." }
ICRB_ECODE_XTERR = { value = 7, grade = "established", doc = "CRB error code: incoming Crosstalk packet had its error bit set." }
ICRB_IMSGT_XTALK = { value = 0, grade = "established", doc = "CRB incoming message type: from Crosstalk." }
ICRB_IMSGT_BTE = { value = 1, grade = "established", doc = "CRB incoming message type: from a BTE." }
ICRB_IMSGT_SN1NET = { value = 2, grade = "established", doc = "CRB incoming message type: from the network. The header names it for SN1; whether SHub reuses the value for NUMAlink is not stated." }
ICRB_IMSGT_CRB = { value = 3, grade = "established", doc = "CRB incoming message type 3. The header marks it with question marks." }
ICRB_INIT_XTALK = { value = 0, grade = "established", doc = "CRB initiator: Crosstalk." }
ICRB_INIT_BTE0 = { value = 1, grade = "established", doc = "CRB initiator: BTE 0." }
ICRB_INIT_NET = { value = 2, grade = "established", doc = "CRB initiator: the network (the header calls it SN1net)." }
ICRB_INIT_CRB = { value = 3, grade = "established", doc = "CRB initiator 3; the header marks it with a question mark." }
ICRB_INIT_BTE1 = { value = 5, grade = "established", doc = "CRB initiator: BTE 1. Bit 2 of the initiator is the BTE number (kernel hub error code)." }
PROTECTION_OVERRIDE_KEY = { value = 0x53474972756c6573, grade = "established", doc = "Value written to the local access protection override register: the ASCII string SGIrules (header text)." }
WIDGET_ACCESS_OPEN = { value = 0xff01, grade = "established", doc = "Value the SAL 5.04 PROM writes to both the outbound and the inbound widget access register (site 0xffab30e0): widget 0 and widgets 8 to F open. Which bits that opens is the header's field layout (inferred)." }
ERROR_CLEAR_ALL = { value = 0x7ffffffffff, grade = "established", doc = "Value the SAL 5.04 PROM writes to the error clear register (site 0xffab1cc0): bits 42:0, which cover every defined clear bit and the reserved bits between them." }
CRB_TIMEOUT_PRESCALE_PROM = { value = 0x1fffff, grade = "established", doc = "Value the SAL 5.04 PROM writes to the CRB timeout prescaler (site 0xffab1cc0)." }
LLP_NULLTO_PROM = { value = 3, grade = "established", doc = "Value the SAL 5.04 PROM leaves in the nullto field of the LLP control and status register (site 0xffab3780)." }
WCR_DST_CRD_PROM = { value = 4, grade = "established", doc = "Destination credit count the SAL 5.04 PROM leaves in the widget control register (site 0xffab3580)." }


[registers.widget_id]
offset = 0x400000
access = "r"
width = 64
grade = "established"
doc = "Crosstalk widget identification. Echoes the revision and manufacturer fields of the local block's revision register and carries the part number SGI assigned to SHub. Also visible to a widget on the link at its own offset 0. Header name IIO_WID."

[registers.widget_id.fields]
mfg_num = { bits = [11, 1], grade = "established" }
part_num = { bits = [27, 12], grade = "established" }
rev_num = { bits = [31, 28], grade = "established" }

[registers.widget_status]
offset = 0x400008
access = "rw"
width = 64
grade = "established"
doc = "Widget status: error flags the II sets on a Crosstalk credit timeout, tail timeout, retry limit and similar link faults, plus a pending count. Cleared by the mechanisms the header lists per field. Header name IIO_WSTAT. SAL 5.04 PROM: written 0 once, in its set-up routine (site 0xffab1cc0)."

[registers.widget_status.fields]
pending = { bits = [3, 0], grade = "established" }
xt_crd_to = { bits = [4, 4], grade = "established" }
xt_tail_to = { bits = [5, 5], grade = "established" }
tx_mx_rty = { bits = [9, 9], grade = "established" }
llp_tx_cnt = { bits = [23, 16], grade = "established" }
crazy = { bits = [32, 32], grade = "established" }

[registers.widget_control]
offset = 0x400020
access = "rw"
width = 64
grade = "established"
doc = "Widget control: Crosstalk flow control. Holds the widget id the II answers to, tag mode, destination credit count, a force-bad-packet debug bit, the direct-connect bit and the elasticity threshold. Header name IIO_WCR. SAL 5.04 PROM: read-modify-write, each followed by a read back and a 10 ms wait: wid from bits 9:6 of the widget 0 status with tag cleared (site 0xffab33e0), dir_con cleared (site 0xffab3320), tag set (site 0xffab3260), dst_crd set to 4 (site 0xffab3580); wid is read to find the master link (site 0xffab3720)."

[registers.widget_control.fields]
wid = { bits = [3, 0], grade = "established" }
tag = { bits = [4, 4], grade = "established" }
dst_crd = { bits = [15, 13], grade = "established" }
f_bad_pkt = { bits = [16, 16], grade = "established" }
dir_con = { bits = [17, 17], grade = "established" }
e_thresh = { bits = [22, 18], grade = "established" }

[registers.local_access_protection]
offset = 0x400100
access = "rw"
width = 64
grade = "established"
doc = "Local access protection: one bit per region of nodes. A PIO read or write is performed only if the requester's region bit is set; reset value permits every node. The header says it is also reachable through an alias window for the local processors. Header name IIO_ILAPR."

[registers.local_access_protection.fields]
region = { bits = [63, 0], grade = "established" }

[registers.local_access_override]
offset = 0x400108
access = "w"
width = 64
grade = "established"
doc = "Protection override: writing the 64-bit ASCII string SGIrules sets the requester's region bit in the local access protection register; any other value is ignored. Header name IIO_ILAPO."

[registers.local_access_override.fields]
io_ovrride = { bits = [63, 0], grade = "established" }

[registers.outbound_widget_access]
offset = 0x400110
access = "rw"
width = 64
grade = "established"
doc = "Outbound widget access: one bit per widget qualifying PIO and graphics writes the SHub launches toward that widget, on top of the local access protection register. Header name IIO_IOWA. SAL 5.04 PROM: written 0xff01 (site 0xffab30e0)."

[registers.outbound_widget_access.fields]
w0_oac = { bits = [0, 0], grade = "established" }
wx_oac = { bits = [15, 8], grade = "established" }

[registers.inbound_widget_access]
offset = 0x400118
access = "rw"
width = 64
grade = "established"
doc = "Inbound widget access: qualifies requests a widget sends toward the SHub. Meant for software to fence off a misbehaving widget. Header name IIO_IIWA. SAL 5.04 PROM: written 0xff01 (site 0xffab30e0)."

[registers.inbound_widget_access.fields]
w0_iac = { bits = [0, 0], grade = "established" }
wx_iac = { bits = [15, 8], grade = "established" }

[registers.inbound_device_error_mask]
offset = 0x400120
access = "rw"
width = 64
grade = "established"
doc = "Inbound device error mask: per-device (up to eight per widget) enable bits for DMA masters. The SHub clears a device's bit when it detects an error that requires the device to be shut off. Header name IIO_IIDEM."

[registers.inbound_device_error_mask.fields]
w8_dxs = { bits = [7, 0], grade = "established" }
w9_dxs = { bits = [15, 8], grade = "established" }
wa_dxs = { bits = [23, 16], grade = "established" }
wb_dxs = { bits = [31, 24], grade = "established" }
wc_dxs = { bits = [39, 32], grade = "established" }
wd_dxs = { bits = [47, 40], grade = "established" }
we_dxs = { bits = [55, 48], grade = "established" }
wf_dxs = { bits = [63, 56], grade = "established" }

[registers.llp_control_status]
offset = 0x400128
access = "rw"
width = 64
grade = "established"
doc = "LLP control and status: programmable control and observation fields for the link-level protocol port toward Crosstalk. Header name IIO_ILCSR. SAL 5.04 PROM: bit 13 (llp_stat bit 1, the header's IIO_LLP_CSR_IS_UP) must be set, and the PROM prints that an I/O brick is attached (site 0xffab2e60); read-modify-write of d_avail_sel to 0 (site 0xffab3020), llp_en to 1 (site 0xffab2f80) and nullto to 3 (site 0xffab3780), and wrmrst set when the L1 module type is 111 (site 0xffab3170)."

[registers.llp_control_status.fields]
nullto = { bits = [5, 0], grade = "established" }
wrmrst = { bits = [8, 8], grade = "established" }
llp_en = { bits = [10, 10], grade = "established" }
bm8 = { bits = [11, 11], grade = "established" }
llp_stat = { bits = [13, 12], grade = "established" }
remote_power = { bits = [14, 14], grade = "established" }
maxrtry = { bits = [25, 16], grade = "established" }
d_avail_sel = { bits = [27, 26], grade = "established" }
maxbrst = { bits = [41, 32], grade = "established" }

[registers.llp_log]
offset = 0x400130
access = "rw"
width = 64
grade = "established"
doc = "LLP log: status of the link error rate. Header name IIO_ILLR. SAL 5.04 PROM: written 0 (site 0xffab1cc0)."

[registers.llp_log.fields]
sn_cnt = { bits = [15, 0], grade = "established" }
cb_cnt = { bits = [31, 16], grade = "established" }

[registers.interrupt_destination]
offset = 0x400138
access = "rw"
width = 64
grade = "established"
doc = "Interrupt destination for II-detected non-BTE error interrupts: vector level, target PI unit, target node, an enable bit and a sent state. Which processor interface receives the packet is fixed in hardware: PI0 register 0x1800090 or PI1 register 0x1a00090 of the target node (header text). Header name IIO_IIDSR."

[registers.interrupt_destination.fields]
level = { bits = [7, 0], grade = "established" }
pi_id = { bits = [8, 8], grade = "established" }
node = { bits = [19, 9], grade = "established" }
enable = { bits = [24, 24], grade = "established" }
int_sent = { bits = [29, 28], grade = "established" }
pi0_forward_int = { bits = [32, 32], grade = "established" }
pi1_forward_int = { bits = [33, 33], grade = "established" }

[registers.graphics_map]
offset = 0x400140
count = 2
stride = 0x8
access = "rw"
width = 64
grade = "established"
doc = "Graphics node and widget map: matches write responses coming back from a graphics widget to the processor that issued the write, so the response can be turned into a flow-control credit for that processor. Two instances. Header name IIO_IGFX. SAL 5.04 PROM: instance 0 written 2 and instance 1 written 3 (site 0xffab1cc0)."

[registers.graphics_map.fields]
w_num = { bits = [3, 0], grade = "established" }
pi_id = { bits = [4, 4], grade = "established" }
n_num = { bits = [16, 5], grade = "established" }
p_num = { bits = [17, 17], grade = "established" }

[registers.scratch]
offset = 0x400150
count = 2
stride = 0x8
access = "rw"
width = 64
grade = "established"
doc = "Scratch register for software. Two instances, no hardware effect. Header name IIO_ISCR."

[registers.scratch.fields]
scratch = { bits = [63, 0], grade = "established" }

[registers.itte]
offset = 0x400160
count = 7
stride = 0x8
access = "rw"
width = 64
grade = "established"
doc = "Translation table entry mapping one SHub big window to a Crosstalk address: a 5-bit offset joined to the window-relative address bits, a 4-bit widget number and an I/O space bit. The header numbers the entries 1 to 7; the kernel numbers them 0 to 6, and uses the top big window as a stand-in for small window 0 to work around a defect on the processor-interface side. Header names IIO_ITTE1 to IIO_ITTE7. SAL 5.04 PROM: all seven written 0 (site 0xffab1cc0); it programs no translation and uses no big window."

[registers.itte.fields]
offset = { bits = [4, 0], grade = "established" }
w_num = { bits = [11, 8], grade = "established" }
iosp = { bits = [12, 12], grade = "established" }

[registers.prb]
offset = 0x400198
count = 9
stride = 0x8
access = "rw"
width = 64
grade = "established"
doc = "PIO request buffer for one widget (widget 0 and widgets 8 to F): the state the II keeps to manage PIO flow control on Crosstalk and toward the router network, including a spurious-read and spurious-write indicator. Nine entries, widget 0 first and widgets 8 to F after it, at an 8-byte stride (header names IIO_IPRB0, IIO_IPRB8 to IIO_IPRBF). SAL 5.04 PROM: f_bit set by read-modify-write in entry 0 and in entries 8 to F (site 0xffab1cc0); the header gives f_bit no meaning."

[registers.prb.fields]
c_bit = { bits = [7, 0], grade = "established" }
na = { bits = [21, 8], grade = "established" }
nb = { bits = [37, 24], grade = "established" }
m_bit = { bits = [41, 40], grade = "established" }
f_bit = { bits = [42, 42], grade = "established" }
of_cnt = { bits = [47, 43], grade = "established" }
error = { bits = [48, 48], grade = "established" }
rd_to = { bits = [49, 49], grade = "established" }
spur_wr = { bits = [50, 50], grade = "established" }
spur_rd = { bits = [51, 51], grade = "established" }
mult_err = { bits = [63, 63], grade = "established" }

[registers.crosstalk_credit_timeout]
offset = 0x4001e0
access = "rw"
width = 64
grade = "established"
doc = "Crosstalk credit timeout threshold: how long, counted in 128 II clocks, outbound Crosstalk credits may stay below the threshold before a credit timeout is flagged. Header name IIO_IXCC."

[registers.crosstalk_credit_timeout.fields]
time_out = { bits = [25, 0], grade = "established" }

[registers.misc_error_mask]
offset = 0x4001e8
access = "rw"
width = 64
grade = "established"
doc = "Miscellaneous error mask: enable bits for widget 0 and the two BTE streams; the SHub clears a bit when it shuts that source down after an error. Software sets it again by writing a one. The kernel's BTE recovery sets the two BTE bits. Kernel: read, BTE 0 and BTE 1 bits set, written back after a BTE error. Header name IIO_IMEM."

[registers.misc_error_mask.fields]
w0_esd = { bits = [0, 0], grade = "established" }
b0_esd = { bits = [4, 4], grade = "established" }
b1_esd = { bits = [8, 8], grade = "established" }
