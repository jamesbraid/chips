unit = "isp2200"
prefix = "ISP2200"
title = "QLogic ISP2200 Fibre Channel host adapter (PCI 1077:2200), the host interface the public drivers use"
doc = "The single-chip Fibre Channel host adapter of the Origin 3000 I-brick (PCI 1077:2200), as the public Linux, OpenBSD and NetBSD drivers use it. Grades say how each item was derived: established means at least two of the public driver trees state the value and agree; inferred means one driver states it, or a driver's own struct or use names it without a second source; unknown means the sources do not settle it. No QLogic programming manual for this part is held, so the register contract rests on driver agreement, and the reset state of every register is unknown. The mailbox opcodes and status values are what the drivers send and read, not measured chip behaviour."
from = "public Linux qla2xxx, OpenBSD SGI qla and NetBSD isp drivers"
public_from = ["Linux qla2xxx driver", "OpenBSD qla driver", "NetBSD isp driver", "QLogic QLA2200 hardware installation guide (FC0151103-00 D)", "pci.ids", "Origin 3000 System Architecture (108-0240-002)"]

[constants.PCI_VENDOR_ID]
value = 0x1077
grade = "established"
from = "Linux qla2xxx and OpenBSD qla PCI tables; pci.ids"
doc = "QLogic's PCI vendor ID. The same vendor ID is on every QLogic part in this repository."

[constants.PCI_DEVICE_ID]
value = 0x2200
grade = "established"
from = "Linux qla2xxx and OpenBSD qla PCI tables; NetBSD isp PCI ID name for the 2200; pci.ids"
doc = "PCI device ID of the ISP2200 under vendor 0x1077. pci.ids gives the marketing name QLA2200 64-bit Fibre Channel Adapter, which is not a silicon marking."

[constants.PCI_BAR_IO_CONFIG_OFFSET]
value = 0x10
grade = "established"
from = "Linux qla2xxx uses the first BAR as port I/O; OpenBSD qla QLA_PCI_IO_BAR; NetBSD isp IO_MAP_REG"
doc = "Configuration-space offset of BAR0, the I/O-space BAR. Linux and OpenBSD both use it for the register window. The window is also decoded in memory space through the BAR at the next offset, and the drivers read the same registers through either."

[constants.PCI_BAR_MEM_CONFIG_OFFSET]
value = 0x14
grade = "established"
from = "OpenBSD qla QLA_PCI_MEM_BAR; Linux qla2xxx uses the second BAR as memory-mapped I/O"
doc = "Configuration-space offset of BAR1, the memory-space BAR. The BAR type (32-bit or 64-bit memory) is unknown: the drivers accept either."

[constants.REGISTER_WINDOW_BYTES]
value = 0x100
grade = "established"
from = "Linux qla2xxx minimum I/O length; NetBSD isp PCI register size"
doc = "Size of the register window. The last mailbox ends exactly at this size, so it is the smallest window that holds the register file."

[constants.MAILBOXES_TOTAL]
