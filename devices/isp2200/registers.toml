[constants.OP_LOAD_RAM_DMA]
value = 0x0009
grade = "inferred"
from = "Linux qla2xxx RAM load for the 2200, sent in chunks"
doc = "Load RAM from host memory by DMA. Mailbox 1 is the RAM word address. Mailbox 2 carries bits 31 to 16 of the low 32 bits of the host address and mailbox 3 bits 15 to 0; mailboxes 6 and 7 carry the top 32 bits, and mailbox 4 the word count. Only Linux uses it for this part."

[constants.OP_LOAD_RAM_EXT]
value = 0x000b
grade = "inferred"
from = "Linux qla2xxx extended RAM load"
doc = "Load RAM by DMA, as the 0x0009 form, with RAM address bits 31 to 16 in mailbox 8. Linux selects it only when the RAM address needs more than 16 bits."

