doc = "Load RAM with a 32-bit host address: mailbox 1 is the RAM word address, mailboxes 2 and 3 the host address, and mailbox 4 the word count. No public driver sends it for this part."

[constants.OP_EXECUTE_FIRMWARE]
value = 0x0002
grade = "established"
from = "Linux qla2xxx, OpenBSD qla and NetBSD isp execute command"
doc = "Start the RISC at a RAM address given in mailbox 1. Linux and OpenBSD check its status. NetBSD does not."

[constants.OP_DUMP_RAM]
