[constants.OP_VERIFY_CHECKSUM]
value = 0x0007
grade = "established"
from = "Linux qla2xxx, OpenBSD qla and NetBSD isp verify command"
doc = "Sum a loaded firmware image in RAM. The sum over the length in the image's length word is the check the drivers make. The sum comes back in mailbox 1, and the drivers treat zero as a match."

[constants.OP_ABOUT_FIRMWARE]
