[registers.csr]
offset = 0x06
access = "rw"
width = 16
reset = "unknown"
grade = "established"
from = "Linux qla2xxx and OpenBSD qla register layouts; NetBSD isp register header"
doc = "Control and status register. Writing bit 0 starts a soft reset. The drivers poll the bit until the adapter clears it. Bits 5 and 4 choose the bank that answers the banked window. Linux and NetBSD disagree on the flash bank bits, so those bits are not named here."

[registers.csr.fields]
soft_reset = { bits = [0, 0], grade = "established", doc = "Soft reset. Writing 1 starts a reset. The drivers poll until it reads 0." }
bank = { bits = [5, 4], grade = "established", doc = "Bank behind the banked window at offsets 0x80 to 0xBF. The drivers leave it at the RISC bank. The other values select frame-buffer and diagnostic banks that no public driver uses." }

[registers.icr]
offset = 0x08
access = "rw"
width = 16
reset = "unknown"
grade = "established"
from = "Linux qla2xxx, OpenBSD qla and NetBSD isp interrupt control use"
doc = "Interrupt control. The drivers write 0x8008 to enable and 0 to disable. Other bits are not used by any public driver for this part."

[registers.icr.fields]
global_enable = { bits = [15, 15], grade = "established", doc = "Global interrupt enable. Drivers set it together with the RISC enable." }
risc_enable = { bits = [3, 3], grade = "established", doc = "RISC interrupt enable. Drivers set it together with the global enable." }

[registers.isr]
offset = 0x0a
access = "r"
width = 16
reset = "unknown"
grade = "established"
from = "Linux qla2xxx, OpenBSD qla and NetBSD isp interrupt status use"
doc = "Interrupt status. Drivers test the RISC interrupt bit first. OpenBSD also tests the pending bit before it reads the response ring."

[registers.isr.fields]
risc_pending = { bits = [3, 3], grade = "established", doc = "RISC interrupt pending. Linux tests only this bit." }
any_pending = { bits = [15, 15], grade = "inferred", doc = "Interrupt pending. OpenBSD tests it before reading the response ring. Linux does not read it." }

[registers.sema]
offset = 0x0c
access = "rw"
width = 16
reset = "unknown"
grade = "established"
from = "Linux qla2xxx, OpenBSD qla and NetBSD isp semaphore use"
doc = "Semaphore. The adapter sets the lock bit when a mailbox result or asynchronous event waits for the host. The host releases it by writing 0, and the drivers release it last, after reading the mailboxes."

[registers.sema.fields]
lock = { bits = [0, 0], grade = "established", doc = "Lock. Set while mailbox or event data waits for the host. Writing 0 releases it." }
status = { bits = [1, 1], grade = "unknown", doc = "Named status by NetBSD. No driver reads it, and what a write of 1 does is not known." }

[registers.nvram]
offset = 0x0e
access = "rw"
width = 16
reset = "unknown"
grade = "established"
from = "Linux qla2xxx and OpenBSD qla NVRAM read sequence"
doc = "Serial EEPROM port. The host bit-bangs the clock, chip select and data lines to read the board NVRAM."

[registers.nvram.fields]
clock = { bits = [0, 0], grade = "established", doc = "Serial clock to the EEPROM." }
select = { bits = [1, 1], grade = "established", doc = "Chip select for the EEPROM." }
data_to_eeprom = { bits = [2, 2], grade = "established", doc = "Data from the host to the EEPROM." }
data_from_eeprom = { bits = [3, 3], grade = "established", doc = "Data from the EEPROM to the host." }

[registers.mailbox]
offset = 0x10
count = 8
access = "rw"
width = 16
reset = "unknown"
grade = "established"
from = "Linux qla2xxx and OpenBSD qla register layouts"
doc = "Mailboxes 0 to 7, two bytes apart. Mailbox 0 carries the command number in and the status out. Mailbox 4 is the request-queue pointer and mailbox 5 the response-queue pointer. The drivers write and read them outside any command, and a write to them does not ring the doorbell."

[registers.mailbox_hi]
offset = 0xe0
count = 16
access = "rw"
width = 16
reset = "unknown"
grade = "inferred"
from = "Linux qla2xxx register layout; NetBSD isp header gives the count of 24 for the 2200"
doc = "Mailboxes 8 to 23. The count of 24 comes from two drivers, but only Linux gives where the upper sixteen sit. Linux writes all 24 on every mailbox command, zeroing the ones the command does not use."

[registers.hccr]
offset = 0xc0
access = "rw"
width = 16
reset = "unknown"
grade = "established"
from = "Linux qla2xxx, OpenBSD qla and NetBSD isp host command register"
doc = "Host command and control register. A write carries a command in bits 15 to 12. A read returns status in the bits named below. Reset values are not stated by any source."

[registers.hccr.fields]
cmd = { bits = [15, 12], grade = "established", enum = "hccr_cmd", doc = "Write: command number. Value 4 covers the words 0x4000 and 0x4001. Drivers write 0x4001, which Linux and NetBSD call disable parity pause, and OpenBSD writes 0x4000 between reset and release, which it calls mask parity while NetBSD calls it single step. What the chip does with either word is unknown." }
risc_reset = { bits = [6, 6], grade = "inferred", doc = "Read: RISC held in reset. NetBSD names it reset in progress. Whether the bit clears by itself when a soft reset ends, or only at a release, is unknown." }
host_int = { bits = [7, 7], grade = "established", doc = "Read: host interrupt set, the command-pending flag. Drivers wait for it to clear after a doorbell. That it clears once the firmware takes the command, without a clear-host-interrupt write, is inferred from the waits in two drivers." }
risc_paused = { bits = [5, 5], grade = "established", doc = "Read: RISC paused. Linux treats a paused status seen during an interrupt as a fault." }

[enums.hccr_cmd]
values = { noop = { value = 0x0, grade = "established" }, reset_risc = { value = 0x1, grade = "established" }, pause_risc = { value = 0x2, grade = "established" }, release_risc = { value = 0x3, grade = "established" }, parity = { value = 0x4, grade = "established" }, set_host_int = { value = 0x5, grade = "established" }, clear_host_int = { value = 0x6, grade = "established" }, clear_risc_int = { value = 0x7, grade = "established" } }
