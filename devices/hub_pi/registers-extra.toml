unit = "hub_pi_extra"
prefix = "HUB"
title = "Hub processor interface registers, bit layouts and constants outside the census"
from = "public Linux SN0 Hub processor-interface header, Linux v4.0 (names, offsets, masks and shifts)"
public_from = ["census:", "public Linux SN0 Hub processor-interface header", "shipped IRIX"]

# The census has the offsets the shipped kernel and PROM touch in the processor interface, and
# their names come from the public header by offset. The registers here are the processor
# interface offsets the census does not reach: protection, cross-call, the self-test block,
# the graphics page and credit block, and the spool, timeout, check and count registers. Their
# offsets and names are from the public header. The header states no access type and no reset
# value, so each register is graded inferred as a whole and its access is an assumption, said so
# in its doc. The field layouts are the header's own masks and shifts and are established as
# header facts. The register offsets already in devices/hub/registers.toml are not repeated here.

# Where the IRIX register table states a register's access, the row is graded established and its from names the
# header and the table; the rows it does not list keep the Linux-header reading and stay inferred.

[registers.pi_cpu_protect]
offset = 0x0
access = "rw"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubpi.h, PI_CPU_PROTECT; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
reset = 0xffffffffffffffff
reset_grade = "established"
reset_from = "irix-657m-src stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg, register PI_CPU_PROTECT (field reset values are the system reset initial values); the same table is in the IP27 PROM 6.156 image at 0xd6c18"
doc = "CPU protection register, named PI_CPU_PROTECT in the header. The header gives no fields. The IRIX register table confirms the access."

[registers.pi_prot_override]
offset = 0x8
access = "w"
width = 64
grade = "established"
from = "irix-657m-src irix/kern/sys/SN/SN0/hubpi.h, PI_PROT_OVRRD; stand/arcs/lib/libkl/hwreg/hwreg_hub.hwreg for access"
doc = "Protection override register, named PI_PROT_OVRRD in the header as the way to clear a CPU protection bit. The header gives neither an unlock value nor a behaviour, so none is imported. The IRIX register table confirms the access."

