[constants]
# Cause register bits the header names for the processor's pending interrupt lines. Bits 15:8 of
# the Cause register are the interrupt pending field, so these are the lines IP2 to IP6.
IP_PEND0 = { value = 0x400, grade = "established", doc = "Cause bit for the first pending bank, named HUB_IP_PEND0 in the header: IP2 line." }
IP_PEND1_CC = { value = 0x800, grade = "established", doc = "Cause bit for the second pending bank and the cross-call sources, named HUB_IP_PEND1_CC in the header: IP3 line." }
IP_RT = { value = 0x1000, grade = "established", doc = "Cause bit for the real-time counter comparator, named HUB_IP_RT in the header: IP4 line." }
IP_PROF = { value = 0x2000, grade = "established", doc = "Cause bit for the profiling comparator, named HUB_IP_PROF in the header: IP5 line." }
IP_ERROR = { value = 0x4000, grade = "established", doc = "Cause bit for Hub errors, named HUB_IP_ERROR in the header: IP6 line." }
IP_MASK = { value = 0x7c00, grade = "established", doc = "All five Hub-driven Cause bits together, named HUB_IP_MASK in the header." }

# Cached-alias size codes. The header gives the size each code selects. The register is the one in
# devices/hub/registers.toml at offset 0x28; these are the values a write to it can hold.
PI_CALIAS_SIZE_0 = { value = 0, grade = "established", doc = "Cached-alias size code 0: no alias, per the header's name PI_CALIAS_SIZE_0." }
PI_CALIAS_SIZE_4K = { value = 1, grade = "established", doc = "Cached-alias size code 1: 4 KB, per the header." }
PI_CALIAS_SIZE_8K = { value = 2, grade = "established", doc = "Cached-alias size code 2: 8 KB, per the header." }
PI_CALIAS_SIZE_16K = { value = 3, grade = "established", doc = "Cached-alias size code 3: 16 KB, per the header." }
PI_CALIAS_SIZE_32K = { value = 4, grade = "established", doc = "Cached-alias size code 4: 32 KB, per the header." }
PI_CALIAS_SIZE_64K = { value = 5, grade = "established", doc = "Cached-alias size code 5: 64 KB, per the header." }
PI_CALIAS_SIZE_128K = { value = 6, grade = "established", doc = "Cached-alias size code 6: 128 KB, per the header." }
PI_CALIAS_SIZE_256K = { value = 7, grade = "established", doc = "Cached-alias size code 7: 256 KB, per the header." }
PI_CALIAS_SIZE_512K = { value = 8, grade = "established", doc = "Cached-alias size code 8: 512 KB, per the header." }
PI_CALIAS_SIZE_1M = { value = 9, grade = "established", doc = "Cached-alias size code 9: 1 MB, per the header." }
PI_CALIAS_SIZE_2M = { value = 10, grade = "established", doc = "Cached-alias size code 10: 2 MB, per the header." }
PI_CALIAS_SIZE_4M = { value = 11, grade = "established", doc = "Cached-alias size code 11: 4 MB, per the header." }
PI_CALIAS_SIZE_8M = { value = 12, grade = "established", doc = "Cached-alias size code 12: 8 MB, per the header." }
PI_CALIAS_SIZE_16M = { value = 13, grade = "established", doc = "Cached-alias size code 13: 16 MB, per the header." }
PI_CALIAS_SIZE_32M = { value = 14, grade = "established", doc = "Cached-alias size code 14: 32 MB, per the header." }
PI_CALIAS_SIZE_64M = { value = 15, grade = "established", doc = "Cached-alias size code 15: 64 MB, per the header." }
PI_LOCAL_WINDOW_BASE = { value = 0x1000000, grade = "established", from = "Linux arch/mips/include/asm/sn/addrs.h at the references/code/linux pin: LOCAL_HUB_ADDR is IALIAS_BASE plus the offset, IALIAS_BASE is hub register widget 1 with 24-bit windows (HUB_REGISTER_WIDGET, SWIN_SIZE_BITS)", doc = "Physical base of the processor's own hub window; no node shift." }
PI_NODE_WINDOW_BASE = { value = 0x1800000, grade = "established", from = "Linux arch/mips/include/asm/sn/addrs.h at the references/code/linux pin: REMOTE_HUB_ADDR is widget 1 plus 0x800000 within the named node; arch/mips/sgi-ip27/ip27-xtalk.c line 85 adds 0x01800000 to PI_INT_PEND_MOD", doc = "Physical base of a named node's window." }
