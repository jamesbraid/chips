par = { bits = [9, 9], grade = "established", doc = "CPU parity error." }
addr = { bits = [10, 10], grade = "established", doc = "Memory bus error: the address maps to no valid bank, or an MC register was accessed at the address wrong for the current byte order." }
sysad_par = { bits = [11, 11], grade = "established", doc = "SysAD address or MC write data parity error; only the low four byte bits are valid." }
syscmd_par = { bits = [12, 12], grade = "established", doc = "SysCmd parity error; the byte field is invalid." }
bad_data = { bits = [13, 13], grade = "established", doc = "The CPU sent a bad-data identifier." }

