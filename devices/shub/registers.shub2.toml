[override]
unit = "shub2"
prefix = "SHUB2"
title = "SHub 2 registers outside the I/O interface, differences from SHub 1"
doc = "SHub 2 offsets as the SGI Linux ia64 platform header defines them (SH2_ names). Registers the header defines only for SHub 1 are removed; for those, SHub 2's address is not in the sources read (unknown). Field layouts not patched here are the SHub 1 ones: the header gives one set of field macros for both chips. Registers added from the SHub 2 firmware (grade and site named on each) give the 32-bit offset in the local window; add 0x2_0000_0000 for the address the firmware uses."

[patch."registers.ipi_int"]
offset = 0x10000380

[patch."registers.event_occurred"]
offset = 0x10010000

[patch."registers.event_occurred_alias"]
offset = 0x10010008

[add.constants]
EVENT_OCCURRED_EXTIO_INT2 = { value = 0x200000000, grade = "established", doc = "Bit 33 of the event register: pending SHub 2 external I/O interrupt 2 (header SH2_EVENT_OCCURRED_EXTIO_INT2). The base unit's field table has no entry for it because overlays cannot add fields." }
EVENT_OCCURRED_EXTIO_INT3 = { value = 0x400000000, grade = "established", doc = "Bit 34 of the event register: pending SHub 2 external I/O interrupt 3." }

[patch."registers.rtc"]
offset = 0x2101c0000
access = "r"

[patch."registers.rtc_int_config"]
offset = 0x10001480

[patch."registers.rtc_int_enable"]
offset = 0x10001500

[patch."registers.int_cmp"]
offset = 0x101b0080

[patch."registers.ipi_access"]
offset = 0x10060c00
count = 4
stride = 0x80
doc = "Which processors may send interprocessor interrupts to this one: four registers, one per processor slice (SH2_IPI_ACCESS0 to 3). Defined by the header; the kernel files read never touch them, so the layout is unknown."

[patch."registers.pio_write_status"]
offset = 0x20070200
count = 4
stride = 0x80
doc = "PIO write status, four instances (SHub 2 nodes carry up to four processor slices). Note the kernel indexes them out of order: slices 0, 1, 2, 3 use instances 0, 2, 1, 3, in the setup code's table. The idle value is zero, not all ones."

[patch."registers.pio_write_status_alias"]
offset = 0x20070208
count = 4
stride = 0x80

[patch."registers.junk_bus_led"]
offset = 0xf0000000

[patch."constants.PIO_WRITE_STATUS_IDLE"]
value = 0
doc = "What the kernel waits for the masked pending-write count to equal on SHub 2: zero."

[add.registers.ptc]
offset = 0x170000000
access = "w"
width = 64
grade = "established"
doc = "Purge translation cache message, SHub 2 (header SH2_PTC). One 64-bit store per target node replaces SHub 1's two. The region id and region number do not go in the data: the kernel adds them, shifted left by four, to the register's address. (The header's `SH2_PTC_ADDR_SHFT` is 4 but sits under a region-id comment and no kernel code uses it, which uses `SH2_PTC_RID_SHFT`; the data's address field is `SH2_PTC_ADDR_MASK`, which starts at bit 12, and that is what this file uses.) The data carries the type bit, the page size and the start bit, and the virtual address in bits 60:12. How wide the address-encoded part is, and so how large the register window is, is unknown. The kernel only waits on the PIO write status afterwards; on a deadlock it reads the status alias instead of clearing it."

[add.registers.ptc.fields]
type_bit = { bits = [0, 0], grade = "inferred", doc = "Header title: type; the kernel always writes 1." }
ps = { bits = [3, 2], grade = "inferred", doc = "Page size as a power of two. The width is a guess from the next field starting at bit 4; the kernel passes a value that may need more bits, so the width is unknown." }
address = { bits = [60, 12], grade = "established", doc = "Virtual address to purge (header SH2_PTC_ADDR_MASK 0x1ffffffffffff000)." }
start = { bits = [63, 63], grade = "established" }

[add.registers.bt_eng_csr]
offset = 0x30040000
count = 4
stride = 0x10000
access = "rw"
width = 64
grade = "established"
doc = "Block transfer engine control and status, one per engine, SHub 2 (four engines, SH2_BT_ENG_CSR_0 to 3). Unlike SHub 1 the kernel starts a transfer with one store here: busy, the mode shifted left by 24, and the length in cache lines in the low bits. The kernel reads it for busy and error; the engine's error code sits in bits 41:36 (kernel's BTE_ERR_BITS)."

[add.registers.bt_eng_csr.fields]
length = { bits = [15, 0], grade = "inferred", doc = "Length in cache lines, as in the SHub 1 status register. The kernel keeps one length width for both chips (BTE_LEN_MASK, 16 bits)." }
error = { bits = [16, 16], grade = "inferred", doc = "Error flag: the kernel tests the same IBLS_ERROR bit position on both chips." }
busy = { bits = [20, 20], grade = "inferred", doc = "Busy: same position as SHub 1's status register in the kernel's macros." }
zero_fill = { bits = [24, 24], grade = "inferred", doc = "The kernel shifts its mode word left by 24; its zero-fill mode bit is bit 0, so it lands here." }
notify = { bits = [28, 28], grade = "inferred", doc = "The kernel's notify mode bit is bit 4, so it lands at bit 28. The kernel always sets it." }
error_code = { bits = [41, 36], grade = "inferred", doc = "Six-bit error code; non-zero means error. Bits: 1 short response, 2 long response, 4 (RESP_DSP), 8 access, 0x10 CRB timeout, 0x20 NACK limit (kernel BTEFAIL_SH2_* names). Whether the hardware also sets the error flag at bit 16 when this field is non-zero is unknown: the kernel's SHub 2 status decode ORs the flag in itself when the code is non-zero." }

[add.registers.bt_eng_src]
offset = 0x30040080
count = 4
stride = 0x10000
access = "rw"
width = 64
grade = "established"
doc = "BTE source address, per engine. The kernel converts the physical address to the network address form first (nasid moved to bit 40 upward, the bank-select bits moved to bit 36)."

[add.registers.bt_eng_dest]
offset = 0x30040100
count = 4
stride = 0x10000
access = "rw"
width = 64
grade = "established"
doc = "BTE destination address, per engine; same conversion as the source."

[add.registers.bt_eng_notify]
offset = 0x30040180
count = 4
stride = 0x10000
access = "rw"
width = 64
grade = "established"
doc = "BTE notification address, per engine; same conversion."

[add.registers.junk_bus_time]
offset = 0x10020000
access = "w"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) site 0xff6745d0 (write)"
doc = "Junk-bus access timing, written once by the first-stage firmware with 0xffff_ffff_0003. Meaning of the value is inferred from the PROM name; the hardware accepts the store. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.address_mode]
offset = 0x20110000
access = "r"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) site 0xff6745e0 (read); every node-addressed access in the PROM reads it again"
doc = "V, the node-addressing selector: the PROM reads it before forming any global or TIO address and uses it unmasked as an index into a five-entry table, so it must read 0 to 4 (devices/shub/shub2.md section 1 gives the shifts for each value). Real value unknown. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.firmware_remap]
offset = 0x20110008
access = "w"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff420910 (write of (arg & 0x1ff000000) | 1 << 60)"
doc = "Remote flash remap: the PROM writes the enable bit and a 9-bit field it takes from bits 32:24 of its argument. Meaning of the fields is inferred from the PROM name. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.firmware_remap.fields]
enable = { bits = [60, 60], grade = "established", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff420910 (bit 60 set by the write)", doc = "Set by the PROM's write." }
offset = { bits = [32, 24], grade = "established", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff420910 (mask 0x1ff000000)", doc = "Bits 32:24 of the remap argument; meaning inferred from the PROM name." }

[add.registers.processor_type]
offset = 0x20110010
access = "r"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) site 0xff674800 (read)"
doc = "The first-stage firmware reads it and compares the whole word with zero to choose which bit pair of the PAL argument becomes the slice number in cr.lid (zero: bits 2:1, else bits 3:2). Meaning of the bit is inferred from the PROM name. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.processor_type.fields]
code = { bits = [0, 0], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) site 0xff674806 (cmp.eq of the whole word with 0, no mask)", doc = "Zero selects argument bits 2:1, non-zero bits 3:2. The code does not isolate bit 0; the position comes from the PROM name table." }

[add.registers.scratch1]
offset = 0x101d0080
access = "rw"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) sites 0xff6746a0 (acquire read), 0xff674536 (second check)"
doc = "Node election word: each slice writes slice + 1 through the alias and reads it back; the winner is the one that reads its own value. Plain storage satisfies the code. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch1_alias]
offset = 0x101d0088
access = "w"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) site 0xff674696 (release write)"
doc = "Write path onto the SCRATCH1 word; the relation is inferred from the use. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch2]
offset = 0x101d0100
access = "rw"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) sites 0xff674570 and 0xff674580 (SAL_A sets bits 41:39), routines 0xff49ef20, 0xff49a130, 0xff4a7a20, 0xff4a30b0"
doc = "Firmware mailbox word for the L1 console link. Plain storage satisfies the code; the fields are how the 10.54 firmware uses it, names are ours. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch2.fields]
state = { bits = [41, 39], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) sites 0xff674570 (SAL_A sets 7), routine 0xff49ef20 (tests for 7, clears), routine 0xff49a130 (tests for at least 2)", doc = "Mailbox state." }
sequence = { bits = [49, 42], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff49ef20 (read, increment modulo 256), routine 0xff49a130 (compare)", doc = "Receive sequence byte." }
channel = { bits = [54, 50], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff49a130", doc = "Index of the channel with a pending packet." }
rx_index = { bits = [62, 58], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff4a7a20 (set to 7), routine 0xff4a30b0 (read, decrement)", doc = "Index of the next byte to take from the current 8-byte receive word; 7 after reset of the link." }
clear_bit = { bits = [63, 63], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff49ef20 (cleared), routine 0xff499650 (tested)", doc = "Cleared once by the firmware's handshake; the send routine 0xff499650 tests it and only when it is set toggles bit 16 of 0x1000_0e00 around a transmit." }

[add.registers.scratch3]
offset = 0x101d0180
access = "w"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routines 0xff4221b0, 0xff422d70 (release writes of 0)"
doc = "Release side of the second firmware lock; the alias 0x08 above is the take side. Whether a read of the alias takes the lock in hardware is unknown; a plain pair that always reads 0 satisfies every access. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch3_alias]
offset = 0x101d0188
access = "r"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routines 0xff4221b0, 0xff422d70 (read until 0)"
doc = "Take side of the second firmware lock. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch4]
offset = 0x101d0200
access = "w"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routines 0xff421f10 (deadline write), 0xff422020 (release write of 0)"
doc = "Release side of the node lock that guards SCRATCH6 and SCRATCH7. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch4_alias]
offset = 0x101d0208
access = "r"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff421f10 (read until 0, 1,000,000 microsecond deadline)"
doc = "Take side of the node lock; a plain register that always reads 0 satisfies every access. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch5]
offset = 0x101d0280
access = "rw"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routines 0xff4221b0 (claim), 0xff422d70 (release), 0xff422800 (test)"
doc = "Claim bits of the second firmware lock: the firmware sets a bit to claim a resource (bit 0 for the barrier, bit 7 for the console link, bit 0xf for a packet exchange). Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch6]
offset = 0x101d0300
access = "rw"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routines 0xff421430 (set or clear a bit), 0xff421ad0 (set a field), 0xff421c30, 0xff421e30 (read), 0xff4b2850, 0xff4b2c90"
doc = "Shared firmware word guarded by the node lock: slice present and arrival bits, the barrier flag and a per-slice-pair field. Plain storage; names of the fields are ours. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch6.fields]
pal_flags = { bits = [24, 21], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) site 0xff42f4e0 (test of bit 21 + slice, called through 0xff4b3580)", doc = "Four bits assume slices 0 to 3; the code extracts a three-bit slice. Slice n's bit decides whether the PAL entry point is translated through RAM tables (bit set) or used unchanged." }
slice_present = { bits = [29, 26], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff4b2850 (sets bit 0x1a + slice), routine 0xff423920 (tests lower slices)", doc = "Slice n has started." }
slice_arrived = { bits = [33, 30], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff4b2c90 (sets bit 0x1e + slice)", doc = "Slice n has reached the barrier." }
barrier_busy = { bits = [34, 34], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff4b2c90 (bit 0x22)", doc = "Barrier in progress." }
pair0_state = { bits = [49, 47], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff4b2850 (field starting at bit 0x2f, width 3)", doc = "Three-bit field for even slices, set from a PAL-supplied value." }
pair1_state = { bits = [52, 50], grade = "inferred", from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) routine 0xff4b2850 (field starting at bit 0x32, width 3)", doc = "Three-bit field for odd slices." }

[add.registers.scratch7]
offset = 0x101d0380
access = "rw"
width = 64
grade = "established"
reset = "unknown"
from = "SAL 1.54 PROM (shub2snprom.bin, snprom 10.54) site 0xff674700 (write of 0), routine 0xff4ae770 (same lock shape as SCRATCH6)"
doc = "Second shared firmware word with the same lock cycle as SCRATCH6. Offset in the local window (add 0x2_0000_0000); the name is the PROM's own register-name table, not Linux."

[add.registers.scratch24]
offset = 0x101d0c00
access = "rw"
width = 64
grade = "established"
