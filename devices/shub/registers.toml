reset_from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_LB_ERROR_DETAIL_1_INIT (macro only; read as zero here)"
from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) names SH_LB_ERROR_DETAIL_1 at 0x1_1005_0200; the five-register stride is the PROM's (0xffa0b9a0 and 0xffa0bd20 write 0 to 0x200, 0x280, 0x300, 0x380 and 0x400); names for 2 to 5 follow the stride and were not each checked"
doc = "Local block error detail words 1 to 5. After its forced PIO write error (see lb_reg_1005_0608) the PROM reads detail 1 (low byte 0xe9 or 0xea) and detail 2 ((value & 0x3fffffff) equal to 0x2200a0c1, the error address >> 3); either match sets bit 3 of the event mask for 0xffa30b40.  A vector read that ends in an error leaves 0xe9 in the low byte of detail 1 (a write 0xea); the PROM then writes 0 to all five and to 0x1_1007_1100, and goes on. Never read otherwise. A plain read/write register that reads 0 satisfies it."
