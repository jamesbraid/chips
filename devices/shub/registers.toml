port_probe = { bits = [55, 54], grade = "inferred", from = "SAL 5.04 PROM site 0xffa5d2a0 (clears then stores the two-bit result of 0xffa5d6a0; nonzero ends the poll at once)", doc = "Result of probing NI ports 0 and 1 (bit i is port i); stored once, by firmware." }
bit57 = { bits = [57, 57], grade = "inferred", from = "SAL 5.04 PROM site 0xffacc6e0 (node-object method 5, writes bits 57 and 40 through method 46)", doc = "Set by the node set-up method; no reader found. Firmware state." }
bit56 = { bits = [56, 56], grade = "inferred", from = "SAL 5.04 PROM site 0xffa1a6d0 (test-and-set under a firmware lock)", doc = "One-time claim flag set by 0xffa1a6d0; firmware state." }

[registers.scratch1_alias]
offset = 0x1101d0088
access = "w"
width = 64
grade = "established"
reset = "unknown"
from = "SGI 2.4 SN2 header shub_mmr.h (SH_SCRATCH1_ALIAS, address only); SAL 5.04 PROM site 0xffc4e970 (store of slice + 1)"
doc = "SH_SCRATCH1_ALIAS: the header gives the address and no description, and Linux v5.3 has no name. Established: the first stage stores slice + 1 here and then reads SH_SCRATCH1 expecting exactly that value, so the alias cannot be write-one-to-clear (a clear of a zero word would never read back equal). Inferred, from that single use: the store lands in the SH_SCRATCH1 word (either as a plain store or as an OR; a lone processor cannot tell them apart). Unknown: whether a second writer is blocked or OR-merged. A model keeps both addresses on one 64-bit cell; reads of the alias are never issued by the PROM."

[registers.lb_l1_state]
offset = 0x1101d0100
access = "rw"
width = 64
grade = "established"
reset = 0x0
reset_grade = "inferred"
reset_from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_SCRATCH2_INIT 0x0, MASK 0xffffffffffffffff; no source states a power-on default"
from = "SAL 5.04 PROM site 0xffc4e790 and 0xffc4e7a0 (read-modify-write); the PROM's runtime also names the word sc_shub_state_reg and sc_shub_pushed_data_reg"
doc = "L1 link state word in the local block; the name is ours. The header calls this offset SH_SCRATCH2 (one 64-bit field, MASK all ones, INIT 0); its alias SH_SCRATCH2_ALIAS is at +8 (0x1101d0108). SAL_A's election winner sets bits 41:39 to 7 by read-modify-write, keeping the other bits. An earlier reading says the L1 start checks bits 41:39 for 7; a later review found no reader that does, so that requirement is unconfirmed and plain storage satisfies the write. Other bits are used by the L1 transport and are not decoded here. The PROM's node-object builder (site 0xffa8b5d0, run for the local node by main, slot 95 and slot 81) tests bits 41:39 for 7 and, if so, clears them, saves bits 49:42 from the register, rewrites bits 49:42 incremented modulo 256, then clears bit 63; so the second run finds 0 in bits 41:39 (review of the node set-up traces)."

[registers.lb_l1_state.fields]
link = { bits = [41, 39], grade = "inferred", from = "SAL 5.04 PROM site 0xffc4e7a0 (write 7) ; the L1 start check named in boot-sequence.md is unconfirmed", doc = "Written 7 by SAL_A's election winner; no reader that requires 7 was found (an earlier reading said the L1 start checks it). Meaning inferred; name is ours." }

[registers.lb_lock]
offset = 0x1101d0200
access = "rw"
width = 64
grade = "inferred"
reset = 0x0
reset_grade = "inferred"
reset_from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_SCRATCH4_INIT 0x0, MASK 0x1; no source states a power-on default"
from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_SCRATCH4 (mask 0x1, INIT 0); SAL 5.04 PROM site 0xffa0ed30 (take), 0xffa0ee40 (release), 0xffa0e730 (user)"
doc = "Firmware lock pair, release side. The header names this offset SH_SCRATCH4, a one-bit scratch register (mask 0x1, INIT 0) with its alias at 0x208 (lb_lock_status); the lock use is the PROM's, and our name stays for that role. The PROM takes the lock by polling lb_lock_status until it reads 0, does a read-modify-write of cpu_bits, then writes 0 here. If the status does not read 0 within 1,000,000 microseconds it writes 0 here and polls again. Whether a read of lb_lock_status takes the lock in hardware is unknown; a plain register pair where the status always reads 0 satisfies every access read. The same lock guards the field setter of fw_debug_word (site 0xffa974d0). Linux v5.3 does not define the lock; the PROM behaviour above is as observed at the access and the meaning is inferred."

[registers.lb_lock_status]
offset = 0x1101d0208
access = "r"
width = 64
grade = "inferred"
reset = "unknown"
from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_SCRATCH4_ALIAS (address only); SAL 5.04 PROM site 0xffa0ed30 (the poll); the offset-form variant site 0xffa0e880 reads 0x1101d0208 on a remote node"
doc = "Firmware lock status. The header names this offset SH_SCRATCH4_ALIAS and gives no description, so what a read does is unknown; the lock use is the PROM's and our name stays for that role. The bit it tests is the one bit of SH_SCRATCH4. The PROM polls it with a short delay until it reads 0; any non-zero value keeps it waiting until the 1,000,000 microsecond deadline, then it writes 0 to lb_lock and keeps polling, so a status that never reads 0 hangs the PROM. A read side effect is unknown. Linux v5.3 does not define the lock; the PROM behaviour above is as observed at the access and the meaning is inferred."

