[registers.ni_llp_stat]
offset = 0x150000000
count = 2
stride = 0x2000
access = "r"
width = 64
grade = "established"
reset = 0x0
reset_grade = "inferred"
reset_from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_NI0_LLP_STAT_INIT, value 0x0 (macro only; no source states a power-on default)"
from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) names the offset SH_NI0_LLP_STAT (mask 0xf); the SHub 1 PROM name table agrees (records 81 to 105 and 261 to 281); SAL 5.04 PROM slot 55 (0xffa5d850) and its probe 0xffa5cf40"
doc = "Port 0 at this offset, port 1 is the next register block, 0x2000 higher (SH_NI1_*). Network interface link state. The PROM reads it once per port in its link probe and compares the low nibble with 9, nothing else. 9 is taken as link up (inferred from the use: the probe then checks the link credit words and reports success). Any other value is a link that is not up; no PROM code separates a link that is down from a port with no cable. The INIT of zero is a not-up value, so a node with no NUMAlink cable keeps the hardware path."

[registers.ni_llp_stat.fields]
