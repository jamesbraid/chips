reset_grade = "inferred"
reset_from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_SCRATCH3_INIT 0x0, MASK 0x1; no source states a power-on default"
from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_SCRATCH3 (mask 0x1, INIT 0); SAL 5.04 PROM site 0xffa0ee40 (release, shared with lb_lock), 0xffa0ed30 (forced release on timeout), 0xffa0eee0 (release on another node), 0xffa0f046 and 0xffa0f5a6 (callers)"
doc = "Second firmware lock pair, release side. The header names this offset SH_SCRATCH3, a one-bit scratch register (mask 0x1, INIT 0) with its alias at 0x188 (lb_lock2_status); the lock use is the PROM's, and our name stays for that role. The methods of the chip object take it around read-modify-writes of fw_word_1540 by the same routines that take lb_lock (site 0xffa0ed30 on this node, 0xffa0ee90 on another): poll lb_lock2_status, do the work, write 0 here. On this node a status that does not read 0 within 1,000,000 microseconds makes the PROM write 0 here and keep polling; the other-node form gives up after its deadline and returns -9 without writing. Whether a read of the status takes the lock in hardware is unknown; a plain register pair where the status always reads 0 satisfies every access read. Linux v5.3 does not define the lock; the behaviour is as observed at the access and the meaning is inferred."

[registers.lb_lock2_status]
offset = 0x1101d0188
access = "r"
width = 64
grade = "inferred"
reset = "unknown"
from = "SGI 2.4 SN2 header (linux-mips linux-2.4 8ef7d46c94d5) SH_SCRATCH3_ALIAS (address only); SAL 5.04 PROM site 0xffa0ed30 (this-node poll), 0xffa0ad80 (other-node poll), 0xffa0ef40 (descriptor entry), 0xffa0f056 and 0xffa0f5b6 (callers)"
doc = "Second firmware lock status. The header names this offset SH_SCRATCH3_ALIAS and gives no description; the other-node routine tests bit 0 only, which is the one bit of SH_SCRATCH3. The lock use is the PROM's and our name stays for that role. This-node polls proceed when the whole 64-bit value reads 0 (the same routine as lb_lock_status). The other-node routine, reading it through the node-object read, proceeds when bit 0 reads 0 and ignores the other bits, so a model must keep bit 0 at 0 when the lock is free. A status that never reads 0 times out after 1,000,000 microseconds (forced release on this node, error -9 on another). A read side effect is unknown. Linux v5.3 does not define the lock; the meaning is inferred."

