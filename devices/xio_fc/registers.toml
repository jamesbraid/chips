unit = "xio_fc"
prefix = "XIO_FC"
title = "XIO Fibre Channel adapter (Adaptec AIC-1160 board), command and register contract"
from = "shipped XIO Fibre Channel adapter driver objects, read directly; no public programming manual exists"

[c]
legacy_header = "include/xio_fc.h"
legacy_guard = "XIO_FC_H"

[constants]
BANK_CODE_STEP = { value = 0x11, grade = "established", doc = "bank n is selected by writing n * 0x11: 0x00, 0x11, 0x22, 0x33, 0x44, 0x55 are written as immediates; 0x66 and 0x77 only by the RAM test, which steps through all eight codes; whether the two nibbles select banks separately is [U]" }
CLOCK_STATUS_DIV_1 = { value = 0xbe, grade = "established", doc = "accepted result; divisor names [I]" }
CLOCK_STATUS_DIV_2_A = { value = 0x2e, grade = "established", doc = "accepted result; divisor names [I]" }
CLOCK_STATUS_DIV_2_B = { value = 0xfe, grade = "established", doc = "accepted result; divisor names [I]" }
CLOCK_STATUS_DIV_4 = { value = 0x6e, grade = "established", doc = "accepted result; divisor names [I]" }
CLOCK_STATUS_MASK = { value = 0xfc, grade = "established", doc = "" }
CLOCK_STATUS_OR = { value = 0x2, grade = "established", doc = "" }
DONE_HANDLE = { value = 0x0, grade = "established", doc = "2 bytes LE; completed TCB handle, the tag written at XIO_FC_TCB_OX_ID" }
DONE_PASS = { value = 0x3, grade = "established", doc = "byte; initialised to 0xff; the chip writes the ring-lap number modulo 256 and the driver consumes while it equals the expected value" }
DONE_STATUS = { value = 0x2, grade = "established", doc = "byte; completion status code (normal-command meanings: 0 success, 1 overrun, 2 underrun, 3 TCB parity error, 4 error response, 5 out of order, 6 frame format, 7 count overflow, 8 undelivered, 9 and 0xa bad delimiter, 0xb aborted, 0xf primitive timeout [E]; a loop-init completion reuses some values, and a successful one returns the negotiated loop address)" }
HOST_CTRL_MASTER_IRQ_EN = { value = 0x4, grade = "established", doc = "set and cleared by the interrupt enable and disable routines; name [I]" }
HOST_CTRL_PAUSE = { value = 0x40, grade = "established", doc = "set to pause the sequencer, polled for the acknowledge" }
HOST_CTRL_PAUSE_AT_TOP = { value = 0x80, grade = "established", doc = "set to pause at the top of the program, polled for the acknowledge; unpause clears 0xc0" }
HOST_CTRL_RESET_WRITE = { value = 0x43, grade = "established", doc = "the value the error-recovery reset writes after a pause (pause plus 0x02 plus 0x01); the effect of the two low bits is [I]; this is a value written, not a reset value of the register ([U])" }
INT_BREAKPOINT = { value = 0x200, grade = "inferred", doc = "register 0x25 bit 1: named by the sheet's register map; neither interrupt routine tests it on its own" }
INT_HARDWARE_ERROR = { value = 0x4000, grade = "established", doc = "register 0x25 bit 6: the routine reads and latches the error-status register at 0x23" }
INT_HOST_COMPLETION = { value = 0x400, grade = "inferred", doc = "register 0x25 bit 2: named by the sheet's register map; neither interrupt routine tests it on its own, and the driver does not depend on it" }
INT_LOOP_ATTENTION = { value = 0x8, grade = "established", doc = "register 0x24 bit 3: the back-end routine then selects bank 1 and reads the loop-state register at 0xa1" }
INT_PCI_ERROR = { value = 0x8000, grade = "established", doc = "register 0x25 bit 7" }
INT_SEQ_COMPLETION = { value = 0x1000, grade = "established", doc = "register 0x25 bit 4: the done-queue completion bit; the driver drains the queue by scanning pass bytes regardless of this bit. Whether the per-source enable at 0x99 bit 4 is needed is [U]" }
INT_SEQ_READY_FOR_LIP = { value = 0x100, grade = "established", doc = "register 0x25 bit 0: tested by the back-end routine on its saved copy of the status byte; set means the sequencer has run loop initialisation far enough for the host to post its loop-initialisation command block, and the routine then pauses the sequencer. Name [I]" }
INT_SOFTWARE_ERROR = { value = 0x2000, grade = "established", doc = "register 0x25 bit 5" }
LINK_CTRL_LINK_ENABLE = { value = 0x40, grade = "established", doc = "written second by the initialiser; name [I]" }
LINK_CTRL_LINK_RESET = { value = 0x20, grade = "established", doc = "written first by the initialiser; name [I]" }
LINK_CTRL_LOSS_OF_SIGNAL = { value = 0x1, grade = "established", doc = "tested on the read, raises the loss-of-signal notice; name [I]" }
LINK_CTRL_LOSS_OF_SYNC = { value = 0x2, grade = "established", doc = "tested on the read, raises the loss-of-synchronisation notice; name [I]" }
PLOGI_ACC_CLASS1_PARAMS = { value = 0x24, grade = "inferred", doc = "16 bytes" }
PLOGI_ACC_CLASS2_PARAMS = { value = 0x34, grade = "inferred", doc = "16 bytes" }
PLOGI_ACC_CLASS3_PARAMS = { value = 0x44, grade = "inferred", doc = "16 bytes" }
PLOGI_ACC_CODE = { value = 0x0, grade = "established", doc = "top byte 0x02 is accept, 0x01 is reject; the driver gates login on it" }
PLOGI_ACC_COMMON_PARAMS = { value = 0x4, grade = "inferred", doc = "16 bytes" }
PLOGI_ACC_LENGTH = { value = 0x74, grade = "established", doc = "bytes copied (116)" }
PLOGI_ACC_NODE_NAME = { value = 0x1c, grade = "inferred", doc = "8 bytes, target node name" }
PLOGI_ACC_PORT_NAME = { value = 0x14, grade = "inferred", doc = "8 bytes, target port name" }
PLOGI_ACC_RESERVED = { value = 0x54, grade = "inferred", doc = "16 bytes" }
PLOGI_ACC_VENDOR_VERSION = { value = 0x64, grade = "inferred", doc = "16 bytes" }
PLOGI_REJECT_EXPLANATION = { value = 0x6, grade = "established", doc = "logged on a reject" }
PLOGI_REJECT_REASON = { value = 0x5, grade = "established", doc = "logged on a reject" }
PRLI_ACC_CODE = { value = 0x0, grade = "established", doc = "byte; 0x02 is accept, 0x01 is reject" }
PRLI_ACC_FLAGS = { value = 0x6, grade = "inferred", doc = "2 bytes" }
PRLI_ACC_LENGTH = { value = 0x14, grade = "established", doc = "bytes copied (20)" }
PRLI_ACC_ORIGINATOR_ASSOC = { value = 0x8, grade = "inferred", doc = "4 bytes" }
PRLI_ACC_PAGE_LENGTH = { value = 0x1, grade = "inferred", doc = "" }
PRLI_ACC_PAYLOAD_LENGTH = { value = 0x2, grade = "inferred", doc = "2 bytes" }
PRLI_ACC_RESPONDER_ASSOC = { value = 0xc, grade = "inferred", doc = "4 bytes" }
PRLI_ACC_SERVICE_BYTE = { value = 0x13, grade = "established", doc = "byte; the driver requires 0x12 (target-function bit 0x10 plus 0x02), otherwise rejects the target; the bit meanings are [I]" }
PRLI_ACC_TYPE = { value = 0x4, grade = "inferred", doc = "byte; 0x08 for the SCSI protocol" }
REG_BANK_SELECT = { value = 0x2c, grade = "established", doc = "byte; register-bank select, not a reset" }
REG_CLOCK_STATUS = { value = 0x63, grade = "established", doc = "byte, read under bank 4: the link-speed routine masks the low two bits with 0xfc, ORs in 0x02 and requires 0xbe, 0x2e, 0xfe or 0x6e, otherwise configuration collection fails" }
REG_HOST_CONTROL = { value = 0x22, grade = "established", doc = "byte; host control" }
REG_LINK_CONTROL = { value = 0xe1, grade = "established", doc = "byte; written 0x20 then 0x40 under bank 3 by the initialiser, read under bank 2 by the error routine" }
REG_SEQ_CONTROL = { value = 0x0, grade = "established", doc = "byte; sequencer control" }
REG_SERDES_STATUS = { value = 0xeb, grade = "established", doc = "byte, read under bank 1" }
RESID_SEGMENT_RESIDUAL = { value = 0x8, grade = "established", doc = "3 bytes, low byte first; the byte count left in the current segment" }
RESID_SG_ELEMENT_INDEX = { value = 0xc, grade = "established", doc = "byte; the element index is the high nibble ([I] that it is an index)" }
RESID_SG_PAGE_PTR = { value = 0x0, grade = "established", doc = "offset in that block: 8-byte bus pointer to the current scatter-gather page" }
RESP_FCP_STATUS_FLAGS = { value = 0xa, grade = "established", doc = "byte; bits 0x01 response-length valid, 0x02 sense-length valid, 0x04 residual overrun, 0x08 residual underrun (each tested by a single-bit branch); the names follow the FC-4 SCSI profile [I]" }
RESP_PAYLOAD = { value = 0x18, grade = "inferred", doc = "response information, then sense data, from the standard response unit; [E] only that the completion routine reads the byte at 0x1b" }
RESP_RESIDUAL = { value = 0xc, grade = "established", doc = "4 bytes big-endian (read as an unaligned word pair); the command residual on underrun, reported as a length mismatch on overrun" }
RESP_RESIDUAL_INFO = { value = 0x80, grade = "established", doc = "16-byte adapter residual-info block, written by the chip little-endian and read as written" }
RESP_RESPONSE_LEN = { value = 0x14, grade = "established", doc = "4 bytes big-endian, read as an unaligned word pair" }
RESP_SCSI_STATUS = { value = 0xb, grade = "established", doc = "byte; passed up as the command's SCSI status; 0x28 (queue full) is compared and handled apart" }
RESP_SENSE_LEN = { value = 0x10, grade = "established", doc = "4 bytes big-endian, read as an unaligned word pair" }
SEQ_CTRL_RAM_LOAD = { value = 0x1, grade = "established", doc = "written alone before the microcode image is streamed in" }
SEQ_CTRL_RESET_PC = { value = 0x2, grade = "inferred", doc = "reset the sequencer program counter; seen only inside the 0x42 write" }
SEQ_CTRL_RUN = { value = 0x40, grade = "established", doc = "written after the image is verified, to run the sequencer" }
SEQ_CTRL_START = { value = 0x42, grade = "established", doc = "run plus reset, written after the mainline image is loaded to start it from the top" }
SERDES_FAULT = { value = 0x10, grade = "established", doc = "tested by the error routine, raises the media-fault notice; name [I]" }
SERDES_LOCK_NOT_IN_USE = { value = 0x8, grade = "established", doc = "tested only when bit 0x10 of 0xea is set, raises the link-not-usable notice; name [I]" }
SERDES_MEDIA_SENSE_MASK = { value = 0x3, grade = "established", doc = "the initialiser masks these two bits and stores them; that they sense the media module is [I]" }
TCB_CONTROL = { value = 0x21, grade = "established", doc = "command-type discriminator: 0x00 read or no-data command, 0x01 unsolicited-receive buffer, 0x02 write, 0x0a link-service request/reply; roles [I] from the builders" }
TCB_DATA_LEN = { value = 0x60, grade = "established", doc = "4 bytes LE; copy of the transfer length" }
TCB_DATA_PTR = { value = 0x4c, grade = "established", doc = "8 bytes LE; bus address of the single buffer (mode 0x08) or of the scatter-gather list (mode 0x0b)" }
TCB_DELIMITER = { value = 0x9, grade = "established", doc = "byte written 0x05, class-3 normal [I]" }
TCB_DESC_MODE = { value = 0x23, grade = "established", doc = "data-descriptor mode set by the data mapper: 0x08 one direct buffer, 0x0b scatter-gather list, 0x0c no data" }
TCB_D_ID = { value = 0x4, grade = "established", doc = "3 bytes; on a loop the byte at 0x04 is the target loop address, looked up from a fixed target-id table; the source ID is absent" }
TCB_FCP_CDB = { value = 0x30, grade = "established", doc = "16 bytes copied from the request; confirmed at 0x30 on the three machine builds" }
TCB_FCP_CNTL = { value = 0x2c, grade = "established", doc = "only the byte at 0x2f is written: 0x02 read, 0x01 write; the rest of FCP_CNTL [I]" }
TCB_FCP_DL = { value = 0x40, grade = "established", doc = "4 bytes big-endian, FC network order (the builder uses unaligned word stores)" }
TCB_FCP_LUN = { value = 0x24, grade = "established", doc = "that the request's LUN bytes land here (8 bytes, FC order); full 8-byte form [I]" }
TCB_F_CTL0 = { value = 0x10, grade = "established", doc = "byte written 0x08 by the normal builder (re-read); name [I]" }
TCB_F_CTL1 = { value = 0x11, grade = "inferred", doc = "name by frame-header layout; the normal builder does not store here ([U] value); the link-service builders store a 4-byte big-endian word at 0x10 to 0x13 [E that it is written]" }
TCB_F_CTL2 = { value = 0xe, grade = "established", doc = "byte written 0x29 for a SCSI command" }
TCB_HANDLE_COPY = { value = 0x68, grade = "established", doc = "2 bytes LE written; the TCB handle repeated, chip use [I]" }
TCB_LOOP_FLAGS = { value = 0x1c, grade = "established", doc = "byte: 0x18 when the host-unfair tunable is set, else 0x40; meaning (open half-duplex, with and without fair arbitration) [I]" }
TCB_NEXT = { value = 0x44, grade = "established", doc = "8 bytes LE, PCI bus address of the next slot of the driver's circular TCB queue; [I] that the chip uses it as a chain link" }
TCB_OX_ID = { value = 0x0, grade = "established", doc = "2 bytes LE; the command tag, written again at 0x68 and echoed in the done-queue entry" }
TCB_RESP_PTR = { value = 0x58, grade = "established", doc = "8 bytes LE; bus address of the 256-byte response and sense buffer" }
TCB_RX_ID = { value = 0x2, grade = "established", doc = "2 bytes; 0xffff (unassigned) on an outbound command" }
TCB_R_CTL = { value = 0x7, grade = "established", doc = "byte written: 0x01 for a SCSI command, 0x22 for a link-service request, 0x23 for its reply; [I] that this is a chip encoding rather than the wire value (the wire value of a command is 0x06)" }
TCB_SEQ_CNT = { value = 0x14, grade = "inferred", doc = "sequence count, 2 bytes at 0x14 to 0x15, by frame-header layout; no store seen" }
TCB_SEQ_ID = { value = 0x13, grade = "inferred", doc = "sequence ID by frame-header layout; no store from the normal builder (re-read), reached only by the link-service word at 0x10" }
TCB_TYPE = { value = 0xf, grade = "established", doc = "byte written 0x08 for a SCSI command; 0x01 for a link-service request [E written, I as FC-4 type]" }
TCB_UNKNOWN_64 = { value = 0x64, grade = "established", doc = "byte written 0x14 by the normal builder (re-read); role [U]: settle by reading the sequencer microcode's use of this byte, or a capture of a completed command block" }
TCB_XFER_LEN = { value = 0x54, grade = "established", doc = "4 bytes LE byte count for a single buffer; zero in list mode (the list ends on a flag in its last descriptor)" }
