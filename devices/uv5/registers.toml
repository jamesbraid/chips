unit = "uv5"
prefix = "UV5"
title = "UV5 (UV 500 generation) hub MMR map"
doc = "Offsets are relative to the hub local MMR window (or the pnode-indexed global window). Offsets, field positions and access letters are definitions in SGI-written Linux platform code. Field positions are the header bitfield structs read least-significant first; reserved and undefined bits are omitted. Role text is a paraphrase of how the kernel uses the register and is inferred. Reset values are unknown: the header states none."
from = "Linux v5.4 SGI UV platform MMR header (GPL); UV5 rows from the v6.6 header"
public_from = ["Linux v5.4 SGI UV platform", "Linux v6.6 SGI UV platform"]

[c]
offset_macro = "bare"

[registers.node_id]
offset = 0x0
access = "rw"
width = 64
grade = "established"
doc = "Header name UVH_NODE_ID. Hub identity: part number, revision, manufacturer and the node id the hub was given. Software reads it at offset 0 to tell the hub generation."
[registers.node_id.fields]
force1 = { bits = [0, 0], grade = "established", doc = "Access RO in the header." }
manufacturer = { bits = [11, 1], grade = "established", doc = "Access RO in the header." }
part_number = { bits = [27, 12], grade = "established", doc = "Access RO in the header." }
revision = { bits = [31, 28], grade = "established", doc = "Access RO in the header." }
node_id = { bits = [38, 32], grade = "established", doc = "Access RW in the header." }
ni_port = { bits = [62, 57], grade = "established", doc = "Access RO in the header." }

[registers.node_present_0]
offset = 0x1400
access = "rw"
width = 64
grade = "established"
doc = "Header name UVH_NODE_PRESENT_0."
[registers.node_present_0.fields]
