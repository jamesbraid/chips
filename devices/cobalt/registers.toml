unit = "cobalt"
prefix = "COBALT"
name_source = "ours"
title = "Cobalt (system ASIC of the SGI Visual Workstation 320 and 540): the CPU block with its timer, and the interrupt controller"
doc = "Offsets, bit positions and values come from the Linux Visual Workstation code (kernel 2.2 to 3.14) and are cross-checked against SGI's shipped Windows NT 4.0 HAL (halborg.dll 1.3). Grades: established means the shipped HAL programs the item the same way (or the item is its own table); inferred means only Linux defines it, a software expectation of Linux and not of the shipped system. Where the HAL differs, the item says so. The chip's own specification is not held. Offsets are relative to the base of each block (CPU_PHYS and APIC_PHYS below). Linux reads and writes every register as a 32-bit word. Names: the register and constant names follow the public Linux header and the shipped HAL's own function names (where the HAL names the feature); the memory controller, which neither names, is the separate unit cobalt_mc with names of our own. Reset values are unknown throughout. Only what the kernel, the NT HAL and the PROM touch is here; the graphics engine registers are not."
from = "SGI NT 4.0 HAL halborg.dll 1.3 (Recovery CD-1 v1.1), read in Ghidra: see software/visws/nt-hal.md; Linux visws code: include/asm-i386/cobalt.h (2.2, 2.4), include/asm-i386/mach-visws/cobalt.h (2.6.20), arch/x86/include/asm/visws/cobalt.h and arch/x86/kernel/visws_quirks.c (2.6.33, 3.14)"
public_from = ["census:"]

[spaces.cpu]
[spaces.apic]

[registers.cpu_rev]
space = "cpu"
offset = 0x08
access = "r"
width = 32
grade = "established"
doc = "Cobalt revision. The kernel prints it at start-up and, in the 2.4 interrupt path, reads it after a driver has acknowledged its device as a way to make sure the driver's write has reached the device before the end-of-interrupt. Readers: the NT HAL compares the whole 32-bit word with 0xa0 and 0xa8; the PROM main module reads it as a byte (and as a dword masked to the low byte) before the same comparisons; the PROM self-test compares the whole dword with them to choose the bank-register base, and records the difference between the word with its low nibble cleared and 0xa0 in extended CMOS without branching on it. Those equality tests bound nothing for a board that is neither 0xa0 nor 0xa8, and the record is never acted on in the code read, so what other revisions read is inferred only from the Cobalt:a4 revision text a real machine reports. Byte and dword reads both occur. The register is only ever read, so no reset value is known. Addresses: the Cobalt README."

[registers.cpu_ctrl]
space = "cpu"
offset = 0x10
access = "rw"
width = 32
grade = "established"
doc = "Timer and memory control. Linux sets timer_run and clears timer_mask, each by a read-modify-write, after loading the count, and touches no other bit. The NT HAL (halborg.dll 1.3: the Cobalt control set-up in HalInitSystem and HalpEccControl) also clears ecc_enable at start-up, sets timer_mask at start-up (it clears the mask later, when it starts the tick: see cpu_timeval), ORs in page_close from its PAGEOPENPOLICY boot option, and sets ecc_enable together with bit 0 of the memory block when it enables ECC."

[registers.cpu_ctrl.fields]
ecc_enable = { bits = [0, 0], grade = "established", doc = "1 turns ECC checking on (the HAL sets it with bit 0 of the first memory-controller register). Cleared by the HAL at start-up; the NT HAL never sets it on a Cobalt Lite revision (0xa0, 0xa8)." }
page_close = { bits = [1, 1], grade = "established", doc = "Page policy. The HAL ORs 2 in for PAGEOPENPOLICY=CLOSE and 0 for OPEN (the default); it never clears the bit, so what OPEN means for a bit the firmware set is unknown. That the bit makes the controller close DRAM pages after an access is inferred from the option's names only." }
timer_run = { bits = [2, 2], grade = "established", doc = "1 starts the system timer; 0 leaves it stopped." }
timer_mask = { bits = [3, 3], grade = "established", doc = "1 masks the timer interrupt; 0 lets it through." }

[registers.cpu_stat]
space = "cpu"
offset = 0x20
access = "rw"
width = 32
grade = "established"
doc = "Timer status. The HAL also stores all ones here once while setting up the timer, after it loads the count and sets the run bit, so an all-ones write is accepted and a model that treats a written 1 as no change matches it. It does not read it back there. The 2.2 and 2.4 timer handlers clear the pending bit by reading the register and writing it back with that bit cleared. The 2.5 and later code never writes it, so whether a level timer interrupt needs this clear to deassert is open."

[registers.cpu_stat.fields]
cacheop_intr = { bits = [0, 0], grade = "established", doc = "Read: 1 means a cache-operation interrupt is pending. The NT HAL treats it as unexpected (halborg.dll 1.3, CacheopInterrupt) and clears it by writing the register with this bit zero and every other bit one. Which cache operation raises it is unknown." }
timer_intr = { bits = [1, 1], grade = "established", doc = "Read: 1 means the timer interrupt is pending. Write 0: clear it." }

[registers.cpu_reset]
space = "cpu"
offset = 0x18
access = "rw"
width = 32
grade = "established"
doc = "Machine reset on early boards (the PROM main module's reboot routine does the same: it sets bit 0 here, or writes 6 to the PIIX4 reset control register on the newer board classes). The NT HAL sets bit 0 to reboot the 320 below board revision 12 and the 540 revision 0 (halborg.dll 1.3, HalpReboot, BoardResetAtPIIX4); other boards reboot through the PIIX4 reset control register. A separate register from the memory block's error status at offset 0x18. The PROM self-test also writes it: a read-modify-write that ORs in bit 0 only when neither of two CMOS marker bytes is 0xa5 (a cold boot: it writes 0xa5 to both, and every boot then zeroes both) (the value read is only ORed, never tested), a store of 3 (bits 1 and 0) right after it stores 0xbb in extended CMOS byte 0x8c, and a store of 1 on a second path whose caller was not traced. What bit 1 does is unknown. Addresses: the Cobalt README."

[registers.cpu_reset.fields]
reset = { bits = [0, 0], grade = "established", doc = "1 resets the machine on the boards named above." }

[registers.cpu_cacheop_ctl]
space = "cpu"
offset = 0x40
access = "rw"
width = 32
grade = "inferred"
doc = "Cache-operation request, used by the NT HAL's cache flush routine. It first waits for bit 16 to clear, then stores the line count (the byte length rounded up to 32-byte lines, at most 0xffff per request) in bits 15:0 with bit 16 set (start), and bit 18 set as well when the caller asks for invalidate and the HAL's invalidate flag is set. The address goes to cpu_cacheop_addr first. The HAL does not use these registers on the reduced revisions. The bit meanings come from this use only; nothing says what the operation does on the bus."

[registers.cpu_cacheop_addr]
space = "cpu"
offset = 0x48
access = "rw"
width = 32
grade = "inferred"
doc = "Start address of the cache operation requested through the cache-operation request register (cpu_cacheop_ctl). The HAL stores it immediately before the request word and never reads it."

[registers.cpu_cacheop_busy]
space = "cpu"
offset = 0x50
access = "r"
width = 32
grade = "inferred"
doc = "Bit 16 is set while cache operations are outstanding. The HAL polls it, stalling between reads, after the last flush request; the request routine polls bit 16 of the request register the same way before it starts a new one."

[registers.cpu_timecur]
space = "cpu"
offset = 0x38
access = "r"
width = 32
grade = "established"
doc = "Timer current value. The NT HAL's timer calibration reads it after starting the timer with a reload of 0xffffffff and takes the fall as the tick count over one RTC second (halborg.dll 1.3, HalpCalibrateCobaltTimer); it counts down."

[registers.cpu_timeval]
space = "cpu"
offset = 0x30
access = "rw"
width = 32
grade = "established"
doc = "Timer count. The kernel writes the Cobalt core rate divided by the tick rate (a 100 MHz core rate) before starting the timer and calls it a countdown value. That it reloads itself each period is inferred from the kernel using it as the periodic tick and writing it once. The NT HAL writes all ones to it three times: once at set-up before the run bit is set, then twice more in the calibration loop (two passes, run bit already set), and each pass reads the current count about one real-time-clock second later, of which only the last is used; it takes all ones minus that count as the rate, rounded to the nearest 10,000, with no range test. For that to measure one second the write must set the running count at once, not only a reload that waits for the next expiry (software expectation; the hardware behaviour is inferred). After calibration the HAL also writes the computed tick reload here (halborg.dll 1.3, addresses in the Cobalt README), then sets timer_run and clears timer_mask. The HAL never reads this register back. Addresses: the Cobalt README."

[registers.apic_lo]
space = "apic"
offset = 0x00
count = 30
stride = 0x10
access = "rw"
width = 32
grade = "established"
doc = "Interrupt redirection entry, low word, one per interrupt line (thirty lines, 0 to 29). The kernel writes the level bit and an interrupt vector to unmask a line and only the mask bit to mask it, reading the register back after masking. The vector it writes is the kernel's irq number plus 0x20, so it is not the line number."

[registers.apic_lo.fields]
delivery_mode = { bits = [10, 8], grade = "established", doc = "Delivery mode in the I/O APIC layout. The NT HAL writes 0 (fixed) for every device entry and 4 (NMI) for the NMI entry, after first writing the entry with 0 and reading it back." }
dest_mode = { bits = [11, 11], grade = "established", doc = "1 means the high word's destination is a logical mask, 0 a physical id. The NT HAL sets it only on the NMI entry; device entries are physical." }
remote_irr = { bits = [14, 14], grade = "established", doc = "The NT HAL reads it on the NMI entry and clears it by writing the entry back with the bit zero (HalpHandleCoNMI), then re-reads it. Whether it is set by delivery of a level line and cleared by the local APIC end of interrupt is not shown." }
bit17 = { bits = [17, 17], grade = "unknown", doc = "The NT HAL writes the NMI entry with this bit clear, reads it back, and aborts NMI set-up (masking the entry) if it reads set. Its meaning is not known." }
vector = { bits = [7, 0], grade = "established", doc = "Interrupt vector delivered to the processor. The kernel's value fits in eight bits; the field's extent is not stated by any code and follows the standard I/O APIC layout." }
level = { bits = [15, 15], grade = "established", doc = "1 level-triggered, 0 edge. The kernel sets it on every line it enables." }
mask = { bits = [16, 16], grade = "established", doc = "1 masks the line, 0 enables it." }

[registers.apic_hi]
space = "apic"
offset = 0x04
count = 30
stride = 0x10
access = "rw"
width = 32
grade = "established"
doc = "Interrupt redirection entry, high word. Linux and the NT HAL write zero beside every device entry's low word; the HAL writes the NMI entry's high word with one bit set per processor id (1 shifted by the processor number) in bits 31:24 for logical delivery. What the HAL writes is established; reading the field as the destination, in the I/O APIC layout, and zero as 'processor id 0, physical' for device entries are inferred from the layout. The HAL never steers a device entry to another processor."


[registers.apic_id]
space = "apic"
offset = 0xffc
access = "rw"
width = 32
grade = "established"
doc = "Controller identification and enable. The kernel reads it, sets the enable bit with a read-modify-write that it says must not change the identification, and prints the result. Where the identification field sits is not known. The NT HAL and the PROM main module run the same sequence: read the word, test bits 27:24, and only when they are zero clear bit 8 and the field and store 4 in the field; then in every case set bit 8 and store again. Both test the field before writing it, so each depends on the value only through whether the field is zero. The HAL masks all thirty entries first and the PROM writes all thirty first (low word the vector with the level and mask bits set, then the mask bit cleared for every line that has a registered handler; entry 29 gets all ones; high word 0), so entries accept writes while the controller is disabled. The PROM also has three places that set the field to 4 without testing it: the self-test, the early start-up in the main module, and the same early code in every held release (1.0002 to 1.1005). The main module ends by masking all entries and clearing bit 8. No reset value is known. Addresses: the Cobalt README."

[registers.apic_hi.fields]
dest = { bits = [31, 24], grade = "inferred", doc = "Destination (what the HAL writes is established; the meaning follows the I/O APIC layout and is inferred): a logical processor mask when the low word's dest_mode is set (the NMI entry), otherwise a processor id (device entries, written as 0)." }

[registers.apic_id.fields]
id = { bits = [27, 24], grade = "established", doc = "Controller id field. The NT HAL writes 4 here only when the field reads zero (with the enable bit cleared in that store); the PROM main module does the same test, and its self-test and early start-up write 4 unconditionally. What the id is used for is not known." }
enable = { bits = [8, 8], grade = "established", doc = "1 enables the interrupt controller. Linux sets it once at start-up." }

[constants]
CPU_PHYS = { value = 0xc2000000, grade = "established", doc = "Physical base of the CPU block." }
APIC_PHYS = { value = 0xc4000000, grade = "established", doc = "Physical base of the interrupt controller." }
TIME_HZ = { value = 100000000, grade = "inferred", doc = "The core rate the Linux kernel divides by the tick rate to load the timer. The NT HAL assumes no rate: it measures the timer against the RTC update flag at start-up (nt-hal.md)." }
CPU_NUM_PHYS = { value = 0x1e00, grade = "established", doc = "Physical address of the 16-bit processor count in low memory; the processor table follows at the next two bytes. Not a register: written by the machine firmware." }
CPU_MAX = { value = 4, grade = "inferred", doc = "Most processors the kernel accepts from that table." }
APIC_LINES = { value = 30, grade = "established", doc = "Number of interrupt lines the kernel knows (0 to 29)." }
APIC_IDE0 = { value = 4, grade = "inferred", doc = "Line of the first IDE channel (on board 320 revision 5 the kernel uses line 5). The NT HAL uses line 4 on the newest 320 generation and the 540 except revision 0, 5 on the middle 320 generation and the 540 revision 0, and line 1 on the oldest 320 generation, which Linux has no case for." }
APIC_IDE1 = { value = 2, grade = "established", doc = "Line of the second IDE channel, on the 320 only." }
APIC_8259 = { value = 12, grade = "established", doc = "Line the PIIX4's cascaded interrupt controllers drive." }
APIC_PIIX4_USB = { value = 7, grade = "established", doc = "Line of the PIIX4's USB function." }
APIC_LI_AUDIO = { value = 22, grade = "inferred", doc = "Line of the Lithium audio engine." }
APIC_CPU = { value = 28, grade = "established", doc = "Line of the Cobalt timer, which the header also calls the cache interrupt." }
APIC_NMI = { value = 29, grade = "established", doc = "Last line; named NMI by the header and unused by Linux. The NT HAL programs it as an NMI-delivery entry (entry 28 on the Lite revisions 0xa0 and 0xa8 moves the NMI to 28 and the clock to 27)." }
APIC_PCIA_BASE0 = { value = 0, grade = "established", doc = "First line of the per-slot INTA lines of Lithium bridge A." }
APIC_PCIA_BASE123 = { value = 5, grade = "established", doc = "First of the lines bridge A shares among INTB, INTC and INTD (the header comment says 5 and 6)." }
APIC_PCIB_BASE0 = { value = 8, grade = "established", doc = "First line of the per-slot INTA lines of Lithium bridge B (8 to 12)." }
APIC_PCIB_BASE123 = { value = 13, grade = "established", doc = "First of the lines bridge B shares among INTB, INTC and INTD (13 to 15). Linux uses none of them; the NT HAL's bridge B interrupt map does (shared pins on entries 13 to 15)." }
APIC_VIDOUT0 = { value = 16, grade = "established", doc = "Video output 0 interrupt." }
APIC_VIDOUT1 = { value = 17, grade = "established", doc = "Video output 1 interrupt." }
APIC_VIDIN0 = { value = 18, grade = "established", doc = "Video input 0 interrupt." }
APIC_VIDIN1 = { value = 19, grade = "established", doc = "Video input 1 interrupt." }
APIC_AS = { value = 24, grade = "established", doc = "Linux does not use the line; the NT graphics miniport (sgcomp.sys) asks the HAL for the vector of line 24 and connects a handler to it. The line number is established; the name is Linux's." }
APIC_RE = { value = 25, grade = "established", doc = "Linux does not use the line; the NT graphics miniport (sgcomp.sys) asks the HAL for the vector of line 25 and connects a handler to it. The line number is established; the name is Linux's." }
APIC_MEM_ERR0 = { value = 26, grade = "established", doc = "First memory-error interrupt line. The NT HAL (halborg.dll 1.3, HalpMemErrInterrupt, HalpInitMemErrSubsystem) connects lines 26 and 27, only when the board is not a Cobalt Lite revision. Line 26 has vector 0xf1 (HalpInitMemErrSubsystem, 0x8001a041 to 0x8001a071). Which error uses which line is not recovered." }
APIC_MEM_ERR1 = { value = 27, grade = "established", doc = "Second memory-error interrupt line; Line 27 has vector 0xf2 (HalpInitMemErrSubsystem, 0x8001a041 to 0x8001a071). On Lite revisions 0xa0 and 0xa8 the HAL puts the clock here and the NMI on line 28." }
