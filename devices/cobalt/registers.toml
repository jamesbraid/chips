unit = "cobalt"
prefix = "COBALT"
title = "Cobalt (system ASIC of the SGI Visual Workstation 320 and 540): the CPU block and the interrupt controller, as SGI's Linux platform code names them"
doc = "Offsets, bit positions and values come from the Linux Visual Workstation code (kernel 2.2 to 3.14) and are cross-checked against SGI's shipped Windows NT 4.0 HAL (halborg.dll 1.3). Grades: established means the shipped HAL programs the item the same way (or the item is its own table); inferred means only Linux defines it, a software expectation of Linux and not of the shipped system. Where the HAL differs, the item says so. The chip's own specification is not held. Offsets are relative to the base of each block (CPU_PHYS and APIC_PHYS below). Linux reads and writes every register as a 32-bit word. Reset values are unknown throughout. Only what the kernel and the NT HAL touch is here; the bank registers of the memory controller and the graphics engine registers are not."
from = "SGI NT 4.0 HAL halborg.dll 1.3 (Recovery CD-1 v1.1), read in Ghidra: see software/visws/nt-hal.md; Linux visws code: include/asm-i386/cobalt.h (2.2, 2.4), include/asm-i386/mach-visws/cobalt.h (2.6.20), arch/x86/include/asm/visws/cobalt.h and arch/x86/kernel/visws_quirks.c (2.6.33, 3.14)"
public_from = ["census:"]

[spaces.cpu]
[spaces.apic]
[spaces.mem]

[registers.cpu_rev]
space = "cpu"
offset = 0x08
access = "r"
width = 32
grade = "established"
doc = "Cobalt revision. The kernel prints it at start-up and, in the 2.4 interrupt path, reads it after a driver has acknowledged its device as a way to make sure the driver's write has reached the device before the end-of-interrupt. Three shipped readers constrain the value: the NT HAL compares the whole 32-bit word with 0xa0 and 0xa8, so those two revisions read with bits 31:8 zero; the PROM main module keeps only the low byte before the same comparisons; the PROM self-test records the difference between the word with its low nibble cleared and 0xa0, so the revisions it expects have bits 31:8 zero and 0xa in bits 7:4. The low nibble and the layout beneath it are not known. The register is only ever read, so no reset value is known. Addresses: the Cobalt README."

[registers.cpu_ctrl]
space = "cpu"
offset = 0x10
access = "rw"
width = 32
grade = "established"
doc = "Timer and memory control. Linux sets timer_run and clears timer_mask, each by a read-modify-write, after loading the count, and touches no other bit. The NT HAL (halborg.dll 1.3: the Cobalt control set-up in HalInitSystem and HalpEccControl) also clears ecc_enable at start-up, sets timer_mask, ORs in page_close from its PAGEOPENPOLICY boot option, and sets ecc_enable together with bit 0 of the memory block when it enables ECC."

[registers.cpu_ctrl.fields]
ecc_enable = { bits = [0, 0], grade = "established", doc = "1 turns ECC checking on (the HAL sets it with bit 0 of the first memory-controller register). Cleared by the HAL at start-up; the NT HAL never sets it on a Cobalt Lite revision (0xa0, 0xa8)." }
page_close = { bits = [1, 1], grade = "established", doc = "Page policy. The HAL ORs 2 in for PAGEOPENPOLICY=CLOSE and 0 for OPEN (the default); it never clears the bit, so what OPEN means for a bit the firmware set is unknown. That the bit makes the controller close DRAM pages after an access is inferred from the option's names only." }
timer_run = { bits = [2, 2], grade = "established", doc = "1 starts the system timer; 0 leaves it stopped." }
timer_mask = { bits = [3, 3], grade = "established", doc = "1 masks the timer interrupt; 0 lets it through." }

[registers.cpu_stat]
space = "cpu"
offset = 0x20
access = "rw"
width = 32
grade = "established"
doc = "Timer status. The HAL also stores all ones here once while setting up the timer, after it loads the count and sets the run bit, so an all-ones write is accepted and a model that treats a written 1 as no change matches it. The 2.2 and 2.4 timer handlers clear the pending bit by reading the register and writing it back with that bit cleared. The 2.5 and later code never writes it, so whether a level timer interrupt needs this clear to deassert is open."

[registers.cpu_stat.fields]
cacheop_intr = { bits = [0, 0], grade = "established", doc = "Read: 1 means a cache-operation interrupt is pending. The NT HAL treats it as unexpected (halborg.dll 1.3, CacheopInterrupt) and clears it by writing the register with this bit zero and every other bit one. Which cache operation raises it is unknown." }
timer_intr = { bits = [1, 1], grade = "established", doc = "Read: 1 means the timer interrupt is pending. Write 0: clear it." }

[registers.cpu_reset]
space = "cpu"
offset = 0x18
access = "rw"
width = 32
grade = "established"
doc = "Machine reset on early boards. The NT HAL sets bit 0 to reboot the 320 below board revision 12 and the 540 revision 0 (halborg.dll 1.3, HalpReboot, BoardResetAtPIIX4); other boards reboot through port 0xcf9. A separate register from the memory block's error status at offset 0x18. The PROM self-test also writes it: a read-modify-write that ORs in bit 0 when the CMOS marker bytes are not 0xa5 (the value read is only ORed, never tested), a store of 3 (bits 1 and 0) right after it stores 0xbb in extended CMOS byte 0x8c, and a store of 1 on a second path whose caller was not traced. What bit 1 does is unknown. Addresses: the Cobalt README."

[registers.cpu_reset.fields]
reset = { bits = [0, 0], grade = "established", doc = "1 resets the machine on the boards named above." }

[registers.cpu_timecur]
space = "cpu"
offset = 0x38
access = "r"
width = 32
grade = "established"
doc = "Timer current value. The NT HAL's timer calibration reads it after starting the timer with a reload of 0xffffffff and takes the fall as the tick count over one RTC second (halborg.dll 1.3, HalpCalibrateCobaltTimer); it counts down."

[registers.cpu_timeval]
space = "cpu"
offset = 0x30
access = "rw"
width = 32
grade = "established"
doc = "Timer count. The kernel writes the Cobalt core rate divided by the tick rate (a 100 MHz core rate) before starting the timer and calls it a countdown value. That it reloads itself each period is inferred from the kernel using it as the periodic tick and writing it once. The NT HAL writes all ones to it with the run bit already set, in a second calibration pass, and reads the current count about one real-time-clock second later; it takes all ones minus that count as the rate, rounded to the nearest 10,000, with no range test. For that to measure one second the write must set the running count at once, not only a reload that waits for the next expiry (software expectation; the hardware behaviour is inferred). The HAL never reads this register back. Addresses: the Cobalt README."

[registers.apic_lo]
space = "apic"
offset = 0x00
count = 30
stride = 0x10
access = "rw"
width = 32
grade = "established"
doc = "Interrupt redirection entry, low word, one per interrupt line (thirty lines, 0 to 29). The kernel writes the level bit and an interrupt vector to unmask a line and only the mask bit to mask it, reading the register back after masking. The vector it writes is the kernel's irq number plus 0x20, so it is not the line number."

[registers.apic_lo.fields]
delivery_mode = { bits = [10, 8], grade = "established", doc = "Delivery mode in the I/O APIC layout. The NT HAL writes 0 (fixed) for every device entry and 4 (NMI) for the NMI entry, after first writing the entry with 0 and reading it back." }
dest_mode = { bits = [11, 11], grade = "established", doc = "1 means the high word's destination is a logical mask, 0 a physical id. The NT HAL sets it only on the NMI entry; device entries are physical." }
remote_irr = { bits = [14, 14], grade = "established", doc = "The NT HAL reads it on the NMI entry and clears it by writing the entry back with the bit zero (HalpHandleCoNMI), then re-reads it. Whether it is set by delivery of a level line and cleared by the local APIC end of interrupt is not shown." }
bit17 = { bits = [17, 17], grade = "unknown", doc = "The NT HAL writes the NMI entry with this bit clear, reads it back, and aborts NMI set-up (masking the entry) if it reads set. Its meaning is not known." }
vector = { bits = [7, 0], grade = "established", doc = "Interrupt vector delivered to the processor. The kernel's value fits in eight bits; the field's extent is not stated by any code and follows the standard I/O APIC layout." }
level = { bits = [15, 15], grade = "established", doc = "1 level-triggered, 0 edge. The kernel sets it on every line it enables." }
mask = { bits = [16, 16], grade = "established", doc = "1 masks the line, 0 enables it." }

[registers.apic_hi]
space = "apic"
offset = 0x04
count = 30
stride = 0x10
access = "rw"
width = 32
grade = "established"
doc = "Interrupt redirection entry, high word. Linux and the NT HAL write zero beside every device entry's low word; the HAL writes the NMI entry's high word with one bit set per processor id (1 shifted by the processor number) in bits 31:24 for logical delivery. What the HAL writes is established; reading the field as the destination, in the I/O APIC layout, and zero as 'processor id 0, physical' for device entries are inferred from the layout. The HAL never steers a device entry to another processor."


[registers.apic_id]
space = "apic"
offset = 0xffc
access = "rw"
width = 32
grade = "established"
doc = "Controller identification and enable. The kernel reads it, sets the enable bit with a read-modify-write that it says must not change the identification, and prints the result. Where the identification field sits is not known. The NT HAL reads it and, only when bits 27:24 are zero, clears bit 8 and the field and stores 4 in the field; it then in every case ORs in bit 8 and stores it again. It masks all thirty entries first, so entries accept writes while the controller is disabled. The PROM does not test the field: it replaces bits 27:24 with 4 unconditionally and keeps every other bit as read, once in the self-test and once in the main module, with no other access to this offset in either. No reset value is known: no code depends on the value before its first write. Addresses: the Cobalt README."

[registers.apic_hi.fields]
dest = { bits = [31, 24], grade = "inferred", doc = "Destination (what the HAL writes is established; the meaning follows the I/O APIC layout and is inferred): a logical processor mask when the low word's dest_mode is set (the NMI entry), otherwise a processor id (device entries, written as 0)." }

[registers.apic_id.fields]
id = { bits = [27, 24], grade = "established", doc = "Controller id field. The NT HAL writes 4 here only when the field reads zero (with the enable bit cleared in that store); the PROM always writes 4 whatever it read. What the id is used for is not known." }
enable = { bits = [8, 8], grade = "established", doc = "1 enables the interrupt controller. Linux sets it once at start-up." }

[registers.mem_ecc]
space = "mem"
offset = 0x00
access = "rw"
width = 32
grade = "established"
doc = "Memory controller control. At timer set-up the HAL also stores 0 here and 0 in the error status. The PROM self-test sets bit 0 with a full-word store of 1 and clears it with a store of 0; the main module clears bit 0 by read-modify-write before it sizes memory; none depends on a value read before the first write. The NT HAL clears it at start-up and sets bit 0, together with the CPU block's control bit 0, to turn ECC checking on (halborg.dll 1.3, HalpEccControl). Other bits are not touched by any software read."

[registers.mem_ecc.fields]
ecc_enable = { bits = [0, 0], grade = "established", doc = "1 enables ECC checking." }

[registers.mem_err_status]
space = "mem"
offset = 0x18
access = "rw"
width = 32
grade = "established"
doc = "Memory error status. The NT HAL's error handler reads it, treats the error as non-fatal when bit 16 is set or when bit 17 is set and the syndrome is zero, and clears the register by writing zero. The meaning of the bits is inferred from the messages the handler selects with them (invalid address, hard ECC, soft ECC, multiple errors)."

[registers.mem_err_addr]
space = "mem"
offset = 0x28
access = "r"
width = 32
grade = "established"
doc = "Memory error address, printed by the HAL as the address of the error."

[registers.mem_err_syndrome]
space = "mem"
offset = 0x30
access = "r"
width = 32
grade = "established"
doc = "Memory error ECC syndrome. A nonzero syndrome with a correctable error sends the HAL to HalpCorrectSoftEccError, which computes a quadword offset from the syndrome byte that is nonzero but performs no write-back; a model must not depend on a HAL write."

[constants]
MEM_PHYS = { value = 0xc6000000, grade = "established", doc = "Physical base of the memory-controller block, mapped by the NT HAL as one page (the HAL maps the three blocks with a page count of 1 and sets the page-table entries cache-disabled and write-through; the PROM maps one page each too). No code reads past the first page, and the highest offset used anywhere is the interrupt controller's identification word, so each extent is at least 4 KiB and not otherwise known. The firmware also reads bank registers from 0xc6000048 upward; the HAL never does." }
CPU_PHYS = { value = 0xc2000000, grade = "established", doc = "Physical base of the CPU block." }
APIC_PHYS = { value = 0xc4000000, grade = "established", doc = "Physical base of the interrupt controller." }
TIME_HZ = { value = 100000000, grade = "inferred", doc = "The core rate the Linux kernel divides by the tick rate to load the timer. The NT HAL assumes no rate: it measures the timer against the RTC update flag at start-up (nt-hal.md)." }
CPU_NUM_PHYS = { value = 0x1e00, grade = "established", doc = "Physical address of the 16-bit processor count in low memory; the processor table follows at the next two bytes. Not a register: written by the machine firmware." }
CPU_MAX = { value = 4, grade = "inferred", doc = "Most processors the kernel accepts from that table." }
APIC_LINES = { value = 30, grade = "established", doc = "Number of interrupt lines the kernel knows (0 to 29)." }
APIC_IDE0 = { value = 4, grade = "inferred", doc = "Line of the first IDE channel (on board 320 revision 5 the kernel uses line 5). The NT HAL uses line 4 on the newest 320 generation and the 540 except revision 0, 5 on the middle 320 generation and the 540 revision 0, and line 1 on the oldest 320 generation, which Linux has no case for." }
APIC_IDE1 = { value = 2, grade = "established", doc = "Line of the second IDE channel, on the 320 only." }
APIC_8259 = { value = 12, grade = "established", doc = "Line the PIIX4's cascaded interrupt controllers drive." }
APIC_PIIX4_USB = { value = 7, grade = "established", doc = "Line of the PIIX4's USB function." }
APIC_LI_AUDIO = { value = 22, grade = "inferred", doc = "Line of the Lithium audio engine." }
APIC_CPU = { value = 28, grade = "established", doc = "Line of the Cobalt timer, which the header also calls the cache interrupt." }
APIC_NMI = { value = 29, grade = "established", doc = "Last line; named NMI by the header and unused by Linux. The NT HAL programs it as an NMI-delivery entry (entry 28 on the Lite revisions 0xa0 and 0xa8 moves the NMI to 28 and the clock to 27)." }
APIC_PCIA_BASE0 = { value = 0, grade = "established", doc = "First line of the per-slot INTA lines of Lithium bridge A." }
APIC_PCIA_BASE123 = { value = 5, grade = "established", doc = "First of the lines bridge A shares among INTB, INTC and INTD (the header comment says 5 and 6)." }
APIC_PCIB_BASE0 = { value = 8, grade = "established", doc = "First line of the per-slot INTA lines of Lithium bridge B (8 to 12)." }
APIC_PCIB_BASE123 = { value = 13, grade = "established", doc = "First of the lines bridge B shares among INTB, INTC and INTD (13 to 15). Linux uses none of them; the NT HAL's bridge B interrupt map does (shared pins on entries 13 to 15)." }
APIC_VIDOUT0 = { value = 16, grade = "established", doc = "Video output 0 interrupt." }
APIC_VIDOUT1 = { value = 17, grade = "established", doc = "Video output 1 interrupt." }
APIC_VIDIN0 = { value = 18, grade = "established", doc = "Video input 0 interrupt." }
APIC_VIDIN1 = { value = 19, grade = "established", doc = "Video input 1 interrupt." }
APIC_AS = { value = 24, grade = "established", doc = "Header name AS. Linux does not use the line; the NT graphics miniport (sgcomp.sys) asks the HAL for the vector of line 24 and connects a handler to it. The line number is established; the name is Linux's." }
APIC_RE = { value = 25, grade = "established", doc = "Header name RE. Linux does not use the line; the NT graphics miniport (sgcomp.sys) asks the HAL for the vector of line 25 and connects a handler to it. The line number is established; the name is Linux's." }
