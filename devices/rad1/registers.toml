[words.PCI_REVISION]
width = 8
grade = "established"
from = "IRIX 6.5.30 IP30 rad_dd.o rad_create_subsys: config offset 0x08 split into two nibbles"
doc = "Low byte of PCI config offset 8. The driver reads the dword and splits this byte."
[words.PCI_REVISION.fields]
board_mode = { bits = [7, 4], grade = "established", doc = "Board variant; also the board number in hinv" }
chip_rev = { bits = [3, 0], grade = "established", doc = "Chip revision; hinv prints board.chip" }

[words.STATUS_FLAGS]
width = 32
grade = "inferred"
from = "IRIX 6.5.30 IP30 rad_dd.o rad_check_adat_rx and rad_update_subsys"
doc = "Slot word at byte offset 0x78 of each status slot. Bits not listed are never read by the driver."
[words.STATUS_FLAGS.fields]
adat_present = { bits = [6, 6], grade = "inferred", doc = "ADAT input signal present; tested by the ADAT receiver state machine. Name inferred from the function" }
video_event_a = { bits = [7, 7], grade = "inferred", doc = "Counted by the driver over 1024 passes to derive a period, which it uses only to classify a video reference. Name inferred" }
video_event_b = { bits = [8, 8], grade = "inferred", doc = "As video_event_a, counted separately" }

[words.STATUS_DONE]
width = 32
grade = "established"
from = "IRIX 6.5.30 IP30 rad_dd.o rad_one_shot_status, rad_update_subsys, rad_process_aesrx_subcode"
doc = "Slot word at byte offset 0x7c. The driver clears it before a transfer and waits for the engine to set bit 31."
[words.STATUS_DONE.fields]
aes_rate_code = { bits = [26, 24], grade = "established", doc = "AES3 input sample-rate code, looked up in an eight-entry table; 0 means no rate" }
aes_no_input = { bits = [19, 19], grade = "inferred", doc = "Set means no valid AES3 input, so the decoded rate is 0. Name inferred" }
done = { bits = [31, 31], grade = "established", doc = "Slot complete" }

[words.DESC_WORD]
width = 32
grade = "inferred"
from = "IRIX 6.5.30 IP30 rad_dd.o rad_start_dma .text 0x34b0-0x3504"
doc = "Control word of a descriptor, in the RAM entry and in the working descriptor of a channel. The driver builds it as ((tag & 0xf) << 3) + (-length_units << 7), so bits 2:0 are zero in every driver-written word."
[words.DESC_WORD.fields]
end_of_descriptor = { bits = [2, 2], grade = "inferred", doc = "Set: the transfer stops after this descriptor. Only the Octane PROM sets it (from reading its image); the shipped drivers never do. Inferred" }
next_index = { bits = [6, 3], grade = "inferred", doc = "Index of the descriptor RAM entry the channel continues with. The drivers write the channel's own entry number (analog output 1, AES3 output 3, ADAT output 5, AES3-input subcode 6) so the ring loops on itself; Linux writes 7. Inferred as the one reading under which all three writers work" }
length_units = { bits = [31, 7], grade = "established", doc = "Transfer length as a negative count of 128-byte units, 25 bits. 0x1ffffe0 is 32 units, 4096 bytes" }

[[words.DESC_WORD.tests]]
value = 0xfffff008
expect = { end_of_descriptor = 0, next_index = 1, length_units = 0x1ffffe0 }

# ---------------------------------------------------------------- position bank
[registers.pos_adat_in_a]
offset = 0x4
access = "r"
width = 32
grade = "established"
from = "IRIX 6.5.30 IP30 rad_dd.o rad_start_dma position reads (offset = table index * 4 - 0x40, table in .data)"
doc = "Sample-position register, ADAT input, position A. The upper 14 bits count frames and advance only while the channel's DMA runs. A copy sits in the status slot at offset + 0x40. Channel roles follow the shipped driver's per-channel tables; the table entries are established, the role names inferred from the direction flags and interface objects."

[registers.pos_adat_in_a.fields]
frame_count = { bits = [31, 18], grade = "established", doc = "14-bit frame count; the driver masks it with 0x3fff after the shift" }
ust_latch = { bits = [17, 0], grade = "inferred", doc = "Low bits of the free-running counter at the frame named by frame_count; the driver splices them into its timestamp. Inferred" }

