[registers.gpio_data]
offset = 0x8c
access = "w"
width = 32
grade = "inferred"
from = "IRIX 6.5.30 IP27 rad_dd.o rad_vl_write_MUX_SEL_MIO .text 0x6f10-0x6f20 and 0x6f7c; rad_update_subsys .text 0x3150-0x318c; IRIX 6.5.30 IP30 rad_dd.o rad_update_subsys .text 0x2f80-0x2fb8, rad_start_subsys mode 12 .text 0xee4 (0x8c = 2)"
doc = "General-purpose output 2. On the MediaIO card (mode 7) it is the serial data line of the 16-bit video-clock mux: for each of 16 bits, most significant first, the driver writes (bit | 2), then drops and raises the clock on the analog input control register (bit 27), and after all 16 bits writes 2 then 3 to gpio_relay as the latch strobe and restores this register from a shadow. Separately every 1024 status passes (about 1.024 s) the driver rewrites it as (selector | 2), flipping the selector between 0 and 1, which is the 3, 2, 3, 2 pattern seen on the bus: the selector alternates 0 and 1 between writes, bit 1 stays set, and the driver samples bit 10 of the register 0x34 mirror in the status slot between writes (what that probes is unknown). On the Octane board a vendor PROM uses it as the DAC mute: 3 mutes and 2 unmutes, and the unmute also writes 0x03000000 to the analog input control. On the PCI audio board (mode 13) a second reading of the shipped drivers finds 0 written here at start."

