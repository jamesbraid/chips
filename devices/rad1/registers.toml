REV_OCTANE = { value = 0xc0, grade = "established", from = "published hinv captures of Octane and Octane2 (revision 12.0); IRIX 6.5.30 IP30 rad_dd.o rad_create_subsys", doc = "PCI revision byte on the Octane base board: board mode 12, chip revision 0" }
REV_PCI_BOARD = { value = 0xd0, grade = "inferred", from = "published hinv captures of Tezro, Origin 350 and Onyx 350 (revision 13.0); IRIX 6.5.30 IP30 rad_dd.o mode dispatch", doc = "PCI revision byte shown by the PCI audio board and Origin 3000-family base I/O: board mode 13. Inferred from hinv" }
