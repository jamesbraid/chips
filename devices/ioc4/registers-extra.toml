unit = "ioc4_extra"
prefix = "IOC4"
title = "IOC4 registers outside the census"
from = "shipped Origin 3000 kernel keyboard poll routine; public Linux IOC4 and IDE driver names"
public_from = ["census:"]

[c]
offset_macro = "bare"

[registers.km_rx_kbd]
offset = 0x204
access = "r"
width = 32
grade = "established"

[registers.km_rx_mouse]
offset = 0x208
access = "r"
width = 32
grade = "established"

[registers.km_tx_kbd]
offset = 0x20c
access = "w"
width = 32
grade = "established"

[registers.km_tx_mouse]
offset = 0x210
access = "w"
width = 32
grade = "established"

[registers.gpdr]
offset = 0x38
access = "rw"
width = 32
grade = "established"
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h (struct ioc4_misc_regs, member gpdr); shipped Origin 350 PROM stores of 0 at this offset (devices/ioc4/README.md)"
doc = "Generic pin data word. The SGI header defines it at 0x38 with bits 7:0 holding the state of the eight generic pins. Offset and name are established by the header and the PROM store; no Linux driver code read touches it, and what a write does is unknown."

[constants]
ATA_DMA_CONTROL = { value = 0x15c, grade = "established", doc = "index 7, byte accesses; bits below" }
ATA_DMA_CONTROL_ACTIVE = { value = 0x8, grade = "established", doc = "bit 3: read first by the start routine, which stops the engine before arming when set; name [I]" }
ATA_DMA_CONTROL_DIR_TO_MEMORY = { value = 0x4, grade = "inferred", doc = "bit 2: 1 copies ATA data to memory; the direction convention rests on the public driver's comments" }
ATA_DMA_CONTROL_ERROR = { value = 0x10, grade = "established", doc = "bit 4: tested; when set the start routine stores 2 and the completion routine reads it back; name [I]" }
ATA_DMA_CONTROL_START = { value = 0x1, grade = "established", doc = "bit 0: ORed with the direction bit and stored once to start a transfer (earlier full reading; the combined value was not re-derived); name [I]" }
ATA_DMA_CONTROL_STOP = { value = 0x2, grade = "established", doc = "bit 1: the value 2 is stored, then the word is read until the bit clears; name [I]" }
ATA_DMA_COUNT_DEVICE = { value = 0x154, grade = "inferred", doc = "index 5; read by the completion routine" }
ATA_DMA_COUNT_MEMORY = { value = 0x158, grade = "inferred", doc = "index 6; read by the completion routine" }
ATA_DMA_CURRENT_HIGH = { value = 0x150, grade = "unknown", doc = "index 4; name from the public driver only" }
ATA_DMA_CURRENT_LOW = { value = 0x14c, grade = "unknown", doc = "index 3; name from the public driver only" }
ATA_DMA_END_AREA = { value = 0x160, grade = "inferred", doc = "index 8; bus address of the 128-byte end-of-transfer area" }
ATA_DMA_LIST_HIGH = { value = 0x148, grade = "inferred", doc = "index 2; written by the packet-DMA start routine" }
ATA_DMA_LIST_LOW = { value = 0x144, grade = "inferred", doc = "index 1; written by the packet-DMA start routine" }
ATA_DMA_TIMING = { value = 0x140, grade = "inferred", doc = "width 4 byte(s); index 0; name from the public driver only" }
SERIAL_RING_PTR_B_9_3 = { value = 0x3f8, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c lines 211-212 (IOC4_PROD_CONS_PTR_4K and _1K)", doc = "Active bits of a producer or consumer index on a 1 KB serial ring of 8-byte entries. The 4 KB ring mask is 0xff8 (the ring bits 11:3 in the register table)." }
SERIAL_RX_TIMER_COUNT_B_27_16 = { value = 0xfff0000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c lines 237-240 (IOC4_SRTR_CNT_VAL)", doc = "Current count of the receive timer, bits 27:16 of the RX timer register. The public driver defines the field and does not read it." }
SERIAL_RX_TIMER_RELOAD_B_11_0 = { value = 0xfff, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c lines 237-238 (IOC4_SRTR_CNT) and 1299-1303", doc = "Reload count of the receive timer, bits 11:0 of the RX timer register. The IOC3 receive-timeout routine caps its stored count at 4095, the same twelve bits." }
SERIAL_SHADOW_CTS_V_100000 = { value = 0x100000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c line 229 (IOC4_SHADOW_CTS)", doc = "Clear-to-send line level, bit 20 of the port shadow register." }
SERIAL_SHADOW_DCD_V_800000 = { value = 0x800000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c line 230 (IOC4_SHADOW_DCD)", doc = "Carrier-detect line level, bit 23 of the port shadow register." }
SERIAL_SHADOW_DCTS_V_10000 = { value = 0x10000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c line 227 (IOC4_SHADOW_DCTS)", doc = "Clear-to-send changed, bit 16 of the port shadow register." }
SERIAL_SHADOW_DDCD_V_80000 = { value = 0x80000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c line 228 (IOC4_SHADOW_DDCD)", doc = "Carrier-detect changed, bit 19 of the port shadow register." }
SERIAL_SHADOW_OUTPUTS_B_28_24 = { value = 0x1f000000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c lines 231-235 (IOC4_SHADOW_DTR, RTS, OUT1, OUT2, LOOP)", doc = "Modem outputs and loopback, bits 28:24 of the port shadow register. The public driver gives each position: bit 24 DTR, bit 25 RTS, bit 26 OUT1, bit 27 OUT2, bit 28 loopback." }
SERIAL_SHADOW_RX_FLAGS_B_7_0 = { value = 0xff, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c lines 219-226 (IOC4_SHADOW_DR to RFCE)", doc = "Low byte of the port shadow register: bit 0 data ready, 1 overrun, 2 parity error, 3 framing error, 4 break, 5 transmit holding register empty, 6 transmit shift register empty, 7 error character in the receive FIFO." }
SERIAL_SRCIR_TIMER_ARM_V_80000000 = { value = 0x80000000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c line 216 (IOC4_SRCIR_ARM) and the writes at lines 847 and 2105", doc = "Bit 31 of the RX consumer write. The public driver calls it the timer-arm bit. Whether the readback reflects it is not established." }
SIO_CR_CMD_PULSE = { value = 0xf, grade = "established", doc = "value stored at attach; that bits 3:0 are a strobe field is [I]" }
SIO_CR_SIO_DIAG_IDLE = { value = 0x80, grade = "established", doc = "bit 7, polled until set; name [I]" }
KM_CSR_KBD_WRITE_PENDING = { value = 0x1, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 0 of the keyboard and mouse control word: keyboard transmit pending. A written byte stays pending until the transmit completes." }
KM_CSR_AUX_WRITE_PENDING = { value = 0x2, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 1: auxiliary (mouse) transmit pending. Same rule as bit 0." }
KM_CSR_KBD_DATA_LINE = { value = 0x10, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 4: keyboard data line state. Both public drivers name it as a status bit (OpenBSD IOC3_KBC_STATUS_KBD_DATA, Linux KM_CSR_K_DATA)." }
KM_CSR_AUX_DATA_LINE = { value = 0x100, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 8: auxiliary (mouse) data line state (OpenBSD IOC3_KBC_STATUS_AUX_DATA, Linux KM_CSR_M_DATA). An earlier version placed this at bit 5; both public headers put bit 5 on the keyboard clock line." }
KM_CSR_KBD_CLOCK_LINE = { value = 0x20, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 5: keyboard clock line state (OpenBSD IOC3_KBC_STATUS_KBD_CLOCK, Linux KM_CSR_K_CLK). An earlier version placed this at bit 8; both public headers put bit 8 on the auxiliary data line." }
KM_CSR_AUX_CLOCK_LINE = { value = 0x200, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 9: auxiliary (mouse) clock line state (OpenBSD IOC3_KBC_STATUS_AUX_CLOCK, Linux KM_CSR_M_CLK)." }
KM_CSR_LAST_WRITE_LINE_B_3_2 = { value = 0xc, grade = "inferred", from = "linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 277-278 (KM_CSR_K_LCB, KM_CSR_M_LCB), IOC3 header only; OpenBSD iockbcreg.h does not define the bits", doc = "Bits 3:2: line control of the last write, by name only. Whether the chip sets or clears them is unknown." }
KM_CSR_IDLE_B_15_14 = { value = 0xc000, grade = "inferred", from = "linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 289-290 (KM_CSR_K_SM_IDLE, KM_CSR_M_SM_IDLE), IOC3 header only; OpenBSD iockbcreg.h does not define the bits", doc = "Bits 15:14: state-machine idle flags, by name only. No driver relies on them." }
OTHER_IR_KBM = { value = 0x40, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/pci/iofreg.h line 58 (IOC4_OIRQ_KBC) and sys/arch/sgi/pci/iof.c lines 220-300 (enable through IOC4_OTHER_IES, acknowledge through IOC4_OTHER_IR); the IOC3 value is IOC3_IRQ_KBC 0x400000 in iocreg.h line 101", doc = "Bit 6 of the other-interrupt word: the keyboard and mouse interrupt source. The driver masks and acknowledges it through the same word. IOC3 raises its keyboard and mouse interrupt from a different parent source (bit 22), so IOC3 parent wiring does not carry over." }
SIO_IR_SRC_UART_0 = { value = 0x40, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h (union ioc4_sio_int, field intr_pass, bit 6 of each port byte) and drivers/tty/serial/ioc4_serial.c line 69 (IOC4_SIO_IR_S0_INT, 0x40) and the matching port 1 to 3 lines; OpenBSD 7011342f6a72 sys/arch/sgi/pci/iofreg.h lines 51-54 agree", doc = "Pass-through pending bit for port 0's own 16550 interrupt: bit 6 of that port's byte of the serial interrupt word. The SGI Linux header names the field intr_pass (interrupt pass-through), which settles the role OpenBSD gave it by comment. Whether the chip raises it from the UART level or an edge is not stated." }
