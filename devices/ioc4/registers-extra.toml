EXTINT_COUNT_DIVISOR = { value = 520, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h (IOC4_EXTINT_COUNT_DIVISOR)", doc = "PCI clocks per COUNT tick of the external interrupt output. Period of a toggle-mode half cycle is (COUNT plus 1) times this many PCI clocks." }
