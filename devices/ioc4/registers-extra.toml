GPCR_EDGE_MASK = { value = 0xff00, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h (ioc4_gpcr.edge)", doc = "Bits 15:8: edge or level mode of the pin interrupt, one bit per pin." }
GPCR_INT_OUT_EN = { value = 0x100000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h (ioc4_gpcr.int_out_en) and drivers/misc/ioc4.c (ioc4_clock_calibrate sets it with direction bit 0)", doc = "Bit 20: connect the external interrupt output to pin 0. The shipped Origin 350 PROM value 0x1000f0 sets this bit and the direction of pins 4 to 7." }
