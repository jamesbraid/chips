doc = "External interrupt output control. In toggle mode (7) the output pin inverts every count+1 ticks; one tick is 520 PCI clocks, so the square wave period is 2*(count+1)*520 PCI clocks. Bit 31 reads the current output level and is the way the SGI Linux driver measures the PCI clock. Writing zero first returns the section to its power-on state, per the driver comment."

