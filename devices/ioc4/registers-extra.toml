KM_CSR_KBD_CLOCK_LINE = { value = 0x20, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 5: keyboard clock line state (OpenBSD IOC3_KBC_STATUS_KBD_CLOCK, Linux KM_CSR_K_CLK). An earlier version placed this at bit 8; both public headers put bit 8 on the auxiliary data line." }
KM_CSR_AUX_CLOCK_LINE = { value = 0x200, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 9: auxiliary (mouse) clock line state (OpenBSD IOC3_KBC_STATUS_AUX_CLOCK, Linux KM_CSR_M_CLK)." }
KM_CSR_LAST_WRITE_LINE_B_3_2 = { value = 0xc, grade = "inferred", from = "linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 277-278 (KM_CSR_K_LCB, KM_CSR_M_LCB), IOC3 header only; OpenBSD iockbcreg.h does not define the bits", doc = "Bits 3:2: line control of the last write, by name only. Whether the chip sets or clears them is unknown." }
KM_CSR_IDLE_B_15_14 = { value = 0xc000, grade = "inferred", from = "linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 289-290 (KM_CSR_K_SM_IDLE, KM_CSR_M_SM_IDLE), IOC3 header only; OpenBSD iockbcreg.h does not define the bits", doc = "Bits 15:14: state-machine idle flags, by name only. No driver relies on them." }
OTHER_IR_KBM = { value = 0x40, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/pci/iofreg.h line 58 (IOC4_OIRQ_KBC) and sys/arch/sgi/pci/iof.c lines 220-300 (enable through IOC4_OTHER_IES, acknowledge through IOC4_OTHER_IR); the IOC3 value is IOC3_IRQ_KBC 0x400000 in iocreg.h line 101", doc = "Bit 6 of the other-interrupt word: the keyboard and mouse interrupt source. The driver masks and acknowledges it through the same word. IOC3 raises its keyboard and mouse interrupt from a different parent source (bit 22), so IOC3 parent wiring does not carry over." }
SIO_IR_SRC_UART_0 = { value = 0x40, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h (union ioc4_sio_int, field intr_pass, bit 6 of each port byte) and drivers/tty/serial/ioc4_serial.c line 69 (IOC4_SIO_IR_S0_INT, 0x40) and the matching port 1 to 3 lines; OpenBSD 7011342f6a72 sys/arch/sgi/pci/iofreg.h lines 51-54 agree", doc = "Pass-through pending bit for port 0's own 16550 interrupt: bit 6 of that port's byte of the serial interrupt word. The SGI Linux header names the field intr_pass (interrupt pass-through), which settles the role OpenBSD gave it by comment. Whether the chip raises it from the UART level or an edge is not stated." }
