doc = "Generic pin control, written through the set alias (writing a 1 sets that bit) and the clear alias (writing a 1 clears it). Pin 0 drives the external interrupt output, pin 1 is the external interrupt input, pin 3 senses keyboard and mouse presence and pins 4 to 7 select RS-232 (0) or RS-422 (1) for ports 0 to 3. The set and clear behaviour follows the register names and the SGI driver's use of the set alias; the SGI Linux driver never uses the clear alias."

