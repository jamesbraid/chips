unit = "ioc4_extra"
prefix = "IOC4"
title = "IOC4 registers outside the census"
from = "shipped Origin 3000 kernel keyboard poll routine; public Linux IOC4 and IDE driver names"
public_from = ["census:"]

[c]
offset_macro = "bare"
legacy_header = "include/ioc4_extra.h"
legacy_guard = "IOC4_EXTRA_H"

[registers.km_rx_kbd]
offset = 0x204
access = "r"
width = 32
grade = "established"

[registers.km_rx_mouse]
offset = 0x208
access = "r"
width = 32
grade = "established"

[registers.km_tx_kbd]
offset = 0x20c
access = "w"
width = 32
grade = "established"

[registers.km_tx_mouse]
offset = 0x210
access = "w"
width = 32
grade = "established"

[constants]
ATA_DMA_CONTROL = { value = 0x15c, grade = "established", doc = "index 7, byte accesses; bits below" }
ATA_DMA_CONTROL_ACTIVE = { value = 0x8, grade = "established", doc = "bit 3: read first by the start routine, which stops the engine before arming when set; name [I]" }
ATA_DMA_CONTROL_DIR_TO_MEMORY = { value = 0x4, grade = "inferred", doc = "bit 2: 1 copies ATA data to memory; the direction convention rests on the public driver's comments" }
ATA_DMA_CONTROL_ERROR = { value = 0x10, grade = "established", doc = "bit 4: tested; when set the start routine stores 2 and the completion routine reads it back; name [I]" }
ATA_DMA_CONTROL_START = { value = 0x1, grade = "established", doc = "bit 0: ORed with the direction bit and stored once to start a transfer (earlier full reading; the combined value was not re-derived); name [I]" }
ATA_DMA_CONTROL_STOP = { value = 0x2, grade = "established", doc = "bit 1: the value 2 is stored, then the word is read until the bit clears; name [I]" }
ATA_DMA_COUNT_DEVICE = { value = 0x154, grade = "inferred", doc = "index 5; read by the completion routine" }
ATA_DMA_COUNT_MEMORY = { value = 0x158, grade = "inferred", doc = "index 6; read by the completion routine" }
ATA_DMA_CURRENT_HIGH = { value = 0x150, grade = "unknown", doc = "index 4; name from the public driver only" }
ATA_DMA_CURRENT_LOW = { value = 0x14c, grade = "unknown", doc = "index 3; name from the public driver only" }
ATA_DMA_END_AREA = { value = 0x160, grade = "inferred", doc = "index 8; bus address of the 128-byte end-of-transfer area" }
ATA_DMA_LIST_HIGH = { value = 0x148, grade = "inferred", doc = "index 2; written by the packet-DMA start routine" }
ATA_DMA_LIST_LOW = { value = 0x144, grade = "inferred", doc = "index 1; written by the packet-DMA start routine" }
ATA_DMA_TIMING = { value = 0x140, grade = "inferred", doc = "width 4 byte(s); index 0; name from the public driver only" }
SERIAL_RING_PTR_B_9_3 = { value = 0x3f8, grade = "inferred", from = "public Linux ioc4_serial.c active-pointer mask; not re-read against a hardware source", doc = "Active bits of a producer or consumer index on a 1 KB serial ring of 8-byte entries. The 4 KB ring mask is 0xff8 (the ring bits 11:3 in the register table)." }
SERIAL_RX_TIMER_COUNT_B_27_16 = { value = 0xfff0000, grade = "inferred", from = "public Linux ioc4.h field definition; not re-read against a hardware source", doc = "Current count of the receive timer, bits 27:16 of the RX timer register. The public driver defines the field and does not read it." }
SERIAL_RX_TIMER_RELOAD_B_11_0 = { value = 0xfff, grade = "inferred", from = "public Linux ioc4.h field definition; not re-read against a hardware source", doc = "Reload count of the receive timer, bits 11:0 of the RX timer register. The IOC3 receive-timeout routine caps its stored count at 4095, the same twelve bits." }
SERIAL_SHADOW_CTS_V_100000 = { value = 0x100000, grade = "inferred", from = "public Linux ioc4.h shadow field definition; not re-read against a hardware source", doc = "Clear-to-send line level, bit 20 of the port shadow register." }
SERIAL_SHADOW_DCD_V_800000 = { value = 0x800000, grade = "inferred", from = "public Linux ioc4.h shadow field definition; not re-read against a hardware source", doc = "Carrier-detect line level, bit 23 of the port shadow register." }
SERIAL_SHADOW_DCTS_V_10000 = { value = 0x10000, grade = "inferred", from = "public Linux ioc4.h shadow field definition; not re-read against a hardware source", doc = "Clear-to-send changed, bit 16 of the port shadow register." }
SERIAL_SHADOW_DDCD_V_80000 = { value = 0x80000, grade = "inferred", from = "public Linux ioc4.h shadow field definition; not re-read against a hardware source", doc = "Carrier-detect changed, bit 19 of the port shadow register." }
SERIAL_SHADOW_OUTPUTS_B_28_24 = { value = 0x1f000000, grade = "inferred", from = "public Linux ioc4.h shadow field definition; not re-read against a hardware source", doc = "Modem outputs and loopback, bits 28:24 of the port shadow register. The public driver names DTR, RTS, OUT1, OUT2 and loopback in this field and does not give the position of each one." }
SERIAL_SHADOW_RX_FLAGS_B_7_0 = { value = 0xff, grade = "inferred", from = "public Linux ioc4.h shadow field definition; not re-read against a hardware source", doc = "Low byte of the port shadow register: receive data and line-status flags." }
SERIAL_SRCIR_TIMER_ARM_V_80000000 = { value = 0x80000000, grade = "inferred", from = "public Linux ioc4_serial.c naming of the RX consumer write; not re-read against a hardware source", doc = "Bit 31 of the RX consumer write. The public driver calls it the timer-arm bit. Whether the readback reflects it is not established." }
SIO_CR_CMD_PULSE = { value = 0xf, grade = "established", doc = "value stored at attach; that bits 3:0 are a strobe field is [I]" }
SIO_CR_SIO_DIAG_IDLE = { value = 0x80, grade = "established", doc = "bit 7, polled until set; name [I]" }
KM_CSR_KBD_WRITE_PENDING = { value = 0x1, grade = "established", from = "public Linux IOC4 keyboard driver naming (driver file not re-read for this import)", doc = "Bit 0 of the keyboard and mouse control word: keyboard transmit pending. A written byte stays pending until the transmit completes." }
KM_CSR_AUX_WRITE_PENDING = { value = 0x2, grade = "established", from = "public Linux IOC4 keyboard driver naming (driver file not re-read for this import)", doc = "Bit 1: auxiliary (mouse) transmit pending. Same rule as bit 0." }
KM_CSR_KBD_DATA_LINE = { value = 0x10, grade = "established", from = "public Linux IOC4 keyboard driver naming (driver file not re-read for this import)", doc = "Bit 4: keyboard data line state. The public driver names it as a status bit. The bit order of the four line-state bits follows the order of the driver's names, not a second source." }
KM_CSR_AUX_DATA_LINE = { value = 0x20, grade = "established", from = "public Linux IOC4 keyboard driver naming (driver file not re-read for this import)", doc = "Bit 5: auxiliary data line state. See KM_CSR_KBD_DATA_LINE for the bit-order caveat." }
KM_CSR_KBD_CLOCK_LINE = { value = 0x100, grade = "established", from = "public Linux IOC4 keyboard driver naming (driver file not re-read for this import)", doc = "Bit 8: keyboard clock line state. See KM_CSR_KBD_DATA_LINE for the bit-order caveat." }
KM_CSR_AUX_CLOCK_LINE = { value = 0x200, grade = "established", from = "public Linux IOC4 keyboard driver naming (driver file not re-read for this import)", doc = "Bit 9: auxiliary clock line state. See KM_CSR_KBD_DATA_LINE for the bit-order caveat." }
KM_CSR_LAST_WRITE_LINE_B_3_2 = { value = 0xc, grade = "inferred", from = "public Linux IOC4 keyboard driver naming only; no public driver writes or reads these bits", doc = "Bits 3:2: line control of the last write, by name only. Whether the chip sets or clears them is unknown." }
KM_CSR_IDLE_B_15_14 = { value = 0xc000, grade = "inferred", from = "public Linux IOC4 keyboard driver naming only; no public driver writes or reads these bits", doc = "Bits 15:14: state-machine idle flags, by name only. No driver relies on them." }
OTHER_IR_KBM = { value = 0x40, grade = "established", from = "public Linux IOC4 keyboard driver mask and acknowledge sequence (driver file not re-read for this import)", doc = "Bit 6 of the other-interrupt word: the keyboard and mouse interrupt source. The driver masks and acknowledges it through the same word. IOC3 raises its keyboard and mouse interrupt from a different parent source (bit 22), so IOC3 parent wiring does not carry over." }
SIO_IR_SRC_UART_0 = { value = 0x40, grade = "inferred", from = "OpenBSD IOC4 serial enable mask (driver file not re-read for this import)", doc = "Pass-through pending bit for port 0's own 16550 interrupt. OpenBSD enables only the four pass-through bits, so the other serial pending bits are not enabled by that driver." }
SIO_IR_SRC_UART_1 = { value = 0x4000, grade = "inferred", from = "OpenBSD IOC4 serial enable mask (driver file not re-read for this import)", doc = "Pass-through pending bit for port 1's own 16550 interrupt. See SIO_IR_SRC_UART_0." }
SIO_IR_SRC_UART_2 = { value = 0x400000, grade = "inferred", from = "OpenBSD IOC4 serial enable mask (driver file not re-read for this import)", doc = "Pass-through pending bit for port 2's own 16550 interrupt. See SIO_IR_SRC_UART_0." }
SIO_IR_SRC_UART_3 = { value = 0x40000000, grade = "inferred", from = "OpenBSD IOC4 serial enable mask (driver file not re-read for this import)", doc = "Pass-through pending bit for port 3's own 16550 interrupt. See SIO_IR_SRC_UART_0." }
