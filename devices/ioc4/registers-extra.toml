SERIAL_SHADOW_DCTS_V_10000 = { value = 0x10000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c line 227 (IOC4_SHADOW_DCTS)", doc = "Clear-to-send changed, bit 16 of the port shadow register." }
SERIAL_SHADOW_DDCD_V_80000 = { value = 0x80000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c line 228 (IOC4_SHADOW_DDCD)", doc = "Carrier-detect changed, bit 19 of the port shadow register." }
SERIAL_SHADOW_OUTPUTS_B_28_24 = { value = 0x1f000000, grade = "inferred", from = "Linux linux-5.3 pin 4d856f72c10e drivers/tty/serial/ioc4_serial.c lines 231-235 (IOC4_SHADOW_DTR, RTS, OUT1, OUT2, LOOP)", doc = "Modem outputs and loopback, bits 28:24 of the port shadow register. The public driver gives each position: bit 24 DTR, bit 25 RTS, bit 26 OUT1, bit 27 OUT2, bit 28 loopback." }
