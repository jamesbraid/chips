grade = "established"
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, drivers/ide/sgiioc4.c"
doc = "Last word of a 16-byte ATA scatter list entry. Each entry is four big-endian 32-bit words: zero, the low 32 bits of the bus address, zero, this word. The driver splits entries at 64 KB boundaries so an aligned entry can hold 0x10000 bytes, which does not fit in 16 bits; how the chip reads a length of 0x10000 is unknown."

