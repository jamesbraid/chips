# ---- field layouts: SGI Linux v5.3 ioc4.h, ioc4_serial.c, sgiioc4.c, ioc4.c
[words.PCI_ERR_ADDR_L_WORD]
width = 32
grade = "established"
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h"
doc = "Low word of the latched PCI error address. The word is read together with the high word after a DMA error interrupt. Master id 0 to 7 names a serial port (port number is the id shifted right one, bit 0 of the id is 1 for the receive ring and 0 for the transmit ring); 8 is the ATA engine; 9 to 15 are undefined. The address field holds bits 31:6 of the address."

[words.PCI_ERR_ADDR_L_WORD.fields]
valid = { bits = [0, 0], grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h", doc = "an address was captured" }
master_id = { bits = [4, 1], grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h", doc = "unit that caused the error" }
mul_err = { bits = [5, 5], grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h", doc = "more than one error occurred before the register was read" }
addr = { bits = [31, 6], grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h", doc = "address bits 31:6, in the same position as in the word" }

[words.SIO_IR_PORT_WORD]
width = 8
grade = "established"
from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h; SGI Linux platform code, linux-5.3 pin 4d856f72c10e, drivers/tty/serial/ioc4_serial.c"
doc = "One serial port's byte of the serial interrupt status, enable-set and enable-clear words. Port n occupies bits 8n+7 down to 8n. Software acknowledges tx explicit, rx timer, delta DCD and delta CTS by writing the bit to the status word; rx high is a level condition the driver cannot acknowledge; it masks the enable until the ring drains. Transmit empty is masked the same way (inferred)."

[words.SIO_IR_PORT_WORD.fields]
tx_mt = { bits = [0, 0], grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h", doc = "transmit ring empty" }
