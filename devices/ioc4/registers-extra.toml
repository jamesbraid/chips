KM_CSR_KBD_WRITE_PENDING = { value = 0x1, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 0 of the keyboard and mouse control word: keyboard transmit pending. A written byte stays pending until the transmit completes." }
KM_CSR_AUX_WRITE_PENDING = { value = 0x2, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 1: auxiliary (mouse) transmit pending. Same rule as bit 0." }
KM_CSR_KBD_DATA_LINE = { value = 0x10, grade = "established", from = "OpenBSD 7011342f6a72 sys/arch/sgi/dev/iockbcreg.h lines 24-31 (PS/2 controller bits shared by IOC3 and IOC4; the IOC4 driver iockbc.c uses them at lines 258-267) and Linux linux-5.3 pin 4d856f72c10e arch/mips/include/asm/sn/ioc3.h lines 274-287", doc = "Bit 4: keyboard data line state. Both public drivers name it as a status bit (OpenBSD IOC3_KBC_STATUS_KBD_DATA, Linux KM_CSR_K_DATA)." }
