SIO_IR_SRC_UART_3 = { value = 0x40000000, grade = "established", from = "SGI Linux platform code, linux-5.3 pin 4d856f72c10e, include/linux/ioc4.h (union ioc4_sio_int, field intr_pass, bit 6 of each port byte) and drivers/tty/serial/ioc4_serial.c line 69 (IOC4_SIO_IR_S0_INT, 0x40) and the matching port 1 to 3 lines; OpenBSD 7011342f6a72 sys/arch/sgi/pci/iofreg.h lines 51-54 agree", doc = "Pass-through pending bit for port 3's own 16550 interrupt: bit 6 of that port's byte of the serial interrupt word. The SGI Linux header names the field intr_pass (interrupt pass-through), which settles the role OpenBSD gave it by comment. Whether the chip raises it from the UART level or an edge is not stated." }

